version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
      upload-artifact-action: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
profiles:
  default:
    runner: ubuntu-24.04
    timeout-minutes: 5
    setup:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
    - run: uv sync --locked
  infrastructure:
    runner: ubuntu-24.04
    timeout-minutes: 5
    setup:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
    - run: uv sync --locked
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      with:
        version: v3.19.0
  quality-helm:
    runner: ubuntu-24.04
    timeout-minutes: 10
    setup:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: 'false'
        fetch-depth: '0'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
    - run: uv sync --locked
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      with:
        version: v3.19.0
  quality-tools:
    extends: quality-helm
    setup:
    - run: uv run python scripts/quality/install_tools.py --tools actionlint kubeconform gitleaks shellcheck kube-linter
  quality-docker:
    extends: default
    timeout-minutes: 5
    setup:
    - run: uv run python scripts/quality/install_tools.py --tools hadolint
  quality-javascript:
    extends: default
    setup:
    - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
      with:
        node-version: 24.11.1
nodes:
  graph-freshness:
    title: Quality Graph declaration freshness
    run: uv run qg validate
  workflow-failure-policy:
    title: n8n workflow failure notification policy
    run: uv run python scripts/n8n/check_failure_alerts.py
  workflow-policy-tests:
    title: Offline workflow policy regressions
    run: uv run python -m unittest discover -s tests -p test_n8n_failure_alert_policy.py
  alert-graph-delivery:
    profile: infrastructure
    title: Alert graph chart, image ownership and renderer capacity
    run: 'command -v helm

      uv run python -m unittest discover -s tests -p test_alert_graphs_chart.py

      uv run python -m unittest discover -s tests -p test_alert_graph_panel_ids.py

      uv run python scripts/alert_graphs.py --check

      '
  spi-execution-links:
    title: Stable SPI alert identity and execution link metadata
    run: uv run python -m unittest discover -s tests -p test_spi_execution_links.py
  infrastructure-contracts:
    title: Offline infrastructure ownership, placement and issuer contracts
    profile: infrastructure
    run: 'command -v helm

      uv run python scripts/check_infrastructure_contracts.py

      uv run python scripts/check_source_pointers.py

      uv run python -m unittest discover -s tests -p test_source_pointers.py

      uv run python -m unittest discover -s tests -p test_wg_peer15_relay.py

      uv run python scripts/check_operational_entrypoints.py

      uv run python -m unittest discover -s tests -p test_operational_entrypoints.py

      uv run python scripts/check_vendor_contracts.py

      uv run python -m unittest discover -s tests -p test_vendor_contracts.py

      uv run python -m unittest discover -s tests -p test_vm105_renderer_lms_litellm.py

      uv run python -m unittest discover -s tests -p test_target_placement_ownership.py

      uv run python -m unittest discover -s tests -p test_infrastructure_contracts.py

      uv run python -m unittest discover -s tests -p test_vm105_management.py

      uv run python -m unittest discover -s tests -p test_socrat5_app_placement.py

      uv run python -m unittest discover -s tests -p test_argocd_refresh.py

      uv run python -m unittest discover -s tests -p test_refactor_acceptance.py

      uv run python -m unittest discover -s tests -p test_deployment_ownership.py

      uv run python -m unittest discover -s tests -p test_gateway_readonly.py

      '
  wishlist-observability:
    title: Wishlist private metrics and dedicated OTel identity
    profile: infrastructure
    run: 'helm lint charts/wishlist -f deploy/wishlist/values.yaml

      uv run python -m unittest tests.test_wishlist_observability tests.test_otel_application_credentials tests.test_otel_application_registry
      tests.test_otel_application_leaf_rotation

      '
  quality-contracts:
    title: Quality framework, schema/tool locks and test inventory
    run: 'uv run python scripts/quality/contracts.py

      uv run python scripts/check_source_pointers.py'
    policy: &id001
      blocking: true
      approvals:
        findings: false
        files: false
        node: false
  quality-implementation:
    title: CI implementation lint and formatting (no legacy baseline)
    run: 'uv run ruff check --config quality/ruff.toml scripts/quality tests/test_quality_system.py

      uv run ruff format --check --config quality/ruff.toml scripts/quality tests/test_quality_system.py'
    policy: *id001
  lint-python:
    title: Python correctness, security and modernization ratchet
    profile: default
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py python
    results:
      native: reports/python.json
  lint-yaml:
    title: Non-template YAML syntax, duplicate keys and hygiene
    profile: default
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py yaml
    results:
      native: reports/yaml.json
  lint-shell:
    title: ShellCheck static source diagnostics
    profile: quality-tools
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py shell
    results:
      native: reports/shell.json
  lint-actions:
    title: Offline GitHub Actions security / trusted publisher boundary
    profile: default
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py actions
    results:
      native: reports/actions.json
    policy: *id001
  lint-actionlint:
    title: GitHub Actions semantics and expression validation
    profile: quality-tools
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py actionlint
    results:
      native: reports/actionlint.json
    policy: *id001
  lint-ansible:
    title: Ansible safety profile (tool compatibility diagnosis)
    profile: default
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py ansible
    results:
      native: reports/ansible.json
    policy:
      blocking: false
      approvals:
        findings: false
        files: false
        node: false
  lint-docker:
    title: Dockerfile best practices (Hadolint)
    profile: quality-docker
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py docker
    results:
      native: reports/docker.json
  lint-secrets:
    title: Tracked-tree secret scan with exact reviewed false positives
    profile: quality-tools
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py secrets
    results:
      native: reports/secrets.json
    policy: *id001
  lint-javascript:
    title: JavaScript syntax, parse-only Node 24
    profile: quality-javascript
    needs:
    - quality-contracts
    run: uv run python scripts/quality/lint.py javascript
    results:
      native: reports/javascript.json
  charts-0:
    title: Helm consumed values / strict schemas / Kubernetes policy shard 1/4
    profile: quality-tools
    needs:
    - quality-contracts
    run: uv run python scripts/quality/charts.py --shard 0
    results:
      native: reports/charts-0.json
    policy: *id001
  charts-1:
    title: Helm consumed values / strict schemas / Kubernetes policy shard 2/4
    profile: quality-tools
    needs:
    - quality-contracts
    run: uv run python scripts/quality/charts.py --shard 1
    results:
      native: reports/charts-1.json
    policy: *id001
  charts-2:
    title: Helm consumed values / strict schemas / Kubernetes policy shard 3/4
    profile: quality-tools
    needs:
    - quality-contracts
    run: uv run python scripts/quality/charts.py --shard 2
    results:
      native: reports/charts-2.json
    policy: *id001
  charts-3:
    title: Helm consumed values / strict schemas / Kubernetes policy shard 4/4
    profile: quality-tools
    needs:
    - quality-contracts
    run: uv run python scripts/quality/charts.py --shard 3
    results:
      native: reports/charts-3.json
