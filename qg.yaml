---
version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
      publication: scheduled
      publisher-action: alchemmist/quality-graph@f5cef503eaf0734b9c9a0c6f88ee8206b2a6235d
      upload-artifact-action: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
profiles:
  default:
    runner: ubuntu-24.04
    timeout-minutes: 5
    setup:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
  infrastructure:
    runner: ubuntu-24.04
    timeout-minutes: 5
    setup:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.19.0
  quality-helm:
    runner: ubuntu-24.04
    timeout-minutes: 10
    setup:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.19.0
  quality-docker:
    extends: default
    timeout-minutes: 5
    setup:
      - run: uv run python -m ci.quality.install_tools --tools hadolint
  quality-javascript:
    extends: default
    setup:
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24.11.1
  quality-cluster:
    extends: quality-helm
    timeout-minutes: 15
    setup:
      - run: uv run python -m ci.quality.install_tools --tools kind kubectl
  quality-shell:
    extends: default
    setup:
      - run: uv run python -m ci.quality.install_tools --tools shellcheck
      - run: .quality-tools/bin/shellcheck --version
  quality-delivery:
    extends: default
    setup:
      - run: uv run python -m ci.quality.install_tools --tools actionlint shellcheck
  quality-secrets:
    extends: default
    setup:
      - run: uv run python -m ci.quality.install_tools --tools gitleaks
  quality-images:
    extends: default
    timeout-minutes: 15
    setup:
      - run: uv run python -m ci.quality.install_tools --tools trivy
  quality-manifests:
    extends: quality-helm
    setup:
      - run: uv run python -m ci.quality.install_tools --tools kubeconform kube-linter
  quality-ansible:
    extends: default
    setup:
      - run: uv run python -m ci.quality.install_collections
  quality-fast:
    extends: quality-helm
    setup:
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24.11.1
      - run: uv run python -m ci.quality.install_tools --tools hadolint
  quality-integration:
    extends: quality-helm
    setup:
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24.11.1
      - run: uv run python -m ci.quality.install_tools --tools promtool
      - run: |
          set -euo pipefail
          read -r image < quality/nginx-syntax-image.txt
          docker pull "${image}"
nodes:
  graph:
    title: Graph integrity
    profile: default
    run: make graph
    policy: &id001
      blocking: true
      approvals:
        findings: false
        files: false
        node: false
  yaml:
    title: YAML structure
    profile: default
    run: make yaml
    policy: *id001
    needs:
      - graph
    results:
      native: reports/yaml.json
  python-scopes:
    title: Scoped Python rules
    profile: default
    needs:
      - graph
    policy: *id001
    run: make python-scopes
  scripts-q000:
    title: Python CI, script and test quotes (Q000, D300)
    profile: default
    needs:
      - graph
    policy: *id001
    run: make scripts-q000
  deploy-i001:
    title: Python import order (I001) and unused CI/script/test imports (F401)
    profile: default
    needs:
      - graph
    policy: *id001
    run: make deploy-i001
  secrets:
    title: Credential hygiene
    profile: quality-secrets
    run: make secrets
    policy: *id001
    needs:
      - graph
    results:
      native: reports/secrets.json
  javascript:
    title: JavaScript syntax
    profile: quality-javascript
    run: make javascript
    policy: *id001
    needs:
      - graph
    results:
      native: reports/javascript.json
  ownership:
    title: Ownership contracts
    profile: quality-helm
    needs:
      - graph
    policy: *id001
    run: make ownership
  docker:
    title: Container recipes
    profile: quality-docker
    needs:
      - graph
    policy: *id001
    run: make docker
    results:
      native: reports/docker.json
  image-cves:
    title: Deployed image vulnerabilities
    profile: quality-images
    needs:
      - graph
    policy: *id001
    run: make image-cves
  tests-fast:
    title: Unit tests
    profile: quality-fast
    needs:
      - graph
    policy: *id001
    run: make tests-fast
    results:
      junit: reports/tests-fast.xml
  workflow:
    title: Delivery security
    profile: quality-delivery
    needs:
      - graph
    policy: *id001
    run: make workflow
    env:
      GH_TOKEN: ${{ github.token }}
    results:
      native: reports/workflow.json
  shell:
    title: Shell safety
    profile: quality-shell
    needs:
      - graph
    policy: *id001
    run: make shell
    results:
      native: reports/shell.json
  rustfs-return-types:
    title: RustFS gateway public return types
    profile: default
    needs:
      - graph
    policy: *id001
    run: make rustfs-return-types
  dependencies:
    title: Dependency audit
    profile: quality-javascript
    needs:
      - ownership
    policy: *id001
    run: make dependencies
    results:
      native: reports/dependencies.json
  tests-medium:
    title: Integration tests
    profile: quality-integration
    run: make tests-medium
    policy: *id001
    needs:
      - ownership
    results:
      junit: reports/tests-medium.xml
  ansible:
    title: Playbook safety
    profile: quality-ansible
    run: make ansible
    policy: *id001
    needs:
      - ownership
    results:
      native: reports/ansible.json
...
