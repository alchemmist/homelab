---
version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
      publication: scheduled
      publisher-action: alchemmist/quality-graph@a08603fcb44e9e22813b497ed391addf68797ce3
      upload-artifact-action: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
profiles:
  default:
    runner: ubuntu-24.04
    timeout-minutes: 5
    setup:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
  infrastructure:
    runner: ubuntu-24.04
    timeout-minutes: 5
    setup:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.19.0
  quality-helm:
    runner: ubuntu-24.04
    timeout-minutes: 10
    setup:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.19.0
  quality-docker:
    extends: default
    timeout-minutes: 5
    setup:
      - run: uv run python scripts/quality/install_tools.py --tools hadolint
  quality-javascript:
    extends: default
    setup:
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24.11.1
  quality-cluster:
    extends: quality-helm
    timeout-minutes: 15
    setup:
      - run: uv run python scripts/quality/install_tools.py --tools kind kubectl
  quality-shell:
    extends: default
    setup:
      - run: uv run python scripts/quality/install_tools.py --tools shellcheck
      - run: .quality-tools/bin/shellcheck --version
  quality-delivery:
    extends: default
    setup:
      - run: uv run python scripts/quality/install_tools.py --tools actionlint shellcheck
  quality-secrets:
    extends: default
    setup:
      - run: uv run python scripts/quality/install_tools.py --tools gitleaks
  quality-manifests:
    extends: quality-helm
    setup:
      - run: uv run python scripts/quality/install_tools.py --tools kubeconform kube-linter
  quality-ansible:
    extends: default
    setup:
      - run: uv run python scripts/quality/install_collections.py
  quality-fast:
    extends: quality-helm
    setup:
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24.11.1
      - run: uv run python scripts/quality/install_tools.py --tools hadolint
  quality-integration:
    extends: quality-helm
    setup:
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24.11.1
      - run: uv run python scripts/quality/install_tools.py --tools promtool
      - run: |
          set -euo pipefail
          read -r image < quality/nginx-syntax-image.txt
          docker pull "${image}"
nodes:
  graph:
    title: Graph integrity
    profile: default
    run: |-
      set -euo pipefail
      uv run qg validate
      uv run python scripts/quality/contracts.py
      uv run python scripts/quality/strict_guard.py
      uv run pytest -q tests/test_quality_python_policy.py
    policy: &id001
      blocking: true
      approvals:
        findings: false
        files: false
        node: false
  yaml:
    title: YAML structure
    profile: default
    run: uv run python scripts/quality/lint.py yaml
    policy: *id001
    needs:
      - graph
    results:
      native: reports/yaml.json
  scripts-q000:
    title: Python script and test quotes (Q000)
    profile: default
    needs:
      - graph
    policy: *id001
    run: |-
      set -euo pipefail
      uv run python -m scripts.quality.python_inputs scripts/ tests/ |
        xargs -0 -r uv run ruff check --config quality/ruff.toml --select Q000 \
          --ignore-noqa --output-format concise --
  deploy-i001:
    title: Owned deploy Python import order (I001)
    profile: default
    needs:
      - graph
    policy: *id001
    run: |-
      set -euo pipefail
      uv run python -m scripts.quality.python_inputs deploy/ |
        xargs -0 -r uv run ruff check --config quality/ruff.toml --select I001 \
          --ignore-noqa --output-format concise --
  secrets:
    title: Credential hygiene
    profile: quality-secrets
    run: uv run python scripts/quality/lint.py secrets
    policy: *id001
    needs:
      - graph
    results:
      native: reports/secrets.json
  javascript:
    title: JavaScript syntax
    profile: quality-javascript
    run: uv run python scripts/quality/lint.py javascript
    policy: *id001
    needs:
      - graph
    results:
      native: reports/javascript.json
  ownership:
    title: Ownership contracts
    profile: quality-helm
    needs:
      - graph
    policy: *id001
    run: |-
      set -euo pipefail
      uv run python scripts/check_infrastructure_contracts.py
      uv run python scripts/check_source_pointers.py
      uv run python scripts/check_operational_entrypoints.py
      uv run python scripts/check_vendor_contracts.py
      uv run python scripts/alert_graphs.py --check
      uv run python scripts/n8n/check_failure_alerts.py
      uv run python -m pytest -q \
        tests/test_alert_graph_inventory.py \
        tests/test_alert_graph_panel_ids.py \
        tests/test_alert_graphs_chart.py \
        tests/test_infrastructure_contracts.py \
        tests/test_n8n_failure_alert_policy.py \
        tests/test_n8n_failure_alerts.py \
        tests/test_operational_entrypoints.py \
        tests/test_source_pointers.py \
        tests/test_vendor_contracts.py
  docker:
    title: Container recipes
    profile: quality-docker
    needs:
      - graph
    policy: *id001
    run: |
      set -euo pipefail
      uv run pytest -q tests/test_quality_experiment_admission.py -k docker
      uv run python scripts/quality/lint.py docker
    results:
      native: reports/docker.json
  tests-fast:
    title: Unit tests
    profile: quality-fast
    needs:
      - graph
    policy: *id001
    run: uv run python scripts/quality/tests.py fast --isolate-network
    results:
      junit: reports/tests-fast.xml
  workflow:
    title: Delivery security
    profile: quality-delivery
    needs:
      - graph
    policy: *id001
    run: uv run python scripts/quality/lint.py workflow
    env:
      GH_TOKEN: ${{ github.token }}
    results:
      native: reports/workflow.json
  shell:
    title: Shell safety
    profile: quality-shell
    needs:
      - graph
    policy: *id001
    run: uv run python scripts/quality/lint.py shell
    results:
      native: reports/shell.json
  rustfs-return-types:
    title: RustFS gateway public return types
    profile: default
    needs:
      - graph
    policy: *id001
    run: >-
      uv run ruff check --config quality/ruff.toml --select ANN201 --ignore-noqa
      services/rustfs_gateway
  manifests:
    title: Manifest validation
    profile: quality-manifests
    needs:
      - ownership
    policy: *id001
    run: uv run python scripts/quality/charts.py
    results:
      native: reports/manifests.json
  tests-medium:
    title: Integration tests
    profile: quality-integration
    run: uv run python scripts/quality/tests.py medium --isolate-network
    policy: *id001
    needs:
      - ownership
    results:
      junit: reports/tests-medium.xml
  ansible:
    title: Playbook safety
    profile: quality-ansible
    run: uv run python scripts/quality/lint.py ansible
    policy: *id001
    needs:
      - ownership
    results:
      native: reports/ansible.json
...
