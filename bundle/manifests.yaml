---
# Source: wiki-editor/templates/workload.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiki-editor-private
spec:
  podSelector:
    matchLabels:
      app: wiki-editor
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wiki
        - ipBlock:
            cidr: 192.168.0.23/32
        - ipBlock:
            cidr: 192.168.0.24/32
        - ipBlock:
            cidr: 10.250.0.1/32
        - ipBlock:
            cidr: 10.250.0.3/32
        - ipBlock:
            cidr: 10.42.2.1/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.2.0/32
        - ipBlock:
            cidr: 10.42.1.0/32
      ports:
        - port: 8080
          protocol: TCP
---
# Source: wiki-editor/templates/workload.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wiki-editor-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
# Source: wiki-editor/templates/workload.yaml
apiVersion: v1
kind: Service
metadata:
  name: wiki-editor
spec:
  selector:
    app: wiki-editor
  ports:
    - port: 8080
      targetPort: http
---
# Source: wiki-editor/templates/workload.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-editor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiki-editor
  template:
    metadata:
      labels:
        app: wiki-editor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: editor
          image: "ghcr.io/alchemmist/socrat-wiki-editor@sha256:4473629da8a62910bf16eda06d6e2ebd986249036257eb49a2e2515ebc6c7e56"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: LIVE_MODE
              value: "true"
            - name: LIVE_TEMPLATE_DIR
              value: /opt/wiki
            - name: LIVE_STATE_DIR
              value: /data/live
            - name: GIT_REPOSITORY
              value: git@github.com:alchemmist/homelab.git
            - name: PUBLIC_ORIGIN
              value: https://wiki.alchemmist.xyz
            - name: WORK_DIR
              value: /data/repository
            - name: GIT_SSH_KEY
              value: /etc/wiki-git/id_ed25519
            - name: GIT_KNOWN_HOSTS
              value: /etc/wiki-hosts/known_hosts
            - name: EDITOR_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wiki-editor-auth
                  key: gateway-token
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: work
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: git-key
              mountPath: /etc/wiki-git
              readOnly: true
            - name: hosts
              mountPath: /etc/wiki-hosts
              readOnly: true
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: wiki-editor-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: git-key
          secret:
            secretName: wiki-editor-git
            defaultMode: 0440
        - name: hosts
          configMap:
            name: wiki-editor-hosts
