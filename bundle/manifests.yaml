---
# Source: wiki-editor/templates/workload.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiki-editor-private
spec:
  podSelector:
    matchLabels:
      app: wiki-editor
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.0.23/32
        - ipBlock:
            cidr: 192.168.0.24/32
        - ipBlock:
            cidr: 10.250.0.1/32
        - ipBlock:
            cidr: 10.250.0.3/32
        - ipBlock:
            cidr: 10.42.2.1/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.2.0/32
        - ipBlock:
            cidr: 10.42.1.0/32
      ports:
        - port: 8080
          protocol: TCP
---
# Source: wiki-editor/templates/workload.yaml
apiVersion: v1
kind: Service
metadata:
  name: wiki-editor
spec:
  selector:
    app: wiki-editor
  ports:
    - port: 8080
      targetPort: http
---
# Source: wiki-editor/templates/workload.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-editor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiki-editor
  template:
    metadata:
      labels:
        app: wiki-editor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: editor
          image: "ghcr.io/alchemmist/socrat-wiki-editor@sha256:daf4ab626b26516ae3cf69833d9b5d337c328640fb911312080d9c929d1d6f71"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: GIT_REPOSITORY
              value: git@github.com:alchemmist/homelab.git
            - name: PUBLIC_ORIGIN
              value: https://wiki.alchemmist.xyz
            - name: WORK_DIR
              value: /data/repository
            - name: GIT_SSH_KEY
              value: /etc/wiki-git/id_ed25519
            - name: GIT_KNOWN_HOSTS
              value: /etc/wiki-hosts/known_hosts
            - name: EDITOR_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wiki-editor-auth
                  key: gateway-token
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: work
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: git-key
              mountPath: /etc/wiki-git
              readOnly: true
            - name: hosts
              mountPath: /etc/wiki-hosts
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: git-key
          secret:
            secretName: wiki-editor-git
            defaultMode: 0440
        - name: hosts
          configMap:
            name: wiki-editor-hosts
