---
name: SWE Mini Release
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - services/swe-mini/**
      - .github/workflows/swe-mini-release.yml
permissions:
  contents: read
concurrency:
  group: swe-mini-release
  cancel-in-progress: false
jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Test publication boundaries
        run: python -m unittest discover -s tests/swe_mini -v
      - name: Verify existing scoped Harbor robot
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: python3 scripts/harbor_ci_auth.py --repository homelab/swe-mini
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          # Existing hosted-runner transport workaround; no global TLS or DNS change.
          driver-opts: |
            env.GODEBUG=tlsmlkem=0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        id: image
        with:
          context: services/swe-mini
          push: true
          platforms: linux/amd64
          outputs: type=image,compression=zstd,compression-level=12,force-compression=true
          tags: harbor.socrat.alchemmist.xyz/homelab/swe-mini:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Socrat
        uses: alchemmist/deploy-to-socrat@56037a9bf2a4d7b5c0fd715911a0efa9032ae7a6  # v1
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          app: swe-mini
          image_version: ${{ steps.image.outputs.digest }}
      - name: Remove ephemeral registry credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          directory = pathlib.Path(os.environ.get('DOCKER_CONFIG', '/nonexistent'))
          if (
              directory.name.startswith('harbor-ci-auth-')
              and directory.parent == pathlib.Path(os.environ['RUNNER_TEMP'])
          ):
              (directory / 'config.json').unlink(missing_ok=True)
          PY
...
