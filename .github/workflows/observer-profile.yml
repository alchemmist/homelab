name: Native observer policy
on:
  pull_request:
    paths:
      - '.github/workflows/observer-profile.yml'
      - 'deploy/identity/**'
      - 'deploy/platform/rancher/public-entry/**'
      - 'ansible/roles/authentik/**'
      - 'ansible/roles/identity_integrations/**'
      - 'scripts/observer-*.py'
      - 'deploy/wiki-runtime/**'
      - 'tests/test_observer_membership.py'
      - 'tests/test_observer_access.py'
      - 'tests/test_identity.py'
      - 'tests/test_app_iam.py'
      - 'tests/test_browser_auth_policy.py'
      - 'tests/test_native_browser_auth.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/observer-profile.yml'
      - 'deploy/identity/**'
      - 'deploy/platform/rancher/public-entry/**'
      - 'ansible/roles/authentik/**'
      - 'ansible/roles/identity_integrations/**'
      - 'scripts/observer-*.py'
      - 'deploy/wiki-runtime/**'
      - 'tests/test_observer_membership.py'
      - 'tests/test_observer_access.py'
permissions:
  contents: read
jobs:
  policy-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned test dependencies (no infrastructure credentials)
        run: |
          python3 -m venv /tmp/observer-ci-venv
          /tmp/observer-ci-venv/bin/python -m pip install --disable-pip-version-check pytest==9.0.2 PyYAML==6.0.3
      - name: Offline policy and identity regression tests
        run: >-
          /tmp/observer-ci-venv/bin/python -m pytest -q
          tests/test_observer_membership.py
          tests/test_observer_access.py
          tests/test_identity.py
          tests/test_app_iam.py
          tests/test_browser_auth_policy.py
          tests/test_native_browser_auth.py
