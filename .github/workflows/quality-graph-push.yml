  graph:
    name: Graph integrity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - run: 'uv run qg validate

          uv run python scripts/quality/contracts.py'
        name: Run Graph integrity
        id: quality-command
        continue-on-error: true
      - name: Collect Graph integrity result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
        with:
          operation: collect
          node-id: graph
          title: Graph integrity
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: bf908d457cc74cbb66f72a8a5f673a207329395bb15f710af04e25758734bdf5
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Graph integrity result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-graph-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/graph.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Graph integrity result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    timeout-minutes: 5
