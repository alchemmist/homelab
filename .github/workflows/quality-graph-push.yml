# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph (push)
'on':
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests-cluster:
    name: Cluster lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.19.0
      - run: uv run python scripts/quality/install_tools.py --tools kind kubectl
      - run: uv run python scripts/quality/tests.py cluster
        name: Run Cluster lifecycle
        id: quality-command
        continue-on-error: true
      - name: Collect Cluster lifecycle result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
        with:
          operation: collect
          node-id: tests-cluster
          title: Cluster lifecycle
          adapter: junit
          report-path: reports/tests-cluster.xml
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 8d7afc182fd87cd9060f41fdf3072dce287ccb5838a7f6d9291fd52b91544d9e
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Cluster lifecycle result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-tests-cluster-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/tests-cluster.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Cluster lifecycle result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    timeout-minutes: 15
