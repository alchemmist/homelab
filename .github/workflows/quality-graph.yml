      - name: Collect Credential hygiene result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
        with:
          operation: collect
          node-id: secrets
          title: Credential hygiene
          adapter: native
          report-path: reports/secrets.json
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 1906984676d64ade0033fac57089b793f05068442b136149a7d5dd5350e25190
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Credential hygiene result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-secrets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/secrets.json
