name: Strict Kind lifecycle
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/strict-kind-lifecycle.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind-lifecycle:
    name: kind-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.19.0
      - run: uv run python scripts/quality/install_tools.py --tools kind kubectl
      - name: Private UUID Kind lifecycle
        run: uv run python scripts/quality/tests.py cluster
