---
# Independent expectations for the pilot workloads in the owner Helm render.
# Compare actual volume sources and every mount, not just allowed volume types.
canvasVolumes:
  - {name: pg-ca, configMap: {name: pg-common-ca}}
  - {name: sdk-iteration-policy, emptyDir: {sizeLimit: 2Mi}}
policies:
  automation-postgres-egress:
    podSelector:
      matchExpressions:
        - key: statefulset.kubernetes.io/pod-name
          operator: In
          values: [openhands-0]
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: postgres}}
            podSelector: {matchLabels: {cnpg.io/cluster: pg-common}}
        ports: [{port: 5432, protocol: TCP}]
services:
  openhands:
    type: ClusterIP
    selector: &canvas {app.kubernetes.io/instance: openhands, app.kubernetes.io/name: agent-canvas}
    ports: &http [{name: http, port: 8000, protocol: TCP, targetPort: http}]
  openhands-headless:
    type: ClusterIP
    clusterIP: None
    publishNotReadyAddresses: true
    selector: *canvas
    ports: *http
  monori-publisher:
    selector: {app: monori-publisher}
    ports: [{port: 8081, targetPort: 8081}]
  openhands-oidc:
    selector: {app: openhands-oidc}
    ports: [{name: http, port: 4180, targetPort: http}]
  openhands-oidc-sessions:
    selector: {app: openhands-oidc-sessions}
    ports: [{name: redis, port: 6379, targetPort: redis}]
...
