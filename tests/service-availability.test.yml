  - series: prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group="/rules/file;socrat.services.availability"}
    values: 0+30x20
  promql_expr_test:
  - expr: count(ALERTS{alertname="SocratServiceBlogUnavailable",alertstate="pending"})
    eval_time: 1m30s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="SocratServiceBlogUnavailable",alertstate="firing"})
    eval_time: 1m30s
    exp_samples: []
  - expr: (max(2 * ALERTS{alertname="SocratServiceBlogUnavailable",service_id="blog",alertstate="firing"}
      or ALERTS{alertname="SocratServiceBlogUnavailable",service_id="blog",alertstate="pending"}))
      or ((1 - max(probe_success{job="service-probes",service_id="blog"})) and on()
      ((max(up{job="service-probes",service_id="blog"}) == 1) and on() (time() - max(timestamp(up{job="service-probes",service_id="blog"}))
      < 90) and on() (time() - max(timestamp(probe_success{job="service-probes",service_id="blog"}))
      < 90) and on() (time() - max(prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group=~".*;socrat.services.availability"})
      < 90))) or vector(-2)
    eval_time: 1m30s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="SocratServiceBlogUnavailable",alertstate="firing"})
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: (max(2 * ALERTS{alertname="SocratServiceBlogUnavailable",service_id="blog",alertstate="firing"}
