- name: active eviction remains visible despite failed scrape
  interval: 30s
  input_series:
  - series: up{job="kubelet",metrics_path="/metrics",node="socrat-1"}
    values: '0x40'
  - series: ALERTS{alertname="KubeNodeEviction",alertstate="firing",node="socrat-1"}
