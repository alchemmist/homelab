      == 1) and on() (time() - max(timestamp(up{job="kubelet",metrics_path="/metrics",node="socrat-1"}))
      < 90) and on() (time() - max(prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group=~".*;kubernetes-system-kubelet"})
      < 90))) or vector(-2)
    eval_time: 2m
