rule_files:
- node-certificates.rules.yml
evaluation_interval: 30s
tests:
- name: no eviction counter is clear with healthy fresh source
  interval: 30s
  input_series:
  - series: up{job="kubelet",metrics_path="/metrics",node="socrat-1"}
    values: 1x40
  - series: prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group="/rules/file;kubernetes-system-kubelet"}
    values: 0+30x40
  promql_expr_test:
  - expr: (max(2 * ALERTS{alertname="KubeNodeEviction",alertstate="firing",node="socrat-1"}
      or ALERTS{alertname="KubeNodeEviction",alertstate="pending",node="socrat-1"}))
      or (vector(0) and on() ((max(up{job="kubelet",metrics_path="/metrics",node="socrat-1"})
      == 1) and on() (time() - max(timestamp(up{job="kubelet",metrics_path="/metrics",node="socrat-1"}))
      < 90) and on() (time() - max(prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group=~".*;kubernetes-system-kubelet"})
      < 90))) or vector(-2)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
- name: failed eviction scrape is unknown not clear
  interval: 30s
  input_series:
  - series: up{job="kubelet",metrics_path="/metrics",node="socrat-1"}
    values: '0x40'
  - series: prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group="/rules/file;kubernetes-system-kubelet"}
    values: 0+30x40
  promql_expr_test:
  - expr: (max(2 * ALERTS{alertname="KubeNodeEviction",alertstate="firing",node="socrat-1"}
      or ALERTS{alertname="KubeNodeEviction",alertstate="pending",node="socrat-1"}))
      or (vector(0) and on() ((max(up{job="kubelet",metrics_path="/metrics",node="socrat-1"})
      == 1) and on() (time() - max(timestamp(up{job="kubelet",metrics_path="/metrics",node="socrat-1"}))
      < 90) and on() (time() - max(prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group=~".*;kubernetes-system-kubelet"})
      < 90))) or vector(-2)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: -2
- name: stale eviction rule evaluation is unknown
  interval: 30s
  input_series:
  - series: up{job="kubelet",metrics_path="/metrics",node="socrat-1"}
    values: 1x40
  - series: prometheus_rule_group_last_evaluation_timestamp_seconds{rule_group="/rules/file;kubernetes-system-kubelet"}
