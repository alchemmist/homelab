---
extends: default
rules:
  line-length:
    max: 100
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
    level: error
  comments:
    level: error
  comments-indentation:
    level: error
  document-start:
    level: error
    present: true
  document-end:
    level: error
    present: true
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: false
  float-values:
    require-numeral-before-decimal: true
    forbid-scientific-notation: false
    forbid-nan: false
    forbid-inf: false
  # Unsatisfiable with ansible-lint key-order on the same mappings.
  key-ordering: disable
  # Explicit null and an empty map remain valid; only implicit empty values fail.
  empty-values:
    level: error
    forbid-in-block-mappings: true
    forbid-in-flow-mappings: true
    forbid-in-block-sequences: true
  # Enforce one compatible quote style, not a blanket exception for strings.
  quoted-strings:
    level: error
    quote-type: double
    required: only-when-needed
    check-keys: false
    allow-quoted-quotes: false
...
