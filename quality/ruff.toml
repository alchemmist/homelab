target-version = "py313"
line-length = 100

[lint]
select = ["ALL"]
# Unsatisfiable rule pairs. Documented in docs/quality/strict-policy.md.
ignore = ["D203", "D213", "ISC001", "COM812"]

[lint.per-file-ignores]
# Test method names describe behavior; do not require method docstrings.
"**/test/**" = ["D102"]
"**/tests/**" = ["D102", "S101"]
