---
serviceClusterIP: "" # Optional fixed existing Service VIP; never a Pod/public address.
# Full-service image is activated only after a protected, naturally drained release.
tokenAccountingMode: byte-bound-v1
brokerImage: pragent/pr-agent:0.49.0-github_app@sha256:b57649785c4366eed39aab698f6d0fe944fa21cb7c2312ddc9bc8e4db2192a60
nodeName: socrat-1
writeEnabled: true
storageSize: 2Gi
secretName: spi-triage
appSecretName: pr-agent
brokerNamespace: pr-agent
grafanaUrl: http://kube-prometheus-stack-grafana.cattle-monitoring-system.svc.cluster.local
dispatchEnabled: true
telegramLinksEnabled: true
s3Evidence:
  publicOrigin: https://spi-evidence.socrat.alchemmist.xyz
  enabled: false
  retainCredentials: false
  writerSecret: ""
durableWaitEnabled: false
llmMinuteTokens: 30000
queueUI:
  enabled: false
  hostAliases: []
  nodeName: socrat-3
  authEgressCIDRs: []
  oidc:
    enabled: false
    existingSecret: spi-queue-oidc
legacyImage: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
legacyImagePullSecrets: []
bundleEnabled: false
image:
  repository: harbor.socrat.alchemmist.xyz/homelab/spi-triage
  tag: 731e6ff9d905f96c39166d094b8069f06ec7a039
  digest: sha256:5ca296d0dff03eb85598808b4822c48938b5676d21bd2bec759612d8b10388ab
imagePullSecrets:
- name: spi-triage-harbor-pull

# Requires the full-service image and a scoped client token; opt-in after acceptance.
graphs:
  enabled: false
  existingSecret: spi-graph-client

workerReplicas: 1
dataClaim: spi-triage-data
requireExistingData: false
maintenanceIngressPaused: false

# App-only migration must not drag the existing installation-token broker.
brokerAffinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [socrat-0, socrat-1]
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [socrat-0]
...
