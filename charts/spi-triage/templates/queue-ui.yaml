{{- if .Values.queueUI.enabled }}
{{- if not .Values.bundleEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: spi-queue-ui
  labels: {app: spi-queue-ui}
data:
{{ range $path, $_ := .Files.Glob "ui/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{ end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: spi-queue-ui}
spec:
  replicas: 1
  selector: {matchLabels: {app: spi-queue-ui}}
  template:
    metadata:
      labels: {app: spi-queue-ui}
      {{- if not .Values.bundleEnabled }}
      annotations:
        checksum/ui: {{ (.Files.Glob "ui/*").AsConfig | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.queueUI.nodeName | quote }}
      {{- $pull := ternary .Values.imagePullSecrets .Values.legacyImagePullSecrets .Values.bundleEnabled }}
      {{- with $pull }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: {{ include "spi-triage.image" . | quote }}
          command: [python, -B, /ui/queue_web.py]
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
          volumeMounts:
            {{- if not .Values.bundleEnabled }}
            - {name: ui, mountPath: /ui, readOnly: true}
            {{- end }}
            - {name: queue-control, mountPath: /queue-control, readOnly: true}
      volumes:
        {{- if not .Values.bundleEnabled }}
        - name: ui
          configMap: {name: spi-queue-ui}
        {{- end }}
        - name: queue-control
          secret:
            secretName: spi-queue-control
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata: {name: spi-queue-ui}
spec:
  selector: {app: spi-queue-ui}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: spi-queue-clean-identity}
spec:
  headers:
    customRequestHeaders:
      X-authentik-groups: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: spi-queue-auth}
spec:
  forwardAuth:
    address: https://rustfs.socrat.alchemmist.xyz/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: false
    authResponseHeaders: [X-authentik-groups]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spi-queue-ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.priority: '160'
spec:
  ingressClassName: traefik
  rules:
    - host: rustfs.socrat.alchemmist.xyz
      http:
        paths:
          - path: /queue
            pathType: Prefix
            backend:
              service: {name: spi-queue-ui, port: {number: 8080}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: spi-queue-ui}
spec:
  podSelector: {matchLabels: {app: spi-queue-ui}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    {{- range .Values.queueUI.authEgressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{port: 443, protocol: TCP}]
    {{- end }}
    - to:
        - podSelector: {matchLabels: {app: spi-triage}}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
