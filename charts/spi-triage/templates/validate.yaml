{{- if not (kindIs "bool" .Values.s3Evidence.enabled) }}
{{- fail "s3Evidence.enabled must be boolean" }}
{{- end }}
{{- if not (kindIs "bool" .Values.s3Evidence.retainCredentials) }}
{{- fail "s3Evidence.retainCredentials must be boolean" }}
{{- end }}
{{- if or .Values.s3Evidence.enabled .Values.s3Evidence.retainCredentials }}
{{- if not (regexMatch "^spi-evidence-writer$" .Values.s3Evidence.writerSecret) }}
{{- fail "S3 requires dedicated spi-evidence-writer Secret, never root/reader/general env Secret" }}
{{- end }}
{{- end }}

{{- if not (kindIs "bool" .Values.durableWaitEnabled) }}
{{- fail "durableWaitEnabled must be boolean" }}
{{- end }}
{{- if or (kindIs "bool" .Values.llmMinuteTokens) (not (or (eq (toString .Values.llmMinuteTokens) "30000") (eq (toString .Values.llmMinuteTokens) "60000"))) }}
{{- fail "llmMinuteTokens must be 30000 or 60000" }}
{{- end }}
{{- if not (has .Values.s3Evidence.publicOrigin (list "https://rustfs.socrat.alchemmist.xyz" "https://spi-evidence.socrat.alchemmist.xyz")) }}
{{- fail "s3Evidence.publicOrigin must be the canonical RustFS origin or pre-cutover legacy origin" }}
{{- end }}
{{- if not (kindIs "bool" .Values.queueUI.enabled) }}
{{- fail "queueUI.enabled must be boolean" }}
{{- end }}
{{- if and .Values.queueUI.enabled (not (regexMatch "^.+@sha256:[0-9a-f]{64}$" .Values.image)) }}
{{- fail "queueUI requires the pinned worker runtime image" }}
{{- end }}
{{- if .Values.queueUI.enabled }}
{{- if not .Values.queueUI.authEgressCIDRs }}
{{- fail "queueUI requires explicit fixed auth-edge /32 egress" }}
{{- end }}
{{- range .Values.queueUI.authEgressCIDRs }}
{{- if not (has . (list "109.173.40.247/32" "109.120.141.97/32")) }}
{{- fail "queueUI auth egress must use the reviewed TLS auth-edge /32 addresses" }}
{{- end }}
{{- end }}
{{- end }}

{{- if not (kindIs "bool" .Values.queueUI.external) }}{{ fail "queueUI.external must be boolean" }}{{- end }}
