apiVersion: v1
kind: ConfigMap
metadata:
  name: spi-triage-code
data:
{{ range $path, $_ := .Files.Glob "files/*.py" }}
{{ if ne (base $path) "github_broker.py" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{ end }}
{{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spi-github-broker-code
  namespace: {{ .Values.brokerNamespace }}
data:
  github_broker.py: |-
{{ .Files.Get "files/github_broker.py" | indent 4 }}
