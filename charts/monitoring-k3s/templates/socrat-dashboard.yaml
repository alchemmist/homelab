{{- range $name := list "overview" "nodes" "services" "llm" }}
{{- $content := $.Files.Get (printf "dashboards/%s.json" $name) }}
{{- if and (eq $name "nodes") $.Values.nodeAlertLinks }}
{{- $dashboard := fromJson $content }}
{{- range $panel := $dashboard.panels }}
{{- $links := index $.Values.nodeAlertLinks (printf "%v" $panel.id) }}
{{- if $links }}
{{- $_ := set $panel.fieldConfig.defaults "links" $links }}
{{- end }}
{{- end }}
{{- $content = toPrettyJson $dashboard }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socrat-{{ $name }}-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards
data:
  socrat-{{ $name }}.json: |
{{ $content | indent 4 }}
{{- end }}
