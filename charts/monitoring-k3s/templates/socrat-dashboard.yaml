{{- range $name := list "overview" "nodes" "services" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socrat-{{ $name }}-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards
data:
  socrat-{{ $name }}.json: |
{{ $.Files.Get (printf "dashboards/%s.json" $name) | indent 4 }}
{{- end }}
