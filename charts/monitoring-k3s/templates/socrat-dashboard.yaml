{{- range $name := list "overview" "nodes" "services" "llm" "metrics" }}
{{- $content := $.Files.Get (printf "dashboards/%s.json" $name) }}
{{- $alertLinks := dict }}
{{- if eq $name "nodes" }}
{{- $alertLinks = $.Values.nodeAlertLinks | default dict }}
{{- else if eq $name "overview" }}
{{- $alertLinks = $.Values.overviewAlertLinks | default dict }}
{{- end }}
{{- if $alertLinks }}
{{- $dashboard := fromJson $content }}
{{- range $panel := $dashboard.panels }}
{{- $links := index $alertLinks (printf "%v" $panel.id) }}
{{- if $links }}
{{- $_ := set $panel.fieldConfig.defaults "links" $links }}
{{- end }}
{{- end }}
{{- $content = toPrettyJson $dashboard }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socrat-{{ $name }}-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards
data:
  socrat-{{ $name }}.json: |
{{ $content | indent 4 }}
{{- end }}
