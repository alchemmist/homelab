{{- range $number := list 1 2 3 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socrat-traffic-light-tmp-{{ $number }}-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards
data:
  socrat-traffic-light-tmp-{{ $number }}.json: |
{{ $.Files.Get (printf "dashboards/traffic-light-tmp-%v.json" $number) | indent 4 }}
{{- end }}
