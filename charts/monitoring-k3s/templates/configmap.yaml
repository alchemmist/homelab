apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-etcd-metrics-config
data:
  nginx.conf.template: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 64; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen ${METRICS_BIND}:{{ .Values.port }};
        location = /metrics {
          if ($http_authorization != "Bearer ${METRICS_TOKEN}") { return 403; }
          limit_except GET { deny all; }
          proxy_pass http://127.0.0.1:2381/metrics;
          proxy_connect_timeout 2s;
          proxy_read_timeout 10s;
          proxy_set_header Authorization "";
        }
        location / { return 404; }
      }
    }
