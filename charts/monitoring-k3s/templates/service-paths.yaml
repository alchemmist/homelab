apiVersion: v1
kind: ConfigMap
metadata: {name: socrat-service-paths, namespace: automation}
data:
  paths.py: |
{{ .Files.Get "files/service_paths.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: socrat-api-read-canary, namespace: automation}
data: {canary: service-path-v1}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: socrat-api-read-canary, namespace: automation}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [socrat-api-read-canary]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: socrat-api-read-canary, namespace: automation}
subjects: [{kind: ServiceAccount, name: service-path-socrat-3, namespace: automation}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: socrat-api-read-canary}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: socrat-bot-path-slices, namespace: socrat-bot}
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: socrat-bot-path-slices, namespace: socrat-bot}
subjects:
  - {kind: ServiceAccount, name: service-path-socrat-3, namespace: automation}
  - {kind: ServiceAccount, name: service-path-socrat-5, namespace: automation}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: socrat-bot-path-slices}
{{ range $source := list "socrat-3" "socrat-5" }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: service-path-{{ $source }}, namespace: automation}
---
apiVersion: v1
kind: Service
metadata: {name: service-path-{{ $source }}, namespace: automation}
spec:
  clusterIP: None
  selector: {app: socrat-service-path, source: {{ $source }}}
  ports: [{name: metrics, port: 9119, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: service-path-{{ $source }}, namespace: automation}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: socrat-service-path, source: {{ $source }}}
  template:
    metadata:
      labels: {app: socrat-service-path, source: {{ $source }}}
      annotations:
        checksum/code: {{ $.Files.Get "files/service_paths.py" | sha256sum }}
    spec:
      nodeSelector: {kubernetes.io/hostname: {{ $source }}}
      serviceAccountName: service-path-{{ $source }}
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: probe
          image: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command: [python, -B, /probe/paths.py]
          env: [{name: SOURCE, value: {{ $source }}}]
          ports: [{name: metrics, containerPort: 9119}]
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: code, mountPath: /probe, readOnly: true}]
      volumes: [{name: code, configMap: {name: socrat-service-paths}}]
{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: socrat-service-path, namespace: automation}
spec:
  podSelector: {matchLabels: {app: socrat-service-path}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cattle-monitoring-system}}}]
      ports: [{port: 9119, protocol: TCP}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock: {cidr: 10.250.0.2/32}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: socrat-bot}}
          podSelector: {matchLabels: {app.kubernetes.io/component: bot}}
      ports: [{port: 8082, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.43.0.1/32}}]
      ports: [{port: 443, protocol: TCP}]
    - to:
        - ipBlock: {cidr: 10.250.0.1/32}
        - ipBlock: {cidr: 10.250.0.3/32}
        - ipBlock: {cidr: 10.250.0.41/32}
        - ipBlock: {cidr: 192.168.0.23/32}
      ports: [{port: 6443, protocol: TCP}]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: socrat-service-path
  labels: {release: {{ .Values.prometheusRelease }}}
spec:
  groups:
    - name: socrat.service.paths
      rules:
        - alert: SocratServicePathDiverged
          expr: (socrat_service_path_divergence_streak >= 3) and (time() - socrat_service_path_sample_seconds < 60)
          labels: {severity: warning}
          annotations:
            {{- with index (.Values.alertGraphAnnotations | default dict) "SocratServicePathDiverged" }}
            spi_graphs: {{ . | quote }}
            {{- end }}
            summary: Ready bot endpoint works but the Kubernetes Service fails.
            runbook_url: https://github.com/alchemmist/homelab/blob/main/docs/service-paths-404.md
        - alert: SocratApiScrapeUnavailable
          expr: up{job="apiserver",instance=~"10[.]250[.]0[.](1|3|41):6443"} == 0
          for: 2m
          labels: {severity: warning}
          annotations:
            {{- with index (.Values.alertGraphAnnotations | default dict) "SocratApiScrapeUnavailable" }}
            spi_graphs: {{ . | quote }}
            {{- end }}
            summary: A monitored Kubernetes API scrape is failing.
        - alert: SocratApiScrapeMissing
          expr: |
            absent(up{job="apiserver",instance="10.250.0.1:6443"}) or
            absent(up{job="apiserver",instance="10.250.0.3:6443"}) or
            absent(up{job="apiserver",instance="10.250.0.41:6443"})
          for: 2m
          labels: {severity: warning}
          annotations:
            {{- with index (.Values.alertGraphAnnotations | default dict) "SocratApiScrapeMissing" }}
            spi_graphs: {{ . | quote }}
            {{- end }}
            summary: An expected Kubernetes API scrape target is missing.
