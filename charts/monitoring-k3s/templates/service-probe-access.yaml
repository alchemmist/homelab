{{- if .Values.serviceProbes.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-service-probes
  namespace: llm
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [open-terminal, vllm, llm-switcher]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: monitoring-service-probes
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-grafana-mcp-health
spec:
  selector:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: grafana-mcp
  ports:
    - name: health
      port: 8080
      targetPort: health
{{- end }}
