apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-k3s-shared-registry
  labels:
    release: {{ .Values.prometheusRelease }}
spec:
  groups:
    - name: socrat.k3s.shared-registry
      rules:
        - record: socrat:k3s_scheduler_pending_pods:sum
          expr: sum by (instance) (scheduler_pending_pods{job="apiserver"})
        - record: socrat:k3s_workqueue_depth:sum
          expr: sum by (instance) (workqueue_depth{job="apiserver"})
        - record: socrat:etcd_members_healthy:sum
          expr: sum(etcd_server_has_leader{job="kube-etcd"} == 1)
    - name: socrat.nodes.health
      rules:
        - record: socrat:node_exporter_last_success_timestamp_seconds
          expr: |
            max by (node) (
              label_replace(timestamp(node_uname_info{job="node-exporter"}), "node", "$1", "nodename", "(.+)")
            )
        - alert: KubeNodeNotReady
          expr: max by (node) (kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true"}) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node is not ready.
            description: 'Node {{ "{{ $labels.node }}" }} is not Ready, including when it is cordoned. The alert becomes Firing after 15m in this state.'
            rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}'
        - alert: KubeNodePressure
          expr: max by (node, condition) (kube_node_status_condition{job="kube-state-metrics",condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"}) == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Node resource pressure is active.
            description: 'Node {{ "{{ $labels.node }}" }} reports {{ "{{ $labels.condition }}" }}. The condition indicates pressure on memory, disk space or inodes, or process IDs and can lead to pod eviction. The alert becomes Firing after 5m.'
            rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}'
        - alert: SocratNodeSchedulingDisabled
          expr: max by (node) (kube_node_spec_unschedulable{job="kube-state-metrics"}) == 1
          for: 15m
          labels:
            severity: info
          annotations:
            summary: Node scheduling is disabled.
            description: 'Node {{ "{{ $labels.node }}" }} is cordoned and does not accept ordinary new pods. Existing pods can keep running. This may be intentional maintenance; the alert becomes Firing after 15m.'
            rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}'
        - alert: SocratNodeMetricsStale
          expr: |
            (
              (time() - last_over_time(socrat:node_exporter_last_success_timestamp_seconds[24h]) > 120)
              and on (node) max by (node) (kube_node_info{job="kube-state-metrics"})
            )
            or
            (
              max by (node) (kube_node_info{job="kube-state-metrics"})
              unless on (node) last_over_time(socrat:node_exporter_last_success_timestamp_seconds[24h])
            )
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Node exporter telemetry is stale or missing.
            description: 'Node {{ "{{ $labels.node }}" }} has no successful node-exporter sample in the last 2m, or no recorded sample in the last 24h. The alert becomes Firing after 1m. Check the exporter, its scrape target and network reachability; this does not by itself prove that the node is down.'
            rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}'
    - name: socrat.nodes.hardware
      rules:
        - record: socrat:node_cpu_temperature_headroom_celsius
          expr: |-
            min by (node) (
              ((max by (instance, chip, sensor) (node_hwmon_temp_crit_celsius{job="node-exporter"} > 0) * on (instance, chip) group_left () max by (instance, chip) (node_hwmon_chip_names{job="node-exporter",chip_name=~"coretemp|k10temp|zenpower"})) - on (instance, chip, sensor) (max by (instance, chip, sensor) (node_hwmon_temp_celsius{job="node-exporter"}) * on (instance, chip) group_left () max by (instance, chip) (node_hwmon_chip_names{job="node-exporter",chip_name=~"coretemp|k10temp|zenpower"})))
              * on (instance) group_left (node) max by (instance, node) (label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)"))
            )
            or
            (
              100 - max by (node) ((max by (instance, chip, sensor) (node_hwmon_temp_celsius{job="node-exporter"}) * on (instance, chip) group_left () max by (instance, chip) (node_hwmon_chip_names{job="node-exporter",chip_name=~"coretemp|k10temp|zenpower"})) * on (instance) group_left (node) max by (instance, node) (label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)")))
              and on (node) max by (node) (label_replace(node_uname_info{job="node-exporter",nodename="socrat-1"}, "node", "$1", "nodename", "(.+)"))
            )
        - record: socrat:node_thermal_throttles:increase5m
          expr: |-
            max by (node) (
              max by (instance) (increase(node_cpu_core_throttles_total{job="node-exporter"}[5m])
              or increase(node_cpu_package_throttles_total{job="node-exporter"}[5m]))
              * on (instance) group_left (node) max by (instance, node) (label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)"))
            )
        - record: socrat:node_pressure_waiting:ratio5m
          expr: |-
            label_replace(max by (node) (rate(node_pressure_cpu_waiting_seconds_total{job="node-exporter"}[5m]) * on (instance) group_left (node) max by (instance, node) (label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)"))), "resource", "cpu", "node", ".+")
            or
            label_replace(max by (node) (rate(node_pressure_memory_waiting_seconds_total{job="node-exporter"}[5m]) * on (instance) group_left (node) max by (instance, node) (label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)"))), "resource", "memory", "node", ".+")
            or
            label_replace(max by (node) (rate(node_pressure_io_waiting_seconds_total{job="node-exporter"}[5m]) * on (instance) group_left (node) max by (instance, node) (label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)"))), "resource", "io", "node", ".+")
        - record: socrat:node_cpu_steal:ratio5m
          expr: avg by (node) (max by (instance, cpu) (rate(node_cpu_seconds_total{job="node-exporter",mode="steal"}[5m])) * on
            (instance) group_left (node) max by (instance, node) (label_replace(node_uname_info{job="node-exporter"}, "node",
            "$1", "nodename", "(.+)")))
        - alert: SocratNodeCPUTemperatureHigh
          expr: socrat:node_cpu_temperature_headroom_celsius < 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CPU temperature is approaching its limit.
            description: Node {{ "{{ $labels.node }}" }} has less than 10 C of CPU temperature headroom for 5m. Headroom uses the CPU
              sensor critical threshold; socrat-1 uses the Ryzen 7 7840HS 100 C limit. Check cooling and sustained load.
            rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}
        - alert: SocratNodeThermalThrottling
          expr: socrat:node_thermal_throttles:increase5m > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: CPU thermal throttling has been detected.
            description: Node {{ "{{ $labels.node }}" }} has reported hardware CPU thermal throttle events in the trailing 5m for 2m.
              These are hardware events, not container CPU-limit throttling or a percentage of lost performance.
            rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}
        - alert: SocratNodeResourceContention
          expr: socrat:node_pressure_waiting:ratio5m{resource="cpu"} > 0.25 or socrat:node_pressure_waiting:ratio5m{resource=~"memory|io"}
            > 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Tasks are persistently waiting for a node resource.
            description: 'Node {{ "{{ $labels.node }}" }} has sustained {{ "{{ $labels.resource }}" }} PSI some pressure for 10m: above 25% for
              CPU or 10% for memory or I/O, averaged over 5m. This measures time with at least one stalled task, not resource
              utilization or Kubernetes eviction pressure.'
            rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}
        - alert: SocratNodeCPUStealHigh
          expr: socrat:node_cpu_steal:ratio5m > 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Hypervisor CPU steal time is high.
            description: Node {{ "{{ $labels.node }}" }} spends more than 10% of CPU time waiting for the hypervisor, averaged across
              CPUs over 5m, for 15m. Check contention on the virtualization host; this is distinct from application CPU usage.
            rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ "{{ $labels.node }}" }}
    - name: socrat.containers.health
      rules:
        - alert: SocratContainerOOMKilled
          expr: |
            (
              max by (namespace, pod, container, uid) (kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",reason="OOMKilled"}) == 1
              and on (namespace, pod, container, uid)
              (
                time() - max by (namespace, pod, container, uid) (kube_pod_container_status_last_terminated_timestamp{job="kube-state-metrics"}) >= 0
                and
                time() - max by (namespace, pod, container, uid) (kube_pod_container_status_last_terminated_timestamp{job="kube-state-metrics"}) <= 600
              )
            )
            * on (namespace, pod, uid) group_left (node)
            max by (namespace, pod, uid, node) (kube_pod_info{job="kube-state-metrics"})
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: Container was recently killed because it ran out of memory.
            description: 'Container {{ "{{ $labels.container }}" }} in pod {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} on node {{ "{{ $labels.node }}" }} has a last termination marked OOMKilled within the trailing 10m. The alert becomes Firing after 30s even if the pod has recovered to Ready. Check memory usage and the container memory limit. This rule covers regular containers; later terminations can replace the recorded reason.'
            rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }}'
        - alert: SocratContainerRestartsFrequent
          expr: |
            (
              max by (namespace, pod, container, uid) (
                increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[30m])
                or
                increase(kube_pod_init_container_status_restarts_total{job="kube-state-metrics"}[30m])
              ) >= 3
            )
            * on (namespace, pod, uid) group_left (node)
            max by (namespace, pod, uid, node) (kube_pod_info{job="kube-state-metrics"})
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Container is restarting frequently.
            description: 'Container {{ "{{ $labels.container }}" }} in pod {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} on node {{ "{{ $labels.node }}" }} has an estimated increase of at least 3 restarts in the trailing 30m for 1m. This includes regular and init containers and does not require continuous unready or CrashLoopBackOff states. Check termination reasons and previous container logs; Prometheus increase extrapolates between samples.'
            rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }}'
