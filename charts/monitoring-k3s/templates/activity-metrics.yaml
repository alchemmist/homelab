apiVersion: v1
kind: Service
metadata:
  name: socrat-argocd-metrics
  namespace: argocd
  labels:
    app: socrat-argocd-metrics
spec:
  selector:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/instance: argo-cd
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socrat-n8n-activity
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  exporter.py: |
{{ .Files.Get "files/n8n-activity-exporter.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socrat-n8n-activity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: socrat-n8n-activity
  template:
    metadata:
      labels:
        app: socrat-n8n-activity
      annotations:
        checksum/native-pipeline: {{ include "monitoring-k3s.tvNativeMetrics" . | sha256sum }}
        checksum/exporter: {{ .Files.Get "files/n8n-activity-exporter.py" | sha256sum }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: socrat-0
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
          command: [python, /app/exporter.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: metrics
              containerPort: 9189
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: credentials
              mountPath: /secrets
              readOnly: true
        - name: native-metrics
          image: docker.io/otel/opentelemetry-collector-contrib@sha256:ac0bb9cdc844b55d2fd2655d03e596243787d6a8c52dd408b1dc96dd1bd372ee
          args: ["--config=/collector/collector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: native-config
              mountPath: /collector
              readOnly: true
            - name: native-tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: native-config
          configMap:
            name: socrat-tv-native-metrics
        - name: native-tls
          secret:
            secretName: socrat-tv-native-metrics
            defaultMode: 0440
        - name: code
          configMap:
            name: socrat-n8n-activity
        - name: credentials
          secret:
            secretName: socrat-n8n-observer
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socrat-n8n-activity
spec:
  podSelector:
    matchLabels:
      app: socrat-n8n-activity
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cattle-monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9189
  egress:
{{- if .Values.publicIpProbes.enabled }}
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.publicIpProbes.sourceAddress }}
      ports:
        - port: {{ .Values.publicIpProbes.port }}
          protocol: TCP
{{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cattle-monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 4317
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-application-controller
      ports:
        - port: 8082
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: automation
          podSelector:
            matchLabels:
              app: n8n
      ports:
        - port: 5678
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: socrat-tv-native-metrics
spec:
  secretName: socrat-tv-native-metrics
  commonName: socrat-tv-native-metrics
  usages: [digital signature, client auth]
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: otel-ca
    kind: Issuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socrat-tv-native-metrics
data:
  collector.yaml: |
{{ include "monitoring-k3s.tvNativeMetrics" . | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: socrat-tv-otlp-receiver
spec:
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kube-prometheus-stack-prometheus
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otel-grpc
