{{- $metrics := .Values.traefikMetrics | default dict }}
{{- if $metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $metrics.serviceName }}
  namespace: kube-system
  labels:
    app: {{ $metrics.serviceName }}
spec:
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: metrics
      port: {{ $metrics.port }}
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $metrics.serviceName }}
  labels:
    release: {{ .Values.prometheusRelease }}
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app: {{ $metrics.serviceName }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $metrics.interval }}
      scrapeTimeout: {{ $metrics.scrapeTimeout }}
      relabelings:
        - targetLabel: job
          replacement: traefik
{{- end }}
