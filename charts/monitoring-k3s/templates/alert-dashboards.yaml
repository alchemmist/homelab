{{- range $path, $_ := .Files.Glob "alert-dashboards/*.json" }}
{{- $uid := trimSuffix ".json" (base $path) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $uid }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards/Alert-diagnostics
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
