image: nginx:1.31.2-alpine
secretName: monitoring-etcd-metrics-token
prometheusRelease: kube-prometheus-stack
port: 9238
nodes:
  socrat-0: 10.250.0.1
  socrat-1: 10.250.0.3
  socrat-2: 10.250.0.2
nodeAlertLinks: {}
traefikMetrics:
  enabled: true
  serviceName: monitoring-traefik-metrics
  port: 9100
  interval: 5s
  scrapeTimeout: 4s
publicIpProbes:
  enabled: true
  node: socrat-0
