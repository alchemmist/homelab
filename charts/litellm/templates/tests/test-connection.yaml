{{- if .Values.testsEnabled }}
apiVersion: v1
kind: Pod
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: "{{ include "litellm.fullname" . }}-test-connection"
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  serviceAccountName: {{ include "litellm.fullname" . }}-helm-test
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: wget
      image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      command: ['sh', '-c']
      args:
        - |
          # Wait for a bit to allow the service to be ready
          sleep 10
          # Try multiple times with a delay between attempts
          for i in $(seq 1 30); do
            wget -O /dev/null -T 5 "{{ include "litellm.fullname" . }}:{{ .Values.service.port }}/health/readiness" && exit 0
            echo "Attempt $i failed, waiting..."
            sleep 2
          done
          exit 1
  restartPolicy: Never
{{- end }}
