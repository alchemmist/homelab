{{- if .Values.enabled }}
# Only the common writer hosts databases with TCP service probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-common-writer-service-probes
spec:
  podSelector: {matchLabels: {cnpg.io/cluster: pg-common, cnpg.io/instanceRole: primary}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cattle-monitoring-system}}
          podSelector: {matchLabels: {app: monitoring-service-probes}}
      ports: [{port: 5432, protocol: TCP}]
{{- end }}
