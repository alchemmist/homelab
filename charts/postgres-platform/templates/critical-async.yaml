{{- if .Values.enabled }}
# A replica cluster stays outside the source cluster's ANY 1 failover quorum.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-critical-async
spec:
  instances: 1
  imageName: {{ .Values.imageName | quote }}
  enableSuperuserAccess: false
  bootstrap:
    pg_basebackup:
      source: pg-critical
  replica:
    enabled: true
    source: pg-critical
  externalClusters:
    - name: pg-critical
      connectionParameters:
        host: pg-critical-rw.{{ .Release.Namespace }}.svc.cluster.local
        user: streaming_replica
        sslmode: verify-full
      sslRootCert: {name: pg-critical-ca, key: ca.crt}
      sslCert: {name: pg-critical-replication, key: tls.crt}
      sslKey: {name: pg-critical-replication, key: tls.key}
  affinity:
    nodeSelector:
      kubernetes.io/hostname: socrat-3
  storage:
    size: 5Gi
    storageClass: pg-local-retain
  resources:
    requests: {cpu: 100m, memory: 256Mi}
{{- end }}
