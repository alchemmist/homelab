{{- range $resource := .Values.resources }}
{{- if and (eq $resource.kind "Deployment") (eq $resource.metadata.name "dashboard") }}
{{- $image := $.Values.image.repository }}
{{- if $.Values.image.digest }}
{{- $image = printf "%s@%s" $image $.Values.image.digest }}
{{- else }}
{{- $image = printf "%s:%s" $image $.Values.image.repository $.Values.image.tag }}
{{- end }}
{{- $_ := set (first $resource.spec.template.spec.containers) "image" $image }}
{{- end }}
---
{{ toYaml $resource }}
{{- end }}
