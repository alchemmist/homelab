apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: otel-loki
  labels:
    app: otel-loki
    app.kubernetes.io/part-of: otel-backends
spec:
  selector:
    app: otel-loki
  externalIPs:
  - {{ .Values.externalIP | quote }}
  ports:
  - name: http
    port: 3100
    targetPort: http
