apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-terminal-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: open-terminal
spec:
  type: ClusterIP
  selector:
    app: open-terminal
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-terminal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-terminal
  template:
    metadata:
      {{- if .Values.browserCleanup.enabled }}
      annotations:
        checksum/browser-cleanup: {{ include (print $.Template.BasePath "/browser-cleanup-configmap.yaml") . | sha256sum }}
      {{- end }}
      labels:
        app: open-terminal
    spec:
      {{- if .Values.browserCleanup.enabled }}
      shareProcessNamespace: true
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      containers:
        - name: open-terminal
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OPEN_TERMINAL_PACKAGES
              value: {{ join " " (.Values.systemPackages | default list) | quote }}
            - name: OPEN_TERMINAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: api-key
            - name: OPEN_TERMINAL_MAX_SESSIONS
              value: '4'
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/user
            {{- if .Values.browserCleanup.enabled }}
            - name: browser-cleanup
              mountPath: /usr/local/bin/homelab-browser-test
              subPath: browser_test_runner.py
              readOnly: true
            {{- end }}
        {{- if .Values.browserCleanup.enabled }}
        - name: browser-cleanup
          image: {{ .Values.image | quote }}
          command: [python, /guard/browser_watchdog.py]
          env:
            - name: BROWSER_MAX_AGE_SECONDS
              value: {{ .Values.browserCleanup.maxAgeSeconds | quote }}
            - name: BROWSER_POLL_SECONDS
              value: {{ .Values.browserCleanup.pollSeconds | quote }}
            - name: BROWSER_GRACE_SECONDS
              value: {{ .Values.browserCleanup.graceSeconds | quote }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: browser-cleanup
              mountPath: /guard
              readOnly: true
        {{- end }}
      volumes:
        {{- if .Values.browserCleanup.enabled }}
        - name: browser-cleanup
          configMap:
            name: open-terminal-browser-cleanup
            defaultMode: 0555
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: open-terminal-data
