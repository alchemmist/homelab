replicaCount: 1

image:
  repository: nginx
  tag: 1.27-alpine
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  className: traefik
  host: img.alchemmist.xyz
  tlsSecretName: img-proxy-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
