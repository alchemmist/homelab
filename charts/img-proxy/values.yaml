---
replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: socrat-2

image:
  repository: nginx
  tag: 1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  className: traefik
  host: img.alchemmist.xyz
  tlsSecretName: img-proxy-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi


# Ingress reaches this service only through the traefik-edge release.
networkPolicy:
  enabled: true
  ingressFromNamespaces:
    - traefik-edge
...
