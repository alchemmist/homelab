apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  default.conf: |
    # HTTP context only: never log query strings, headers or client addresses.
    map $status $access_level {
      default info;
      ~^4 warn;
      ~^5 error;
    }
    log_format safe_json escape=json '{"timestamp":"$time_iso8601","service":"img-proxy","level":"$access_level","method":"$request_method","path":"$uri","status":$status,"bytes_sent":$body_bytes_sent,"duration_seconds":$request_time}';
    access_log /dev/stdout safe_json;
    server {
      listen 8080;
      server_name _;

      location / {
        proxy_pass https://images.weserv.nl;
        proxy_ssl_server_name on;
        proxy_set_header Host images.weserv.nl;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36";
        proxy_set_header Accept "image/webp,image/apng,image/*,*/*;q=0.8";
        proxy_set_header Referer "https://images.weserv.nl/";
        add_header Access-Control-Allow-Origin "*" always;
      }
    }
