---
workflowConfigRevision: bot-scoped-api-1
# Enable only after asserted global natural n8n/SPI drain. False renders the original runtime
# exactly.
googleDnsEnabled: false
# Pre-HTTP TCP/TLS address failover for the two exact Google API/OAuth hosts.
googleTransportEnabled: true
database:
  postgresEnabled: true
  secretName: n8n-postgres
postgresCaConfigMap: pg-common-ca
replicaCount: 1
image:
  repository: harbor.socrat.alchemmist.xyz/n8n/n8n
  tag: 444db57644c734c8c45a4d621888540d597fdbf5
  digest: sha256:34bb222fb111ffd12c63859cd9b7567d94264b859b1e52ce3967207a637c5755
imagePullSecrets:
  - n8n-harbor-pull
nodeName: socrat-5
secretName: n8n-secrets
persistence:
  claimName: n8n-socrat5
  storageClass: local-path
  size: 5Gi
host: n8n.socrat.alchemmist.xyz
webhookUrl: https://n8n.socrat.alchemmist.xyz/
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
ingress:
  enabled: true

tolerations: []

# Preserved socrat-1 recovery dataset; quiesced/freshly copied to VM105 on15Nov.
# Retain these rollback coordinates unchanged. Active original n8n-socrat5 PV/PVC
# now contains the final consistent socrat-1 dataset on the VM's dedicated data disk.
recoveryStorage:
  enabled: true
  name: n8n-recovery-20261114
  nodeName: socrat-1
  path: /home/alchemmist/.local/share/homelab/n8n-recovery-20261114/data
  size: 5Gi

# VPN-as-service identity in native 3x-ui; NOT wg-socrat or SSH forwarding.
serviceVpn:
  enabled: true
  secretName: n8n-service-vpn
  image:
    ghcr.io/mhsanaei/3x-ui@sha256:1628adbd9bed680d25d6f714bef4a20f132105f4612ea294952f6665dad32e5b

# OIDC: n8n 1.x stores SSO config in its database (settings key features.oidc),
# set via Settings -> SSO owner UI. Authentik identity is provisioned by
# scripts/provision-n8n-oidc.py; credentials: kubectl -n automation get secret socrat-authentik-n8n.
authentikPublicAlias:
  enabled: true
  ip: 109.173.40.247
  host: auth.socrat.alchemmist.xyz

# n8n log-streaming webhook bridge to otel-loki. n8n posts its log-streaming
# webhook destination to 127.0.0.1:<port>/event; the bridge converts each event
# to a Loki push entry and ships it over mTLS using the dedicated n8n client
# leaf mirrored into the automation namespace (see
# deploy/monitoring/otel-application-credentials.yaml).
# n8n binary-data (execution attachments) stored in RustFS, in-cluster S3.
# Dedicated writer identity (machine user `n8n`, bucket `n8n-binary`) is
# provisioned offline by scripts/rustfs/n8n_objectstore.py and mounted from
# the automation-namespace Secret rendered there (n8n-s3-storage).
s3BinaryData:
  enabled: true
  secretName: n8n-s3-storage
  host: rustfs.rustfs.svc.cluster.local:9000
  protocol: http
  bucket: n8n-binary
  region: us-east-1

otelLogBridge:
  enabled: true
  secretName: otel-app-tls-n8n
  image: docker.io/library/python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
  port: 9123
  lokiUrl: https://otel-loki.cattle-monitoring-system.svc.cluster.local:3100
  lokiServerName: otel-loki.cattle-monitoring-system.svc.cluster.local
