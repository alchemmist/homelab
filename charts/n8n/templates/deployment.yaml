{{- if and .Values.googleEgress.enabled (not .Values.googleTransportEnabled) }}
{{- fail "Google egress requires scoped verified Google transport" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      annotations:
        checksum/yandex-extension: {{ include (print $.Template.BasePath "/yandex-extension.yaml") . | sha256sum }}
      labels:
        app: n8n
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: {{ .Values.image | quote }}
          env:
            {{- if .Values.googleTransportEnabled }}
            - name: NODE_OPTIONS
              value: '--require=/opt/n8n/yandex-extension/google-transport-preload.js'
            {{- else if .Values.googleDnsEnabled }}
            - name: NODE_OPTIONS
              value: '--require=/opt/n8n/yandex-extension/google-dns-preload.js'
            {{- end }}
            {{- if .Values.googleEgress.enabled }}
            - name: N8N_GOOGLE_SSH_EGRESS
              value: '1'
            {{- end }}
            - name: EXECUTIONS_TIMEOUT_MAX
              value: '21600'
            - name: N8N_CUSTOM_EXTENSIONS
              value: /opt/n8n/yandex-extension
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: encryption-key
            - name: N8N_HOST
              value: {{ .Values.host }}
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PROXY_HOPS
              value: '1'
            - name: N8N_DIAGNOSTICS_ENABLED
              value: 'false'
            - name: WEBHOOK_URL
              value: {{ .Values.webhookUrl }}
            - name: N8N_SECURE_COOKIE
              value: 'true'
            - name: GENERIC_TIMEZONE
              value: Europe/Moscow
            - name: TZ
              value: Europe/Moscow
          ports:
            - name: http
              containerPort: 5678
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: yandex-extension
              mountPath: /opt/n8n/yandex-extension
              readOnly: true
            - name: data
              mountPath: /home/node/.n8n
        {{- if .Values.googleEgress.enabled }}
        - name: google-egress
          image: {{ .Values.googleEgress.image | quote }}
          command: [ssh]
          args:
            - -F
            - /dev/null
            - -N
            - -T
            - -L
            - 127.0.0.1:18443:www.googleapis.com:443
            - -L
            - 127.0.0.1:18444:oauth2.googleapis.com:443
            - -i
            - /egress/id_ed25519
            - -p
            - '2222'
            - -o
            - BatchMode=yes
            - -o
            - IdentitiesOnly=yes
            - -o
            - StrictHostKeyChecking=yes
            - -o
            - UserKnownHostsFile=/egress/known_hosts
            - -o
            - HostKeyAlias=[socrat.alchemmist.xyz]:2224
            - -o
            - ExitOnForwardFailure=yes
            - -o
            - ServerAliveInterval=15
            - -o
            - ServerAliveCountMax=3
            - -o
            - ConnectTimeout=10
            - alchemmist@10.250.0.2
          readinessProbe:
            exec:
              command: [python, -c, "import socket; [socket.create_connection(('127.0.0.1',p),2).close() for p in (18443,18444)]"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: google-egress, mountPath: /egress, readOnly: true}
        {{- end }}
      volumes:
        {{- if .Values.googleEgress.enabled }}
        - name: google-egress
          secret:
            secretName: {{ .Values.googleEgress.secretName }}
            defaultMode: 0440
        {{- end }}
        - name: yandex-extension
          configMap:
            name: n8n-yandex-extension
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName | default "n8n" }}
