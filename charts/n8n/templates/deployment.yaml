{{- if and .Values.serviceVpn.enabled (not .Values.googleTransportEnabled) }}
{{- fail "Service VPN requires scoped verified Google transport" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: n8n
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      annotations:
        {{- with .Values.workflowConfigRevision }}
        workflows.socrat/revision: {{ . | quote }}
        {{- end }}
        checksum/service-vpn-script: {{ include (print $.Template.BasePath "/service-vpn.yaml") . | sha256sum }}
        checksum/yandex-extension: {{ include (print $.Template.BasePath "/yandex-extension.yaml") . | sha256sum }}
        {{- if .Values.otelLogBridge.enabled }}
        checksum/otel-log-bridge: {{ include (print $.Template.BasePath "/otel-log-bridge.yaml") . | sha256sum }}
        {{- end }}
      labels:
        app: n8n
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.authentikPublicAlias }}
      {{- if .Values.authentikPublicAlias.enabled }}
      # Node socrat-5 blocks pod egress to the split-horizon LAN VIP (192.168.0.250)
      # for auth.socrat.alchemmist.xyz; the public ingress IP is reachable instead.
      hostAliases:
        - ip: {{ .Values.authentikPublicAlias.ip }}
          hostnames:
            - {{ .Values.authentikPublicAlias.host }}
      {{- end }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Pin the controller ABI; an image upgrade requires reviewing this narrow guard.
        - name: oidc-only-login
          image: {{ include "n8n.image" . | quote }}
          command: [node, -e]
          args:
            - |
              const fs = require('fs'), crypto = require('crypto');
              const src = fs.readFileSync('/usr/local/lib/node_modules/n8n/dist/controllers/auth.controller.js', 'utf8');
              if (crypto.createHash('sha256').update(src).digest('hex') !== '12fd77c59ecc35d68690bb5e02b3e943605105c90865d973b995bc8b33f971a5') throw Error('Review n8n password handler before upgrade');
              const marker = 'async login(req, res, payload) {';
              if (src.split(marker).length !== 2) throw Error('Unexpected n8n password handler');
              fs.writeFileSync('/guard/auth.controller.js', src.replace(marker, marker + " throw new forbidden_error_1.ForbiddenError('Use Authentik OIDC');"));
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 200m, memory: 96Mi}}
          volumeMounts: [{name: login-guard, mountPath: /guard}]
      {{- if .Values.serviceVpn.enabled }}
        - name: prepare-service-vpn
          image: {{ include "n8n.image" . | quote }}
          command: [node, /vpn-script/prepare.js]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: service-vpn-script, mountPath: /vpn-script, readOnly: true}
            - {name: service-vpn-identity, mountPath: /vpn-identity, readOnly: true}
            - {name: service-vpn-runtime, mountPath: /vpn-runtime}
      {{- end }}
      containers:
        - name: n8n
          image: {{ include "n8n.image" . | quote }}
          env:
            {{- if .Values.database.postgresEnabled }}
            - {name: DB_TYPE, value: postgresdb}
            - {name: DB_POSTGRESDB_HOST, value: pg-common-rw.postgres.svc.cluster.local}
            - {name: DB_POSTGRESDB_DATABASE, value: n8n}
            - {name: DB_POSTGRESDB_SSL_ENABLED, value: 'true'}
            - {name: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED, value: 'true'}
            - name: DB_POSTGRESDB_SSL_CA
              valueFrom:
                configMapKeyRef: {name: {{ required "postgresCaConfigMap required for PostgreSQL" .Values.postgresCaConfigMap | quote }}, key: ca.crt}
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.secretName | quote }}, key: username}
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.secretName | quote }}, key: password}
            {{- end }}
            {{- if .Values.postgresCaConfigMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/pg-common/ca.crt
            {{- end }}
            {{- if .Values.googleTransportEnabled }}
            - name: NODE_OPTIONS
              value: '--require=/opt/n8n/yandex-extension/google-transport-preload.js'
            {{- else if .Values.googleDnsEnabled }}
            - name: NODE_OPTIONS
              value: '--require=/opt/n8n/yandex-extension/google-dns-preload.js'
            {{- end }}
            {{- if .Values.serviceVpn.enabled }}
            - name: N8N_GOOGLE_SERVICE_VPN
              value: '1'
            {{- end }}
            - name: EXECUTIONS_TIMEOUT_MAX
              value: '21600'
            - name: N8N_CUSTOM_EXTENSIONS
              value: /opt/n8n/yandex-extension
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: encryption-key
            - name: N8N_HOST
              value: {{ .Values.host }}
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PROXY_HOPS
              value: '1'
            - name: N8N_DIAGNOSTICS_ENABLED
              value: 'false'
            - name: WEBHOOK_URL
              value: {{ .Values.webhookUrl }}
            - name: N8N_SECURE_COOKIE
              value: 'true'
            {{- if .Values.s3BinaryData.enabled }}
            - name: N8N_DEFAULT_BINARY_DATA_MODE
              value: s3
            - name: N8N_AVAILABLE_BINARY_DATA_MODES
              value: filesystem,s3
            - name: N8N_EXTERNAL_STORAGE_S3_HOST
              value: {{ .Values.s3BinaryData.host }}
            - name: N8N_EXTERNAL_STORAGE_S3_PROTOCOL
              value: {{ .Values.s3BinaryData.protocol }}
            - name: N8N_EXTERNAL_STORAGE_S3_FORCE_PATH_STYLE
              value: 'true'
            - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME
              value: {{ .Values.s3BinaryData.bucket }}
            - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_REGION
              value: {{ .Values.s3BinaryData.region }}
            - name: N8N_EXTERNAL_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.s3BinaryData.secretName | quote }}, key: accessKey}
            - name: N8N_EXTERNAL_STORAGE_S3_ACCESS_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.s3BinaryData.secretName | quote }}, key: accessSecret}
            {{- end }}
            - name: GENERIC_TIMEZONE
              value: Europe/Moscow
            - name: TZ
              value: Europe/Moscow
          ports:
            - name: http
              containerPort: 5678
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - {name: login-guard, mountPath: /usr/local/lib/node_modules/n8n/dist/controllers/auth.controller.js, subPath: auth.controller.js, readOnly: true}
            {{- if .Values.postgresCaConfigMap }}
            - {name: pg-common-ca, mountPath: /etc/pg-common, readOnly: true}
            {{- end }}
            - name: yandex-extension
              mountPath: /opt/n8n/yandex-extension
              readOnly: true
            - name: data
              mountPath: /home/node/.n8n
        {{- if .Values.serviceVpn.enabled }}
        - name: service-vpn
          image: {{ .Values.serviceVpn.image | quote }}
          command: [/app/bin/xray-linux-amd64]
          args: [run, -c, /vpn-runtime/client.json]
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, "nc -z -w 2 127.0.0.1 18443 && nc -z -w 2 127.0.0.1 18444"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: service-vpn-runtime, mountPath: /vpn-runtime, readOnly: true}
        {{- end }}
      {{- if .Values.otelLogBridge.enabled }}
        - name: otel-log-bridge
          image: {{ .Values.otelLogBridge.image | quote }}
          command: [python3, /bridge/bridge.py]
          env:
            - {name: BRIDGE_PORT, value: {{ .Values.otelLogBridge.port | quote }}}
            - {name: LOKI_URL, value: {{ .Values.otelLogBridge.lokiUrl | quote }}}
            - {name: LOKI_SERVER_NAME, value: {{ .Values.otelLogBridge.lokiServerName | quote }}}
            - {name: TLS_DIR, value: /etc/otel-tls}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          readinessProbe:
            exec:
              command: [python3, -c, {{ printf "import socket; socket.create_connection(('127.0.0.1', %d), timeout=2).close()" (int .Values.otelLogBridge.port) | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: otel-log-bridge-script, mountPath: /bridge, readOnly: true}
            - {name: otel-log-bridge-tls, mountPath: /etc/otel-tls, readOnly: true}
            - {name: otel-log-bridge-tmp, mountPath: /tmp}
      {{- end }}
      volumes:
        - {name: login-guard, emptyDir: {sizeLimit: 1Mi}}
        {{- if .Values.otelLogBridge.enabled }}
        - name: otel-log-bridge-script
          configMap:
            name: n8n-otel-log-bridge
            defaultMode: 0440
        - name: otel-log-bridge-tls
          secret:
            secretName: {{ .Values.otelLogBridge.secretName | quote }}
            defaultMode: 0440
        - name: otel-log-bridge-tmp
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        {{- end }}
        {{- if .Values.postgresCaConfigMap }}
        - name: pg-common-ca
          configMap: {name: {{ .Values.postgresCaConfigMap | quote }}}
        {{- end }}
        {{- if .Values.serviceVpn.enabled }}
        - name: service-vpn-identity
          secret:
            secretName: {{ .Values.serviceVpn.secretName }}
            defaultMode: 0440
        - name: service-vpn-runtime
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: service-vpn-script
          configMap:
            name: n8n-service-vpn-script
        {{- end }}
        - name: yandex-extension
          configMap:
            name: n8n-yandex-extension
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName | default "n8n" }}
