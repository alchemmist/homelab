apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      annotations:
        checksum/yandex-extension: {{ include (print $.Template.BasePath "/yandex-extension.yaml") . | sha256sum }}
      labels:
        app: n8n
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: {{ .Values.image | quote }}
          env:
            - name: N8N_CUSTOM_EXTENSIONS
              value: /opt/n8n/yandex-extension
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: encryption-key
            - name: N8N_HOST
              value: {{ .Values.host }}
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PROXY_HOPS
              value: '1'
            - name: N8N_DIAGNOSTICS_ENABLED
              value: 'false'
            - name: WEBHOOK_URL
              value: {{ .Values.webhookUrl }}
            - name: N8N_SECURE_COOKIE
              value: 'true'
            - name: GENERIC_TIMEZONE
              value: Europe/Moscow
            - name: TZ
              value: Europe/Moscow
          ports:
            - name: http
              containerPort: 5678
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: yandex-extension
              mountPath: /opt/n8n/yandex-extension
              readOnly: true
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: yandex-extension
          configMap:
            name: n8n-yandex-extension
        - name: data
          persistentVolumeClaim:
            claimName: n8n
