# The legacy n8n PVC stays untouched for rollback. This explicit Retain volume
# is physically local to worker5; it must never be replaced with NFS.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-socrat5
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/lib/rancher/k3s/storage/n8n-socrat5
  claimRef:
    namespace: automation
    name: n8n-socrat5
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [socrat-5]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-socrat5
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: n8n-socrat5
  resources:
    requests:
      storage: 5Gi
