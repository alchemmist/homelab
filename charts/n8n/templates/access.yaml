# Machine endpoints do not depend on IdP availability. Their native webhook/API
# authentication remains unchanged; this route never accepts interactive passwords.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-machine-endpoints
  namespace: automation
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.priority: '200'
spec:
  ingressClassName: traefik
  rules:
    - host: n8n.socrat.alchemmist.xyz
      http:
        paths:
          - {path: /webhook, pathType: Prefix, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /webhook-waiting, pathType: Prefix, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /form, pathType: Prefix, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /form-waiting, pathType: Prefix, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /healthz, pathType: Prefix, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /mcp-server/http, pathType: Exact, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /api/v1, pathType: Prefix, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /rest/oauth1-credential/callback, pathType: Exact, backend: {service: {name: n8n, port: {number: 80}}}}
          - {path: /rest/oauth2-credential/callback, pathType: Exact, backend: {service: {name: n8n, port: {number: 80}}}}
