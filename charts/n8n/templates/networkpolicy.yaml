apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: n8n-isolation}
spec:
  podSelector: {matchLabels: {app: n8n}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 5678}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: postgres}}
          podSelector: {matchLabels: {cnpg.io/cluster: pg-common}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - ipBlock: {cidr: 91.189.82.238/32}
      ports: [{protocol: TCP, port: 32053}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: n8n-backup-isolation}
spec:
  podSelector: {matchLabels: {app: n8n-backup}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - ipBlock: {cidr: 10.250.0.5/32}
      ports: [{protocol: TCP, port: 2222}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
