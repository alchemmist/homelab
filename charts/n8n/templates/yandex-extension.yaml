apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-yandex-extension
data:
{{- range $path, $_ := .Files.Glob "extensions/*.js" }}
{{- if or (and (or $.Values.googleDnsEnabled $.Values.googleTransportEnabled) (hasPrefix "google-dns" (base $path))) (and $.Values.googleTransportEnabled (hasPrefix "google-transport" (base $path))) (and (not (hasPrefix "google-dns" (base $path))) (not (hasPrefix "google-transport" (base $path)))) }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
