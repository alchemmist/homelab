{{- if .Values.ingress.enabled }}
# Keep GET /rest/login (session lookup) and OIDC callbacks unchanged.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-deny-password-login
  namespace: {{ .Release.Namespace | quote }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: 'Host(`{{ .Values.host }}`) && Method(`POST`) && PathRegexp(`(?i)^/rest/login/?$`)'
      priority: 300
      services:
        - {name: noop@internal, kind: TraefikService}
  tls:
    secretName: n8n-public-tls
{{- end }}
