pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log off;
  server {
    listen 8080;
    server_tokens off;
    location = /healthz { return 200 'ok'; }
    location = /_session {
      internal;
      proxy_pass http://authentik-server.identity.svc.cluster.local/api/v3/core/users/me/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length '';
      proxy_set_header Host auth.socrat.alchemmist.xyz;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization '';
      proxy_set_header Cookie $http_cookie;
    }
    location = /change-password/ { return 302 /change-password; }
    location = /change-password {
      auth_request /_session;
      error_page 401 403 = @login;
      add_header Cache-Control 'no-store' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'none'; frame-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
      root /page;
      try_files /index.html =404;
    }
    location @login {
      return 302 https://auth.socrat.alchemmist.xyz/if/flow/default-authentication-flow/?next=%2Fchange-password;
    }
    location / { return 404; }
  }
}
