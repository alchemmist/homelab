apiVersion: v1
kind: ConfigMap
metadata:
  name: password-self-service
  namespace: identity
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-self-service
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels: {app: password-self-service}
  template:
    metadata:
      labels: {app: password-self-service}
      annotations:
        checksum/config: {{ printf "%s" (.Files.Get "files/nginx.conf") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: page
          image: {{ .Values.image }}
          command: [nginx]
          args: [-g, 'daemon off;']
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: password-self-service}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: password-self-service
  namespace: identity
spec:
  selector: {app: password-self-service}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: password-self-service
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app: password-self-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/component: server
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: password-self-service
  namespace: identity
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '160'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [auth.socrat.alchemmist.xyz]
      secretName: authentik-tls
  rules:
    - host: auth.socrat.alchemmist.xyz
      http:
        paths:
          - path: /change-password
            pathType: Exact
            backend:
              service: {name: password-self-service, port: {number: 80}}
          - path: /change-password/
            pathType: Exact
            backend:
              service: {name: password-self-service, port: {number: 80}}
