apiVersion: 1
datasources:
- name: "Prometheus"
  type: prometheus
  uid: prometheus
  url: http://thanos-query.cattle-monitoring-system.svc.cluster.local:9090
  access: proxy
  isDefault: true
  jsonData:
    httpMethod: POST
    timeInterval: 5s
- name: "Alertmanager"
  type: alertmanager
  uid: alertmanager
  url: http://kube-prometheus-stack-alertmanager.cattle-monitoring-system:9093/
  access: proxy
  jsonData:
    handleGrafanaManagedAlerts: false
    implementation: prometheus