---
# Credentials exist as scoped native Kubernetes Secrets; never put values here.
grafana:
  imageRenderer:
    enabled: true
    existingSecret: socrat-grafana-renderer
    image:
      registry: docker.io
      repository: grafana/grafana-image-renderer
      tag: v5.12.10
      sha: a7970b826f6e477461e02bf5463d92634e9ad27d525e4e50296978a2e592d2d7
    # 1↔5 encrypted relay passed loss/bulk acceptance; move only the renderer.
    nodeSelector:
      kubernetes.io/hostname: socrat-5
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 2Gi
    env:
      HTTP_HOST: 0.0.0.0
      # Upstream request logger otherwise includes ephemeral Grafana renderKey.
      API_SILENCE_REQUEST_LOG_PATH: /render,/healthz
      LOG_LEVEL: error
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
      RATE_LIMIT_MIN_LIMIT: "1"
      RATE_LIMIT_MAX_LIMIT: "2"
      RATE_LIMIT_MAX_AVAILABLE: "2147483648"
      RATE_LIMIT_HEADROOM: "268435456"
      BROWSER_READINESS_PRIOR_WAIT: 0s

alertGraphs:
  enabled: true
  existingSecret: socrat-alert-graphs-auth
  imagePullSecrets:
    - name: alert-graphs-harbor-pull
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [socrat-0, socrat-1]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [socrat-0]
  # Cross-node socket source is flannel.1 on socrat-2 after service DNAT/SNAT.
  botSourceCIDRs:
    - 10.42.0.0/32
...
