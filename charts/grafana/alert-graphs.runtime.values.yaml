# Credentials exist as scoped native Kubernetes Secrets; never put values here.
grafana:
  imageRenderer:
    enabled: true
    existingSecret: socrat-grafana-renderer
    image:
      registry: docker.io
      repository: grafana/grafana-image-renderer
      tag: v5.12.10
      sha: sha256:83201e73724250bbeb5a3c89763fc274771ef67156ecac3871c427d7b629d8fa8f
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    env:
      HTTP_HOST: '0.0.0.0'
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
      RATE_LIMIT_MIN_LIMIT: '1'
      RATE_LIMIT_MAX_LIMIT: '2'
      RATE_LIMIT_MAX_AVAILABLE: '1073741824'
      RATE_LIMIT_HEADROOM: '134217728'
      BROWSER_READINESS_PRIOR_WAIT: '0s'
