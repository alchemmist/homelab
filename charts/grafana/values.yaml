grafana:
  enabled: true
  namespaceOverride: ''
  forceDeployDatasources: false
  forceDeployDashboards: false
  defaultDashboardsEnabled: false
  operator:
    dashboardsConfigMapRefEnabled: false
    datasourcesEnabled: false
    annotations: {}
    matchLabels: {}
    resyncPeriod: 10m
    folder: General
    folderUID: null
    folderRef: null
  defaultDashboardsTimezone: utc
  defaultDashboardsEditable: true
  defaultDashboardsInterval: 1m
  adminUser: admin
  admin:
    existingSecret: socrat-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  rbac:
    pspEnabled: false
  ingress:
    enabled: false
    annotations: {}
    labels: {}
    hosts: []
    path: /
    tls: []
  serviceAccount:
    create: true
    autoMount: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: ALL
      enableNewTablePanelSyntax: false
      annotations: {}
      multicluster:
        global:
          enabled: false
        etcd:
          enabled: false
      provider:
        allowUiUpdates: true
        foldersFromFilesStructure: true
      folderAnnotation: grafana_folder
      env:
        GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email offline_access
        GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 8h
        GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 8h
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
      annotations: {}
      httpMethod: POST
      createPrometheusReplicasDatasources: false
      prometheusServiceName: prometheus-operated
      label: grafana_datasource
      labelValue: '1'
      exemplarTraceIdDestinations: {}
      alertmanager:
        enabled: true
        name: Alertmanager
        uid: alertmanager
        handleGrafanaManagedAlerts: false
        implementation: prometheus
      url: http://thanos-query.cattle-monitoring-system.svc.cluster.local:9090
      env:
        GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email offline_access
        GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 8h
        GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 8h
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 96Mi
  extraConfigmapMounts:
  - configMap: socrat-branding
    mountPath: /usr/share/grafana/public/img/socrat
    name: socrat-branding
    readOnly: true
  deleteDatasources: []
  additionalDataSources: []
  additionalDataSourcesString: ''
  prune: false
  service:
    portName: http-web
    ipFamilies: []
    ipFamilyPolicy: ''
  serviceMonitor:
    enabled: true
  deploymentStrategy:
    type: Recreate
  env:
    GOMEMLIMIT: 1GiB
    GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
    GF_AUTH_GENERIC_OAUTH_NAME: Authentik
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: 'true'
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: socrat-grafana
    GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email offline_access
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.socrat.alchemmist.xyz/application/o/authorize/
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.socrat.alchemmist.xyz/application/o/token/
    GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.socrat.alchemmist.xyz/application/o/userinfo/
    GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
    GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: 'true'
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
    GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: 'true'
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: 'true'
    GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: 'false'
    GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 8h
    GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 8h
    GF_AUTH_ANONYMOUS_ENABLED: 'false'
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: 'true'
    GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS: homelab-owner homelab-observer homelab-platform-operator homelab-project-maintainer
      app-grafana-viewer app-grafana-editor
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'homelab-owner') && 'GrafanaAdmin' || contains(groups[*],
      'app-grafana-editor') && 'Editor' || 'Viewer'
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    auth.anonymous:
      enabled: false
      org_role: Viewer
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/socrat-overview.json
    security:
      allow_embedding: true
    server:
      domain: grafana.socrat.alchemmist.xyz
      enforce_domain: false
      root_url: https://grafana.socrat.alchemmist.xyz/
      serve_from_sub_path: false
    users:
      allow_sign_up: false
      default_theme: dark
  nodeSelector:
    kubernetes.io/hostname: socrat-1
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 1Gi
    storageClassName: local-path
    type: pvc
  podAnnotations:
    homelab.alchemmist.xyz/dashboard-language: en
  replicas: 1
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: 50m
      memory: 512Mi
  testFramework:
    enabled: false
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        key: client-secret
        name: socrat-authentik-grafana
