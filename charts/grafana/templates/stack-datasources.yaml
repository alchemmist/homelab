apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-grafana-datasource
  namespace: cattle-monitoring-system
  labels:
    grafana_datasource: '1'
    app: kube-prometheus-stack-grafana
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/version: 92.10.0
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.10.0
    release: kube-prometheus-stack
    heritage: Helm
data:
  datasource.yaml: "apiVersion: 1\ndatasources:\n- name: \"Prometheus\"\n  type: prometheus\n  uid: prometheus\n  url: http://thanos-query.cattle-monitoring-system.svc.cluster.local:9090\n\
    \  access: proxy\n  isDefault: true\n  jsonData:\n    httpMethod: POST\n    timeInterval: 5s\n- name: \"Alertmanager\"\
    \n  type: alertmanager\n  uid: alertmanager\n  url: http://kube-prometheus-stack-alertmanager.cattle-monitoring-system:9093/\n\
    \  access: proxy\n  jsonData:\n    handleGrafanaManagedAlerts: false\n    implementation: prometheus"
