apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: nvidia-device-plugin-isolation}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: nvidia-device-plugin}}
  policyTypes: [Ingress, Egress]
  # The plugin talks only to the kubelet over the mounted Unix socket; no
  # network peers are required.
  ingress: []
  egress: []
