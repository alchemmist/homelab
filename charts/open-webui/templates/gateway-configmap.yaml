apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-gateway
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }
    server {
      listen {{ .Values.gateway.address }}:{{ .Values.gateway.port }} default_server;
      server_name _;
      return 444;
    }
    server {
      listen {{ .Values.gateway.address }}:{{ .Values.gateway.port }};
      server_name {{ .Values.gateway.host }};
      allow {{ .Values.gateway.allowedCidr }};
      deny all;
      {{- if .Values.gateway.redirectHttps }}
      return 308 https://$host$request_uri;
      {{- else }}
      resolver {{ .Values.gateway.resolver }} valid=30s ipv6=off;
      client_max_body_size 100m;
      location / {
        set $upstream "open-webui.{{ .Release.Namespace }}.svc.cluster.local:8080";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
      }
      {{- end }}
    }
