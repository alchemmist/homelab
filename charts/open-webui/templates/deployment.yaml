apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      {{- if .Values.toolGuard.enabled }}
      annotations:
        checksum/tool-guard: {{ include (print $.Template.BasePath "/tool-guard-configmap.yaml") . | sha256sum }}
      {{- end }}
      labels:
        app: open-webui
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      {{- if .Values.toolGuard.enabled }}
      initContainers:
        - name: prepare-tool-guard
          image: {{ .Values.image | quote }}
          command: [python, /guard/patch_tool_guard.py]
          args: [/app/backend/open_webui/utils/middleware.py, /patched/middleware.py]
          volumeMounts:
            - name: tool-guard
              mountPath: /guard
              readOnly: true
            - name: patched-middleware
              mountPath: /patched
      {{- end }}
      containers:
        - name: open-webui
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS
              value: {{ .Values.maxToolCallIterations | quote }}
            - name: WEBUI_AUTH
              value: "True"
            - name: WEBUI_AUTH_COOKIE_SECURE
              value: "True"
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "True"
            - name: ENABLE_DIRECT_CONNECTIONS
              value: "False"
            - name: WEBUI_URL
              value: {{ .Values.webuiUrl | quote }}
            - name: CORS_ALLOW_ORIGIN
              value: {{ .Values.webuiUrl | quote }}
            - name: ENABLE_SIGNUP
              value: "False"
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: ENABLE_OPENAI_API
              value: "True"
            - name: OPENAI_API_BASE_URL
              value: {{ .Values.openai.baseUrl | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.apiKeySecret | quote }}
                  key: {{ .Values.openai.apiKeySecretKey | quote }}
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secret | quote }}
                  key: {{ .Values.auth.secretKey | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            {{- if .Values.toolGuard.enabled }}
            - name: patched-middleware
              mountPath: /app/backend/open_webui/utils/middleware.py
              subPath: middleware.py
              readOnly: true
            - name: tool-guard
              mountPath: /app/backend/open_webui/utils/homelab_tool_guard.py
              subPath: tool_guard.py
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /app/backend/data
      volumes:
        {{- if .Values.toolGuard.enabled }}
        - name: tool-guard
          configMap:
            name: open-webui-tool-guard
        - name: patched-middleware
          emptyDir: {}
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
