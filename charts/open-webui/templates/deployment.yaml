apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: open-webui
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      {{- if or .Values.toolGuard.enabled .Values.otel.enabled }}
      annotations:
        {{- if .Values.toolGuard.enabled }}
        checksum/tool-guard: {{ include (print $.Template.BasePath "/tool-guard-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.otel.enabled }}
        checksum/otel-source: {{ .Values.otel.sourceConfigMap | quote }}
        {{- end }}
      {{- end }}
      labels:
        app: open-webui
    spec:
      {{- if .Values.otel.enabled }}
      terminationGracePeriodSeconds: 7200
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.hostAliases }}
      hostAliases:
{{ toYaml . | indent 8 }}
      {{- end }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      {{- if or .Values.toolGuard.enabled (and .Values.migrationStorage.enabled (eq .Values.persistence.claimName .Values.migrationStorage.name)) }}
      initContainers:
        {{- if and .Values.migrationStorage.enabled (eq .Values.persistence.claimName .Values.migrationStorage.name) }}
        - name: require-verified-migration
          image: {{ .Values.image | quote }}
          command: [python, -c]
          args:
            - |
              import json, pathlib, psycopg
              assert json.loads(pathlib.Path('/data/.homelab-vm105-migration-verified.json').read_text())['verified']
              url = pathlib.Path('/run/migration-db/url').read_bytes().decode('utf-8')
              with psycopg.connect(url, connect_timeout=8) as db:
                  assert db.execute('SELECT EXISTS (SELECT FROM "user"), EXISTS (SELECT FROM alembic_version)').fetchone() == (True, True)
          volumeMounts:
            - {name: migration-db, mountPath: /run/migration-db, readOnly: true}
            - {name: data, mountPath: /data, readOnly: true}
            - {name: pg-ca, mountPath: /pg-ca, readOnly: true}
        {{- end }}
        {{- if .Values.toolGuard.enabled }}
        - name: prepare-tool-guard
          image: {{ .Values.image | quote }}
          command: [python, /guard/patch_tool_guard.py]
          args: [/app/backend/open_webui/utils/middleware.py, /patched/middleware.py]
          volumeMounts:
            - name: tool-guard
              mountPath: /guard
              readOnly: true
            - name: patched-middleware
              mountPath: /patched
        {{- end }}
      {{- end }}
      containers:
        - name: open-webui
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: open-webui-postgres, key: url}}
            - {name: DATABASE_POOL_SIZE, value: "5"}
            - {name: DATABASE_POOL_MAX_OVERFLOW, value: "2"}
            - name: CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS
              value: {{ .Values.maxToolCallIterations | quote }}
            - name: WEBUI_AUTH
              value: "True"
            - name: WEBUI_AUTH_COOKIE_SECURE
              value: "True"
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "True"
            - name: ENABLE_DIRECT_CONNECTIONS
              value: "False"
            - name: WEBUI_URL
              value: {{ .Values.webuiUrl | quote }}
            - name: CORS_ALLOW_ORIGIN
              value: {{ .Values.webuiUrl | quote }}
            - name: ENABLE_SIGNUP
              value: "False"
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: ENABLE_OPENAI_API
              value: "True"
            - name: OPENAI_API_BASE_URL
              value: {{ .Values.openai.baseUrl | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.apiKeySecret | quote }}
                  key: {{ .Values.openai.apiKeySecretKey | quote }}
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secret | quote }}
                  key: {{ .Values.auth.secretKey | quote }}
            {{- if .Values.otel.enabled }}
            {{- range $name, $value := .Values.otel.environment }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - {name: pg-ca, mountPath: /pg-ca, readOnly: true}
            {{- if .Values.otel.enabled }}
            - name: otel-source
              mountPath: /etc/otel-source
              readOnly: true
            - name: otel-client
              mountPath: /etc/otel-client
              readOnly: true
            {{- end }}
            {{- if .Values.toolGuard.enabled }}
            - name: patched-middleware
              mountPath: /app/backend/open_webui/utils/middleware.py
              subPath: middleware.py
              readOnly: true
            - name: tool-guard
              mountPath: /app/backend/open_webui/utils/homelab_tool_guard.py
              subPath: tool_guard.py
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /app/backend/data
      volumes:
        {{- if and .Values.migrationStorage.enabled (eq .Values.persistence.claimName .Values.migrationStorage.name) }}
        - name: migration-db
          secret:
            secretName: open-webui-postgres
            defaultMode: 292  # 0444; mounted only in the migration guard
            items: [{key: url, path: url}]
        {{- end }}
        - {name: pg-ca, configMap: {name: pg-common-ca}}
        {{- if .Values.otel.enabled }}
        - name: otel-source
          configMap:
            name: {{ required "Proof-gated immutable source ConfigMap required" .Values.otel.sourceConfigMap | quote }}
            defaultMode: 420
        - name: otel-client
          secret:
            secretName: otel-app-tls-open-webui
            defaultMode: 256
        {{- end }}
        {{- if .Values.toolGuard.enabled }}
        - name: tool-guard
          configMap:
            name: open-webui-tool-guard
        - name: patched-middleware
          emptyDir: {}
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
