---
kube-prometheus-stack:
  grafana:
    enabled: false
  prometheus:
    prometheusSpec:
      disableCompaction: true
      enableOTLPReceiver: true
      evaluationInterval: 30s
      nodeSelector:
        kubernetes.io/hostname: socrat-0
      podMonitorNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - cattle-monitoring-system
              - llm
      podMonitorSelector:
        matchLabels:
          homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
      probeNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cattle-monitoring-system
      probeSelector:
        matchLabels:
          homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
      replicas: 1
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: 500m
          memory: 4Gi
      retention: 12h
      ruleNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cattle-monitoring-system
      ruleSelector:
        matchLabels:
          release: kube-prometheus-stack
      scrapeConfigNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cattle-monitoring-system
      scrapeConfigSelector:
        matchLabels:
          homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
      scrapeInterval: 5s
      scrapeTimeout: 4s
      serviceMonitorNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cattle-monitoring-system
      serviceMonitorSelector:
        matchLabels:
          homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: local-path
      thanos:
        image: quay.io/thanos/thanos:v0.42.4
        objectStorageConfig:
          existingSecret:
            key: objstore.yml
            name: thanos-warm-shipper
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 256Mi
        volumeMounts:
          - mountPath: /trust
            name: thanos-warm-ca
            readOnly: true
      volumes:
        - name: thanos-warm-ca
          secret:
            secretName: thanos-warm-api-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: otel-config
          configMap:
            name: otel-cluster-config
        - name: otel-source-auth
          secret:
            secretName: otel-source-auth
            defaultMode: 288
        - name: otel-source-tls
          secret:
            secretName: otel-source-auth
            defaultMode: 288
            items:
              - key: tls-0
                path: 0_cattle-monitoring-system_kube-prometheus-stack-admission_ca
              - key: tls-1
                path: 1_cattle-monitoring-system_kube-root-ca.crt_ca.crt
        - name: otel-tls
          secret:
            secretName: otel-tls-cluster
            defaultMode: 288
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
              - key: tls.crt
                path: client.crt
              - key: tls.key
                path: client.key
        - name: software-update-otel
          configMap:
            name: software-update-otel
      tsdb:
        outOfOrderTimeWindow: 30m
      walCompression: true
      alertingEndpoints:
        - namespace: cattle-monitoring-system
          name: kube-prometheus-stack-alertmanager
          port: http-web
          pathPrefix: /
          apiVersion: v2
      containers:
        - args:
            - --config=/etc/otel/config/collector.yaml
            - --config=/etc/otel/software-updates/collector.yaml
          env:
            - name: OTEL_BIND_IP
              value: 0.0.0.0
            - name: OTEL_TLS_DIR
              value: /etc/otel/tls
            - name: OTEL_STORAGE_DIR
              value: /var/lib/otel-data/otel-cluster
            - name: OTEL_SCRAPE_CONFIG
              value: /etc/otel/config/scrape.yaml
            - name: OTEL_LOG_INGESTION_START_NS
              value: "1793447920650563000"
            - name: OTEL_LOKI_ENDPOINT
              value: https://otel-loki.cattle-monitoring-system.svc:3100/otlp
            - name: OTEL_TRACE_GATEWAY_ENDPOINT
              value: 10.250.0.1:44317
            - name: GOMEMLIMIT
              value: 768MiB
            - name: GOMAXPROCS
              value: "2"
          image:
            docker.io/otel/opentelemetry-collector-contrib@sha256:ac0bb9cdc844b55d2fd2655d03e596243787d6a8c52dd408b1dc96dd1bd372ee
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 20
            periodSeconds: 10
          name: otel-cluster
          ports:
            - containerPort: 4317
              hostIP: 10.250.0.1
              hostPort: 4317
              name: otel-grpc
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /etc/otel/config
              name: otel-config
              readOnly: true
            - mountPath: /etc/otel/tls
              name: otel-tls
              readOnly: true
            - mountPath: /etc/otel/source-auth
              name: otel-source-auth
              readOnly: true
            - mountPath: /etc/prometheus/certs
              name: otel-source-tls
              readOnly: true
            - mountPath: /var/lib/otel-data
              name: prometheus-kube-prometheus-stack-prometheus-db
              subPath: prometheus-db
            - name: software-update-otel
              mountPath: /etc/otel/software-updates
              readOnly: true
        - livenessProbe:
            exec:
              command:
                - /bin/promtool
                - check
                - healthy
                - --url=http://127.0.0.1:9090
          name: prometheus
          readinessProbe:
            exec:
              command:
                - /bin/promtool
                - check
                - ready
                - --url=http://127.0.0.1:9090
          startupProbe:
            exec:
              command:
                - /bin/promtool
                - check
                - ready
                - --url=http://127.0.0.1:9090
      podMetadata:
        annotations:
          homelab.alchemmist.xyz/otel-config-sha256:
            db9921b7fe480086f1378726a72c2159cababf78c4cc45eb9ad8e2f212698067
          homelab.alchemmist.xyz/software-update-scrape-version: "2"
    thanosService:
      enabled: true
    thanosServiceMonitor:
      enabled: true
    enabled: true
  alertmanager:
    enabled: false
  prometheusOperator:
    enabled: false
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: false
  windowsMonitoring:
    enabled: false
  thanosRuler:
    enabled: false
  crds:
    enabled: false
  kubernetesServiceMonitors:
    enabled: true
  defaultRules:
    additionalRuleAnnotations:
      KubeCPUOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeMemoryOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeNodeNotReady:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{
          $labels.node }}
      KubeNodeUnreachable:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{
          $labels.node }}
      KubePodCrashLooping:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{
          $labels.namespace }}/{{ $labels.pod }}
      KubePodNotReady:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{
          $labels.namespace }}/{{ $labels.pod }}
    disabled:
      KubeJobFailed: true
      KubeMemoryOvercommit: true
      KubeNodeNotReady: true
      KubeNodePressure: true
      KubeletClientCertificateExpiration: true
      KubeletClientCertificateRenewalErrors: true
      KubeletServerCertificateExpiration: true
      KubeletServerCertificateRenewalErrors: true
      NodeBondingDegraded: true
      NodeRAIDDegraded: true
      NodeRAIDDiskFailure: true
    rules:
      alertmanager: false
      etcd: false
      configReloaders: false
      general: true
      k8sContainerCpuUsageSecondsTotal: true
      k8sContainerMemoryCache: true
      k8sContainerMemoryRss: true
      k8sContainerMemorySwap: true
      k8sContainerResource: true
      k8sContainerMemoryWorkingSetBytes: true
      k8sPodOwner: true
      kubeApiserverAvailability: true
      kubeApiserverBurnrate: true
      kubeApiserverHistogram: true
      kubeApiserverSlos: true
      kubeControllerManager: false
      kubelet: true
      kubeProxy: false
      kubePrometheusGeneral: true
      kubePrometheusNodeRecording: true
      kubernetesApps: true
      kubernetesResources: true
      kubernetesStorage: true
      kubernetesSystem: true
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeStateMetrics: false
      network: true
      node: true
      nodeExporterAlerting: false
      nodeExporterRecording: false
      prometheus: true
      prometheusOperator: false
      windows: false
    create: true
  additionalPrometheusRulesMap:
    homelab-job-failures:
      groups:
        - name: homelab-job-failures
          rules:
            - alert: KubeJobFailed
              expr: "(kube_job_failed{job=\"kube-state-metrics\"} > 0)\nunless on(namespace, j\
                ob_name)\nkube_job_owner{job=\"kube-state-metrics\",namespace=\"pr-agent\",o\
                wner_kind=\"CronJob\",owner_name=\"pr-agent-webhook-redelivery\"}\nunless on\
                (namespace, job_name)\n(\n  kube_job_owner{job=\"kube-state-metrics\",namesp\
                ace=\"pr-agent\",owner_kind=\"CronJob\",owner_name=\"spi-github-broker\"}\n  a\
                nd on(namespace, job_name) (kube_job_status_succeeded{job=\"kube-state-metri\
                cs\",namespace=\"pr-agent\"} == 1)\n  and on(namespace, job_name) (\n    kub\
                e_job_status_start_time{job=\"kube-state-metrics\",namespace=\"pr-agent\"}\n    < o\
                n(namespace) group_left() max by(namespace) (\n      kube_cronjob_status_las\
                t_successful_time{job=\"kube-state-metrics\",namespace=\"pr-agent\",cronjob=\
                \"spi-github-broker\"}\n    )\n  )\n)\n"
              for: 15m
              labels: {severity: warning}
              annotations:
                summary: Job failed to complete.
                description: >-
                  Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete.
                runbook_url: >-
                  https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
            - alert: SocratPrAgentWebhookRedeliveryFailed
              expr: |
                ((kube_job_failed{job="kube-state-metrics",namespace="pr-agent"} > 0)
                and on(namespace, job_name)
                kube_job_owner{job="kube-state-metrics",namespace="pr-agent",owner_kind="CronJob",owner_name="pr-agent-webhook-redelivery"})
                unless on(namespace, job_name)
                (kube_job_status_start_time{job="kube-state-metrics",namespace="pr-agent"}
                < on(namespace) group_left()
                max by(namespace) (
                  kube_cronjob_status_last_successful_time{job="kube-state-metrics",
                    namespace="pr-agent",cronjob="pr-agent-webhook-redelivery"}
                ))
              labels: {severity: warning}
              annotations:
                summary: Webhook redelivery failed without a later successful run.
                description: >-
                  Inspect {{ $labels.namespace }}/{{ $labels.job_name }} and GitHub delivery
                  history. A later successful scan clears this alert, but does not guarantee
                  every delivery succeeded.
    homelab-memory-overcommit:
      groups:
        - name: homelab-memory-overcommit
          rules:
            - alert: KubeMemoryOvercommit
              annotations:
                description: Cluster memory requests exceed the allocatable memory of
                  all nodes by {{ $value | humanize }} bytes. Pods will stay Pending.
                  Loss of socrat-0 is an accepted hardware limit and is not part of this
                  check.
                summary: Cluster memory requests exceed total allocatable memory.
                rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
                runbook_url:
                  https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubememoryovercommit
              expr: |
                sum(namespace_memory:kube_pod_container_resource_requests:sum{})
                - sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"}) > 0
              for: 10m
              labels:
                severity: warning
  kubeApiServer:
    serviceMonitor:
      relabelings:
        - action: keep
          regex: 10\.250\.0\.(1|3|41):6443
          sourceLabels:
            - __address__
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
  kubelet:
    serviceMonitor:
      insecureSkipVerify: false
      metricRelabelings:
        - action: drop
          regex:
            (192\.168\.0\.(23|24)|10\.250\.0\.5):10250;(apiserver|etcd|scheduler|workqueue|kubeproxy)_.*
          sourceLabels:
            - instance
            - __name__
...
