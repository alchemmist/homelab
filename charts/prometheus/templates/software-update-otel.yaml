# Extend the existing sole OTel scraper without adopting its captured config,
# reviving retired ServiceMonitor discovery or introducing a second scrape path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: software-update-otel
  namespace: {{ .Release.Namespace }}
data:
  collector.yaml: |
    receivers:
      prometheus/software_updates:
        config:
          scrape_configs:
            - job_name: monitoring-update-watch
              scrape_interval: 60s
              scrape_timeout: 10s
              static_configs:
                - targets: [monitoring-update-watch.cattle-monitoring-system.svc.cluster.local:8080]
                  labels:
                    namespace: cattle-monitoring-system
                    service: monitoring-update-watch
    service:
      pipelines:
        metrics:
          receivers: [prometheus, otlp, prometheus/software_updates]
