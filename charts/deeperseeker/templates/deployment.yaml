apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deeperseeker-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deeperseeker-service-vpn-script
data:
  prepare.py: |
{{ .Files.Get "files/prepare-service-vpn.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: deeperseeker
  labels:
    app: deeperseeker
spec:
  selector:
    app: deeperseeker
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deeperseeker
  labels:
    app: deeperseeker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deeperseeker
  template:
    metadata:
      labels:
        app: deeperseeker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      terminationGracePeriodSeconds: 40
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: prepare-service-vpn
          image: {{ .Values.vpn.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, /vpn-script/prepare.py]
          env:
            - name: VPN_ENDPOINT
              value: {{ .Values.vpn.endpoint | quote }}
            - name: VPN_PORT
              value: {{ .Values.vpn.port | quote }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: service-vpn-script
              mountPath: /vpn-script
              readOnly: true
            - name: service-vpn-identity
              mountPath: /vpn-identity
              readOnly: true
            - name: service-vpn-runtime
              mountPath: /vpn-runtime
      containers:
        - name: service-vpn
          image: {{ .Values.vpn.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/app/bin/xray-linux-amd64]
          args: [run, -c, /vpn-runtime/client.json]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: service-vpn-runtime
              mountPath: /vpn-runtime
              readOnly: true
        - name: deeperseeker
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: DEEPSEEKER_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: admin-user
            - name: DEEPSEEKER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: admin-password
            - name: DEEPSEEKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: api-key
            - name: DEEPSEEKER_CALL_GAP_SECONDS
              value: {{ .Values.callGapSeconds | quote }}
            - name: DEEPSEEKER_TOKEN_CONCURRENCY
              value: {{ .Values.tokenConcurrency | quote }}
            - name: DEEPSEEKER_BROWSER_PROXY
              value: {{ .Values.proxy.browser | quote }}
            - name: DEEPSEEKER_UPSTREAM_PROXY
              value: {{ .Values.proxy.upstream | quote }}
            - name: DEEPSEEKER_COOKIE_HEADLESS
              value: "true"
          readinessProbe:
            httpGet:
              path: /health?deep=1
              port: http
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deeperseeker-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: service-vpn-script
          configMap:
            name: deeperseeker-service-vpn-script
            defaultMode: 0555
        - name: service-vpn-identity
          secret:
            secretName: {{ .Values.vpnSecretName }}
            defaultMode: 0400
        - name: service-vpn-runtime
          emptyDir:
            medium: Memory
