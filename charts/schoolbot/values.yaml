---
replicaCount: 1
image:
  repository: harbor.socrat.alchemmist.xyz/schoolbot/schoolbot
  tag: unreleased
  digest: ""
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8000
ingress:
  className: traefik
  host: bot.sch1357.ru
  tlsSecretName: schoolbot-tls
  clusterIssuer: letsencrypt-http01
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 768Mi }
imagePullSecrets:
  - schoolbot-harbor-pull
publicBaseUrl: https://bot.sch1357.ru
cookieSecure: true
adminUi: false
updateMode: polling
timezone: Europe/Moscow
# CNPG creates role schoolbot and stores it in secret pg-internal-schoolbot
# in namespace postgres. Copy username and password into schoolbot-env.
database:
  host: pg-internal-rw.postgres.svc.cluster.local
  port: 5432
  name: schoolbot
envSecretName: schoolbot-env
podSecurity:
  user: 10001
  group: 10001
attachments:
  size: 5Gi
...
