apiVersion: v1
kind: Service
metadata:
  name: otel-tempo
  labels:
    app: otel-tempo
    app.kubernetes.io/part-of: otel-backends
spec:
  selector:
    app: otel-tempo
  externalIPs:
  - {{ .Values.externalIP | quote }}
  ports:
  - name: http
    port: 3200
    targetPort: http
  - name: otlp
    port: 4317
    targetPort: otlp
