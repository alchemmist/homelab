apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.tracing.enabled }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      containers:
        - name: lms
          {{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag -}}
          {{- if .Values.image.digest }}
          {{- $image = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
{{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
{{- end }}
            - name: LMS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: LMS_DATABASE_URL
            - name: LMS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: socrat-authentik-lms
                  key: client-id
                  optional: true
            - name: LMS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: socrat-authentik-lms
                  key: client-secret
                  optional: true
{{- if .Values.profiling.enabled }}
            - name: LMS_PROFILING_ENABLED
              value: "1"
            - name: LMS_PROFILING_ENDPOINT
              value: {{ .Values.profiling.endpoint | quote }}
{{- end }}
{{- if .Values.tracing.enabled }}
            - name: LMS_TRACING_ENABLED
              value: "1"
            - name: LMS_TRACE_SAMPLE_RATIO
              value: {{ .Values.tracing.sampleRatio | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE
              value: /etc/otel-client/ca.crt
            - name: OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE
              value: /etc/otel-client/tls.crt
            - name: OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY
              value: /etc/otel-client/tls.key
            - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
              value: Connection=close
{{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
{{- if .Values.tracing.enabled }}
            - name: otel-client
              mountPath: /etc/otel-client
              readOnly: true
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data

{{- if .Values.tracing.enabled }}
        - name: otel-client
          secret:
            secretName: {{ .Values.tracing.secretName }}
            defaultMode: 288
{{- end }}
