apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          {{- range .Values.engines }}
          - {{ . | quote }}
          {{- end }}
    engines:
      {{- range .Values.engines }}
      - name: {{ . | quote }}
        disabled: false
      {{- end }}
    general:
      instance_name: Socrat Search
    server:
      base_url: {{ .Values.baseUrl | quote }}
      limiter: false
      image_proxy: false
    search:
      safe_search: 0
      default_lang: auto
      formats:
        - html
        - json
    outgoing:
      request_timeout: 5.0
      max_request_timeout: 10.0
