---
kube-prometheus-stack:
  grafana:
    enabled: false
  prometheus:
    enabled: false
  alertmanager:
    enabled: false
  prometheusOperator:
    image:
      sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
    affinity: &portablePlacement
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [socrat-0, socrat-1]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [socrat-0]
    admissionWebhooks:
      patch:
        image:
          sha: 778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082
        affinity: *portablePlacement
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
    prometheusConfigReloader:
      resources:
        limits:
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 16Mi
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 30m
        memory: 128Mi
    enabled: true
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: false
  windowsMonitoring:
    enabled: false
  thanosRuler:
    enabled: false
  crds:
    enabled: true
  kubernetesServiceMonitors:
    enabled: false
  defaultRules:
    additionalRuleAnnotations:
      KubeCPUOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeMemoryOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeNodeNotReady:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}
      KubeNodeUnreachable:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}
      KubePodCrashLooping:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace
          }}/{{ $labels.pod }}
      KubePodNotReady:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace
          }}/{{ $labels.pod }}
    disabled:
      KubeMemoryOvercommit: true
      KubeNodeNotReady: true
      KubeNodePressure: true
      KubeletClientCertificateExpiration: true
      KubeletClientCertificateRenewalErrors: true
      KubeletServerCertificateExpiration: true
      KubeletServerCertificateRenewalErrors: true
      NodeBondingDegraded: true
      NodeRAIDDegraded: true
      NodeRAIDDiskFailure: true
    rules:
      alertmanager: false
      etcd: false
      configReloaders: true
      general: false
      k8sContainerCpuUsageSecondsTotal: false
      k8sContainerMemoryCache: false
      k8sContainerMemoryRss: false
      k8sContainerMemorySwap: false
      k8sContainerResource: false
      k8sContainerMemoryWorkingSetBytes: false
      k8sPodOwner: false
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubelet: false
      kubeProxy: false
      kubePrometheusGeneral: false
      kubePrometheusNodeRecording: false
      kubernetesApps: false
      kubernetesResources: false
      kubernetesStorage: false
      kubernetesSystem: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeStateMetrics: false
      network: false
      node: false
      nodeExporterAlerting: false
      nodeExporterRecording: false
      prometheus: false
      prometheusOperator: true
      windows: false
    create: true
...
