# cert-manager release isolation (cert-manager).
# The controller, cainjector, webhook and startupapicheck all talk to the
# in-cluster Kubernetes API (:443); the controller also solves ACME challenges
# (outbound 443 to external ACME endpoints) and serves webhooks to the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ .Release.Namespace | quote }}, name: cert-manager-controller-isolation}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: controller}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cattle-monitoring-system}}
      ports: [{protocol: TCP, port: 9402}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ .Release.Namespace | quote }}, name: cert-manager-cainjector-isolation}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: cainjector}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ .Release.Namespace | quote }}, name: cert-manager-webhook-isolation}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: webhook}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-api}}
      ports: [{protocol: TCP, port: 9443}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ .Release.Namespace | quote }}, name: cert-manager-startupapicheck-isolation}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: startupapicheck}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
