replicaCount: 2

image:
  repository: ghcr.io/alchemmist/cats
  tag: latest
  # Verified digest of the existing healthy replica; prewarm new nodes before rollout.
  digest: ""
  pullPolicy: IfNotPresent
  fallback: alchemmist/cats:latest

service:
  port: 80
  targetPort: 5173

ingress:
  className: traefik
  host: cats.alchemmist.xyz
  tlsSecretName: cats-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nodeAffinity:
  excludeHostnames:
    - socrat-2
