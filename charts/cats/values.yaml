---
replicaCount: 2

image:
  repository: harbor.socrat.alchemmist.xyz/homelab/cats
  tag: 079390c7bf05a76eb823990a28275eef181d63d9
  # Verified digest of the existing healthy replica; prewarm new nodes before rollout.
  digest: sha256:af42b0edabcbbfa0541b6ee427ec8ba649ea7aa72429f7245f95c8dbfdb61a18
  pullPolicy: IfNotPresent
  fallback: alchemmist/cats:latest

service:
  port: 80
  targetPort: 5173

ingress:
  className: traefik
  host: cats.alchemmist.xyz
  tlsSecretName: cats-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nodeAffinity:
  excludeHostnames:
    - socrat-2

imagePullSecrets:
  - cats-harbor-pull

# Local docker evidence (image digest af42b0ed..., linux/amd64):
#   - Config: nginx serving the built site on 0.0.0.0:5173 (GET / -> 200 as
#     uid 101 with a read-only root filesystem).
#   - Real runtime write paths (docker diff): /var/cache/nginx/* and
#     /run/nginx.pid. Mounted writable via emptyDir; everything else read-only.
#   - Upstream dependency (from /etc/nginx/conf.d/default.conf): only
#     rustfs.rustfs.svc.cluster.local:9000 (/src/assets -> /cats-media/).
# Fatigue-style qualitative idle (static nginx) retained from existing values.

probes:
  port: 5173
  path: /
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

writableMounts:
  - {mountPath: /var/cache/nginx}
  - {mountPath: /run}

podAntiAffinity:
  enabled: true

networkPolicy:
  enabled: true
  ingressFromNamespaces:
    - traefik-edge
  egress:
    dnsNamespace: kube-system
    upstreams:
      - namespace: rustfs
        port: 9000
...
