replicaCount: 2

image:
  repository: ghcr.io/alchemmist/cats
  tag: 3b9c55f8fc0d415f13f33348270adcfbe35af49a
  # Verified digest of the existing healthy replica; prewarm new nodes before rollout.
  digest: sha256:0c7fc2ad41c5f4435c33d84c1c93b1ea518f566c2df8a8704b0c06c6fd333bf5
  pullPolicy: IfNotPresent
  fallback: alchemmist/cats:latest

service:
  port: 80
  targetPort: 5173

ingress:
  className: traefik
  host: cats.alchemmist.xyz
  tlsSecretName: cats-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nodeAffinity:
  excludeHostnames:
    - socrat-2
