apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-transit
spec:
  replicas: {{ .Values.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: vpn-transit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vpn-transit}
      annotations:
        homelab.alchemmist.xyz/binary-sha256: {{ .Values.binarySHA256 | quote }}
    spec:
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      tolerations:
        - {key: homelab.io/bootstrap, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: relay
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          args: [run, -config, /etc/relay/user.json]
          env:
            - {name: GOMEMLIMIT, value: 96MiB}
          securityContext:
            # Static Go exec under this CRI drops non-root effective bind capability.
            # Root in scratch, read-only FS, no token and ONLY NET_BIND_SERVICE.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            tcpSocket: {host: 127.0.0.1, port: 443}
            periodSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: user-config, mountPath: /etc/relay/user.json, readOnly: true}
      volumes:
        - name: user-config
          hostPath: {path: /etc/homelab-vpn-transit/user.json, type: File}
