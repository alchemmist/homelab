{{- range $stage := (ternary (list false true) (list false) $.Values.podRehearsal) }}
{{- $name := ternary "vpn-transit-rehearsal" "vpn-transit" $stage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: {{ $name }}
spec:
  replicas: {{ ternary 0 $.Values.replicas (and (not $stage) (eq $.Values.legacyPortOwner "parked")) }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
      annotations:
        homelab.alchemmist.xyz/binary-sha256: {{ $.Values.binarySHA256 | quote }}
    spec:
      hostNetwork: {{ not $stage }}
      dnsPolicy: {{ ternary "ClusterFirst" "Default" $stage }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: {{ $.Values.nodeName }}
      tolerations:
        - {key: homelab.io/bootstrap, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: relay
          image: {{ $.Values.image | quote }}
          imagePullPolicy: Never
          args: [run, -config, /etc/relay/user.json]
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - {name: GOMEMLIMIT, value: 96MiB}
          securityContext:
            # Static Go exec under this CRI drops non-root effective bind capability.
            # Root in scratch, read-only FS, no token and ONLY NET_BIND_SERVICE.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            tcpSocket: {{ if $stage }}{port: 443}{{ else }}{host: 127.0.0.1, port: 443}{{ end }}
            periodSeconds: 5
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          volumeMounts:
            - {name: user-config, mountPath: /etc/relay/user.json, {{ if $stage }}subPath: user.json, {{ end }}readOnly: true}
      volumes:
        - name: user-config
{{- if $stage }}
          configMap: {name: vpn-transit-rehearsal}
{{- else }}
          hostPath: {path: /etc/homelab-vpn-transit/user.json, type: File}
{{- end }}
{{- end }}
