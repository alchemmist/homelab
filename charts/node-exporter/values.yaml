kube-prometheus-stack:
  grafana:
    enabled: false
  prometheus:
    enabled: false
  alertmanager:
    enabled: false
  prometheusOperator:
    enabled: false
  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: false
  windowsMonitoring:
    enabled: false
  thanosRuler:
    enabled: false
  crds:
    enabled: false
  kubernetesServiceMonitors:
    enabled: false
  defaultRules:
    additionalRuleAnnotations:
      KubeCPUOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeMemoryOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeNodeNotReady:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}
      KubeNodeUnreachable:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}
      KubePodCrashLooping:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace }}/{{ $labels.pod
          }}
      KubePodNotReady:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace }}/{{ $labels.pod
          }}
    disabled:
      KubeMemoryOvercommit: true
      KubeNodeNotReady: true
      KubeNodePressure: true
      KubeletClientCertificateExpiration: true
      KubeletClientCertificateRenewalErrors: true
      KubeletServerCertificateExpiration: true
      KubeletServerCertificateRenewalErrors: true
      NodeBondingDegraded: true
      NodeRAIDDegraded: true
      NodeRAIDDiskFailure: true
    rules:
      alertmanager: false
      etcd: false
      configReloaders: false
      general: false
      k8sContainerCpuUsageSecondsTotal: false
      k8sContainerMemoryCache: false
      k8sContainerMemoryRss: false
      k8sContainerMemorySwap: false
      k8sContainerResource: false
      k8sContainerMemoryWorkingSetBytes: false
      k8sPodOwner: false
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubelet: false
      kubeProxy: false
      kubePrometheusGeneral: false
      kubePrometheusNodeRecording: false
      kubernetesApps: false
      kubernetesResources: false
      kubernetesStorage: false
      kubernetesSystem: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeStateMetrics: false
      network: false
      node: false
      nodeExporterAlerting: true
      nodeExporterRecording: true
      prometheus: false
      prometheusOperator: false
      windows: false
    create: true
  prometheus-node-exporter:
    env:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
    extraArgs:
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
    - --collector.systemd
    - --collector.systemd.enable-restarts-metrics
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 24Mi
    service:
      listenOnAllInterfaces: false
