---
kube-prometheus-stack:
  grafana:
    enabled: false
  prometheus:
    enabled: false
  alertmanager:
    enabled: false
  prometheusOperator:
    enabled: false
  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: false
  windowsMonitoring:
    enabled: false
  thanosRuler:
    enabled: false
  crds:
    enabled: false
  kubernetesServiceMonitors:
    enabled: false
  defaultRules:
    additionalRuleAnnotations:
      KubeCPUOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeMemoryOvercommit:
        rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
      KubeNodeNotReady:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}
      KubeNodeUnreachable:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}
      KubePodCrashLooping:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace
          }}/{{ $labels.pod }}
      KubePodNotReady:
        rancher_url: >-
          https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace
          }}/{{ $labels.pod }}
    disabled:
      NodeSystemSaturation: true  # Replaced by the scoped node-saturation rule below.
      KubeMemoryOvercommit: true
      KubeNodeNotReady: true
      KubeNodePressure: true
      KubeletClientCertificateExpiration: true
      KubeletClientCertificateRenewalErrors: true
      KubeletServerCertificateExpiration: true
      KubeletServerCertificateRenewalErrors: true
      NodeBondingDegraded: true
      NodeRAIDDegraded: true
      NodeRAIDDiskFailure: true
    rules:
      alertmanager: false
      etcd: false
      configReloaders: false
      general: false
      k8sContainerCpuUsageSecondsTotal: false
      k8sContainerMemoryCache: false
      k8sContainerMemoryRss: false
      k8sContainerMemorySwap: false
      k8sContainerResource: false
      k8sContainerMemoryWorkingSetBytes: false
      k8sPodOwner: false
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubelet: false
      kubeProxy: false
      kubePrometheusGeneral: false
      kubePrometheusNodeRecording: false
      kubernetesApps: false
      kubernetesResources: false
      kubernetesStorage: false
      kubernetesSystem: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeStateMetrics: false
      network: false
      node: false
      nodeExporterAlerting: true
      nodeExporterRecording: true
      prometheus: false
      prometheusOperator: false
      windows: false
    create: true
  additionalPrometheusRulesMap:
    node-saturation:
      groups:
        - name: node-exporter
          rules:
            - alert: NodeSystemSaturation
              expr: |-
                (node_load1{job="node-exporter",node="socrat-4"}
                 / count without (cpu, mode)
                 (node_cpu_seconds_total{job="node-exporter",mode="idle"}) > 6)
                or
                (node_load1{job="node-exporter",node!="socrat-4"}
                 / count without (cpu, mode)
                 (node_cpu_seconds_total{job="node-exporter",mode="idle"}) > 2)
              for: 15m
              labels: {severity: warning}
              annotations:
                summary: System saturated, load per core is very high.
                description: >-
                  Load per core on {{ $labels.instance }} has exceeded
                  {{ if eq $labels.node "socrat-4" }}6{{ else }}2{{ end }} for 15 minutes
                  (current: {{ printf "%.2f" $value }}).
                runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/\
                  nodesystemsaturation"
  prometheus-node-exporter:
    image:
      digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    env:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
    extraArgs:
      - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
      - --collector.systemd
      - --collector.systemd.enable-restarts-metrics
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 24Mi
    service:
      listenOnAllInterfaces: false
...
