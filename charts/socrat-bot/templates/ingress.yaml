apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: socrat-bot
  labels:
{{- if .Values.publicWeb }}
    homelab.alchemmist.xyz/public-web: 'true'
{{- end }}
    app.kubernetes.io/name: socrat-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /telegram
            pathType: Prefix
            backend:
              service:
                name: socrat-bot
                port:
                  number: {{ .Values.service.port }}
          {{- if .Values.publicApiEnabled }}
          {{- range $route := list (dict "path" "/" "type" "Exact") (dict "path" "/admin/tokens" "type" "Prefix") (dict "path" "/api/v1" "type" "Prefix") }}
          - path: {{ $route.path | quote }}
            pathType: {{ $route.type }}
            backend:
              service:
                name: socrat-bot
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- end }}
