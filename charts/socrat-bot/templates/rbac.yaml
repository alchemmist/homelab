apiVersion: v1
kind: ServiceAccount
metadata:
  name: socrat-bot-xui-updater
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: socrat-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: socrat-bot-xui-updater
  namespace: x-ui
  labels:
    app.kubernetes.io/name: socrat-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["x-ui"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: socrat-bot-xui-updater
  namespace: x-ui
  labels:
    app.kubernetes.io/name: socrat-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: socrat-bot-xui-updater
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: socrat-bot-xui-updater
