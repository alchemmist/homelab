{{- $components := (include "socrat-bot.components" . | fromYaml).items }}
{{- range $i, $component := $components }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: {{ $component.name }}
  labels:
    app.kubernetes.io/name: {{ $component.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component.component }}
spec:
  replicas: {{ $.Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $component.name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component.component }}
  template:
    metadata:
      {{- if $.Values.telegramPathProbes.enabled }}
      annotations: {checksum/telegram-path: {{ $.Files.Get "files/telegram-egress-probe.py" | sha256sum }}}
      {{- end }}
      labels:
        {{- if $.Values.telegramRelay.routeBot }}
        telegram-relay-client: "true"
        {{- end }}
        app.kubernetes.io/name: {{ $component.name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component.component }}
    spec:
      {{- if $.Values.telegramRelay.routeBot }}
      {{- if not $.Values.telegramRelay.enabled }}{{ fail "routeBot requires telegramRelay.enabled" }}{{- end }}
      # Only Telegram uses the TLS passthrough. Database identity, TLS, Service
      # discovery, webhook ingress and callback authorization remain unchanged.
      hostAliases:
        - ip: {{ $.Values.telegramRelay.clusterIP | quote }}
          hostnames: [api.telegram.org]
      nodeSelector:
        kubernetes.io/hostname: socrat-1
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                namespaces: [postgres]
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {cnpg.io/cluster: pg-common, cnpg.io/instanceRole: primary}
      {{- else if $component.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: socrat-2
      {{- end }}
      {{- if $component.serviceAccount }}
      serviceAccountName: {{ $component.serviceAccount }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if and $.Values.graphs.enabled (eq $component.component "bot") }}
      securityContext:
        fsGroup: 65532
      {{- end }}
      {{- if or $.Values.databaseSecret $.Values.telegramPathProbes.enabled (and $.Values.graphs.enabled (eq $component.component "bot")) }}
      volumes:
        {{- if $.Values.telegramPathProbes.enabled }}
        {{- include "socrat-bot.pathProbeVolumes" $ | nindent 8 }}
        {{- end }}
        {{- if $.Values.databaseSecret }}
        - name: pg-common-ca
          secret: {secretName: pg-common-ca}
        {{- end }}
        {{- if and $.Values.graphs.enabled (eq $component.component "bot") }}
        - name: graph-client
          secret:
            secretName: {{ required "graphs.existingSecret is required" $.Values.graphs.existingSecret | quote }}
            defaultMode: 0440
            items: [{key: telegram, path: telegram}]
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $component.container }}
          image: {{ include "socrat-bot.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "-m", {{ $component.module | quote }}]
          ports:
            - name: http
              containerPort: {{ $component.port }}
          {{- if or $.Values.databaseSecret (and $.Values.graphs.enabled (eq $component.component "bot")) }}
          volumeMounts:
            {{- if $.Values.databaseSecret }}
            - {name: pg-common-ca, mountPath: /etc/pg-common, readOnly: true}
            {{- end }}
            {{- if and $.Values.graphs.enabled (eq $component.component "bot") }}
            - {name: graph-client, mountPath: /graph-client, readOnly: true}
            {{- end }}
          {{- end }}
          env:
            {{- if and $.Values.graphs.enabled (eq $component.component "bot") }}
            - name: ALERT_GRAPHS_ENABLED
              value: "true"
            {{- end }}
            - name: PORT
              value: {{ $component.port | quote }}
            {{- include "socrat-bot.secretEnv" $ | nindent 12 }}
            {{- if $component.extraEnv }}
            - name: ALERTMANAGER_URL
              value: {{ $.Values.alertmanagerUrl | quote }}
            {{- end }}
            {{- if eq $component.component "bot" }}
            - name: TELEGRAM_WEBHOOK_URL
              value: {{ $.Values.telegram.webhookURL | quote }}
            - name: TELEGRAM_WEBHOOK_IP
              value: {{ $.Values.telegram.webhookIP | quote }}
            - name: ACTION_WEBHOOK_URL
              value: {{ $.Values.actionWebhookURL | default "" | quote }}
            {{- end }}
          {{- include "socrat-bot.probes" $ | nindent 10 }}
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if $.Values.telegramPathProbes.enabled }}
        {{- include "socrat-bot.pathProbeContainer" $ | nindent 8 }}
      {{- end }}
{{- end }}
