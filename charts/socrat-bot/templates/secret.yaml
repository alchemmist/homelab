apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.envSecret }}
  labels:
    app.kubernetes.io/name: socrat-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.envSecret }}
{{- if $existing }}
data: {{ toYaml $existing.data | nindent 2 }}
{{- end }}
