apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      containers:
        - name: traefik
          image: {{ .Values.image }}
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.endpoint={{ .Values.apiEndpoint }}
            - --providers.kubernetesingress.ingressclass={{ .Values.ingressClass }}
            - --providers.kubernetesingress.namespaces={{ .Release.Namespace }}
            - --providers.kubernetesingress.ingressendpoint.ip={{ .Values.publicIP }}
            - --entrypoints.web.address={{ .Values.listenHost }}:{{ .Values.httpPort }}/tcp
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.web.http.redirections.entrypoint.permanent=true
            - --entrypoints.web.http.redirections.entrypoint.priority=1
            - --entrypoints.websecure.address={{ .Values.listenHost }}:{{ .Values.httpsPort }}/tcp
            - --entrypoints.websecure.http3=true
            - --entrypoints.websecure.http3.advertisedport={{ .Values.httpsPort }}
            - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0s
            - --entrypoints.health.address=127.0.0.1:{{ .Values.healthPort }}/tcp
            - --ping=true
            - --ping.entrypoint=health
            - --log.level=INFO
          ports:
            - name: web
              containerPort: {{ .Values.httpPort }}
              hostPort: {{ .Values.httpPort }}
            - name: websecure
              containerPort: {{ .Values.httpsPort }}
              hostPort: {{ .Values.httpsPort }}
            - name: websecure-udp
              containerPort: {{ .Values.httpsPort }}
              hostPort: {{ .Values.httpsPort }}
              protocol: UDP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ping
              port: {{ .Values.healthPort }}
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ping
              port: {{ .Values.healthPort }}
            initialDelaySeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
