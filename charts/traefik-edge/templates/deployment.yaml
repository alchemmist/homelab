apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      containers:
        - name: traefik
          image: {{ .Values.image }}
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.endpoint={{ .Values.apiEndpoint }}
            - --providers.kubernetesingress.ingressclass={{ .Values.ingressClass }}
            - --providers.kubernetesingress.namespaces={{ join "," (.Values.watchNamespaces | default (list .Release.Namespace)) }}
{{- if .Values.publishIngressStatus }}
            - --providers.kubernetesingress.ingressendpoint.ip={{ .Values.publicIP }}
{{- end }}
{{- if .Values.kubernetesCRD.enabled }}
            - --providers.kubernetescrd=true
            - --providers.kubernetescrd.endpoint={{ .Values.apiEndpoint }}
            - --providers.kubernetescrd.namespaces={{ join "," .Values.kubernetesCRD.namespaces }}
            - --providers.kubernetescrd.labelselector={{ .Values.kubernetesCRD.labelSelector }}
            - --providers.kubernetescrd.ingressclass={{ .Values.ingressClass }}
            - --providers.kubernetescrd.allowcrossnamespace=false
            - --providers.kubernetescrd.allowexternalnameservices=false
            - --providers.kubernetescrd.disableclusterscoperesources=true
{{- end }}
            - --entrypoints.web.address={{ .Values.listenHost }}:{{ .Values.httpPort }}/tcp
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.web.http.redirections.entrypoint.permanent=true
            - --entrypoints.web.http.redirections.entrypoint.priority=1
            - --entrypoints.websecure.address={{ .Values.listenHost }}:{{ .Values.httpsPort }}/tcp
            - --entrypoints.websecure.http.tls=true
            - --entrypoints.websecure.http3=true
            - --entrypoints.websecure.http3.advertisedport={{ .Values.httpsPort }}
            - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0s
            - --entrypoints.health.address=127.0.0.1:{{ .Values.healthPort }}/tcp
            - --ping=true
            - --ping.entrypoint=health
            - --log.level=INFO
          ports:
            - name: web
              containerPort: {{ .Values.httpPort }}
              hostPort: {{ .Values.httpPort }}
            - name: websecure
              containerPort: {{ .Values.httpsPort }}
              hostPort: {{ .Values.httpsPort }}
            - name: websecure-udp
              containerPort: {{ .Values.httpsPort }}
              hostPort: {{ .Values.httpsPort }}
              protocol: UDP
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ping
              port: health
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ping
              port: health
            initialDelaySeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            # Docker-verified (rancher/mirrored-library-traefik sha256:f86a2cab,
            # uid 65532 with CAP_NET_BIND_SERVICE): binds 0.0.0.0:80/443 and
            # answers /ping on 127.0.0.1:19090 with a read-only root filesystem
            # and /tmp writable; no root privilege or uid 0 is required.
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
