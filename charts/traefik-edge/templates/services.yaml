{{- range .Values.routes }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
spec:
  ports:
    - name: http
      port: {{ .port }}
      targetPort: {{ .port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    kubernetes.io/service-name: {{ $.Release.Name }}-{{ .name }}
    endpointslice.kubernetes.io/managed-by: homelab
addressType: IPv4
ports:
  - name: http
    port: {{ .port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ $.Values.backendIP }}
    conditions:
      ready: true
    nodeName: {{ $.Values.nodeName }}
{{- end }}
