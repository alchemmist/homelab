{{- if .Values.panelGateway.enabled }}
{{- fail "External panel auth gateway is retired; keep native 3x-ui authentication" }}
{{- end }}
{{- if .Values.createIngressClass }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.ingressClass }}
spec:
  controller: traefik.io/ingress-controller
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-vpn
  annotations:
{{- if .Values.panelGateway.enabled }}
    traefik.ingress.kubernetes.io/router.priority: '200'
{{- end }}
    kubernetes.io/ingress.class: {{ .Values.ingressClass }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: {{ .Values.ingressClass }}
  tls:
    - hosts:
        - {{ .Values.host }}
      secretName: {{ .Values.certificate.secretName }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
{{- range .Values.routes }}
{{- if or (not $.Values.panelGateway.enabled) (ne .name "panel") }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-{{ .name }}
                port:
                  number: {{ .port }}
{{- end }}

{{- end }}
