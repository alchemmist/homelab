{{- if .Values.kubernetesCRD.enabled }}
{{- range $namespace := .Values.kubernetesCRD.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-crd
  namespace: {{ $namespace }}
rules:
  # Traefik 3.7 CRD informers watch these types even when routes are label-filtered.
  - apiGroups: [traefik.io]
    resources: [ingressroutes, ingressroutetcps, ingressrouteudps, middlewares,
                middlewaretcps, serverstransports, serverstransporttcps,
                tlsoptions, tlsstores, traefikservices]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-crd
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $.Release.Name }}-crd
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
