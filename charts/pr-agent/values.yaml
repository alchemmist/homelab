image: pragent/pr-agent:0.50.0-github_app
replicaCount: 1
nodeName: socrat-5
host: pr-agent.socrat.alchemmist.xyz
tlsSecret: pr-agent-tls
clusterIssuer: letsencrypt-http01
secretName: pr-agent
port: 3000
openaiApiBase: http://litellm.llm.svc.cluster.local:4000/v1
model: openai/venice-deepseek
# Invalid YAML is retried only by walking fallback models. The chart repeats the
# primary model so one review gets this many generations before the check fails.
invalidOutputAttempts: 10
# venice-deepseek is the LiteLLM alias of the 32768-context Venice bridge model.
customModelMaxTokens: "32768"
# Per-call cap. A diff is split once it exceeds this. 24576 keeps the call inside the
# 32768 window and avoids cutting one function across many independent reviews.
# max calls is only the ceiling: unused slots are not extra chunks.
maxModelTokens: "24576"
inlineKeyIssues: true
largePrChunking: true
reviewMaxCalls: "8"
numMaxFindings: "4"
# Earlier findings are shown back to the model so it repeats them instead of paraphrasing.
maxPreviousFindingsChars: "24000"
# Host-only. Repository settings and /review arguments cannot override this.
systemInstructions: >-
  Act like a careful human reviewer. Publish only a defect you can point at in the shown code.
  Do not claim a statement was removed unless that line is absent from the diff.
  Do not restate an open inline thread, even in different words.
  Skip cosmetic import aliases and formatting-only hunks.
  If the hunk does not contain the whole function, do not invent the missing part.
committableSuggestions: true
suggestionsMaxCalls: "100"
persistentInlineComments: true
# Push reviews only the commits added since the previous review. A full /review rewrites
# old findings, the inline fingerprint misses the paraphrase, and the PR gets another copy.
# A manual /review comment still reviews the whole pull request.
handlePushTrigger: true
pushCommands: '["/review -i"]'
# The review summary is one comment that later runs update. A check run replaces that
# comment with an empty review body, which is not how people read CodeRabbit.
publishAsCheckRun: false
gunicornWorkers: "6"
# Match LiteLLM's request_timeout. The webhook returns immediately, but each model
# call used to give up after 120s while the proxy would still be waiting in queue.
aiTimeout: "7200"
# 0 disables gunicorn's silent-worker kill. A queued review may run for the full AI timeout.
# A short timeout would abort that review: the worker stops heartbeating while a model call runs.
gunicornTimeout: "0"
# DEBUG logs the entire webhook body on the request path and delays the ack.
logLevel: INFO
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi

tolerations:
  - key: homelab.io/no-nfs
    operator: Equal
    value: "true"
    effect: NoSchedule
