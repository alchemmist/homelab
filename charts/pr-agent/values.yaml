image: pragent/pr-agent:0.49.0-github_app@sha256:b57649785c4366eed39aab698f6d0fe944fa21cb7c2312ddc9bc8e4db2192a60
replicaCount: 1
nodeName: socrat-5
host: pr-agent.socrat.alchemmist.xyz
tlsSecret: pr-agent-tls
clusterIssuer: letsencrypt-http01
secretName: pr-agent
port: 3000
openaiApiBase: http://litellm.llm.svc.cluster.local:4000/v1
model: openai/qwen3.8-27b
# Invalid YAML is retried only by walking fallback models. The chart repeats the
# primary model so one review gets this many generations before the check fails.
invalidOutputAttempts: 10
customModelMaxTokens: "131072"
# Per-call cap. A diff is split once it exceeds this. 12288 keeps one call small enough
# for the 27B model. max calls is only the ceiling: unused slots are not extra chunks.
# PR-Agent has no unlimited setting, so the ceiling is deliberately high.
maxModelTokens: "12288"
inlineKeyIssues: true
largePrChunking: true
reviewMaxCalls: "100"
numMaxFindings: "12"
committableSuggestions: true
suggestionsMaxCalls: "100"
persistentInlineComments: true
handlePushTrigger: true
# /improve stays manual. Automatic runs on every push reposted the same inline suggestion.
pushCommands: '["/review"]'
# Publish describe/review as GitHub checks: in progress while the agent runs, then success or failure.
publishAsCheckRun: true
gunicornWorkers: "6"
# Match LiteLLM's request_timeout. The webhook returns immediately, but each model
# call used to give up after 120s while the proxy would still be waiting in queue.
aiTimeout: "7200"
# 0 disables gunicorn's silent-worker kill. A queued review may run for the full AI timeout.
# A short timeout would abort that review: the worker stops heartbeating while a model call runs.
gunicornTimeout: "0"
# DEBUG logs the entire webhook body on the request path and delays the ack.
logLevel: INFO
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi

tolerations:
  - key: homelab.io/no-nfs
    operator: Equal
    value: "true"
    effect: NoSchedule
