image: pragent/pr-agent:0.49.0-github_app
replicaCount: 1
nodeName: socrat-1
host: pr-agent.socrat.alchemmist.xyz
tlsSecret: pr-agent-tls
clusterIssuer: letsencrypt-http01
secretName: pr-agent
port: 3000
openaiApiBase: http://litellm.llm.svc.cluster.local:4000/v1
model: openai/qwen3.8-27b
customModelMaxTokens: "131072"
# Per-call cap. Chunk count is this budget, not max calls: a diff is split only when it
# exceeds one call. 12288 keeps each call small enough for the 27B model. The call caps
# below cover about 150k tokens of diff before files are left out. Calls run in parallel
# against one local model, so the cap stays well below a hundred.
maxModelTokens: "12288"
inlineKeyIssues: true
largePrChunking: true
reviewMaxCalls: "12"
numMaxFindings: "12"
committableSuggestions: true
suggestionsMaxCalls: "12"
persistentInlineComments: true
handlePushTrigger: true
pushCommands: '["/review", "/improve"]'
gunicornWorkers: "2"
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 2Gi
