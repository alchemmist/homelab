image: pragent/pr-agent:0.49.0-github_app
replicaCount: 1
nodeName: socrat-1
host: pr-agent.socrat.alchemmist.xyz
tlsSecret: pr-agent-tls
clusterIssuer: letsencrypt-http01
secretName: pr-agent
port: 3000
openaiApiBase: http://litellm.llm.svc.cluster.local:4000/v1
model: openai/qwen3.8-27b
customModelMaxTokens: "131072"
# Per-call cap. A diff is split once it exceeds this. 12288 keeps one call small enough
# for the 27B model. max calls is only the ceiling: unused slots are not extra chunks.
# PR-Agent has no unlimited setting, so the ceiling is deliberately high.
maxModelTokens: "12288"
inlineKeyIssues: true
largePrChunking: true
reviewMaxCalls: "100"
numMaxFindings: "12"
committableSuggestions: true
suggestionsMaxCalls: "100"
persistentInlineComments: true
handlePushTrigger: true
# /improve stays manual. Automatic runs on every push reposted the same inline suggestion.
pushCommands: '["/review"]'
gunicornWorkers: "2"
# Match LiteLLM's request_timeout. The webhook returns immediately, but each model
# call used to give up after 120s while the proxy would still be waiting in queue.
aiTimeout: "7200"
# 0 disables gunicorn's silent-worker kill. A queued review may run for the full AI timeout.
gunicornTimeout: "0"
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 2Gi
