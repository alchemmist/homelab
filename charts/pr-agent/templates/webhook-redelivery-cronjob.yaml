apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-agent-webhook-redelivery
data:
  redeliver_webhooks.py: |
{{ .Files.Get "files/redeliver_webhooks.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pr-agent-webhook-redelivery
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.nodeName | quote }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: redeliver
              image: {{ .Values.image | quote }}
              command: ["python", "/scripts/redeliver_webhooks.py"]
              env:
                - name: GITHUB__APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: github-app-id
                - name: GITHUB__PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: github-private-key
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: pr-agent-webhook-redelivery
