apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: pr-agent-isolation}
spec:
  podSelector: {matchLabels: {app: pr-agent}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: llm}}
          podSelector: {matchLabels: {app.kubernetes.io/name: litellm}}
      ports: [{protocol: TCP, port: 4000}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: pr-agent-webhook-redelivery-isolation}
spec:
  podSelector: {matchLabels: {app: pr-agent-webhook-redelivery}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
