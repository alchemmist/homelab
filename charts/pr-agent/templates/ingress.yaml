apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: pr-agent
{{- if and .Values.publicWebHost (eq .Values.publicWebHost .Values.host) }}
  labels:
    homelab.alchemmist.xyz/public-web: 'true'
{{- end }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.tlsSecret | quote }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pr-agent
                port:
                  number: 80
