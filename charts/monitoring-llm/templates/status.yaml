apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-llm-status
data:
  switcher_metrics.py: |
{{ .Files.Get "files/switcher_metrics.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-llm-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-llm-status
  template:
    metadata:
      labels:
        app: monitoring-llm-status
      annotations:
        checksum/collector: {{ .Files.Get "files/switcher_metrics.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ .Values.statusImage }}
          command: [python3, /collector/switcher_metrics.py]
          env:
            - name: SWITCHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api
                  key: api-key
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          ports:
            - name: metrics
              containerPort: 9108
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: collector
              mountPath: /collector
              readOnly: true
      volumes:
        - name: collector
          configMap:
            name: monitoring-llm-status
