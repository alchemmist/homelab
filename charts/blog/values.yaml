replicaCount: 2
image:
  repository: ghcr.io/alchemmist/homelab-blog
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8080
ingress:
  className: traefik
  hosts:
    - alchemmist.xyz
    - www.alchemmist.xyz
  tlsSecretName: blog-tls
  clusterIssuer: letsencrypt-http01
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }

imagePullSecrets:
  - ghcr-pull
