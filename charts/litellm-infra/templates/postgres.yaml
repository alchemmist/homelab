apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-private-tls
  namespace: syncthing
  annotations:
    helm.sh/resource-policy: keep
spec:
  secretName: litellm-private-tls
  dnsNames: [litellm.socrat.alchemmist.xyz]
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-http01
