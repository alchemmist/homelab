apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-postgres
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-private-tls
  namespace: syncthing
  annotations:
    helm.sh/resource-policy: keep
spec:
  secretName: litellm-private-tls
  dnsNames: [litellm.socrat.alchemmist.xyz]
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-http01
