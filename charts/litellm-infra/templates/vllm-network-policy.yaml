apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-gateway-only
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 8000
