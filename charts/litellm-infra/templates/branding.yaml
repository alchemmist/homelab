apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-branding
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-branding-nginx
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 128; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /health { return 200 'ok'; }
        location /branding/ {
          try_files $uri =404;
          add_header Cache-Control 'public, max-age=86400';
          add_header X-Content-Type-Options nosniff;
        }
        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-branding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm-branding
  template:
    metadata:
      labels:
        app: litellm-branding
      annotations:
        branding-config-version: '1'
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
      containers:
        - name: nginx
          image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          command: [nginx, '-g', 'daemon off;']
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: assets
              mountPath: /usr/share/nginx/html/branding
            - name: temp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: litellm-branding-nginx
        - name: assets
          persistentVolumeClaim:
            claimName: litellm-branding
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-branding
spec:
  selector:
    app: litellm-branding
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-branding
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [llm.alchemmist.xyz]
      secretName: litellm-public-tls
  rules:
    - host: llm.alchemmist.xyz
      http:
        paths:
          - path: /branding/
            pathType: Prefix
            backend:
              service:
                name: litellm-branding
                port:
                  number: 8080
