apiVersion: v1
kind: Service
metadata: { name: umami-db }
spec:
  selector: { app: umami-db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: Service
metadata: { name: umami }
spec:
  selector: { app: umami }
  ports: [{ name: http, port: 80, targetPort: http }]
