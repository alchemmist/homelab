apiVersion: apps/v1
kind: Deployment
metadata: { name: umami-db }
spec:
  replicas: 0
  selector: { matchLabels: { app: umami-db } }
  template:
    metadata: { labels: { app: umami-db } }
    spec:
      nodeSelector: { kubernetes.io/hostname: socrat-0 }
      containers:
      - name: postgres
        image: {{ .Values.postgresImage }}
        env:
        - { name: POSTGRES_USER, value: umami }
        - { name: POSTGRES_DB, value: umami }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
        ports: [{ name: postgres, containerPort: 5432 }]
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
      - name: data
        hostPath: { path: {{ printf "%s/postgres" .Values.hostPath | quote }}, type: DirectoryOrCreate }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: umami }
spec:
  replicas: {{ .Values.appReplicas }}
  selector: { matchLabels: { app: umami } }
  template:
    metadata: { labels: { app: umami } }
    spec:
      nodeSelector: { kubernetes.io/hostname: {{ .Values.nodeName | quote }} }
      containers:
      - name: umami
        image: {{ .Values.umamiImage }}
        envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
        env:
        - name: DATABASE_URL
          valueFrom: { secretKeyRef: { name: umami-pg-common, key: DATABASE_URL } }
        - { name: NODE_EXTRA_CA_CERTS, value: /etc/pg-common/ca.crt }
        - { name: DISABLE_TELEMETRY, value: "true" }
        - { name: TRACKER_SCRIPT_NAME, value: script.js }
        ports: [{ name: http, containerPort: 3000 }]
        volumeMounts:
        - { name: pg-ca, mountPath: /etc/pg-common, readOnly: true }
        readinessProbe:
          httpGet: { path: /api/heartbeat, port: http }
          periodSeconds: 5
      volumes:
      - name: pg-ca
        configMap: { name: pg-common-ca }
