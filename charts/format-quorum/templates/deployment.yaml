apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.requireExistingData }}
      initContainers:
        - name: require-existing-format-data
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          command: [/bin/sh, -ec]
          args:
            - 'for p in /app/clang_versions /app/tests /app/config_history; do test -s "$p/.homelab-handoff-ready" || exit 1; done'
          volumeMounts:
          {{- range $name, $cfg := .Values.persistence }}
            - name: {{ $name }}
              mountPath: {{ $cfg.mountPath }}
              readOnly: true
          {{- end }}
      {{- end }}
      containers:
        - name: format-quorum
          {{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag -}}
          {{- if .Values.image.digest }}
          {{- $image = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
{{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
{{- end }}
          volumeMounts:
{{- range $name, $cfg := .Values.persistence }}
            - name: {{ $name }}
              mountPath: {{ $cfg.mountPath }}
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
{{- range $name, $cfg := .Values.persistence }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-%s" $.Release.Name $name) $cfg.existingClaim }}
{{- end }}
