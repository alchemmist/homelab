apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $.Release.Name | quote }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: seed-configs
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          command: [/bin/sh, -ec]
          args: ['cp -a /app/configs/. /config-store/']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts: [{name: config-store, mountPath: /config-store}]
      {{- if .Values.requireExistingData }}
        - name: require-existing-format-data
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          command: [/bin/sh, -ec]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          args:
            - 'for p in /app/clang_versions /app/tests /app/config_history; do test -s "$p/.homelab-handoff-ready" || exit 1; done'
          volumeMounts:
          {{- range $name, $cfg := .Values.persistence }}
            - name: {{ $name }}
              mountPath: {{ $cfg.mountPath }}
              readOnly: true
          {{- end }}
      {{- end }}
      containers:
        - name: format-quorum
          {{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag -}}
          {{- if .Values.image.digest }}
          {{- $image = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
{{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
{{- end }}
          volumeMounts:
{{- range $name, $cfg := .Values.persistence }}
            - name: {{ $name }}
              mountPath: {{ $cfg.mountPath }}
{{- end }}
            - {name: config-store, mountPath: /app/configs}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {httpGet: {path: /, port: {{ .Values.service.targetPort }}}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /, port: {{ .Values.service.targetPort }}}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - {name: config-store, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
{{- range $name, $cfg := .Values.persistence }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-%s" $.Release.Name $name) $cfg.existingClaim }}
{{- end }}
