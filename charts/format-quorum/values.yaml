replicaCount: 1
nodeSelector:
  kubernetes.io/hostname: socrat-1
image:
  repository: harbor.socrat.alchemmist.xyz/homelab/format-quorum
  tag: 191034df24aa66a08f54ba868e6e6c2f85378517
  digest: sha256:9915d3e3ba314c6a91f6baa236f34b937bbc96196d0feb658296ddba298b6792
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 3000
ingress:
  className: traefik
  host: fq.alchemmist.xyz
  tlsSecretName: format-quorum-tls
  clusterIssuer: letsencrypt-http01
env:
  PORT: "3000"
  FRONTEND_DIST: /app/frontend
  ALLOW_BINARY_UPLOAD: "0"
  CLANG_FORMAT_BIN: /usr/local/bin/clang-format
  CLANG_FORMAT_CONFIG: /app/configs/clang-format
  RUFF_BIN: ruff
  RUFF_CONFIG: /app/configs/ruff.toml
  VERSIONS_DIR: /app/clang_versions
  TESTS_DIR: /app/tests
  CONFIG_HISTORY_DIR: /app/config_history
  PUBLISH_ENABLED: "0"
persistence:
  clang-versions: { size: 2Gi, mountPath: /app/clang_versions }
  tests: { size: 2Gi, mountPath: /app/tests }
  config-history: { size: 1Gi, mountPath: /app/config_history }
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

imagePullSecrets:
  - format-quorum-harbor-pull
  - ghcr-pull
