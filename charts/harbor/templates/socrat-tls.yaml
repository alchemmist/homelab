{{- with .Values.socratTLS }}
{{- if .enabled }}
# Go default hybrid KEM handshakes stall on the HOME public path while
# authenticated registry clients require reliable TLS. Keep TLS1.3 and cert
# verification; use standard strong classical curves on this hostname only.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: harbor-registry-tls
  namespace: {{ $.Release.Namespace }}
spec:
  minVersion: VersionTLS12
  curvePreferences:
    - X25519
    - CurveP256
{{- end }}
{{- end }}
