{{- range $name, $spec := dict "loki" (dict "port" 3100 "args" (list "-config.file=/etc/otel/loki.yaml" "-config.expand-env=true") "image" .Values.images.loki "path" .Values.storage.loki) "tempo" (dict "port" 3200 "extraPort" 4317 "args" (list "-config.file=/etc/otel/tempo.yaml" "-config.expand-env=true") "image" .Values.images.tempo "path" .Values.storage.tempo) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-{{ $name }}
  labels:
    app: otel-{{ $name }}
    app.kubernetes.io/part-of: otel-backends
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-{{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- if eq $name "loki" }}
      annotations:
        checksum/loki-config: {{ $.Files.Get "files/loki.yaml" | sha256sum }}
      {{- end }}
      labels:
        app: otel-{{ $name }}
        app.kubernetes.io/part-of: otel-backends
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ $.Values.node }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $spec.image }}
          imagePullPolicy: IfNotPresent
          args:
            {{- toYaml $spec.args | nindent 12 }}
          env:
            - name: OTEL_BIND_IP
              value: 0.0.0.0
            - name: OTEL_STORAGE_DIR
              value: /var/lib/otel
            - name: OTEL_TLS_DIR
              value: /etc/otel/tls
            - name: GOMEMLIMIT
              value: 1536MiB
            - name: GOMAXPROCS
              value: "2"
          ports:
            - name: http
              containerPort: {{ $spec.port }}
            {{- if $spec.extraPort }}
            - name: otlp
              containerPort: {{ $spec.extraPort }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            initialDelaySeconds: 20
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            - name: tls
              mountPath: /etc/otel/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/otel
            {{- if eq $name "loki" }}
            # Loki 3.7.9 stages marker BoltDB files in os.TempDir(), then
            # uploads completed markers to the persistent marker object store.
            - name: marker-tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        {{- if eq $name "loki" }}
        - name: marker-tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- end }}
        - name: config
          configMap:
            name: otel-backends
        - name: tls
          secret:
            secretName: otel-tls-backends
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
        - name: data
          hostPath:
            path: {{ $spec.path }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: otel-{{ $name }}
  labels:
    app: otel-{{ $name }}
    app.kubernetes.io/part-of: otel-backends
spec:
  selector:
    app: otel-{{ $name }}
  externalIPs:
    - {{ $.Values.externalIP }}
  ports:
    - name: http
      port: {{ $spec.port }}
      targetPort: http
    {{- if $spec.extraPort }}
    - name: otlp
      port: {{ $spec.extraPort }}
      targetPort: otlp
    {{- end }}
---
{{- end }}
