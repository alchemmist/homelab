{{- if and .Values.statefulRecreate (gt (int .Values.syncReplicaCount) 0) }}
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: monori-sync-image-cache
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {maintenance: monori-schema}
    spec:
      nodeSelector: {kubernetes.io/hostname: {{ .Values.statefulNodeName | quote }}}
      restartPolicy: Never
      serviceAccountName: monori
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: cache
          image: {{ include "monori.image" .Values.images.sync }}
          imagePullPolicy: IfNotPresent
          command: [python, -I, -S, -c, pass]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
{{- end }}
