{{- if .Values.postgresEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: monori-schema-0022
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 240
  backoffLimit: 3
  template:
    metadata:
      labels: {maintenance: monori-schema}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "monori.image" .Values.images.back }}
          command: [/app/.venv/bin/python, -c]
          args:
            - |
              import pathlib, psycopg
              url = pathlib.Path('/run/migrator/DATABASE_URL').read_bytes().decode('utf-8')
              with psycopg.connect(url, connect_timeout=6) as db:
                  db.execute("SET LOCAL ROLE monori_owner")
                  db.execute("SET LOCAL lock_timeout = '8s'")
                  db.execute('LOCK TABLE public.alembic_version IN EXCLUSIVE MODE')
                  version = db.execute('SELECT version_num FROM public.alembic_version').fetchall()
                  if version == [('0021',)]:
                      db.execute(pathlib.Path('/app/server/postgres/0022_refunds.sql').read_text())
                  elif version != [('0022',)]:
                      raise RuntimeError('Unexpected Monori schema revision')
                  if db.execute('SELECT version_num FROM public.alembic_version').fetchall() != [('0022',)]:
                      raise RuntimeError('Migration did not reach revision 0022')
                  db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON public.refund_links TO monori_app")
                  db.execute('SELECT refund_tx_id, original_tx_id FROM public.refund_links LIMIT 0')
          volumeMounts:
            - {name: pg-ca, mountPath: /pg-ca, readOnly: true}
            - {name: migrator, mountPath: /run/migrator, readOnly: true}
      volumes:
        - {name: pg-ca, configMap: {name: pg-common-ca}}
        - name: migrator
          secret:
            secretName: monori-pg-migrator
            items: [{key: DATABASE_URL, path: DATABASE_URL}]
{{- end }}
