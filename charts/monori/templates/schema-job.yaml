{{- if .Values.postgresEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: monori-schema
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 240
  backoffLimit: 3
  template:
    metadata:
      labels: {maintenance: monori-schema}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "monori.image" .Values.images.back }}
          command: [/app/.venv/bin/python, -c]
          args:
            - |
{{ .Files.Get "files/schema_upgrade.py" | indent 14 }}
          env:
            - name: MIGRATION_URL
              valueFrom: {secretKeyRef: {name: monori-pg-migrator, key: DATABASE_URL}}
          volumeMounts: [{name: pg-ca, mountPath: /pg-ca, readOnly: true}]
      volumes: [{name: pg-ca, configMap: {name: pg-common-ca}}]
{{- end }}
