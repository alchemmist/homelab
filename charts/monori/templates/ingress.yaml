apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: monori
{{- if and .Values.publicWebHost (eq .Values.publicWebHost .Values.host) }}
  labels:
    homelab.alchemmist.xyz/public-web: 'true'
{{- end }}
  annotations: { cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }} }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [{{ .Values.host | quote }}], secretName: {{ .Values.tlsSecret }} }]
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: monori, port: { number: 80 } } }
