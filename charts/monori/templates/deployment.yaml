apiVersion: apps/v1
kind: Deployment
metadata: { name: monori-sync }
spec:
  replicas: 1
  selector: { matchLabels: { app: monori-sync } }
  template:
    metadata: { labels: { app: monori-sync } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: socrat-0 }
      containers:
      - name: sync
        image: {{ .Values.images.sync }}
        imagePullPolicy: IfNotPresent
        env: [{ name: MONORI_CONNECTOR_DEBUG, value: "1" }]
        ports: [{ name: http, containerPort: 8010 }]
        volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes: [{ name: data, hostPath: { path: {{ printf "%s/sync-debug" .Values.hostPath | quote }}, type: DirectoryOrCreate } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: monori-back }
spec:
  replicas: 1
  selector: { matchLabels: { app: monori-back } }
  template:
    metadata: { labels: { app: monori-back } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: socrat-0 }
      containers:
      - name: back
        image: {{ .Values.images.back }}
        imagePullPolicy: IfNotPresent
        envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
        env:
        - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
        - { name: MONORI_SYNC_URL, value: http://monori-sync:8010 }
        ports: [{ name: http, containerPort: 8000 }]
        volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes: [{ name: data, hostPath: { path: {{ printf "%s/data" .Values.hostPath | quote }}, type: DirectoryOrCreate } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: monori }
spec:
  replicas: 1
  selector: { matchLabels: { app: monori } }
  template:
    metadata: { labels: { app: monori } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: socrat-0 }
      containers:
      - name: front
        image: {{ .Values.images.front }}
        imagePullPolicy: IfNotPresent
        ports: [{ name: http, containerPort: 8000 }]
