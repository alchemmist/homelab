{{- define "monori.image" -}}
{{- if .digest -}}
{{ .repository }}@{{ .digest }}
{{- else -}}
{{ .fallback }}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: monori-sync }
spec:
  replicas: {{ .Values.syncReplicaCount }}
  {{- if .Values.statefulRecreate }}
  strategy: {type: Recreate}
  {{- end }}
  selector: { matchLabels: { app: monori-sync } }
  template:
    metadata: { labels: { app: monori-sync } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: {{ .Values.statefulNodeName | quote }} }
      {{- if .Values.requireExistingData }}
      initContainers:
      - name: require-existing-sync
        image: {{ include "monori.image" .Values.images.sync }}
        command: [python, -c]
        args:
          - >-
            from pathlib import Path; assert Path('/app/data/.homelab-handoff-ready').is_file(), 'Verified sync data restore required'
        volumeMounts: [{name: data, mountPath: /app/data, readOnly: true}]
      {{- end }}
      containers:
      - name: sync
        image: {{ include "monori.image" .Values.images.sync }}
        imagePullPolicy: IfNotPresent
        env: [{ name: MONORI_CONNECTOR_DEBUG, value: "1" }]
        ports: [{ name: http, containerPort: 8010 }]
        volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
      - name: data
        {{- if .Values.syncClaim }}
        persistentVolumeClaim: {claimName: {{ .Values.syncClaim | quote }}}
        {{- else }}
        hostPath: {path: {{ printf "%s/sync-debug" .Values.hostPath | quote }}, type: DirectoryOrCreate}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: monori-back }
spec:
  replicas: {{ .Values.backReplicaCount }}
  {{- if .Values.statefulRecreate }}
  strategy: {type: Recreate}
  {{- end }}
  selector: { matchLabels: { app: monori-back } }
  template:
    metadata: { labels: { app: monori-back } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.oidc.enabled }}
      {{- with .Values.oidc.hostAliases }}
      hostAliases: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: {{ .Values.statefulNodeName | quote }} }
      {{- if .Values.postgresEnabled }}
      initContainers:
      - name: require-monori-ledger
        image: {{ include "monori.image" .Values.images.back }}
        command: [/app/.venv/bin/python, -c]
        args:
          - |
            import os, pathlib, psycopg
            p=pathlib.Path('/app/data')
            assert all((p/k).stat().st_size for k in ('.auth_secret','.encryption_key'))
            with psycopg.connect(os.environ['MONORI_DATABASE_URL'],connect_timeout=6) as c:
                marker=pathlib.Path('/app/server/postgres/revision')
                target=marker.read_text().strip() if marker.exists() else '0022'
                assert c.execute("SELECT version_num FROM alembic_version").fetchall()==[(target,)]
                assert c.execute('SELECT EXISTS(SELECT FROM users), EXISTS(SELECT FROM accounts)').fetchone()==(True,True)
            with psycopg.connect(os.environ['MONORI_CONSOLE_DATABASE_URL'],connect_timeout=6) as c:
                assert c.execute("SELECT current_user,has_schema_privilege('public','CREATE')").fetchone()==('monori_console',False)
        envFrom: [{secretRef: {name: monori-postgres}}]
        volumeMounts: [{name: data, mountPath: /app/data, readOnly: true}, {name: pg-ca, mountPath: /pg-ca, readOnly: true}]
      {{- else if .Values.requireExistingData }}
      initContainers:
      - name: require-existing-back
        image: {{ include "monori.image" .Values.images.back }}
        command: [python, -c]
        args:
          - >-
            from pathlib import Path; p=Path('/app/data/monori.db'); assert p.is_file() and p.open('rb').read(16)==b'SQLite format 3\x00', 'Existing finance database required'
        volumeMounts: [{name: data, mountPath: /app/data, readOnly: true}]
      {{- end }}
      containers:
      - name: back
        image: {{ include "monori.image" .Values.images.back }}
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef: {name: {{ .Values.secretName }}}
        {{- if .Values.postgresEnabled }}
        - secretRef: {name: monori-postgres}
        {{- end }}
        env:
        - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
        - { name: MONORI_SYNC_URL, value: http://monori-sync:8010 }
        {{- if hasKey .Values.oidc "onlyUserIds" }}
        - name: MONORI_SSO_ONLY_USER_IDS
          value: {{ join "," .Values.oidc.onlyUserIds | quote }}
        {{- end }}
        {{- if .Values.oidc.enabled }}
        - name: MONORI_OIDC_ISSUER
          value: {{ required "OIDC issuer is required" .Values.oidc.issuer | quote }}
        - name: MONORI_OIDC_CLIENT_ID
          value: {{ required "OIDC client ID is required" .Values.oidc.clientId | quote }}
        - name: MONORI_OIDC_REDIRECT_URI
          value: {{ printf "https://%s/oidc/callback" .Values.host | quote }}
        - name: MONORI_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ required "OIDC secret name is required" .Values.oidc.secretName | quote }}
              key: client-secret
              optional: true
        {{- end }}
        ports: [{ name: http, containerPort: 8000 }]
        volumeMounts:
        - {name: data, mountPath: /app/data}
        {{- if .Values.postgresEnabled }}
        - {name: pg-ca, mountPath: /pg-ca, readOnly: true}
        readinessProbe: {tcpSocket: {port: 8000}, periodSeconds: 4}
        {{- end }}
      volumes:
      {{- if .Values.postgresEnabled }}
      - {name: pg-ca, configMap: {name: pg-common-ca}}
      {{- end }}
      - name: data
        {{- if .Values.backClaim }}
        persistentVolumeClaim: {claimName: {{ .Values.backClaim | quote }}}
        {{- else }}
        hostPath: {path: {{ printf "%s/data" .Values.hostPath | quote }}, type: DirectoryOrCreate}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: monori }
spec:
  replicas: 1
  selector: { matchLabels: { app: monori } }
  template:
    metadata: { labels: { app: monori } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: {{ .Values.frontNodeName | quote }} }
      containers:
      - name: front
        image: {{ include "monori.image" .Values.images.front }}
        imagePullPolicy: IfNotPresent
        ports: [{ name: http, containerPort: 8000 }]
