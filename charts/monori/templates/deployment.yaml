{{- define "monori.image" -}}
{{- if .digest -}}
{{ .repository }}@{{ .digest }}
{{- else -}}
{{ .fallback }}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata: { name: monori-sync }
spec:
  replicas: {{ .Values.syncReplicaCount }}
  {{- if .Values.statefulRecreate }}
  strategy: {type: Recreate}
  {{- end }}
  selector: { matchLabels: { app: monori-sync } }
  template:
    metadata: { labels: { app: monori-sync } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: {{ .Values.statefulNodeName | quote }} }
      {{- if .Values.requireExistingData }}
      initContainers:
      - name: require-existing-sync
        image: {{ include "monori.image" .Values.images.sync }}
        command: [python, -c]
        args:
          - >-
            from pathlib import Path; assert Path('/app/data/.homelab-handoff-ready').is_file(), 'Verified sync data restore required'
        volumeMounts: [{name: data, mountPath: /app/data, readOnly: true}]
      {{- end }}
      containers:
      - name: sync
        image: {{ include "monori.image" .Values.images.sync }}
        imagePullPolicy: IfNotPresent
        env: [{ name: MONORI_CONNECTOR_DEBUG, value: "1" }]
        ports: [{ name: http, containerPort: 8010 }]
        volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
      - name: data
        {{- if .Values.syncClaim }}
        persistentVolumeClaim: {claimName: {{ .Values.syncClaim | quote }}}
        {{- else }}
        hostPath: {path: {{ printf "%s/sync-debug" .Values.hostPath | quote }}, type: DirectoryOrCreate}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: monori-back }
spec:
  replicas: {{ .Values.backReplicaCount }}
  {{- if .Values.statefulRecreate }}
  strategy: {type: Recreate}
  {{- end }}
  selector: { matchLabels: { app: monori-back } }
  template:
    metadata: { labels: { app: monori-back } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: {{ .Values.statefulNodeName | quote }} }
      {{- if .Values.requireExistingData }}
      initContainers:
      - name: require-existing-back
        image: {{ include "monori.image" .Values.images.back }}
        command: [python, -c]
        args:
          - >-
            from pathlib import Path; p=Path('/app/data/monori.db'); assert p.is_file() and p.open('rb').read(16)==b'SQLite format 3\x00', 'Existing finance database required'
        volumeMounts: [{name: data, mountPath: /app/data, readOnly: true}]
      {{- end }}
      containers:
      - name: back
        image: {{ include "monori.image" .Values.images.back }}
        imagePullPolicy: IfNotPresent
        envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
        env:
        - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
        - { name: MONORI_SYNC_URL, value: http://monori-sync:8010 }
        ports: [{ name: http, containerPort: 8000 }]
        volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
      - name: data
        {{- if .Values.backClaim }}
        persistentVolumeClaim: {claimName: {{ .Values.backClaim | quote }}}
        {{- else }}
        hostPath: {path: {{ printf "%s/data" .Values.hostPath | quote }}, type: DirectoryOrCreate}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: monori }
spec:
  replicas: 1
  selector: { matchLabels: { app: monori } }
  template:
    metadata: { labels: { app: monori } }
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: { kubernetes.io/hostname: {{ .Values.frontNodeName | quote }} }
      containers:
      - name: front
        image: {{ include "monori.image" .Values.images.front }}
        imagePullPolicy: IfNotPresent
        ports: [{ name: http, containerPort: 8000 }]
