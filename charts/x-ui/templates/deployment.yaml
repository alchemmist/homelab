apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-ui
  labels:
    app.kubernetes.io/name: x-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: x-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      containers:
        - name: x-ui
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: panel
              containerPort: {{ .Values.ports.panel }}
              protocol: TCP
            - name: sub
              containerPort: {{ .Values.ports.sub }}
              protocol: TCP
            - name: trojan
              containerPort: {{ .Values.ports.trojan }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              host: {{ .Values.probeHost | quote }}
              port: panel
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            tcpSocket:
              host: {{ .Values.probeHost | quote }}
              port: trojan
            periodSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: db
              mountPath: /etc/x-ui
            - name: cert
              mountPath: /root/cert
            - name: acme
              mountPath: /root/.acme.sh
            {{- if .Values.hostPath.runtime }}
            - name: runtime
              mountPath: /app/bin
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: db
          hostPath:
            path: {{ .Values.hostPath.db | quote }}
            type: Directory
        - name: cert
          hostPath:
            path: {{ .Values.hostPath.cert | quote }}
            type: DirectoryOrCreate
        - name: acme
          hostPath:
            path: {{ .Values.hostPath.acme | quote }}
            type: DirectoryOrCreate
        {{- if .Values.hostPath.runtime }}
        - name: runtime
          hostPath:
            path: {{ .Values.hostPath.runtime | quote }}
            type: Directory
        {{- end }}
