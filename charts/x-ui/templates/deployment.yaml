apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-ui
  labels:
    app.kubernetes.io/name: x-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: x-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      containers:
        {{- range $name, $instance := .Values.instances }}
        {{- if or (not (hasKey $instance "enabled")) $instance.enabled }}
        {{- $prefix := ternary "primary" "compat" (eq $name "primary") }}
        - name: {{ $name }}
          image: {{ $instance.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            {{- range $name, $value := $instance.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: {{ $prefix }}-panel
              containerPort: {{ $instance.ports.panel }}
              protocol: TCP
            - name: {{ $prefix }}-sub
              containerPort: {{ $instance.ports.sub }}
              protocol: TCP
            - name: {{ $prefix }}-trojan
              containerPort: {{ $instance.ports.trojan }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              host: {{ $instance.probeHost | quote }}
              port: {{ $prefix }}-panel
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            tcpSocket:
              host: {{ $instance.probeHost | quote }}
              port: {{ $prefix }}-trojan
            periodSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: {{ $name }}-db
              mountPath: /etc/x-ui
            - name: {{ $name }}-cert
              mountPath: /root/cert
            - name: {{ $name }}-acme
              mountPath: /root/.acme.sh
            {{- if $instance.hostPath.runtime }}
            - name: {{ $name }}-runtime
              mountPath: /app/bin
            {{- end }}
          resources:
            {{- toYaml $instance.resources | nindent 12 }}
        {{- end }}
        {{- end }}
      volumes:
        {{- range $name, $instance := .Values.instances }}
        {{- if or (not (hasKey $instance "enabled")) $instance.enabled }}
        - name: {{ $name }}-db
          hostPath:
            path: {{ $instance.hostPath.db | quote }}
            type: Directory
        - name: {{ $name }}-cert
          hostPath:
            path: {{ $instance.hostPath.cert | quote }}
            type: DirectoryOrCreate
        - name: {{ $name }}-acme
          hostPath:
            path: {{ $instance.hostPath.acme | quote }}
            type: DirectoryOrCreate
        {{- if $instance.hostPath.runtime }}
        - name: {{ $name }}-runtime
          hostPath:
            path: {{ $instance.hostPath.runtime | quote }}
            type: Directory
        {{- end }}
        {{- end }}
        {{- end }}
