apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-ui
  labels:
    app.kubernetes.io/name: x-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: x-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      containers:
        - name: x-ui
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: panel
              containerPort: 2053
              protocol: TCP
            - name: sub
              containerPort: 2096
              protocol: TCP
            - name: trojan
              containerPort: 10443
              protocol: TCP
          volumeMounts:
            - name: db
              mountPath: /etc/x-ui
            - name: cert
              mountPath: /root/cert
            - name: acme
              mountPath: /root/.acme.sh
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: db
          hostPath:
            path: {{ .Values.hostPath.db | quote }}
            type: DirectoryOrCreate
        - name: cert
          hostPath:
            path: {{ .Values.hostPath.cert | quote }}
            type: DirectoryOrCreate
        - name: acme
          hostPath:
            path: {{ .Values.hostPath.acme | quote }}
            type: DirectoryOrCreate
