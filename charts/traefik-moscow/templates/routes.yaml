{{- if .Values.rehearsal }}
{{- range $net, $ports := dict "TCP" (list 443 32053 32083 32084) "UDP" (list 443 32085 32086) }}
{{- range $ports }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute{{ $net }}
metadata:
  name: moscow-{{ lower $net }}-{{ . }}
  namespace: vpn-transit
  annotations: {kubernetes.io/ingress.class: traefik-moscow}
  labels: {homelab.alchemmist.xyz/moscow-rehearsal: "true"}
spec:
  entryPoints: [{{ if and (eq $net "TCP") (eq . 443) }}websecure{{ else }}{{ lower $net }}-{{ . }}{{ end }}]
  routes:
    - services: [{name: vpn-transit, port: {{ lower $net }}-{{ . }}, nativeLB: true}]
{{- if eq $net "TCP" }}
      match: {{ if eq . 443 }}HostSNI(`vpn.alchemmist.xyz`){{ else }}HostSNI(`*`){{ end }}
{{- if eq . 443 }}
  tls: {passthrough: true}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
