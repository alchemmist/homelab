replicaCount: 2

image:
  repository: docker.io/library/nginx
  tag: stable-alpine
  digest: sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 80

ingress:
  className: traefik
  host: wishlist.alchemmist.xyz
  tlsSecretName: wishlist-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nodeAffinity:
  excludeHostnames:
    - socrat-2
