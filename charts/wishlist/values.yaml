replicaCount: 1

image:
  repository: harbor.socrat.alchemmist.xyz/homelab/wishlist
  tag: pending
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - wishlist-harbor-pull

service:
  port: 80
  targetPort: 8000

ingress:
  className: traefik
  host: wishlist.alchemmist.xyz
  tlsSecretName: wishlist-tls
  clusterIssuer: letsencrypt-http01

nodeName: socrat-0

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
