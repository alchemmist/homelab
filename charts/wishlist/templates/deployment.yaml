apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      {{- with .Values.hostAliases }}
      hostAliases:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if .Values.persistence.requireExistingData }}
      initContainers:
        - name: require-existing-wishlist
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          command: [python, -c]
          args:
            - >-
              import os;
              p='/data/wishlist.sqlite';
              assert os.path.isfile(p) and not os.path.islink(p) and os.path.getsize(p)>16, 'Existing Wishlist database required';
              assert open(p,'rb').read(16)==b'SQLite format 3\x00', 'Invalid Wishlist database header'
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      {{- end }}
      containers:
        - name: wishlist
          image: {{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.observability.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metricsPort }}
          {{- end }}
          env:
          {{- if .Values.observability.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.observability.metricsPort | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.observability.tracesEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE
              value: /etc/otel-client/ca.crt
            - name: OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE
              value: /etc/otel-client/tls.crt
            - name: OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY
              value: /etc/otel-client/tls.key
          {{- end }}
          {{- if .Values.images.enabled }}
            - name: IMAGE_OPTIMIZER_URL
              value: http://{{ .Release.Name }}-image-optimizer:{{ .Values.images.optimizerPort }}
          {{- end }}
            - name: DATA_DIR
              value: /data
            - name: PUBLIC_URL
              value: https://{{ .Values.ingress.host }}
            - name: S3_ENDPOINT
              value: http://rustfs.rustfs.svc.cluster.local:9000
            - name: S3_BUCKET
              value: wishlist
          envFrom:
            - secretRef:
                name: wishlist-secrets
                optional: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: media-cache
              mountPath: /data/media-cache
          {{- if .Values.observability.enabled }}
            - name: otel-client
              mountPath: /etc/otel-client
              readOnly: true
          {{- end }}
      volumes:
      - name: media-cache
        emptyDir:
          sizeLimit: 2Gi
      {{- if .Values.observability.enabled }}
        - name: otel-client
          secret:
            secretName: {{ .Values.observability.clientSecret }}
            defaultMode: 256
      {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
