{{- if .Values.basicAuth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.basicAuth.existingSecret }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
{{- if .Values.basicAuth.users }}
stringData:
  users: {{ .Values.basicAuth.users | quote }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.basicAuth.existingSecret }}
{{- if $existing }}
data:
  users: {{ index $existing.data "users" | quote }}
{{- else }}
stringData:
  users: ""
{{- end }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Chart.Name }}-basic-auth
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  basicAuth:
    secret: {{ .Values.basicAuth.existingSecret }}
{{- end }}
