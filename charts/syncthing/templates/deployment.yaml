apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: Default
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      containers:
        - name: syncthing
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/syncthing"]
          args:
            - serve
            - --home=/var/syncthing/config
            - --no-browser
            - --no-restart
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: gui
              containerPort: {{ .Values.service.guiPort }}
              protocol: TCP
            - name: sync-tcp
              containerPort: {{ .Values.service.syncPort }}
              protocol: TCP
            - name: sync-quic
              containerPort: {{ .Values.service.syncPort }}
              protocol: UDP
            - name: discovery
              containerPort: {{ .Values.service.discoveryPort }}
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /var/syncthing
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: DirectoryOrCreate
