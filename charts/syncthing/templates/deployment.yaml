apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.privateGui.enabled }}
      annotations:
        checksum/private-nginx: {{ include (print $.Template.BasePath "/private-nginx.yaml") . | sha256sum | quote }}
      {{- end }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: Default
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.privateGui.enabled }}
      {{- if not .Values.privateGui.nodes }}
      {{- fail "privateGui requires at least one configured node" }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              {{- range .Values.privateGui.nodes }}
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values:
                      - {{ .nodeName | quote }}
              {{- end }}
      {{- end }}
      containers:
        - name: syncthing
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/syncthing"]
          args:
            - serve
            - --home=/var/syncthing/config
            - --no-browser
            - --no-restart
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ if and $.Values.privateGui.enabled (eq $name "STGUIADDRESS") }}{{ printf "http://127.0.0.1:%v" $.Values.service.guiPort | quote }}{{ else }}{{ $value | quote }}{{ end }}
            {{- end }}
          ports:
            - name: gui
              containerPort: {{ .Values.service.guiPort }}
              protocol: TCP
            - name: sync-tcp
              containerPort: {{ .Values.service.syncPort }}
              protocol: TCP
            - name: sync-quic
              containerPort: {{ .Values.service.syncPort }}
              protocol: UDP
            - name: discovery
              containerPort: {{ .Values.service.discoveryPort }}
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /var/syncthing
          resources:
{{ toYaml .Values.resources | indent 12 }}
        {{- if .Values.privateGui.enabled }}
        - name: private-gui
          image: "{{ .Values.privateGui.image.repository }}:{{ .Values.privateGui.image.tag }}"
          imagePullPolicy: {{ .Values.privateGui.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              cp "/etc/nginx/nodes/${NODE_NAME}.conf" /etc/nginx/nginx.conf
              nginx -t
              tls_fingerprint=""
              nginx_pid=""
              cleanup() {
                if [ -n "$nginx_pid" ]; then
                  kill "$nginx_pid" 2>/dev/null || true
                  wait "$nginx_pid" 2>/dev/null || true
                fi
              }
              trap cleanup TERM INT EXIT
              nginx -g 'daemon off;' &
              nginx_pid=$!
              while kill -0 "$nginx_pid" 2>/dev/null; do
                next_fingerprint=$(sha256sum /etc/nginx/tls/tls.crt /etc/nginx/tls/tls.key{{ range .Values.privateGui.extraVirtualHosts }} /etc/nginx/extra-tls/{{ .name }}/tls.crt /etc/nginx/extra-tls/{{ .name }}/tls.key{{ end }})
                if [ -n "$tls_fingerprint" ] && [ "$next_fingerprint" != "$tls_fingerprint" ]; then
                  nginx -s reload
                fi
                tls_fingerprint="$next_fingerprint"
                sleep 5
              done
              wait "$nginx_pid"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: private-gui
              containerPort: {{ .Values.privateGui.listenPort }}
              protocol: TCP
            - name: private-health
              containerPort: {{ .Values.privateGui.healthPort }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - wget -qO- http://127.0.0.1:{{ .Values.privateGui.healthPort }}/healthz
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - wget -qO- http://127.0.0.1:{{ .Values.privateGui.healthPort }}/healthz
            periodSeconds: 30
          volumeMounts:
            - name: private-nginx-config
              mountPath: /etc/nginx/nodes
              readOnly: true
            - name: private-tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- range .Values.privateGui.extraVirtualHosts }}
            - name: extra-tls-{{ .name }}
              mountPath: /etc/nginx/extra-tls/{{ .name }}
              readOnly: true
            {{- end }}
            - name: basic-auth
              mountPath: /etc/nginx/auth
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: DirectoryOrCreate
        {{- if .Values.privateGui.enabled }}
        - name: private-nginx-config
          configMap:
            name: {{ .Chart.Name }}-private-nginx
        - name: private-tls
          secret:
            secretName: {{ .Values.privateGui.tlsSecret }}
        {{- range .Values.privateGui.extraVirtualHosts }}
        - name: extra-tls-{{ .name }}
          secret:
            secretName: {{ .tlsSecret }}
        {{- end }}
        - name: basic-auth
          secret:
            secretName: {{ .Values.basicAuth.existingSecret }}
            items:
              - key: users
                path: users
        {{- end }}
