{{- if .Values.publicEntry.syncthingPolicyProxy.enabled }}
{{- if not (regexMatch "^docker.io/library/nginx:.+@sha256:[a-f0-9]{64}$" .Values.publicEntry.syncthingPolicyProxy.image) }}
{{- fail "Syncthing policy proxy requires a verified immutable stock nginx image" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-web-syncthing-policy
  namespace: syncthing
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
data:
  nginx.conf: |
{{ .Files.Get "files/syncthing-policy.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web-syncthing-proxy
  namespace: syncthing
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  replicas: 1
  selector: {matchLabels: {app: public-web-syncthing-proxy}}
  template:
    metadata:
      labels: {app: public-web-syncthing-proxy}
      annotations:
        checksum/config: {{ .Files.Get "files/syncthing-policy.conf" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: socrat-0}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: policy
          image: {{ .Values.publicEntry.syncthingPolicyProxy.image }}
          command: [nginx, '-g', 'daemon off;']
          ports: [{name: http, containerPort: 8080}, {name: retired, containerPort: 8081}, {name: health, containerPort: 8082}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /ready, port: health}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 15}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: public-web-syncthing-policy}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- range $n, $port := dict "0" 8080 "1" 8081 }}
---
apiVersion: v1
kind: Service
metadata:
  name: public-web-syncthing-{{ $n }}
  namespace: syncthing
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  selector: {app: public-web-syncthing-proxy}
  ports: [{name: http, port: 80, targetPort: {{ $port }}}]
{{- end }}
{{- end }}
