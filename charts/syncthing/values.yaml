# One Syncthing pod per Socrat Kubernetes node. Each pod stores its own
# Syncthing identity/config/database under hostPath on that node.
mode: daemonset

image:
  repository: syncthing/syncthing
  tag: latest
  pullPolicy: IfNotPresent

hostPath: /srv/syncthing

nodeSelector: {}

hostNetwork: true

env:
  # Keep the GUI reachable through Kubernetes service/ingress and kubectl port-forward.
  STGUIADDRESS: http://0.0.0.0:8384

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

basicAuth:
  enabled: true
  # Create this secret manually; do not commit password hashes.
  existingSecret: syncthing-basic-auth
  users: ""

ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt-http01

service:
  guiPort: 8384
  syncPort: 22000
  discoveryPort: 21027

# The web UI must not be load-balanced across Syncthing pods. The DaemonSet runs
# one independent Syncthing device per node; each UI must point to exactly one
# node-local instance.
gui:
  nodes:
    - name: sync-0
      host: sync-0.alchemmist.xyz
      tlsSecret: syncthing-sync-0-tls
      endpointIP: 192.168.0.23
    - name: sync-1
      host: sync-1.alchemmist.xyz
      tlsSecret: syncthing-sync-1-tls
      endpointIP: 192.168.0.24
    - name: sync-2
      host: sync-2.alchemmist.xyz
      tlsSecret: syncthing-sync-2-tls
      endpointIP: 10.250.0.2
