pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 512; }
http {
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format safe escape=json '{"service":"public-syncthing-policy","status":$status,"method":"$request_method","duration_seconds":$request_time}';
  access_log /dev/stdout safe;
  resolver 10.43.0.10 valid=30s ipv6=off;
  upstream gui0 {
    zone gui0 64k;
    server syncthing-sync-0.syncthing.svc.cluster.local:80 resolve;
  }
  server {
    listen 8080;
    location = / { return 302 /sync/; }
    location = /sync { return 301 /sync/; }
    location /sync/ {
      proxy_pass http://gui0/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8384;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 600s;
    }
    location / {
      proxy_pass http://gui0;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8384;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 600s;
    }
  }
  server {
    listen 8082;
    location = /ready { proxy_pass http://gui0/rest/noauth/health; }
    location / { return 404; }
  }
  # Node1 is gateway-only. Never silently point it at another device.
  server {
    listen 8081;
    default_type application/json;
    return 410 '{"error":"socrat-1 is gateway-only; no Syncthing device is enrolled here"}';
  }
}
