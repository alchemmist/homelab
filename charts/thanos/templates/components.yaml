{{- range $name, $component := .Values.components }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: thanos
spec:
  replicas: {{ if $component.spreadQuery }}2{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    {{- if $component.spreadQuery }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- else }}
    type: Recreate
    {{- end }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: thanos
    spec:
      automountServiceAccountToken: false
      {{- if $component.spreadQuery }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [socrat-0, socrat-1]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ $name }}
      {{- else }}
      nodeSelector:
        kubernetes.io/hostname: {{ required (printf "components.%s.node is required for pinned components" $name) $component.node | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos
          image: {{ $.Values.images.thanos }}
          imagePullPolicy: IfNotPresent
          args:
            {{- toYaml $component.args | nindent 12 }}
          ports:
            - name: http
              containerPort: 10902
            - name: grpc
              containerPort: 10901
          {{- if $component.spreadQuery }}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- toYaml $component.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml $component.volumes | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: thanos
spec:
  selector:
    app: {{ $name }}
  ports:
    {{- if $component.servicePort }}
    - name: http
      port: {{ $component.servicePort }}
      targetPort: http
    {{- else }}
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
    {{- end }}
---
{{- end }}
