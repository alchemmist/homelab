{{- range $name, $component := .Values.components }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: thanos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: thanos
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ $component.node }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos
          image: {{ $.Values.images.thanos }}
          imagePullPolicy: IfNotPresent
          args:
            {{- toYaml $component.args | nindent 12 }}
          ports:
            - name: http
              containerPort: 10902
            - name: grpc
              containerPort: 10901
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- toYaml $component.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml $component.volumes | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: thanos
spec:
  selector:
    app: {{ $name }}
  ports:
    {{- if $component.servicePort }}
    - name: http
      port: {{ $component.servicePort }}
      targetPort: http
    {{- else }}
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
    {{- end }}
---
{{- end }}
