{{- range $name, $component := .Values.components }}
{{- $five := has $name (list "thanos-store-5m" "thanos-compactor-5m") }}
{{- $shared := and $five (has $.Values.fivePhase (list "shared" "shared-hold")) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: thanos
spec:
  replicas: {{ if and (eq $name "thanos-compactor") $.Values.workshopHold }}0{{ else if and $five (eq $.Values.fivePhase "cold") }}0{{ else if $component.spreadQuery }}2{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    {{- if $component.spreadQuery }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- else }}
    type: Recreate
    {{- end }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: thanos
    spec:
      automountServiceAccountToken: false
      {{- if $component.spreadQuery }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $name }}
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [socrat-0, socrat-1]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: {{ $name }}
      {{- else if $shared }}
{{ include "thanos.fivePlacement" . | indent 6 }}
      {{- else }}
      nodeSelector:
        kubernetes.io/hostname: {{ required (printf "components.%s.node is required for pinned components" $name) $component.node | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos
          image: {{ $.Values.images.thanos }}
          imagePullPolicy: IfNotPresent
          args:
            {{- range $arg := $component.args }}
            {{- if and $.Values.warmCascade (eq $name "thanos-compactor") (hasPrefix "--delete-delay=" $arg) }}
            - {{ printf "--delete-delay=%s" $.Values.warmWorkshopDeleteDelay | quote }}
            {{- else }}
            - {{ $arg | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 10902
            - name: grpc
              containerPort: 10901
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- range $m := $component.volumeMounts }}
            {{- if and $shared (eq $m.name "shelf") }}
            - name: shelf
              mountPath: {{ $m.mountPath }}
              subPath: active
              readOnly: {{ eq $name "thanos-store-5m" }}
            {{- else }}{{ toYaml (list $m) | nindent 12 }}{{- end }}
            {{- end }}
      volumes:
        {{- range $v := $component.volumes }}
        {{- if and $shared (eq $v.name "shelf") }}
        - name: shelf
          persistentVolumeClaim: {claimName: thanos-5m-s1-candidate}
        {{- else }}{{ toYaml (list $v) | nindent 8 }}{{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Release.Namespace | quote }}
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: thanos
spec:
  selector:
    app: {{ $name }}
  ports:
    {{- if $component.servicePort }}
    - name: http
      port: {{ $component.servicePort }}
      targetPort: http
    {{- else }}
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
    {{- end }}
---
{{- end }}
