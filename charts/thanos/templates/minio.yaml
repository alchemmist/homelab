{{- range $name, $minio := .Values.minio }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ $minio.node }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ $.Values.images.minio }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              weed server -filer=true -s3=true -s3.port=9000 -s3.config=/etc/seaweed/s3.json -ip.bind=0.0.0.0 &
              weed_pid=$!
              i=0
              ok=0
              while [ "$i" -lt 60 ]; do
                  out=$(echo 's3.bucket.create -name thanos' | timeout 10 weed shell -master=localhost:9333 2>&1 || true)
                  echo "$out"
                  case "$out" in
                      *'created bucket thanos'*) ok=1; break ;;
                  esac
                  i=$((i + 1))
                  sleep 2
              done
              if [ "$ok" != 1 ]; then
                  kill "$weed_pid" || true
                  exit 1
              fi
              wait "$weed_pid"
          ports:
            - name: http
              containerPort: 9000
            - name: filer
              containerPort: 8888
            - name: master
              containerPort: 9333
          resources:
            {{- toYaml $minio.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: s3config
              mountPath: /etc/seaweed
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: {{ $.Values.minioHostPath }}
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: s3config
          secret:
            secretName: {{ $minio.secret }}
            items:
              - key: s3.json
                path: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 9000
      targetPort: http
    - name: filer
      port: 8888
      targetPort: filer
    - name: master
      port: 9333
      targetPort: master
{{- end }}
