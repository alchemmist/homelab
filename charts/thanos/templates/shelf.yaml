{{- $token := "thanos-shelf-token" }}
{{- range $name, $shelf := .Values.shelves }}
{{- $five := eq $name "thanos-shelf-5m" }}
{{- $shared := and $five (has $.Values.fivePhase (list "shared" "shared-hold")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
data:
  shelf.py: |
{{ $.Files.Get "files/shelf.py" | indent 4 }}
{{- if $shared }}
  five_metrics.py: |
{{ $.Files.Get "files/five_metrics.py" | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ if and $five (eq $.Values.fivePhase "cold") }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        checksum/script: {{ $.Files.Get "files/shelf.py" | sha256sum }}
        {{- if $shared }}
        checksum/five-metrics: {{ $.Files.Get "files/five_metrics.py" | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if $shared }}
{{ include "thanos.fivePlacement" . | indent 6 }}
      {{- else }}
      nodeSelector:
        kubernetes.io/hostname: {{ $shelf.node }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shelf
          image: {{ $.Values.images.cascade }}
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", {{ if $shared }}"/scripts/five_metrics.py"{{ else }}"/scripts/shelf.py"{{ end }}]
          env:
            - name: SHELF_DIRECTORY
              value: {{ $shelf.directory }}
            - name: SHELF_TOKEN_FILE
              value: /etc/shelf/token
            - name: SHELF_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml $shelf.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: {{ $shelf.directory }}
              {{- if $shared }}
              subPath: active
              {{- end }}
            - name: token
              mountPath: /etc/shelf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
        - name: data
          {{- if $shared }}
          persistentVolumeClaim: {claimName: thanos-5m-s1-candidate}
          {{- else }}
          hostPath:
            path: {{ $shelf.directory }}
            type: Directory
          {{- end }}
        - name: token
          secret:
            secretName: {{ $token }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- end }}
