# Isolated candidate for the future warm object store. No live bucket mounted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thanos-warm-s1-candidate
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: rustfs-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 80Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: thanos-warm-s1-volume-check-v1
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: socrat-1}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verify
          image: python@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          command: [python3, -Bc]
          args:
            - |
              import os, tempfile
              s = os.statvfs('/candidate')
              free = s.f_bavail * s.f_frsize
              if free < 120 * 2**30:
                  raise SystemExit('need 80 GiB budget plus 40 GiB headroom')
              with tempfile.TemporaryFile(dir='/candidate') as f:
                  payload = os.urandom(4096)
                  f.write(payload); f.flush(); os.fsync(f.fileno()); f.seek(0)
                  if f.read() != payload: raise SystemExit('readback mismatch')
              print('isolated volume write/fsync/read OK; free GiB:', free // 2**30)
          volumeMounts: [{name: candidate, mountPath: /candidate}]
      volumes:
        - name: candidate
          persistentVolumeClaim: {claimName: thanos-warm-s1-candidate}
