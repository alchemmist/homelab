# Warm destination. No production writer, compactor or Query endpoint is attached yet.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: thanos-warm-bootstrap}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: thanos-warm-ca}
spec:
  isCA: true
  commonName: thanos-warm-ca
  secretName: thanos-warm-ca
  duration: 43800h
  issuerRef: {name: thanos-warm-bootstrap, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: thanos-warm-ca}
spec: {ca: {secretName: thanos-warm-ca}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: thanos-warm-api}
spec:
  secretName: thanos-warm-api-tls
  dnsNames: [thanos-warm-api, thanos-warm-api.{{ .Release.Namespace }}.svc, thanos-warm-api.{{ .Release.Namespace }}.svc.cluster.local]
  issuerRef: {name: thanos-warm-ca, kind: Issuer}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: thanos-warm-api}
spec:
  podSelector: {matchLabels: {app: thanos-warm-api}}
  policyTypes: [Ingress]
  # All in-cluster thanos peers (store, compactor, cascade, shelf) and the
  # scraper live in the release namespace; the seed client is not represented
  # by any rendered workload, so scope ingress to the namespace instead of a
  # dangling label.
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $.Release.Namespace | quote }}}}
      ports: [{protocol: TCP, port: 9000}]
---
apiVersion: v1
kind: Service
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: thanos-warm-api}
spec:
  selector: {app: thanos-warm-api}
  ports: [{name: https, port: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: thanos-warm-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: thanos-warm-api}}
  strategy: {type: Recreate}
  template:
    metadata: {labels: {app: thanos-warm-api}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: socrat-1}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: prepare
          image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          command: [/bin/sh, -ec, 'mkdir -p /candidate/workshop-s3/.rustfs/events /candidate/workshop-s3/.rustfs/audit']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
          volumeMounts: [{name: data, mountPath: /candidate}]
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: '2', memory: 4Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          args:
            - --access-key-file=/run/rustfs-root/access
            - --secret-key-file=/run/rustfs-root/secret
          env:
            - {name: RUSTFS_VOLUMES, value: /data}
            - {name: RUSTFS_CONSOLE_ENABLE, value: 'false'}
            - {name: RUSTFS_TLS_PATH, value: /tls}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: /tmp}
            - {name: RUSTFS_OBS_LOGGER_LEVEL, value: warn}
          ports: [{containerPort: 9000}]
          readinessProbe: {httpGet: {scheme: HTTPS, path: /health/ready, port: 9000}, periodSeconds: 5}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /health/live, port: 9000}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
          volumeMounts:
            - {name: data, mountPath: /data, subPath: workshop-s3}
            - {name: tmp, mountPath: /tmp}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: root-credentials, mountPath: /run/rustfs-root, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: thanos-warm-s1-candidate}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - name: root-credentials
          secret:
            secretName: thanos-warm-root
            # Only the server mounts this volume; do not apply fsGroup to its data PVC.
            defaultMode: 292  # 0444
            items: [{key: access, path: access}, {key: secret, path: secret}]
        - name: tls
          secret:
            secretName: thanos-warm-api-tls
            items:
              - {key: tls.crt, path: rustfs_cert.pem}
              - {key: tls.key, path: rustfs_key.pem}
              - {key: ca.crt, path: ca.crt}
