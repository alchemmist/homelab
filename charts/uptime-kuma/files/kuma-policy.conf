pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 512; }
http {
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format safe escape=json '{"service":"public-kuma-policy","status":$status,"method":"$request_method","duration_seconds":$request_time}';
  access_log /dev/stdout safe;
  resolver 10.43.0.10 valid=30s ipv6=off;
  upstream kuma {
    zone kuma 64k;
    server uptime-kuma.uptime-kuma.svc.cluster.local:80 resolve;
  }
  server {
    listen 8080;
    # TLS terminates at ingress: keep local redirects relative, never expose :8080.
    absolute_redirect off;
    proxy_set_header Host status.alchemmist.xyz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade "";
    proxy_set_header Connection close;
    location = / { return 302 /status/socrat; }
    # Only this native machine endpoint accepts write verbs. Native push tokens
    # remain mandatory; no interactive login is inserted into monitor traffic.
    location ^~ /api/push/ { proxy_pass http://kuma; }
    location ^~ /socket.io { return 404; }
    location ~ ^/(dashboard|manage-status-page|settings|add|login)(/|$) {
      return 302 https://kuma.socrat.alchemmist.xyz$request_uri;
    }
    location ~ ^/(status/|assets/|upload/|icon\.|favicon\.|apple-touch-icon|manifest\.json|sw\.js$|workbox-[^/]+\.js$|api/(status-page/|badge/|entry-page$)) {
      limit_except GET HEAD { deny all; }
      proxy_pass http://kuma;
    }
    location / { return 404; }
  }
}
