pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 512; }
http {
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format safe escape=json '{"service":"public-kuma-policy","status":$status,"method":"$request_method","duration_seconds":$request_time}';
  access_log /dev/stdout safe;
  resolver 10.43.0.10 valid=30s ipv6=off;
  upstream kuma {
    zone kuma 64k;
    server gatus.uptime-kuma.svc.cluster.local:80 resolve;
  }
  server {
    listen 8080;
    # TLS terminates at ingress: keep local redirects relative, never expose :8080.
    absolute_redirect off;
    proxy_set_header Host status.alchemmist.xyz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade "";
    proxy_set_header Connection close;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($host = kuma.socrat.alchemmist.xyz) { return 302 https://status.alchemmist.xyz/; }
    location = /status/socrat { return 302 /; }
    location = /status/socrat/ { return 302 /; }
    location ~ ^/(?:$|css/|js/|img/|fonts/|assets/|endpoints/|suites/|favicon|apple-touch-icon|manifest\.json|robots\.txt|api/v1/(?:config$|endpoints/|suites/)) {
      proxy_pass http://kuma;
    }
    location / { return 404; }
  }
}
