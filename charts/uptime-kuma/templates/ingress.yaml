apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: {{ .Release.Namespace | quote }}
{{- if and .Values.publicStatusHost (eq .Values.host .Values.publicStatusHost) }}
{{- if not .Values.publicEntry.kumaPolicyProxy.enabled }}
{{- fail "public status discovery requires the read-only policy proxy" }}
{{- end }}
  labels:
    homelab.alchemmist.xyz/public-web: 'true'
{{- end }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.tlsSecret | quote }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-web-kuma-proxy
                port:
                  number: 80
