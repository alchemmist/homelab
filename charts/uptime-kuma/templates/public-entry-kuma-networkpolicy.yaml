{{- if .Values.publicEntry.kumaPolicyProxy.enabled }}
# Bidirectional isolation for the public status-page policy proxy.
#
# Ingress arrives only from the kube-system ingress controller, which is the
# only peer allowed to reach the reviewed public host. Egress is DNS plus the
# gatus Service in this namespace: files/kuma-policy.conf resolves exactly one
# upstream, gatus.uptime-kuma.svc.cluster:80, so nothing else is addressable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-web-kuma-proxy
  namespace: uptime-kuma
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: public-web-kuma-proxy}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik, app.kubernetes.io/instance: traefik}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {app: gatus}}
      ports: [{protocol: TCP, port: 80}]
{{- end }}
