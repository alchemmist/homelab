apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels: { app: uptime-kuma }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: uptime-kuma }
  template:
    metadata:
      labels: { app: uptime-kuma }
    spec:
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        {{- toYaml (.Values.dnsConfig | default (dict "nameservers" (list "10.250.0.2" "10.250.0.1" "10.250.0.3") "options" (list (dict "name" "ndots" "value" "1") (dict "name" "timeout" "value" "2") (dict "name" "attempts" "value" "2")))) | nindent 8 }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      containers:
        - name: uptime-kuma
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: DirectoryOrCreate
