apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels: { app: uptime-kuma }
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: uptime-kuma }
  template:
    metadata:
      labels: { app: uptime-kuma }
    spec:
      containers:
        - name: uptime-kuma
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: UPTIME_KUMA_DB_TYPE
              value: mariadb
            - name: UPTIME_KUMA_DB_HOSTNAME
              value: {{ .Values.database.serviceName | quote }}
            - name: UPTIME_KUMA_DB_PORT
              value: "3306"
            - name: UPTIME_KUMA_DB_NAME
              value: {{ .Values.database.database | quote }}
            - name: UPTIME_KUMA_DB_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: UPTIME_KUMA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
          volumeMounts:
            - name: branding
              mountPath: /app/data/upload
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: branding
          configMap:
            name: uptime-kuma-branding
