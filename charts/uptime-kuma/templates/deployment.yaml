apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels: { app: uptime-kuma }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: uptime-kuma }
  template:
    metadata:
      labels: { app: uptime-kuma }
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      containers:
        - name: uptime-kuma
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: DirectoryOrCreate
