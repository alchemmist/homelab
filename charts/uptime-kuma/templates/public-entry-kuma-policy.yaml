{{- if .Values.publicEntry.kumaPolicyProxy.enabled }}
{{- $spread := .Values.publicEntry.kumaPolicyProxy.spreadAcrossEntrances }}
{{- if not (kindIs "bool" $spread) }}{{ fail "spreadAcrossEntrances must be boolean" }}{{ end }}
{{- if not (regexMatch "^docker.io/library/nginx:.+@sha256:[a-f0-9]{64}$" .Values.publicEntry.kumaPolicyProxy.image) }}
{{- fail "Kuma policy proxy requires a verified immutable stock nginx image" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-web-kuma-policy
  namespace: uptime-kuma
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
data:
  nginx.conf: |
{{ .Files.Get "files/kuma-policy.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web-kuma-proxy
  namespace: uptime-kuma
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
{{- if $spread }}
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
{{- else }}
  replicas: 1
{{- end }}
  selector: {matchLabels: {app: public-web-kuma-proxy}}
  template:
    metadata:
      labels:
        app: public-web-kuma-proxy
{{- if $spread }}
        homelab.alchemmist.xyz/status-proxy-replica: spread
{{- end }}
      annotations:
        checksum/config: {{ .Files.Get "files/kuma-policy.conf" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
{{- if $spread }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [socrat-0, socrat-2]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {homelab.alchemmist.xyz/status-proxy-replica: spread}}
{{- else }}
      nodeSelector: {kubernetes.io/hostname: socrat-0}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: policy
          image: {{ .Values.publicEntry.kumaPolicyProxy.image }}
          command: [nginx, '-g', 'daemon off;']
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /api/v1/config, port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 15}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: public-web-kuma-policy}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: public-web-kuma-proxy
  namespace: uptime-kuma
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  selector: {app: public-web-kuma-proxy}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
