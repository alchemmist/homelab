apiVersion: apps/v1
kind: Deployment
metadata: {name: gatus}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: gatus}}
  template:
    metadata:
      labels: {app: gatus}
      annotations:
        checksum/config: {{ .Files.Get "files/config.yaml" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gatus
          image: docker.io/twinproduction/gatus@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {port: http, path: /}}
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: GATUS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: gatus-postgres, key: url}}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: ca, mountPath: /pg-ca, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - {name: config, configMap: {name: gatus-config}}
        - {name: ca, configMap: {name: pg-common-ca}}
---
apiVersion: v1
kind: Service
metadata: {name: gatus}
spec:
  selector: {app: gatus}
  ports: [{name: http, port: 80, targetPort: http}]
