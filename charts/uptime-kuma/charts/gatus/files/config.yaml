storage:
  type: postgres
  path: ${GATUS_DATABASE_URL}
ui:
  title: Socrat Status
  header: Socrat · System status
  description: Live availability of Socrat services
  default-sort-by: group
  custom-css: |
    :root { accent-color: #38bda6; }
    header { border-bottom: 2px solid #38bda6; }
    h1, h2 { letter-spacing: -.025em; }
endpoints:
  - name: Socrat
    group: Applications
    url: "http://socrat-home.socrat-home:8080/"
    interval: 60s
    client: {timeout: 8s, ignore-redirect: true}
    ui: {hide-url: true, hide-hostname: true, hide-port: true, hide-errors: true}
    conditions: ["[STATUS] == 200"]
