replicaCount: 2

image:
  repository: harbor.socrat.alchemmist.xyz/homelab/socrat-home
  tag: latest
  digest: sha256:41e26b089357b32fc7caefc21dc2bc1dfcb12c7e8f90373fb11dfefb152c734f
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

service:
  port: 8080
  targetPort: 80

ingress:
  className: traefik
  host: socrat.alchemmist.xyz
  tlsSecretName: socrat-home-tls
