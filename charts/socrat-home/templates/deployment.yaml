apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/access-logging: {{ include (print $.Template.BasePath "/access-logging.yaml") . | sha256sum }}
      {{- if .Values.homepageIndex.enabled }}
        checksum/homepage-index: {{ printf "%s:%s:%s:%s" (.Files.Get "files/index.html" | sha256sum) (.Files.Get "files/wallpaper.webp" | sha256sum) (.Files.Get "files/favicon.svg" | sha256sum) (.Files.Get "files/cmu.serif-roman.woff2" | sha256sum) | sha256sum }}
      {{- end }}
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      {{- end }}
      volumes:
        - name: access-logging
          configMap:
            name: {{ .Release.Name }}-access-logging
      {{- if .Values.homepageIndex.enabled }}
        - name: homepage-index
          configMap:
            name: {{ .Release.Name }}-index
      {{- end }}
      containers:
        - name: nginx
          {{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag -}}
          {{- if .Values.image.digest }}
          {{- $image = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: access-logging
              mountPath: /etc/nginx/conf.d/00-access-logging.conf
              subPath: 00-access-logging.conf
              readOnly: true
          {{- if .Values.homepageIndex.enabled }}
            - name: homepage-index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: homepage-index
              mountPath: /usr/share/nginx/html/wallpaper.webp
              subPath: wallpaper.webp
              readOnly: true
            - name: homepage-index
              mountPath: /usr/share/nginx/html/fonts/cmu.serif-roman.woff2
              subPath: cmu.serif-roman.woff2
              readOnly: true
            - name: homepage-index
              mountPath: /usr/share/nginx/html/favicon.svg
              subPath: favicon.svg
              readOnly: true
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
