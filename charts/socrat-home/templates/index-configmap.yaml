{{- if .Values.homepageIndex.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-index
data:
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
  favicon.svg: |
{{ .Files.Get "files/favicon.svg" | indent 4 }}
binaryData:
  cmu.serif-roman.woff2: {{ .Files.Get "files/cmu.serif-roman.woff2" | b64enc | quote }}
  wallpaper.webp: {{ .Files.Get "files/wallpaper.webp" | b64enc | quote }}
{{- end }}
