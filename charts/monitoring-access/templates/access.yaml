apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-local-only
spec:
  ipAllowList:
    sourceRange:
{{ required "Grafana requires explicit private network ranges" .Values.allowedNetworks | toYaml | indent 6 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-public
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-grafana-local-only@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.tlsSecret | quote }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.serviceName | quote }}
                port:
                  number: {{ .Values.servicePort }}
