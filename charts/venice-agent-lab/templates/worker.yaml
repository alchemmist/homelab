apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.worker.name }}
spec:
  replicas: 1
  serviceName: {{ .Values.worker.name }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.worker.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.worker.name }}
    spec:
      serviceAccountName: {{ .Values.worker.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ .Values.worker.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          workingDir: /workspace
          env:
            - name: HOME
              value: /tmp
            - name: GIT_CONFIG_NOSYSTEM
              value: '1'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
