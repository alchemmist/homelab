apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ .Values.controllerServiceAccount }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ .Values.controllerServiceAccount }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ printf "%s-0" .Values.worker.name | quote }}]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: [{{ printf "%s-0" .Values.worker.name | quote }}]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ .Values.controllerServiceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controllerServiceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.controllerServiceAccount }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ .Values.worker.name }}-deny-all
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.worker.name }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
