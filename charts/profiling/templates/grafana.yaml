apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope-grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  pyroscope-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.cattle-monitoring-system.svc.cluster.local:4040
        editable: false
        isDefault: false
        jsonData:
          minStep: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-cpu-profiling-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards/Profiling
data:
  service-cpu-profiling.json: |
{{ .Files.Get "files/service-cpu-profiling.json" | indent 4 }}
