{{- if .Values.piMonori }}
apiVersion: v1
kind: ConfigMap
metadata: {name: pi-monori-code}
binaryData:
  package-lock.json.gz: {{ .Files.Get "files/pi-monori/package-lock.json.gz" | b64enc | quote }}
data:
{{- range $p, $_ := .Files.Glob "files/pi-monori/*" }}
{{- if not (hasSuffix ".gz" $p) }}
  {{ base $p }}: |
{{ $.Files.Get $p | indent 4 }}
{{- end }}
{{- end }}
{{- range $role := list "author" "judge" }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: pi-monori-{{ $role }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: pi-monori-{{ $role }}}}
  template:
    metadata:
      labels: {app: pi-monori-{{ $role }}}
      annotations: {pilot-code: {{ $.Files.Get "files/pi-monori/relay.py" | sha256sum | quote }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: socrat-5}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      {{- if eq $role "author" }}
      initContainers:
        - name: install-pi
          image: {{ include "agent-canvas.image" $ }}
          command: [sh, -ec, 'cd /opt/pi; cp /code/package.json .; gzip -dc /code/package-lock.json.gz > package-lock.json; HOME=/tmp npm ci --ignore-scripts --no-audit --no-fund; node_modules/.bin/pi --version']
          securityContext: &sec {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 1, memory: 768Mi}}
          volumeMounts: [{name: pi, mountPath: /opt/pi}, {name: code, mountPath: /code, readOnly: true}, {name: temp, mountPath: /tmp}]
      {{- end }}
      containers:
        - name: sandbox
          image: {{ include "agent-canvas.image" $ }}
          command: [sleep, infinity]
          env: [{name: HOME, value: /scratch/home}, {name: PYTHONDONTWRITEBYTECODE, value: '1'}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 1, memory: 1Gi}}
          volumeMounts:
            - {name: work, mountPath: /scratch}
            - {name: temp, mountPath: /tmp}
            {{- if eq $role "author" }}
            - {name: pi, mountPath: /opt/pi, readOnly: true}
            - {name: code, mountPath: /code, readOnly: true}
            {{- end }}
        {{- if eq $role "author" }}
        - name: relay
          image: {{ include "agent-canvas.image" $ }}
          command: [python, -IBu, /code/relay.py]
          securityContext: *sec
          resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts: [{name: code, mountPath: /code, readOnly: true}, {name: model, mountPath: /model, readOnly: true}]
        {{- end }}
      volumes:
        - {name: work, emptyDir: {sizeLimit: 3Gi}}
        - {name: temp, emptyDir: {sizeLimit: 384Mi}}
        {{- if eq $role "author" }}
        - {name: pi, emptyDir: {sizeLimit: 512Mi}}
        - {name: code, configMap: {name: pi-monori-code}}
        - {name: model, secret: {secretName: openhands-model, defaultMode: 0440}}
        {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: pi-monori-judge-offline}
spec:
  podSelector: {matchLabels: {app: pi-monori-judge}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
