{{- if .Values.monoriPilot }}
apiVersion: v1
kind: ConfigMap
metadata: {name: mutation-pilot-code}
binaryData:
  uv.lock.gz: {{ .Files.Get "files/pilot/uv.lock.gz" | b64enc | quote }}
data:
  facts.json: |
{{ .Files.Get "files/pilot/facts.json" | indent 4 }}
  loop.py: |
{{ .Files.Get "files/pilot/loop.py" | indent 4 }}
  mutants.json: |
{{ .Files.Get "files/pilot/mutants.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata: {name: mutation-pilot}
spec:
  selector: {statefulset.kubernetes.io/pod-name: openhands-0}
  ports: [{port: 8083, targetPort: 8083}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mutation-pilot-ticks}
spec:
  podSelector: {matchLabels: {statefulset.kubernetes.io/pod-name: openhands-0}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: automation}}, podSelector: {matchLabels: {app: n8n}}}]
      ports: [{port: 8083, protocol: TCP}]
{{- end }}
