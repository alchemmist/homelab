{{- if .Values.monoriPublisher }}
apiVersion: v1
kind: ConfigMap
metadata: {name: monori-publisher-code}
data:
  publisher.py: |
{{ .Files.Get "files/steward/publisher.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: monori-publisher}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: monori-publisher}}
  template:
    metadata:
      labels: {app: monori-publisher}
      annotations:
        code-sha: {{ .Files.Get "files/steward/publisher.py" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: socrat-5}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: publisher
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: [python, -IB, /code/publisher.py]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 160Mi}
          readinessProbe: {tcpSocket: {port: 8081}}
          volumeMounts:
            - {name: code, mountPath: /code, readOnly: true}
            - {name: credential, mountPath: /credential, readOnly: true}
      volumes:
        - name: code
          configMap: {name: monori-publisher-code}
        - name: credential
          secret: {secretName: monori-publisher-user, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata: {name: monori-publisher}
spec:
  selector: {app: monori-publisher}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: monori-publisher-canvas-out}
spec:
  podSelector: {matchLabels: {statefulset.kubernetes.io/pod-name: openhands-0}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: monori-publisher}}}]
      ports: [{port: 8081, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: monori-publisher-canvas-in}
spec:
  podSelector: {matchLabels: {app: monori-publisher}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {statefulset.kubernetes.io/pod-name: openhands-0}}}]
      ports: [{port: 8081, protocol: TCP}]
{{- end }}
