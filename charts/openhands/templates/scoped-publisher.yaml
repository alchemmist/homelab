{{- if .Values.monoriPublisher }}
apiVersion: v1
kind: ConfigMap
metadata: {name: monori-publisher-code}
data:
  publisher.py: |
{{ .Files.Get "files/steward/publisher.py" | indent 4 }}
  ready_gate.py: |
{{ .Files.Get "files/steward/ready_gate.py" | indent 4 }}
  ci_excerpt.py: |
{{ .Files.Get "files/steward/ci_excerpt.py" | indent 4 }}
  pr_lifecycle.py: |
{{ .Files.Get "files/steward/pr_lifecycle.py" | indent 4 }}
  qa_video.py: |
{{ .Files.Get "files/steward/qa_video.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: monori-publisher}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: monori-publisher}}
  template:
    metadata:
      labels: {app: monori-publisher}
      annotations:
        code-sha: {{ print (.Files.Get "files/steward/publisher.py") (.Files.Get "files/steward/pr_lifecycle.py") (.Files.Get "files/steward/ready_gate.py") (.Files.Get "files/steward/ci_excerpt.py") | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: socrat-5}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: prepare-encoder
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: [python, -IB, -c]
          args:
            - |
{{ .Files.Get "files/steward/install_ffmpeg.py" | indent 14 }}
            - /encoder/ffmpeg
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: encoder, mountPath: /encoder}]
      containers:
        - name: publisher
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: [python, -IB, /code/publisher.py]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 750m, memory: 384Mi}
          readinessProbe: {tcpSocket: {port: 8081}}
          volumeMounts:
            - {name: code, mountPath: /code, readOnly: true}
            - {name: encoder, mountPath: /encoder, readOnly: true}
            - {name: temp, mountPath: /tmp}
            - {name: credential, mountPath: /credential, readOnly: true}
            {{- if .Values.monoriPilot }}
            - {name: proof, mountPath: /proof, readOnly: true}
            {{- end }}
      volumes:
        - {name: encoder, emptyDir: {sizeLimit: 120Mi}}
        - {name: temp, emptyDir: {sizeLimit: 24Mi}}
        - name: code
          configMap: {name: monori-publisher-code}
        {{- if .Values.monoriPilot }}
        - {name: proof, secret: {secretName: monori-proof-ticket, defaultMode: 0440}}
        {{- end }}
        - name: credential
          secret: {secretName: monori-publisher-user, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata: {name: monori-publisher}
spec:
  selector: {app: monori-publisher}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: monori-publisher-canvas-out}
spec:
  podSelector: {matchLabels: {statefulset.kubernetes.io/pod-name: openhands-0}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: monori-publisher}}}]
      ports: [{port: 8081, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: monori-publisher-canvas-in}
spec:
  podSelector: {matchLabels: {app: monori-publisher}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {statefulset.kubernetes.io/pod-name: openhands-0}}}]
      ports: [{port: 8081, protocol: TCP}]
{{- end }}
