# Controlled foundation only. Browser admission must be complete before routing.
enabled: true
# Exact automation/app=spi-triage TCP9000 writer ingress; no broader access.
spiWriter:
  enabled: true
oidc:
  enabled: true
gateway:
  enabled: true
  namespace: identity
  imagePullSecrets: [{name: rustfs-harbor-pull}]
  image: harbor.socrat.alchemmist.xyz/homelab/rustfs-gateway@sha256:9d884a7bd593fd6852db2da0af3f5117862f4a3c1e70e1928fd6b77ab10988ac
browserRoutes:
  enabled: true
  unifiedOrigin: true
authEgressCIDRs: [109.173.40.247/32, 109.120.141.60/32]
# Explicit Burstable reservation; no reduction of 4Gi runtime bound.
# socrat-0 allocatable 32545144Ki; existing requests 29392Mi.
resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits: {cpu: '2', memory: 4Gi}
