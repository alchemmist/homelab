pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 10.43.0.10 valid=30s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    client_max_body_size 8m;
    location / {
      set $console http://rustfs.rustfs.svc.cluster.local:9001;
      proxy_pass $console;
      proxy_http_version 1.1;
      proxy_set_header Host rustfs.socrat.alchemmist.xyz;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host rustfs.socrat.alchemmist.xyz;
      proxy_set_header X-authentik-username "";
      proxy_set_header X-authentik-groups "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
    }
  }
}
