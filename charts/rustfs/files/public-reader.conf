pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 10.43.0.10 valid=30s ipv6=off;
  map $request_uri $object_path { ~^(/public/[^?]+) $1; default ""; }
  server {
    listen 8080;
    location / { return 404; }
    location ^~ /public/ {
      if ($uri = /public/) { return 404; }
      if ($object_path = "") { return 400; }
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      set $origin http://rustfs.rustfs.svc.cluster.local:9000;
      # Forward only a normalized object path, never S3 operation/signature arguments.
      proxy_pass $origin$object_path;
      proxy_set_header Host rustfs.rustfs.svc.cluster.local:9000;
      proxy_hide_header Location;
      proxy_pass_request_headers off;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
    }
  }
}
