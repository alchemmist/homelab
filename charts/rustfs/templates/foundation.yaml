{{- if .Values.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rustfs-retain
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rustfs-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: rustfs}
  template:
    metadata:
      labels: {app: rustfs}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: socrat-0
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # A new PVC hides image-created /data directories. Create symlink targets
        # as the runtime uid, never a privileged/chown repair container.
        - name: data-directories
          image: {{ .Values.image | quote }}
          command: [/bin/sh, -ec, 'mkdir -p /data/.rustfs/events /data/.rustfs/audit']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: rustfs
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/live, port: s3}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: s3}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: s3}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          env:
            # Override image-level wildcard console CORS; never allow arbitrary origins.
            - {name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS, value: 'https://rustfs.socrat.alchemmist.xyz'}
            - {name: RUSTFS_CORS_ALLOWED_ORIGINS, value: ''}
            - {name: RUSTFS_OBS_LOGGER_LEVEL, value: warn}
            - {name: RUSTFS_FTP_ENABLE, value: 'false'}
            - {name: RUSTFS_WEBDAV_ENABLE, value: 'false'}
            - {name: RUSTFS_SFTP_ENABLE, value: 'false'}
            {{- if .Values.oidc.enabled }}
            - {name: RUSTFS_IDENTITY_OPENID_ENABLE, value: 'on'}
            - {name: RUSTFS_BROWSER_REDIRECT_URL, value: 'https://rustfs.socrat.alchemmist.xyz'}
            - {name: RUSTFS_IDENTITY_OPENID_CONFIG_URL, value: {{ .Values.oidc.issuer | quote }}}
            - {name: RUSTFS_OUTBOUND_ALLOW_ORIGINS, value: 'https://auth.socrat.alchemmist.xyz'}
            - {name: RUSTFS_IDENTITY_OPENID_SCOPES, value: 'openid,profile,email,rustfs_policy'}
            - {name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME, value: rustfs_policy}
            - {name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM, value: rustfs_policy}
            - {name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM, value: rustfs_policy}
            - {name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC, value: 'off'}
            - {name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI, value: 'https://rustfs.socrat.alchemmist.xyz/rustfs/admin/v3/oidc/callback/default'}
            - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.oidc.secret }}, key: client-id}
            - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.oidc.secret }}, key: client-secret}
            {{- end }}
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rootSecret }}, key: access-key}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rootSecret }}, key: secret-key}
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /logs
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rustfs-data}
        - name: logs
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
# ClusterIP only. Browser routes, when separately enabled, terminate at Authentik.
apiVersion: v1
kind: Service
metadata: {name: rustfs}
spec:
  selector: {app: rustfs}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
    - {name: console, port: 9001, targetPort: console}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs-isolation
spec:
  podSelector:
    matchLabels: {app: rustfs}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.spiWriter.enabled }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: automation}}
          podSelector: {matchLabels: {app: spi-triage}}
      ports: [{port: 9000, protocol: TCP}]
    {{- end }}
    {{- if .Values.gateway.enabled }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.gateway.namespace }}}}
          podSelector: {matchLabels: {app: rustfs-gateway}}
      ports: [{port: 9000, protocol: TCP}]
    {{- end }}
    {{- if .Values.browserRoutes.enabled }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: identity}}
          podSelector: {matchLabels: {app: rustfs-console-http}}
      ports: [{port: 9001, protocol: TCP}]
    {{- end }}
    {{- if not (or .Values.gateway.enabled .Values.browserRoutes.enabled .Values.spiWriter.enabled) }}
    []
    {{- end }}
  {{- if .Values.oidc.enabled }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.authEgressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{port: 443, protocol: TCP}]
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
