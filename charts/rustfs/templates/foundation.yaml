{{- if .Values.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rustfs-retain
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rustfs-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: rustfs}
  template:
    metadata:
      labels: {app: rustfs}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: socrat-0
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rustfs
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rootSecret }}, key: access-key}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rootSecret }}, key: secret-key}
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /logs
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: '2', memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rustfs-data}
        - name: logs
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
# No service or ingress yet: even the console stays unexposed during review.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs-isolation
spec:
  podSelector:
    matchLabels: {app: rustfs}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
