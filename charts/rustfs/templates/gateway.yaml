{{- if and .Values.enabled .Values.gateway.enabled }}
{{- if not (regexMatch "^.+@sha256:[0-9a-f]{64}$" .Values.gateway.image) }}
{{- fail "gateway.image must be a built reviewed digest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: rustfs-gateway, namespace: {{ .Values.gateway.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: rustfs-gateway}}
  template:
    metadata: {labels: {app: rustfs-gateway}}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.gateway.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.gateway.readerSecret }}, key: access-key}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.gateway.readerSecret }}, key: secret-key}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata: {name: rustfs-gateway, namespace: {{ .Values.gateway.namespace }}}
spec:
  selector: {app: rustfs-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rustfs-gateway-isolation, namespace: {{ .Values.gateway.namespace }}}
spec:
  podSelector: {matchLabels: {app: rustfs-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: rustfs}}
          podSelector: {matchLabels: {app: rustfs}}
      ports: [{port: 9000, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
