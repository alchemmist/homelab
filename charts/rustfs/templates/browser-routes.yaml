{{- if and .Values.enabled .Values.browserRoutes.enabled }}
{{- if not (and .Values.oidc.enabled .Values.gateway.enabled) }}
{{- fail "browserRoutes requires native OIDC and public reader" }}
{{- end }}
# Console uses a routing-only namespace bridge, then native RustFS OIDC.
# Published evidence is anonymous GET/HEAD with manifest integrity checks.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-console-browser
  namespace: identity
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.priority: '100'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [rustfs.socrat.alchemmist.xyz, spi-evidence.socrat.alchemmist.xyz]
      secretName: rustfs-browser-tls
  rules:
    - host: rustfs.socrat.alchemmist.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: rustfs-console-http, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-evidence-browser
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.priority: '50'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [spi-evidence.socrat.alchemmist.xyz]
      secretName: rustfs-browser-tls
  rules:
    - host: spi-evidence.socrat.alchemmist.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: rustfs-gateway, port: {number: 8080}}
{{- end }}
