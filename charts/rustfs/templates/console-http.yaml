{{- if and .Values.enabled .Values.browserRoutes.enabled }}
# Routing-only bridge: no auth_request, login interception or identity headers.
# Keeps the existing edge watch scope; RustFS itself performs native OIDC.
apiVersion: v1
kind: ConfigMap
metadata: {name: rustfs-console-http, namespace: identity}
data:
  nginx.conf: |
{{ .Files.Get "files/console-http.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rustfs-console-http, namespace: identity}
spec:
  replicas: 1
  selector: {matchLabels: {app: rustfs-console-http}}
  template:
    metadata:
      labels: {app: rustfs-console-http}
      annotations:
        checksum/config: {{ .Files.Get "files/console-http.conf" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: http
          image: docker.io/library/nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
          command: [nginx, '-g', 'daemon off;']
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: rustfs-console-http}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: rustfs-console-http, namespace: identity}
spec:
  selector: {app: rustfs-console-http}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rustfs-console-http, namespace: identity}
spec:
  podSelector: {matchLabels: {app: rustfs-console-http}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: rustfs}}
          podSelector: {matchLabels: {app: rustfs}}
      ports: [{port: 9001, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
