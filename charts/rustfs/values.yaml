# All activation is explicit and remains off in committed source.
enabled: false
image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
rootSecret: rustfs-root
resources:
  requests: {cpu: 500m, memory: 4Gi}
  limits: {cpu: '2', memory: 4Gi}
oidc:
  enabled: false
  secret: rustfs-oidc
  issuer: https://auth.socrat.alchemmist.xyz/application/o/spi-rustfs-native/
gateway:
  # Only reviewed placements; activate identity separately after secret/image preparation.
  namespace: rustfs
  enabled: false
  # Build services/rustfs_gateway; supply a reviewed digest before enabling.
  image: ""
  readerSecret: rustfs-reader
  imagePullSecrets: []
browserRoutes:
  enabled: false
# Exact Authentik public endpoint addresses, established before rollout. Not 0/0.
authEgressCIDRs: []

# Dedicated SPI writer only; no reader/root credentials shared with SPI.
spiWriter:
  enabled: false
