# Proxy gates must pass audit/readback BEFORE these routes are activated.
issuer: letsencrypt-http01
routes:
  - {name: grafana, host: grafana.socrat.alchemmist.xyz, namespace: identity, service: public-web-grafana-proxy, port: 80, authorization: grafana-oidc}
  - {name: search, host: search.socrat.alchemmist.xyz, namespace: identity, service: authentik-server, port: 80, authorization: authentik-proxy}
  - {name: webui-alias, host: llm.socrat.alchemmist.xyz, namespace: identity, service: authentik-server, port: 80, authorization: authentik-proxy}
  - {name: litellm-alias, host: litellm.socrat.alchemmist.xyz, namespace: identity, service: authentik-server, port: 80, authorization: authentik-proxy}
  # Native auth is essential for Rancher agents/websockets and token-based MCP.
  - {name: rancher, host: rancher.socrat.alchemmist.xyz, namespace: cattle-system, service: public-web-rancher-proxy, port: 80, authorization: rancher-native}
  - {name: grafana-mcp, host: grafana-mcp.socrat.alchemmist.xyz, namespace: cattle-monitoring-system, service: grafana-mcp, port: 8000, authorization: mcp-bearer, path: /mcp}

  - {name: syncthing-0, host: 0.socrat.alchemmist.xyz, namespace: identity, service: authentik-server, port: 80, authorization: authentik-proxy}
  - {name: syncthing-1, host: 1.socrat.alchemmist.xyz, namespace: identity, service: authentik-server, port: 80, authorization: authentik-proxy}
  - {name: kuma-admin, host: kuma.socrat.alchemmist.xyz, namespace: identity, service: authentik-server, port: 80, authorization: authentik-proxy}

  - name: grafana-tv
    host: tv.alchemmist.xyz
    namespace: identity
    service: public-web-grafana-proxy
    port: 80
    authorization: grafana-public-dashboard
rancherPolicyProxy:
  enabled: true
  image: docker.io/library/nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311

grafanaPolicyProxy:
  enabled: true
  image: docker.io/library/nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311

syncthingPolicyProxy:
  enabled: true
  image: docker.io/library/nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311

kumaPolicyProxy:
  enabled: true
  image: docker.io/library/nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
