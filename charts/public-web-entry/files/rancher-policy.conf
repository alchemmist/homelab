pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 512; }
http {
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format safe escape=json '{"service":"public-rancher-policy","status":$status,"method":"$request_method","duration_seconds":$request_time}';
  access_log /dev/stdout safe;
  map $http_upgrade $upgrade_connection { default upgrade; '' close; }
  # Normalize URI first. Never pass a public local-password action to Rancher.
  # GET/HEAD provider metadata stays available to the native login UI.
  map "$request_method:$uri" $deny_local_password {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):/v3-public/localProviders(?:/|$) 1;
  }
  server {
    listen 8080;
    server_name rancher.socrat.alchemmist.xyz;
    if ($deny_local_password) { return 403; }
    client_max_body_size 64m;
    location / {
      resolver 10.43.0.10 valid=30s ipv6=off;
      set $backend http://rancher.cattle-system.svc.cluster.local:80;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host rancher.socrat.alchemmist.xyz;
      proxy_set_header X-Forwarded-Host rancher.socrat.alchemmist.xyz;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $upgrade_connection;
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-Method-Override "";
      proxy_set_header X-authentik-username "";
      proxy_set_header X-authentik-groups "";
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
