apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: yandex-voice
  namespace: fleet-local
spec:
  repo: https://github.com/alchemmist/homelab.git
  branch: main
  paths:
    - deploy/yandex-voice
  pollingInterval: 1m
  helm:
    repoAuthSecret:
      name: ghcr-oci-auth
  targets:
    - name: local
      clusterSelector:
        matchLabels:
          name: local
