apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: blog
  namespace: fleet-local
spec:
  repo: https://github.com/alchemmist/homelab.git
  branch: main
  clientSecretName: homelab-git-write
  imageScanInterval: 1m
  imageScanCommit:
    authorName: Fleet Image Automation
    authorEmail: fleet-image-automation@users.noreply.github.com
    messageTemplate: "chore(blog): update image reference"
  paths:
    - deploy/blog
  targetNamespace: blog
  pollingInterval: 1m
  targets:
    - name: local
      clusterSelector:
        matchLabels:
          name: local
