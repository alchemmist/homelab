# TEMPORARY, apply only for a guarded idle handoff; NOT an Argo app source.
# No Pod has this selector. Existing accepted connections can finish.
# Restore canonical Services from deploy/{blog-updates,wiki-openapi}/worker.yaml
# after new direct Pod readiness, and in a controller finally block on failure.
apiVersion: v1
kind: Service
metadata:
  name: blog-updates-worker
  namespace: automation
spec:
  selector:
    app: blog-updates-worker
    homelab.io/migration-drain: no-serving-pods
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-openapi-worker
  namespace: automation
spec:
  selector:
    app: wiki-openapi-worker
    homelab.io/migration-drain: no-serving-pods
  ports:
    - port: 8080
      targetPort: 8080
