---
# Not referenced by deploy/argocd/apps/n8n.yaml. That Application renders charts/n8n,
# where ingress.enabled is false. This file remains only as the retired Fleet bundle's values.
image:
  repository: harbor.socrat.alchemmist.xyz/n8n/n8n
  tag: 444db57644c734c8c45a4d621888540d597fdbf5
  digest: sha256:34bb222fb111ffd12c63859cd9b7567d94264b859b1e52ce3967207a637c5755
nodeName: socrat-1
secretName: n8n-secrets
persistence:
  storageClass: local-path
  size: 5Gi
host: n8n.socrat.alchemmist.xyz
webhookUrl: https://n8n.socrat.alchemmist.xyz/
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

ingress:
  enabled: true

# n8n enterprise log-streaming events ship to otel-loki through the in-pod
# bridge sidecar (charts/n8n/templates/otel-log-bridge.yaml). The mTLS client
# leaf otel-app-tls-n8n is mirrored into this namespace by the
# otel-application-credentials CronJob; the bridge reloads its SSL context on
# rotation, so no deployment reload is wired.
otelLogBridge:
  enabled: true
  secretName: otel-app-tls-n8n
...
