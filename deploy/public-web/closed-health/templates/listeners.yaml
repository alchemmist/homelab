{{- $catalog := required "entrance catalog required" .Values.replicas -}}
{{- if ne (dig "schoolbot" "inform.sch1357.ru" "tlsSourceName" "" .Values.hosts) "schoolbot-tls" }}{{ fail "expected ordinary Schoolbot owner" }}{{ end }}
{{- $host := "www.alchemmist.xyz" -}}
{{- $ing := .Values.ingress | default dict -}}
{{- $svc := .Values.service | default dict -}}
{{- $pin := dig "blog" $host (dict) .Values.hosts -}}
{{- $blog := and (eq (get $pin "dns") "managed") (eq (get $pin "tlsSourceName") "blog-tls") (or (not (hasKey $pin "route")) (eq (get $pin "route") "web")) (kindIs "bool" $ing.publicWeb) $ing.publicWeb (eq $ing.className "traefik") (kindIs "slice" $ing.hosts) (has $host $ing.hosts) (eq $ing.tlsSecretName "blog-tls") (eq (toJson $svc.port) "80") (eq (toJson $svc.targetPort) "8080") -}}
{{- $fqPin := dig "format-quorum" "fq.alchemmist.xyz" (dict) .Values.hosts -}}
{{- $fq := and (kindIs "bool" .Values.closedFormatQuorum) .Values.closedFormatQuorum (deepEqual $fqPin (dict "dns" "managed" "tlsSourceName" "format-quorum-tls")) -}}
{{- $wikiPin := dig "wiki" "wiki.socrat.alchemmist.xyz" (dict) .Values.hosts -}}
{{- $wiki := and (kindIs "bool" .Values.closedWiki) .Values.closedWiki (deepEqual $wikiPin (dict "dns" "managed" "tlsSourceName" "wiki-tls")) -}}
{{- $monoriPin := dig "monori" "monori.alchemmist.xyz" (dict) .Values.hosts -}}
{{- $monori := and (kindIs "bool" .Values.closedMonori) .Values.closedMonori (deepEqual $monoriPin (dict "dns" "managed" "tlsSourceName" "monori-tls")) -}}
{{- $apps := dict -}}
{{- range $app, $bit := dict "lms" "closedLms" "wishlist" "closedWishlist" -}}
{{- $host := printf "%s.alchemmist.xyz" $app -}}
{{- $pin := dig $app $host (dict) $.Values.hosts -}}
{{- $_ := set $apps $app (and (kindIs "bool" (get $.Values $bit)) (get $.Values $bit) (deepEqual $pin (dict "dns" "managed" "tlsSourceName" (printf "%s-tls" $app)))) -}}
{{- end -}}
{{- $status := and (kindIs "bool" .Values.closedStatus) .Values.closedStatus (deepEqual (dig "uptime-kuma" "status.alchemmist.xyz" (dict) .Values.hosts) (dict "dns" "managed" "tlsSourceName" "uptime-kuma-tls")) -}}
{{- $redirect := and (kindIs "bool" .Values.closedStatusRedirect) .Values.closedStatusRedirect (deepEqual (dig "uptime-kuma" "kuma.socrat.alchemmist.xyz" (dict) .Values.hosts) (dict "dns" "managed" "tlsSourceName" "public-web-kuma-admin-tls")) -}}
{{- $argo := and (kindIs "bool" .Values.closedArgo) .Values.closedArgo (deepEqual (dig "argocd" "argocd.socrat.alchemmist.xyz" (dict) .Values.hosts) (dict "dns" "managed" "tlsSourceName" "argocd-server-tls")) -}}
{{- $img := and (kindIs "bool" .Values.closedImg) .Values.closedImg (deepEqual (dig "img-proxy" "img.alchemmist.xyz" (dict) .Values.hosts) (dict "dns" "managed" "tlsSourceName" "img-proxy-tls")) -}}
{{- $umami := and (kindIs "bool" .Values.closedUmami) .Values.closedUmami (deepEqual (dig "umami" "umami.alchemmist.xyz" (dict) .Values.hosts) (dict "dns" "managed" "tlsSourceName" "umami-tls")) -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: schoolbot}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: schoolbot, app.kubernetes.io/name: schoolbot}}
      ports: [{port: 8000, protocol: TCP}]
{{- if $blog }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: blog}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: blog, app.kubernetes.io/name: blog}}
      ports: [{port: 8080, protocol: TCP}]
{{- end }}
{{- if $fq }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: format-quorum}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: format-quorum, app.kubernetes.io/name: format-quorum}}
      ports: [{port: 3000, protocol: TCP}]
{{- end }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-wiki
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if $wiki }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: wiki}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: wiki-runtime, app.kubernetes.io/name: hugo-docs-wiki}}
      ports: [{port: 8080, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-monori
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if $monori }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monori}}
          podSelector: {matchLabels: {app: monori}}
      ports: [{port: 8000, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
{{- range $app, $enabled := $apps }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-{{ $app }}
  namespace: {{ $.Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if $enabled }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $app }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: {{ $app }}, app.kubernetes.io/instance: {{ $app }}}}
      ports: [{port: 8000, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-status
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if or $status $redirect }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: uptime-kuma}}
          podSelector: {matchLabels: {app: public-web-kuma-proxy}}
      ports: [{port: 8080, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-argocd
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if $argo }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: argocd}}
          podSelector: {matchLabels: {app.kubernetes.io/name: argocd-server, app.kubernetes.io/instance: argo-cd}}
      ports: [{port: 8080, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-img
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if $img }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: img-proxy}}
          podSelector: {matchLabels: {app.kubernetes.io/name: img-proxy, app.kubernetes.io/instance: img-proxy}}
      ports: [{port: 8080, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-umami
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if $umami }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: umami}}
          podSelector: {matchLabels: {app: umami}}
      ports: [{port: 3000, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: closed-health, namespace: {{ .Release.Namespace }}}
data:
{{- if $img }}
  img.yaml: |
    http:
      routers:
        img:
          entryPoints: [closed]
          rule: 'Host(`img.alchemmist.xyz`) && PathPrefix(`/`)'
          service: img
      services:
        img:
          loadBalancer:
            passHostHeader: true
            servers: [{url: 'http://img-proxy.img-proxy.svc.cluster.local:80'}]
{{- end }}
{{- if $umami }}
  umami.yaml: |
    http:
      routers:
        umami:
          entryPoints: [closed]
          rule: 'Host(`umami.alchemmist.xyz`) && PathPrefix(`/`)'
          service: umami
      services:
        umami:
          loadBalancer:
            passHostHeader: true
            servers: [{url: 'http://umami.umami.svc.cluster.local:80'}]
{{- end }}
{{- if $argo }}
  argocd.yaml: |
    http:
      routers:
        argocd:
          entryPoints: [closed]
          rule: 'Host(`argocd.socrat.alchemmist.xyz`) && PathPrefix(`/`)'
          service: argocd
      services:
        argocd:
          loadBalancer:
            passHostHeader: true
            serversTransport: argocd-verified-tls
            servers: [{url: 'https://argo-cd-argocd-server.argocd.svc.cluster.local:443'}]
      serversTransports:
        argocd-verified-tls:
          serverName: argocd.socrat.alchemmist.xyz
          insecureSkipVerify: false
{{- end }}
  dynamic.yaml: |
    http:
      routers:
        health:
          entryPoints: [closed]
          rule: 'Host(`inform.sch1357.ru`) && Method(`GET`) && Path(`/api/health`)'
          service: schoolbot
{{- if $blog }}
        www-blog:
          entryPoints: [closed]
          rule: 'Host(`{{ $host }}`) && PathPrefix(`/`)'
          service: www-blog
{{- end }}
{{- if $fq }}
        format-quorum:
          entryPoints: [closed]
          rule: 'Host(`fq.alchemmist.xyz`) && PathPrefix(`/`)'
          service: format-quorum
{{- end }}
{{- if $wiki }}
        wiki:
          entryPoints: [closed]
          rule: 'Host(`wiki.socrat.alchemmist.xyz`) && PathPrefix(`/`)'
          service: wiki
{{- end }}
{{- if $monori }}
        monori:
          entryPoints: [closed]
          rule: 'Host(`monori.alchemmist.xyz`) && PathPrefix(`/`)'
          service: monori
{{- end }}
{{- range $app, $enabled := $apps }}
{{- if $enabled }}
        {{ $app }}:
          entryPoints: [closed]
          rule: 'Host(`{{ $app }}.alchemmist.xyz`) && PathPrefix(`/`)'
          service: {{ $app }}
{{- end }}
{{- end }}
{{- if $status }}
        status:
          entryPoints: [closed]
          rule: 'Host(`status.alchemmist.xyz`) && PathPrefix(`/`)'
          service: status-policy
{{- end }}
{{- if $redirect }}
        status-redirect:
          entryPoints: [closed]
          rule: 'Host(`kuma.socrat.alchemmist.xyz`) && PathPrefix(`/`)'
          service: status-policy
{{- end }}
      services:
{{- if or $status $redirect }}
        status-policy:
          loadBalancer:
            passHostHeader: true
            servers: [{url: 'http://public-web-kuma-proxy.uptime-kuma.svc.cluster.local:80'}]
{{- end }}
{{- range $app, $enabled := $apps }}
{{- if $enabled }}
        {{ $app }}:
          loadBalancer:
            servers: [{url: 'http://{{ $app }}.{{ $app }}.svc.cluster.local:80'}]
{{- end }}
{{- end }}
{{- if $monori }}
        monori:
          loadBalancer:
            servers: [{url: 'http://monori.monori.svc.cluster.local:80'}]
{{- end }}
{{- if $wiki }}
        wiki:
          loadBalancer:
            servers: [{url: 'http://wiki-runtime-wiki.wiki.svc.cluster.local:8080'}]
{{- end }}
{{- if $fq }}
        format-quorum:
          loadBalancer:
            servers: [{url: 'http://format-quorum.format-quorum.svc.cluster.local:80'}]
{{- end }}
{{- if $blog }}
        www-blog:
          loadBalancer:
            servers: [{url: 'http://blog.blog.svc.cluster.local:80'}]
{{- end }}
        schoolbot:
          loadBalancer:
            servers: [{url: 'http://schoolbot.schoolbot.svc.cluster.local:80'}]
{{- range $name, $instance := $catalog }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: closed-health-{{ $name }}, namespace: {{ $.Release.Namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: closed-health, entrance: {{ $name }}}}
  template:
    metadata: {labels: {app: closed-health, entrance: {{ $name }}}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: {{ $instance.node }}}
      {{- if eq $name "moscow" }}
      tolerations: [{key: homelab.io/bootstrap, operator: Equal, value: 'true', effect: NoSchedule}]
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: listener
          image: rancher/mirrored-library-traefik@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
          args:
            - --entrypoints.closed.address=127.0.0.1:8181
            - --providers.file.directory=/route
            - --entrypoints.pulse.address=127.0.0.1:8182
            - --ping.entrypoint=pulse
            - --api=false
            - --log.level=ERROR
            - --serverstransport.forwardingtimeouts.dialtimeout=3s
          livenessProbe:
            exec: {command: [wget, -q, -O, /dev/null, 'http://127.0.0.1:8182/ping']}
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            exec: {command: [sh, -ec, 'wget -q -O /dev/null --header="Host: inform.sch1357.ru" http://127.0.0.1:8181/api/health']}
            periodSeconds: 30
            timeoutSeconds: 8
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: routes, mountPath: /route, readOnly: true}]
      volumes: [{name: routes, configMap: {name: closed-health}}]
{{- end }}
