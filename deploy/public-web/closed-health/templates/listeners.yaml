{{- $catalog := required "entrance catalog required" .Values.replicas -}}
{{- if ne (dig "schoolbot" "inform.sch1357.ru" "tlsSourceName" "" .Values.hosts) "schoolbot-tls" }}{{ fail "expected ordinary Schoolbot owner" }}{{ end }}
{{- $host := "www.alchemmist.xyz" -}}
{{- $ing := .Values.ingress | default dict -}}
{{- $svc := .Values.service | default dict -}}
{{- $pin := dig "blog" $host (dict) .Values.hosts -}}
{{- $blog := and (eq (get $pin "dns") "managed") (eq (get $pin "tlsSourceName") "blog-tls") (or (not (hasKey $pin "route")) (eq (get $pin "route") "web")) (kindIs "bool" $ing.publicWeb) $ing.publicWeb (eq $ing.className "traefik") (kindIs "slice" $ing.hosts) (has $host $ing.hosts) (eq $ing.tlsSecretName "blog-tls") (eq (toJson $svc.port) "80") (eq (toJson $svc.targetPort) "8080") -}}
{{- $fqPin := dig "format-quorum" "fq.alchemmist.xyz" (dict) .Values.hosts -}}
{{- $fq := and (kindIs "bool" .Values.closedFormatQuorum) .Values.closedFormatQuorum (deepEqual $fqPin (dict "dns" "managed" "tlsSourceName" "format-quorum-tls")) -}}
{{- $wikiPin := dig "wiki" "wiki.socrat.alchemmist.xyz" (dict) .Values.hosts -}}
{{- $wiki := and (kindIs "bool" .Values.closedWiki) .Values.closedWiki (deepEqual $wikiPin (dict "dns" "managed" "tlsSourceName" "wiki-tls")) -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: schoolbot}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: schoolbot, app.kubernetes.io/name: schoolbot}}
      ports: [{port: 8000, protocol: TCP}]
{{- if $blog }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: blog}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: blog, app.kubernetes.io/name: blog}}
      ports: [{port: 8080, protocol: TCP}]
{{- end }}
{{- if $fq }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: format-quorum}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: format-quorum, app.kubernetes.io/name: format-quorum}}
      ports: [{port: 3000, protocol: TCP}]
{{- end }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: closed-health-wiki
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {matchLabels: {app: closed-health}}
  policyTypes: [Egress]
{{- if $wiki }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: wiki}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: wiki-runtime, app.kubernetes.io/name: hugo-docs-wiki}}
      ports: [{port: 8080, protocol: TCP}]
{{- else }}
  egress: []
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: closed-health, namespace: {{ .Release.Namespace }}}
data:
  dynamic.yaml: |
    http:
      routers:
        health:
          entryPoints: [closed]
          rule: 'Host(`inform.sch1357.ru`) && Method(`GET`) && Path(`/api/health`)'
          service: schoolbot
{{- if $blog }}
        www-blog:
          entryPoints: [closed]
          rule: 'Host(`{{ $host }}`) && PathPrefix(`/`)'
          service: www-blog
{{- end }}
{{- if $fq }}
        format-quorum:
          entryPoints: [closed]
          rule: 'Host(`fq.alchemmist.xyz`) && PathPrefix(`/`)'
          service: format-quorum
{{- end }}
{{- if $wiki }}
        wiki:
          entryPoints: [closed]
          rule: 'Host(`wiki.socrat.alchemmist.xyz`) && PathPrefix(`/`)'
          service: wiki
{{- end }}
      services:
{{- if $wiki }}
        wiki:
          loadBalancer:
            servers: [{url: 'http://wiki-runtime-wiki.wiki.svc.cluster.local:8080'}]
{{- end }}
{{- if $fq }}
        format-quorum:
          loadBalancer:
            servers: [{url: 'http://format-quorum.format-quorum.svc.cluster.local:80'}]
{{- end }}
{{- if $blog }}
        www-blog:
          loadBalancer:
            servers: [{url: 'http://blog.blog.svc.cluster.local:80'}]
{{- end }}
        schoolbot:
          loadBalancer:
            servers: [{url: 'http://schoolbot.schoolbot.svc.cluster.local:80'}]
{{- range $name, $instance := $catalog }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: closed-health-{{ $name }}, namespace: {{ $.Release.Namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: closed-health, entrance: {{ $name }}}}
  template:
    metadata: {labels: {app: closed-health, entrance: {{ $name }}}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: {{ $instance.node }}}
      {{- if eq $name "moscow" }}
      tolerations: [{key: homelab.io/bootstrap, operator: Equal, value: 'true', effect: NoSchedule}]
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: listener
          image: rancher/mirrored-library-traefik@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
          args:
            - --entrypoints.closed.address=127.0.0.1:8181
            - --providers.file.directory=/route
            - --entrypoints.pulse.address=127.0.0.1:8182
            - --ping.entrypoint=pulse
            - --api=false
            - --log.level=ERROR
            - --serverstransport.forwardingtimeouts.dialtimeout=3s
          livenessProbe:
            exec: {command: [wget, -q, -O, /dev/null, 'http://127.0.0.1:8182/ping']}
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            exec: {command: [sh, -ec, 'wget -q -O /dev/null --header="Host: inform.sch1357.ru" http://127.0.0.1:8181/api/health']}
            periodSeconds: 30
            timeoutSeconds: 8
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: routes, mountPath: /route, readOnly: true}]
      volumes: [{name: routes, configMap: {name: closed-health}}]
{{- end }}
