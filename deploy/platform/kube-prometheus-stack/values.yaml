alertmanager:
  alertmanagerSpec:
    secrets:
    - spi-alert-ingress
    nodeSelector:
      kubernetes.io/hostname: socrat-1
    replicas: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: local-path
  config:
    global:
      resolve_timeout: 5m
    receivers:
    - name: socrat-bot
      webhook_configs:
      - url: https://n8n.socrat.alchemmist.xyz/webhook/socrat-alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/spi-alert-ingress/token
    route:
      group_by:
      - namespace
      - alertname
      group_interval: 5m
      group_wait: 30s
      receiver: socrat-bot
      repeat_interval: 12h
      routes: []
defaultRules:
  additionalRuleAnnotations:
    KubeCPUOvercommit:
      rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
    KubeMemoryOvercommit:
      rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
    KubeNodeNotReady:
      rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{
        $labels.node }}
    KubeNodeUnreachable:
      rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{
        $labels.node }}
    KubePodCrashLooping:
      rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{
        $labels.namespace }}/{{ $labels.pod }}
    KubePodNotReady:
      rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{
        $labels.namespace }}/{{ $labels.pod }}
  disabled:
    # Stock rule requires every workload to survive loss of the largest node.
    # socrat-0 holds most of the RAM; its loss sheds noncritical workloads.
    # The replacement rule alerts only when requests exceed all nodes together.
    KubeMemoryOvercommit: true
    KubeNodeNotReady: true
    KubeNodePressure: true
    KubeletClientCertificateExpiration: true
    KubeletClientCertificateRenewalErrors: true
    KubeletServerCertificateExpiration: true
    KubeletServerCertificateRenewalErrors: true
    NodeBondingDegraded: true
    NodeRAIDDegraded: true
    NodeRAIDDiskFailure: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
additionalPrometheusRulesMap:
  homelab-memory-overcommit:
    groups:
      - name: homelab-memory-overcommit
        rules:
          - alert: KubeMemoryOvercommit
            annotations:
              description: Cluster memory requests exceed the allocatable memory of all nodes by {{ $value | humanize }} bytes. Pods will stay Pending. Loss of socrat-0 is an accepted hardware limit and is not part of this check.
              summary: Cluster memory requests exceed total allocatable memory.
              rancher_url: https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubememoryovercommit
            expr: |
              sum(namespace_memory:kube_pod_container_resource_requests:sum{})
              - sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"}) > 0
            for: 10m
            labels:
              severity: warning
grafana:
  admin:
    existingSecret: socrat-grafana-admin
    passwordKey: admin-password
    userKey: admin-user
  defaultDashboardsEnabled: false
  deploymentStrategy:
    type: Recreate
  env:
    GOMEMLIMIT: 1GiB
  extraConfigmapMounts:
  - configMap: socrat-branding
    mountPath: /usr/share/grafana/public/img/socrat
    name: socrat-branding
    readOnly: true
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    auth.anonymous:
      enabled: true
      org_role: Viewer
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/socrat-overview.json
    security:
      allow_embedding: true
    server:
      domain: grafana.socrat.alchemmist.xyz
      enforce_domain: false
      root_url: https://grafana.socrat.alchemmist.xyz/
      serve_from_sub_path: false
    users:
      allow_sign_up: false
      default_theme: dark
  ingress:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: socrat-1
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 1Gi
    storageClassName: local-path
    type: pvc
  podAnnotations:
    homelab.alchemmist.xyz/dashboard-language: en
  replicas: 1
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: 50m
      memory: 512Mi
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        allowUiUpdates: true
        foldersFromFilesStructure: true
      searchNamespace: ALL
    datasources:
      url: http://thanos-query.cattle-monitoring-system.svc.cluster.local:9090
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 96Mi
kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: socrat-1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 64Mi
kubeApiServer:
  serviceMonitor:
    relabelings:
    - action: keep
      regex: 10\.250\.0\.(1|3|5):6443
      sourceLabels:
      - __address__
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubelet:
  serviceMonitor:
    insecureSkipVerify: false
    metricRelabelings:
    - action: drop
      regex: (192\.168\.0\.(23|24)|10\.250\.0\.5):10250;(apiserver|etcd|scheduler|workqueue|kubeproxy)_.*
      sourceLabels:
      - instance
      - __name__
prometheus:
  prometheusSpec:
    disableCompaction: true
    enableOTLPReceiver: true
    evaluationInterval: 30s
    nodeSelector:
      kubernetes.io/hostname: socrat-0
    podMonitorNamespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
        - cattle-monitoring-system
        - llm
    podMonitorSelector:
      matchLabels:
        homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
    probeNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
    probeSelector:
      matchLabels:
        homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
    replicas: 1
    resources:
      limits:
        memory: 8Gi
      requests:
        cpu: 500m
        memory: 4Gi
    retention: 12h
    ruleNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    scrapeConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
    scrapeConfigSelector:
      matchLabels:
        homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
    scrapeInterval: 5s
    scrapeTimeout: 4s
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
    serviceMonitorSelector:
      matchLabels:
        homelab.alchemmist.xyz/scrape-owner: retired-legacy-prometheus
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: local-path
    thanos:
      image: quay.io/thanos/thanos:v0.42.4
      objectStorageConfig:
        existingSecret:
          key: objstore.yml
          name: thanos-objstore-raw
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
      volumeMounts:
      - mountPath: /var/lib/socrat-thanos
        name: thanos-data
    volumes:
    - hostPath:
        path: /var/lib/socrat-thanos
        type: Directory
      name: thanos-data
    - name: otel-config
      configMap:
        name: otel-cluster-config
    - name: otel-source-auth
      secret:
        secretName: otel-source-auth
        defaultMode: 288
    - name: otel-source-tls
      secret:
        secretName: otel-source-auth
        defaultMode: 288
        items:
        - key: tls-0
          path: 0_cattle-monitoring-system_kube-prometheus-stack-admission_ca
        - key: tls-1
          path: 1_cattle-monitoring-system_kube-root-ca.crt_ca.crt
    - name: otel-tls
      secret:
        secretName: otel-tls-cluster
        defaultMode: 288
        items:
        - key: ca.crt
          path: ca.crt
        - key: tls.crt
          path: server.crt
        - key: tls.key
          path: server.key
        - key: tls.crt
          path: client.crt
        - key: tls.key
          path: client.key
    tsdb:
      outOfOrderTimeWindow: 30m
    walCompression: true
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true
prometheus-node-exporter:
  env:
    DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
  extraArgs:
  - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  - --collector.systemd
  - --collector.systemd.enable-restarts-metrics
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 24Mi
  service:
    listenOnAllInterfaces: false
prometheusOperator:
  admissionWebhooks:
    patch:
      nodeSelector:
        kubernetes.io/hostname: socrat-1
      resources:
        limits:
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
  nodeSelector:
    kubernetes.io/hostname: socrat-1
  prometheusConfigReloader:
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 30m
      memory: 128Mi
