---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redisinsight}
spec:
  podSelector: {matchLabels: {app: redisinsight}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 4180, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8443, protocol: TCP}]
    - to:
        - podSelector: {matchLabels: {app: redis-ha-haproxy, release: redis-common}}
      ports: [{port: 6379, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redisinsight-to-writer}
spec:
  podSelector: {matchLabels: {app: redis-ha-haproxy, release: redis-common}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: redisinsight}}}]
      ports: [{port: 6379, protocol: TCP}]
...
