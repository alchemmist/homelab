{{- if .Values.grafanaPolicyProxy.enabled }}
{{- if not (regexMatch "^docker.io/library/nginx:.+@sha256:[a-f0-9]{64}$" .Values.grafanaPolicyProxy.image) }}
{{- fail "Grafana policy proxy requires a verified immutable stock nginx image" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-web-grafana-policy
  namespace: identity
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
data:
  nginx.conf: |
{{ .Files.Get "files/grafana-policy.conf" | indent 4 }}
  traffic-light-inset.js: |
{{ .Files.Get "files/traffic-light-inset.js" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web-grafana-proxy
  namespace: identity
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  replicas: 1
  selector: {matchLabels: {app: public-web-grafana-proxy}}
  template:
    metadata:
      labels: {app: public-web-grafana-proxy}
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/grafana-policy.conf") (.Files.Get "files/traffic-light-inset.js") | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: socrat-0}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: policy
          image: {{ .Values.grafanaPolicyProxy.image }}
          command: [nginx, '-g', 'daemon off;']
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 15}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: config, mountPath: /etc/nginx/traffic-light-inset.js, subPath: traffic-light-inset.js, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: public-web-grafana-policy}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: public-web-grafana-proxy
  namespace: identity
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  selector: {app: public-web-grafana-proxy}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
