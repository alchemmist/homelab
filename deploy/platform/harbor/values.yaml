---
# Runtime credentials and signing keys are preserved in existing cluster Secrets.
externallyManagedRuntimeSecrets: true
core:
  image:
    tag: v2.15.4@sha256:7d2ba5304a729887cdec7cb222a82b500278423de230ae5150c386a6c332b112
  extraEnvVars:
    - name: CONFIG_OVERWRITE_JSON
      valueFrom:
        secretKeyRef:
          name: socrat-authentik-harbor
          key: config-json
  nodeSelector:
    kubernetes.io/hostname: socrat-0
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1Gi
    requests:
      cpu: 100m
      ephemeral-storage: 64Mi
      memory: 256Mi
database:
  internal:
    initContainer:
      migrator:
        resources:
          limits:
            ephemeral-storage: 1Gi
            memory: 256Mi
          requests:
            cpu: 50m
            ephemeral-storage: 64Mi
            memory: 128Mi
      permissions:
        resources:
          limits:
            ephemeral-storage: 1Gi
            memory: 256Mi
          requests:
            cpu: 50m
            ephemeral-storage: 64Mi
            memory: 128Mi
    nodeSelector:
      kubernetes.io/hostname: socrat-0
    resources:
      limits:
        ephemeral-storage: 1Gi
        memory: 1Gi
      requests:
        cpu: 100m
        ephemeral-storage: 64Mi
        memory: 512Mi
existingSecretAdminPassword: harbor-bootstrap
existingSecretSecretKey: harbor-bootstrap
expose:
  ingress:
    labels:
      homelab.alchemmist.xyz/public-web: 'true'
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    className: traefik
    hosts:
      core: harbor.socrat.alchemmist.xyz
  tls:
    certSource: secret
    enabled: true
    secret:
      secretName: harbor-tls
  type: ingress
externalURL: https://harbor.socrat.alchemmist.xyz
jobservice:
  image:
    tag: v2.15.4@sha256:f143578ef30e2be5c48873298257ed0fca31545025958c534e536a06765d2b82
  jobLoggers:
    - stdout
  maxJobWorkers: 2
  nodeSelector:
    kubernetes.io/hostname: socrat-0
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1Gi
    requests:
      cpu: 100m
      ephemeral-storage: 64Mi
      memory: 256Mi
metrics:
  enabled: false
persistence:
  enabled: true
  persistentVolumeClaim:
    database:
      size: 5Gi
      storageClass: local-path
    redis:
      size: 1Gi
      storageClass: local-path
    registry:
      size: 100Gi
      storageClass: local-path
  resourcePolicy: keep
portal:
  image:
    tag: v2.15.4@sha256:01edf478505b21dba23a83c095f6ecac0c1e705690093edbab41e9a4d6754a75
  nodeSelector:
    kubernetes.io/hostname: socrat-0
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 256Mi
    requests:
      cpu: 50m
      ephemeral-storage: 64Mi
      memory: 64Mi
redis:
  internal:
    image:
      tag: v2.15.4@sha256:bb022e8f236f56f53cee7bb1f609595e497da67d829048e0af2284f97e6eb54f
    nodeSelector:
      kubernetes.io/hostname: socrat-0
    resources:
      limits:
        ephemeral-storage: 1Gi
        memory: 512Mi
      requests:
        cpu: 50m
        ephemeral-storage: 64Mi
        memory: 128Mi
registry:
  controller:
    image:
      tag: v2.15.4@sha256:30bd1ace4e3bb390d75b84673f98ddb4a69fcc6d116932ea764391df01943fb7
    resources:
      limits:
        ephemeral-storage: 1Gi
        memory: 512Mi
      requests:
        cpu: 50m
        ephemeral-storage: 64Mi
        memory: 128Mi
  nodeSelector:
    kubernetes.io/hostname: socrat-0
  registry:
    image:
      tag: v2.15.4@sha256:dc0cb388a6445c69c8a0c406679290d2991c9698833d9e6e86a23bdfaf2f83c3
    resources:
      limits:
        ephemeral-storage: 1Gi
        memory: 1Gi
      requests:
        cpu: 100m
        ephemeral-storage: 64Mi
        memory: 256Mi
trivy:
  image:
    tag: v2.15.4@sha256:813ca81b4a4ea0f44f5fa81cca2645eeb58d4b1f6c66b428df9d506174bb71d9
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
updateStrategy:
  type: Recreate
...
