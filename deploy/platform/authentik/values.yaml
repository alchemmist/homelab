---
authentik:
  error_reporting:
    enabled: false
    send_pii: false
  existingSecret:
    secretName: authentik-runtime
geoip:
  enabled: false
global:
  env:
    - {name: AUTHENTIK_POSTGRESQL__HOST, value: pg-critical-rw.postgres.svc.cluster.local}
    - {name: AUTHENTIK_POSTGRESQL__SSLMODE, value: verify-full}
    - {name: AUTHENTIK_POSTGRESQL__SSLROOTCERT, value: /etc/pg-critical/ca.crt}
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom: {secretKeyRef: {name: authentik-pg-critical, key: password}}
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  image:
    digest: sha256:da89d8338a3b1889800eb033fd61f8d43f7aa9a1c5a042cb5e03d891b1f0c56c
    tag: 2026.8.6
  # Do not bypass pressure, maintenance or other administrative taints.
  tolerations:
    - {key: homelab.io/bootstrap, operator: Equal, value: "true", effect: NoSchedule}
  securityContext:
    fsGroup: 1000
  volumeMounts:
    - {name: pg-critical-ca, mountPath: /etc/pg-critical, readOnly: true}
  volumes:
    - {name: pg-critical-ca, secret: {secretName: pg-critical-ca}}
postgresql:
  enabled: false
server:
  # Both platform manifests of the pinned image start as numeric UID 1000.
  containerSecurityContext:
    runAsNonRoot: true
  # Base64 JSON: {"options":"-c jit=off"}. Avoid compiling the wide
  # identification-stage source lookup on each web request. Web sessions only.
  env:
    - {name: AUTHENTIK_POSTGRESQL__CONN_OPTIONS, value: eyJvcHRpb25zIjoiLWMgaml0PW9mZiJ9}
  # Remove a slow backend from routing on the normal readiness budget. Avoid
  # recycling its warm workers during a transient shared latency spike.
  livenessProbe:
    timeoutSeconds: 8
    failureThreshold: 9
  affinity:
    nodeAffinity: &preferredNodes
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [socrat-0, socrat-1, socrat-5]}
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/component: server
  pdb: {enabled: true, minAvailable: 2}
  automountServiceAccountToken: false
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
    enabled: true
    hosts:
      - auth.socrat.alchemmist.xyz
    ingressClassName: traefik
    tls:
      - hosts:
          - auth.socrat.alchemmist.xyz
        secretName: authentik-tls
  replicas: 3
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1536Mi
    requests:
      cpu: 500m
      ephemeral-storage: 256Mi
      memory: 768Mi
  serviceAccountName: identity-runtime
serviceAccount:
  create: false
worker:
  # Both platform manifests of the pinned image start as numeric UID 1000.
  containerSecurityContext:
    runAsNonRoot: true
  affinity:
    nodeAffinity: *preferredNodes
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/component: worker
  pdb: {enabled: true, minAvailable: 1}
  automountServiceAccountToken: false
  replicas: 2
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1536Mi
    requests:
      cpu: 100m
      ephemeral-storage: 256Mi
      memory: 768Mi
  serviceAccountName: identity-runtime
...
