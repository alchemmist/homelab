---
authentik:
  error_reporting:
    enabled: false
    send_pii: false
  existingSecret:
    secretName: authentik-runtime
geoip:
  enabled: false
global:
  env:
    - {name: AUTHENTIK_POSTGRESQL__HOST, value: pg-critical-rw.postgres.svc.cluster.local}
    - {name: AUTHENTIK_POSTGRESQL__SSLMODE, value: verify-full}
    - {name: AUTHENTIK_POSTGRESQL__SSLROOTCERT, value: /etc/pg-critical/ca.crt}
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom: {secretKeyRef: {name: authentik-pg-critical, key: password}}
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  image:
    tag: 2026.8.5
  affinity:
    podAntiAffinity: soft
    nodeAffinity:
      type: soft
      matchExpressions:
      - {key: kubernetes.io/hostname, operator: In, values: [socrat-0, socrat-5, socrat-2]}
  securityContext:
    fsGroup: 1000
  volumeMounts:
  - {name: pg-critical-ca, mountPath: /etc/pg-critical, readOnly: true}
  volumes:
  - {name: pg-critical-ca, secret: {secretName: pg-critical-ca}}
postgresql:
  enabled: false
server:
  pdb: {enabled: true, minAvailable: 2}
  automountServiceAccountToken: false
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
    enabled: true
    hosts:
    - auth.socrat.alchemmist.xyz
    ingressClassName: traefik
    tls:
    - hosts:
      - auth.socrat.alchemmist.xyz
      secretName: authentik-tls
  replicas: 3
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1536Mi
    requests:
      cpu: 100m
      ephemeral-storage: 256Mi
      memory: 768Mi
  serviceAccountName: identity-runtime
serviceAccount:
  create: false
worker:
  automountServiceAccountToken: false
  replicas: 1
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1536Mi
    requests:
      cpu: 100m
      ephemeral-storage: 256Mi
      memory: 768Mi
  serviceAccountName: identity-runtime
...
