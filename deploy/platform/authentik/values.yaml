additionalObjects:
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: authentik-server-isolation
    namespace: identity
  spec:
    egress:
    - ports:
      - port: 5432
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: postgres
        podSelector:
          matchLabels:
            cnpg.io/cluster: pg-critical
    - ports:
      - port: 6379
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: redis
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    - ports:
      - port: 443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 0.0.0.0/0
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
      ports:
      - port: 9000
        protocol: TCP
      - port: 9443
        protocol: TCP
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cattle-monitoring-system
      ports:
      - port: 9300
        protocol: TCP
    podSelector:
      matchLabels:
        app.kubernetes.io/component: server
    policyTypes:
    - Ingress
    - Egress
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: authentik-worker-isolation
    namespace: identity
  spec:
    egress:
    - ports:
      - port: 5432
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: postgres
        podSelector:
          matchLabels:
            cnpg.io/cluster: pg-critical
    - ports:
      - port: 6379
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: redis
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    - ports:
      - port: 443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 0.0.0.0/0
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cattle-monitoring-system
      ports:
      - port: 9300
        protocol: TCP
    podSelector:
      matchLabels:
        app.kubernetes.io/component: worker
    policyTypes:
    - Ingress
    - Egress
authentik:
  error_reporting:
    enabled: false
    send_pii: false
  existingSecret:
    secretName: authentik-runtime
geoip:
  enabled: false
global:
  deploymentStrategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  env:
  - name: AUTHENTIK_POSTGRESQL__HOST
    value: pg-critical-rw.postgres.svc.cluster.local
  - name: AUTHENTIK_POSTGRESQL__SSLMODE
    value: verify-full
  - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
    value: /etc/pg-critical/ca.crt
  - name: AUTHENTIK_POSTGRESQL__PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: authentik-pg-critical
  image:
    digest: sha256:da89d8338a3b1889800eb033fd61f8d43f7aa9a1c5a042cb5e03d891b1f0c56c
    tag: 2026.8.6
  securityContext:
    fsGroup: 1000
  tolerations:
  - effect: NoSchedule
    key: homelab.io/bootstrap
    operator: Equal
    value: 'true'
  volumeMounts:
  - mountPath: /etc/pg-critical
    name: pg-critical-ca
    readOnly: true
  - mountPath: /tmp
    name: tmp
  volumes:
  - name: pg-critical-ca
    secret:
      secretName: pg-critical-ca
  - emptyDir:
      sizeLimit: 128Mi
    name: tmp
postgresql:
  enabled: false
server:
  affinity:
    nodeAffinity: &id001
      preferredDuringSchedulingIgnoredDuringExecution:
      - preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - socrat-0
            - socrat-1
            - socrat-5
        weight: 80
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: authentik
        topologyKey: kubernetes.io/hostname
  automountServiceAccountToken: false
  containerSecurityContext: &id002
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  env:
  - name: AUTHENTIK_POSTGRESQL__CONN_OPTIONS
    value: eyJvcHRpb25zIjoiLWMgaml0PW9mZiJ9
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
    enabled: true
    hosts:
    - auth.socrat.alchemmist.xyz
    ingressClassName: traefik
    tls:
    - hosts:
      - auth.socrat.alchemmist.xyz
      secretName: authentik-tls
  livenessProbe:
    failureThreshold: 9
    timeoutSeconds: 8
  pdb:
    enabled: true
    minAvailable: 2
  replicas: 3
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1536Mi
    requests:
      cpu: 500m
      ephemeral-storage: 256Mi
      memory: 768Mi
  serviceAccountName: identity-runtime
serviceAccount:
  create: false
worker:
  affinity:
    nodeAffinity: *id001
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: worker
            app.kubernetes.io/instance: authentik
        topologyKey: kubernetes.io/hostname
  automountServiceAccountToken: false
  containerSecurityContext: *id002
  pdb:
    enabled: true
    minAvailable: 1
  replicas: 2
  resources:
    limits:
      ephemeral-storage: 1Gi
      memory: 1536Mi
    requests:
      cpu: 100m
      ephemeral-storage: 256Mi
      memory: 768Mi
  serviceAccountName: identity-runtime
