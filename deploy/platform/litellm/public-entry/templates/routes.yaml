{{- range .Values.routes }}
{{- $binding := printf "%s|%s|%s|%v|%s" .host .namespace .service .port .authorization }}
{{- if not (has $binding (list "litellm.socrat.alchemmist.xyz|llm|litellm|4000|native-oidc")) }}
{{- fail "Unreviewed direct browser route: native authentication or explicit public access required" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-browser
  namespace: {{ .namespace }}
  labels:
    homelab.alchemmist.xyz/public-web: reviewed
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.issuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .host | quote }}]
      secretName: public-web-{{ .name }}-tls
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port: {number: {{ .port }}}
{{- end }}
