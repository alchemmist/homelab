db:
  database: litellm
  deployStandalone: false
  endpoint: litellm-postgres.llm.svc.cluster.local
  secret:
    name: litellm-db
    passwordKey: password
    usernameKey: username
  useExisting: true
envVars:
  # Keep the original runtime schema-update fence even with the hook disabled.
  DISABLE_SCHEMA_UPDATE: "true"
  FORWARDED_ALLOW_IPS: 127.0.0.1,10.42.0.0/16,10.250.0.0/24
  LITELLM_TELEMETRY: "False"
  PROXY_BASE_URL: https://llm.alchemmist.xyz
environmentSecrets:
- litellm-env
extraEnvVars:
- name: VENICE_BRIDGE_API_KEY
  valueFrom:
    secretKeyRef:
      name: venice-bridge-upstream
      key: api-key
- name: VLLM_API_KEY
  valueFrom:
    secretKeyRef:
      key: api-key
      name: vllm-api
- name: DEEPSEEK_PROXY_API_KEY
  valueFrom:
    secretKeyRef:
      key: api-key
      name: free-deepseek-upstream
- name: GENERIC_CLIENT_ID
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_CLIENT_ID
      optional: true
- name: GENERIC_CLIENT_SECRET
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_CLIENT_SECRET
      optional: true
- name: GENERIC_AUTHORIZATION_ENDPOINT
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_AUTHORIZATION_ENDPOINT
      optional: true
- name: GENERIC_TOKEN_ENDPOINT
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_TOKEN_ENDPOINT
      optional: true
- name: GENERIC_USERINFO_ENDPOINT
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_USERINFO_ENDPOINT
      optional: true
- name: GENERIC_SCOPE
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_SCOPE
      optional: true
- name: GENERIC_CLIENT_USE_PKCE
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_CLIENT_USE_PKCE
      optional: true
- name: GENERIC_USER_ID_ATTRIBUTE
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_USER_ID_ATTRIBUTE
      optional: true
- name: GENERIC_USER_EMAIL_ATTRIBUTE
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_USER_EMAIL_ATTRIBUTE
      optional: true
- name: GENERIC_USER_ROLE_ATTRIBUTE
  valueFrom:
    secretKeyRef:
      name: socrat-authentik-litellm
      key: GENERIC_USER_ROLE_ATTRIBUTE
      optional: true
fullnameOverride: litellm
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/berriai/litellm
  tag: 1.105.1
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  className: traefik
  enabled: true
  hosts:
  - host: llm.alchemmist.xyz
    paths:
    - path: /
      pathType: Prefix
  tls:
  - hosts:
    - llm.alchemmist.xyz
    secretName: litellm-public-tls
masterkeySecretKey: LITELLM_MASTER_KEY
masterkeySecretName: litellm-env
migrationJob:
  # Last migration succeeded and its Job was deleted; do not recreate it for placement.
  # Chart fails closed on image changes until normal upgrade migrations are reviewed.
  placementOnlyImage: ghcr.io/berriai/litellm:1.105.1
  enabled: false
  hooks:
    argocd:
      enabled: false
    helm:
      enabled: true
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
# Peer15 relay passed repeated native WG/Pod bulk tests; placement-only retry.
nodeSelector:
  kubernetes.io/hostname: socrat-5
numWorkers: 1
proxy_config:
  general_settings:
    cancel_on_disconnect: true
    disable_env_credential_login: true
    master_key: os.environ/LITELLM_MASTER_KEY
    # UI "Logs" request/response bodies. Applies only to requests after rollout.
    store_model_in_db: true
    store_prompts_in_spend_logs: true
  litellm_settings:
    callbacks:
    - prometheus
    num_retries: 0
    request_timeout: 7200
    require_auth_for_metrics_endpoint: true
  model_list:
  - litellm_params:
      api_base: http://vllm.llm.svc.cluster.local:8000/v1
      api_key: os.environ/VLLM_API_KEY
      model: openai/qwen3.8-27b
      stream_timeout: 7200
      timeout: 7200
    model_info:
      input_cost_per_token: 0
      max_input_tokens: 114688
      max_output_tokens: 16384
      output_cost_per_token: 0
    model_name: qwen3.8-27b
  # Four admitted calls = one browser generation plus at most three waiters.
  # Browser adapter: one shared page, buffered SSE, approximate token usage.
  # Zero synthetic price is not a measurement of Venice subscription credits.
  - model_name: v-deepseek-uc
    litellm_params:
      model: openai/venice-agentic-deepseek-v4.1-flash-uncensored
      api_base: http://venice-api.venice-api.svc.cluster.local:8080/v1
      api_key: os.environ/VENICE_BRIDGE_API_KEY
      timeout: 900
      stream_timeout: 900
      max_parallel_requests: 4
      num_retries: 0
    model_info:
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: o-deepseek
    litellm_params:
      model: openai/deepseek-chat
      api_base: http://free-deepseek-api.llm.svc.cluster.local:9655/v1
      api_key: os.environ/DEEPSEEK_PROXY_API_KEY
      timeout: 600
      stream_timeout: 600
      num_retries: 0
    model_info:
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0
redis:
  enabled: false
replicaCount: 1
resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 1Gi
serviceAccount:
  automount: false
  create: true
strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate
terminationGracePeriodSeconds: 7260

# Exact in-Pod IdP name only, with normal certificate/SNI verification.
hostAliases:
- ip: 10.43.218.222
  hostnames: [auth.socrat.alchemmist.xyz]
