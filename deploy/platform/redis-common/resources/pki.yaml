---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: redis-bootstrap}
spec: {selfSigned: {}}
...
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: redis-common-ca}
spec:
  isCA: true
  commonName: redis-common-ca
  secretName: redis-common-ca
  duration: 43800h
  issuerRef: {name: redis-bootstrap, kind: Issuer}
  usages: [cert sign, crl sign]
...
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: redis-common-ca}
spec: {ca: {secretName: redis-common-ca}}
...
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: redis-common-tls}
spec:
  secretName: redis-common-tls
  issuerRef: {name: redis-common-ca, kind: Issuer}
  dnsNames: [redis-common-haproxy.redis.svc.cluster.local]
  usages: [server auth, client auth, digital signature, key encipherment]
...
