applicationSet:
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 64Mi
configs:
  cm:
    oidc.config: |
      name: Authentik
      issuer: https://auth.socrat.alchemmist.xyz/application/o/argocd/
      clientID: socrat-argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes: [openid, profile, email, groups]
      requestedIDTokenClaims:
        groups:
          essential: true
    url: https://argocd.socrat.alchemmist.xyz
  params:
    server.insecure: true
  rbac:
    policy.csv: |
      g, homelab-owner, role:admin
      g, homelab-platform-operator, role:admin
      g, homelab-project-maintainer, role:readonly
      g, homelab-observer, role:readonly
    policy.default: role:readonly
    scopes: '[groups]'
controller:
  replicas: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
dex:
  enabled: false
global:
  nodeSelector:
    kubernetes.io/hostname: socrat-0
notifications:
  enabled: false
redis:
  image:
    repository: docker.io/library/redis
    tag: 8.2-alpine
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
redis-ha:
  enabled: false
repoServer:
  replicas: 1
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi
server:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
    controller: generic
    enabled: true
    hostname: argocd.socrat.alchemmist.xyz
    ingressClassName: traefik
    tls: true
  replicas: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    type: ClusterIP
