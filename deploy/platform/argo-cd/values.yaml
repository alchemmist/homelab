applicationSet:
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 64Mi
configs:
  cm:
    users.session.duration: 8h
    oidc.config: |
      name: Authentik
      issuer: https://auth.socrat.alchemmist.xyz/application/o/argocd/
      clientID: socrat-argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes: [openid, profile, email, groups, offline_access]
      refreshTokenThreshold: 60s
      requestedIDTokenClaims:
        groups:
          essential: true
    url: https://argocd.socrat.alchemmist.xyz
    accounts.mcp: apiKey
  params:
    server.insecure: false
  rbac:
    policy.csv: |
      g, homelab-owner, role:admin
      g, homelab-platform-operator, role:admin
      g, homelab-project-maintainer, role:readonly
      g, homelab-observer, role:readonly
      p, mcp, applications, sync, */*, allow
    policy.default: role:readonly
    scopes: '[groups]'
controller:
  replicas: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
dex:
  enabled: false
global:
  nodeSelector:
    kubernetes.io/hostname: socrat-0
notifications:
  enabled: false
redis:
  image:
    repository: docker.io/library/redis
    tag: 8.2-alpine
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
redis-ha:
  enabled: false
repoServer:
  replicas: 1
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi
server:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
    controller: generic
    enabled: true
    hostname: argocd.socrat.alchemmist.xyz
    ingressClassName: traefik
    tls: true
  replicas: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    type: ClusterIP
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: https
      traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-verified-tls@kubernetescrd

# Keep the verified transport managed by both bootstrap Helm and live GitOps.
extraObjects:
- apiVersion: traefik.io/v1alpha1
  kind: ServersTransport
  metadata:
    name: argocd-verified-tls
    namespace: argocd
    labels:
      homelab.alchemmist.xyz/edge-transport: argocd
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: argo-cd
      meta.helm.sh/release-namespace: argocd
  spec:
    serverName: argocd.socrat.alchemmist.xyz
    insecureSkipVerify: false
