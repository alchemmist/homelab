# Disable Fleet GitOps; Rancher MCM currently requires Fleet itself (v2.15.2).
# Full Fleet removal requires an explicit decision to disable Rancher MCM first.
features: "continuous-delivery=false"
antiAffinity: required
extraNodeSelectorTerms:
- key: kubernetes.io/hostname
  operator: In
  values:
  - socrat-0
  - socrat-5
hostname: rancher.socrat.alchemmist.xyz
ingress:
  enabled: false
  tls:
    source: letsEncrypt
letsEncrypt:
  email: antropophag@gmail.com
  ingress:
    class: traefik
nodeSelector:
  kubernetes.io/hostname: socrat-0
replicas: 2
resources:
  limits:
    memory: 3Gi
  requests:
    cpu: 250m
    memory: 1Gi

extraTolerations:
  - key: homelab.io/no-nfs
    operator: Equal
    value: "true"
    effect: NoSchedule

# Cold catalog restoration on the remote LXC must finish before startup checks
# hand over to the unchanged liveness/readiness probes. Keep a bounded 10m budget.
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
  timeoutSeconds: 5
