---
image:
  tag: v2.15.2@sha256:0c3d8e5702555b2bfd2ec3fe7a6e5f95484a28fcb9787c498db3e5b0f62652ea
preUpgrade:
  image:
    tag: v0.8.2@sha256:1eeed72d4eda486de13403c4ae6e9d29a0842edc35d0f4a8fb7b0dab79d04be9
postDelete:
  image:
    tag: v0.8.2@sha256:1eeed72d4eda486de13403c4ae6e9d29a0842edc35d0f4a8fb7b0dab79d04be9
# Disable Fleet GitOps; Rancher MCM currently requires Fleet itself (v2.15.2).
# Full Fleet removal requires an explicit decision to disable Rancher MCM first.
features: continuous-delivery=false
antiAffinity: preferred
extraNodeSelectorTerms:
  - key: kubernetes.io/hostname
    operator: In
    values:
      - socrat-5
hostname: rancher.socrat.alchemmist.xyz
ingress:
  enabled: false
  tls:
    source: letsEncrypt
letsEncrypt:
  email: antropophag@gmail.com
  ingress:
    class: traefik
# Single non-HA server; verified scoped issuer transport enables VM105 return.
replicas: 1
# Cold catalog restoration and CRD initialization can exceed two minutes.
# Keep health checks; permit up to ten minutes for an honest cold start.
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
  timeoutSeconds: 5
resources:
  limits:
    memory: 3Gi
  requests:
    cpu: 250m
    memory: 1Gi


# Use the existing image OS roots; SSL_CERT_DIR alone points at Rancher TLS files.
extraEnv:
  - name: SSL_CERT_FILE
    value: /var/lib/ca-certificates/ca-bundle.pem

hostAliases:
  - ip: 10.43.218.222
    hostnames: [auth.socrat.alchemmist.xyz]
...
