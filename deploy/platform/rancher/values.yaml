# Disable Fleet GitOps; Rancher MCM currently requires Fleet itself (v2.15.2).
# Full Fleet removal requires an explicit decision to disable Rancher MCM first.
features: "continuous-delivery=false"
antiAffinity: required
extraNodeSelectorTerms:
- key: kubernetes.io/hostname
  operator: In
  values:
  - socrat-1
hostname: rancher.socrat.alchemmist.xyz
ingress:
  enabled: false
  tls:
    source: letsEncrypt
letsEncrypt:
  email: antropophag@gmail.com
  ingress:
    class: traefik
# Single non-HA server;15Nov recovery returns it to1 until VM105 IdP routing is fixed.
replicas: 1
resources:
  limits:
    memory: 3Gi
  requests:
    cpu: 250m
    memory: 1Gi


# Use the existing image OS roots; SSL_CERT_DIR alone points at Rancher TLS files.
extraEnv:
  - name: SSL_CERT_FILE
    value: /var/lib/ca-certificates/ca-bundle.pem
