---
image:
  repository: harbor.socrat.alchemmist.xyz/homelab/schoolbot
  tag: unreleased
  digest: ""
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  port: 80
  targetPort: 8000
ingress:
  className: traefik
  host: bot.sch1357.ru
  tlsSecretName: schoolbot-tls
  clusterIssuer: letsencrypt-http01
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 768Mi }
imagePullSecrets:
  - schoolbot-harbor-pull
publicBaseUrl: https://bot.sch1357.ru
cookieSecure: true
adminUi: false
updateMode: polling
timezone: Europe/Moscow
# Secret is created in the cluster. DATABASE_URL is still a placeholder.
envSecretName: schoolbot-env
podSecurity:
  user: 10001
  group: 10001
attachments:
  size: 5Gi
...
