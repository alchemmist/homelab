---
image:
  repository: harbor.socrat.alchemmist.xyz/schoolbot/schoolbot
  tag: 72f11289b9401b80fe62e5a91c5ad9596daafb73
  digest: sha256:037868390bb8adcbfddc37c9152655b272ede5756cac9c70db901c2ae88b5d23
  pullPolicy: IfNotPresent
replicaCount: 1
# Temporary placement: the socrat-3 to socrat-5 database path is unreachable.
nodeSelector:
  kubernetes.io/hostname: socrat-0
service:
  port: 80
  targetPort: 8000
ingress:
  className: traefik
  host: inform.sch1357.ru
  tlsSecretName: schoolbot-tls
  clusterIssuer: letsencrypt-http01
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 768Mi}
imagePullSecrets:
  - schoolbot-harbor-pull
publicBaseUrl: https://inform.sch1357.ru
cookieSecure: true
# UI is only under adminUiPath. The pinned image reads ADMIN_UI_PATH.
adminUi: true
adminUiPath: /flvbybcnhfnbdyfzgfytkm
updateMode: polling
timezone: Europe/Moscow
# The operator creates basic-auth Secret schoolbot-db in namespace postgres.
# CNPG does not generate this password. Copy username and password into
# schoolbot-env. Percent-encode DATABASE_PASSWORD: Kubernetes inserts it into
# DATABASE_URL and does not encode reserved characters.
database:
  host: pg-internal-rw.postgres.svc.cluster.local
  port: 5432
  name: schoolbot
envSecretName: schoolbot-env
podSecurity:
  user: 10001
  group: 10001
attachments:
  size: 5Gi
...
