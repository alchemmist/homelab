      \ http1\n        servers:\n        - url: http://server.netbird-pilot.svc.cluster.local:80\n    management-h2c:\n\
      \      loadBalancer:\n        passHostHeader: true\n        serversTransport: h2c\n        servers:\n    \
      \    - url: h2c://server.netbird-pilot.svc.cluster.local:80\n    dashboard:\n      loadBalancer:\n       \
      \ passHostHeader: true\n        serversTransport: http1\n        servers:\n        - url: http://dashboard.netbird-pilot.svc.cluster.local:80\n\
      \  routers:\n    deny-setup:\n      entryPoints:\n      - web\n      rule: Path(`/api/setup`) || PathPrefix(`/api/setup/`)\
      \ || (PathPrefix(`/api/users/invites`)\n        && !(Path(`/api/users/invites`) && Method(`GET`))) || PathPrefix(`/oauth2/auth/local`)\n\
      \        || PathPrefix(`/oauth2/register`) || PathPrefix(`/oauth2/signup`)\n      priority: 1000\n      middlewares:\n\
      \      - deny-unclaimed-setup\n      service: management\n    grpc-management:\n      entryPoints:\n     \
      \ - h2c\n      priority: 200\n      service: management-h2c\n      rule: PathPrefix(`/management.ManagementService/`)\n\
      \    grpc-signal:\n      entryPoints:\n      - h2c\n      priority: 200\n      service: management-h2c\n \
      \     rule: PathPrefix(`/signalexchange.SignalExchange/`)\n    websocket-management:\n      entryPoints:\n\
      \      - web\n      priority: 200\n      service: management\n      rule: Path(`/ws-proxy/management`)\n \
      \   websocket-signal:\n      entryPoints:\n      - web\n      priority: 200\n      service: management\n \
      \     rule: Path(`/ws-proxy/signal`)\n    relay:\n      entryPoints:\n      - web\n      priority: 200\n \
      \     service: management\n      rule: Path(`/relay`)\n    api:\n      entryPoints:\n      - web\n      priority:\
      \ 100\n      service: management\n      rule: PathPrefix(`/api/`) || PathPrefix(`/oauth2/`)\n    dashboard:\n\
      \      entryPoints:\n      - web\n      priority: 1\n      service: dashboard\n      rule: PathPrefix(`/`)\n"
    static.yaml: "entryPoints:\n  web:\n    address: :8080\n    transport:\n      respondingTimeouts:\n        readTimeout:\
      \ 0s\n  h2c:\n    address: :8082\n    transport:\n      respondingTimeouts:\n        readTimeout: 0s\n  ping:\n\
      \    address: :8081\nproviders:\n  file:\n    filename: /etc/traefik/dynamic.yaml\nping:\n  entryPoint: ping\n\
      log:\n  level: INFO\n"
