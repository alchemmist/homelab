image:
  repository: netbirdio/dashboard
  tag: v2.96.0
  digest: sha256:340b13c00b84349572a2acc5605e907cb09250a9e6461c757097eabdb8e02f2c
nodes:
  socrat-0: 10.250.0.1
  socrat-1: 10.250.0.3
  socrat-2: 10.250.0.2
  socrat-3: 10.250.0.5
  socrat-5: 10.250.0.41
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: dashboard
    namespace: netbird-pilot
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: netbird-dashboard
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app: netbird-dashboard
      spec:
        automountServiceAccountToken: false
        containers:
        - env:
          - name: NETBIRD_MGMT_API_ENDPOINT
            value: https://netbird.socrat.alchemmist.xyz
          - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
            value: https://netbird.socrat.alchemmist.xyz
          - name: AUTH_AUDIENCE
            value: netbird-dashboard
          - name: AUTH_CLIENT_ID
            value: netbird-dashboard
          - name: AUTH_AUTHORITY
            value: https://netbird.socrat.alchemmist.xyz/oauth2
          - name: USE_AUTH0
            value: 'false'
          - name: AUTH_SUPPORTED_SCOPES
            value: openid profile email groups
          - name: AUTH_REDIRECT_URI
            value: /nb-auth
          - name: AUTH_SILENT_REDIRECT_URI
            value: /nb-silent-auth
          - name: LETSENCRYPT_DOMAIN
            value: none
          imagePullPolicy: IfNotPresent
          name: dashboard
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: '1'
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        dnsPolicy: ClusterFirst
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: socrat-0
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: server
    namespace: netbird-pilot
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: netbird-server
    strategy:
      type: Recreate
    template:
      metadata:
        annotations:
          kubectl.kubernetes.io/restartedAt: '2026-11-03T15:17:16+03:00'
        labels:
          app: netbird-server
      spec:
        automountServiceAccountToken: false
        containers:
        - args:
          - --config
          - /etc/netbird/config.yaml
          env:
          - name: NB_SETUP_PAT_ENABLED
            value: 'false'
          image: netbirdio/netbird-server:0.82.0@sha256:7b5b53b2dc8bc25639f791cf72d47cf86911894ff3f8a97cb79bab9be958109c
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 20
            successThreshold: 1
            tcpSocket:
              port: 9000
            timeoutSeconds: 1
          name: server
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          - containerPort: 3478
            name: stun
            protocol: UDP
          - containerPort: 9000
            name: health
            protocol: TCP
          - containerPort: 9090
            name: metrics
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /oauth2/.well-known/openid-configuration
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: '1'
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /etc/netbird
            name: config
            readOnly: true
          - mountPath: /var/lib/netbird
            name: data
        dnsPolicy: ClusterFirst
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: socrat-0
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 60
        volumes:
        - name: config
          secret:
            defaultMode: 256
            items:
            - key: config.yaml
              path: config.yaml
            secretName: netbird-runtime
        - name: data
          persistentVolumeClaim:
            claimName: server-data
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: stun
    namespace: netbird-pilot
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: netbird-stun
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app: netbird-stun
      spec:
        automountServiceAccountToken: false
        containers:
        - args:
          - -n
          - --stun-only
          - --no-auth
          - --no-tcp
          - --no-tls
          - --no-dtls
          - --no-cli
          - --no-tcp-relay
          - --relay-threads=1
          - --listening-port=3478
          - --listening-ip=109.120.141.60
          - --no-software-attribute
          - --log-file=stdout
          - --simple-log
          - --pidfile=/tmp/turnserver.pid
          command:
          - /usr/bin/turnserver
          image: coturn/coturn:4.7.0@sha256:a00afb5b4890de4df22bbe70379c6b316685dffee297d53cac1271dcb91fab93
          imagePullPolicy: IfNotPresent
          name: stun
          ports:
          - containerPort: 3478
            name: stun
            protocol: UDP
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 5m
              memory: 8Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - NET_BIND_SERVICE
              drop:
              - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /tmp
            name: tmp
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true
        nodeSelector:
          kubernetes.io/hostname: socrat-2
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext:
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        terminationGracePeriodSeconds: 30
        volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: tmp
