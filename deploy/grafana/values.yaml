---
# Canonical independently deployable stateless gateway image; no SPI worker rollout.
# Updated by deploy-to-socrat@v1, app=grafana, component=gateway.
gateway:
  repository: harbor.socrat.alchemmist.xyz/homelab/spi-triage
  tag: f7e712ec38d544b835c9f66114a8661767984007
  digest: sha256:90d4e03023fd4b043d58f0c42461d43fc2fcdc8a07bb24bf62177f6c9afe877c

# Accepted cold restore required; never initialize an empty replacement database.
grafana:
  replicas: 1
  env:
    # Bound concurrent dashboard reads on shared pg-common.
    GF_DATABASE_MAX_OPEN_CONN: "12"
    GF_DATABASE_MAX_IDLE_CONN: "6"
    GF_DATABASE_TYPE: postgres
    GF_DATABASE_HOST: pg-common-rw.postgres.svc.cluster.local:5432
    GF_DATABASE_NAME: grafana
    GF_DATABASE_USER: grafana
    GF_DATABASE_SSL_MODE: verify-full
    GF_DATABASE_CA_CERT_PATH: /etc/grafana/pg-ca/ca.crt
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef: {name: grafana-postgres, key: password}
  extraVolumes:
    - name: pg-common-ca
      configMap: {name: pg-common-ca}
  extraVolumeMounts:
    - {name: pg-common-ca, mountPath: /etc/grafana/pg-ca, readOnly: true}
  hostAliases:
    - ip: 10.43.218.222
      hostnames: [auth.socrat.alchemmist.xyz]
  extraInitContainers:
    - name: require-imported-grafana-db
      image: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:13f5dc1b42c5d96233724be976740df031136ca013f98a56a2877a62b362b453
      imagePullPolicy: IfNotPresent
      command: [sh, -ec]
      args:
        - |
          test "$(psql -XAtq -v ON_ERROR_STOP=1 -c "select exists(select 1 from resource where resource='dashboards') and exists(select 1 from org_user)")" = t
      env:
        - {name: PGHOST, value: pg-common-rw.postgres.svc.cluster.local}
        - {name: PGDATABASE, value: grafana}
        - {name: PGUSER, value: grafana}
        - {name: PGSSLMODE, value: verify-full}
        - {name: PGSSLROOTCERT, value: /etc/grafana/pg-ca/ca.crt}
        - {name: PGCONNECT_TIMEOUT, value: '5'}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: grafana-postgres, key: password}}
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {memory: 64Mi}
      volumeMounts:
        - name: pg-common-ca
          mountPath: /etc/grafana/pg-ca
          readOnly: true
...
