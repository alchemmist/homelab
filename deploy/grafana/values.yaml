---
# Canonical independently deployable stateless gateway image; no SPI worker rollout.
# Updated by deploy-to-socrat@v1, app=grafana, component=gateway.
gateway:
  repository: harbor.socrat.alchemmist.xyz/homelab/spi-triage
  tag: f7e712ec38d544b835c9f66114a8661767984007
  digest: sha256:90d4e03023fd4b043d58f0c42461d43fc2fcdc8a07bb24bf62177f6c9afe877c

# Accepted cold restore required; never initialize an empty replacement database.
grafana:
  replicas: 1
  hostAliases:
    - ip: 10.43.218.222
      hostnames: [auth.socrat.alchemmist.xyz]
  extraInitContainers:
    - name: require-existing-grafana-data
      image: docker.io/library/busybox:1.38.0
      imagePullPolicy: IfNotPresent
      command: [sh, -ec, test -s /var/lib/grafana/grafana.db]
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {memory: 16Mi}
      volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
          readOnly: true
...
