apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-runtime
  namespace: identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-data
  namespace: identity
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
  namespace: identity
spec:
  selector:
    app: authentik-postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres
  namespace: identity
spec:
  serviceName: authentik-postgres
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgres
  template:
    metadata:
      labels:
        app: authentik-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: socrat-0
      serviceAccountName: identity-runtime
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17.11-trixie
          args: ['-c', 'max_connections=150', '-c', 'shared_buffers=128MB']
          env:
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_DB
              value: authentik
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-runtime
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi}
            limits: {memory: 768Mi, ephemeral-storage: 1Gi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, authentik, -d, authentik]
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, authentik, -d, authentik]
            initialDelaySeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-postgres
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app: authentik-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
      ports:
        - protocol: TCP
          port: 5432
