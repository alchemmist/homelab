---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-runtime
  namespace: identity
automountServiceAccountToken: false
...
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-data
  namespace: identity
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
...
