---
# Single-node identity foundation, not HA. Preserve local break-glass service logins.
global:
  env:
    - {name: AUTHENTIK_POSTGRESQL__HOST, value: pg-critical-rw.postgres.svc.cluster.local}
    - {name: AUTHENTIK_POSTGRESQL__SSLMODE, value: verify-full}
    - {name: AUTHENTIK_POSTGRESQL__SSLROOTCERT, value: /etc/pg-critical/ca.crt}
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom: {secretKeyRef: {name: authentik-pg-critical, key: password}}
  image:
    tag: 2026.8.5
  nodeSelector:
    kubernetes.io/hostname: socrat-0
  deploymentStrategy:
    type: Recreate
  securityContext:
    fsGroup: 1000
  volumes:
    - {name: pg-critical-ca, secret: {secretName: pg-critical-ca}}
    - name: data
      persistentVolumeClaim:
        claimName: authentik-data
  volumeMounts:
    - {name: pg-critical-ca, mountPath: /etc/pg-critical, readOnly: true}
    - name: data
      mountPath: /data
authentik:
  existingSecret:
    secretName: authentik-runtime
  error_reporting:
    enabled: false
    send_pii: false
postgresql:
  enabled: false
serviceAccount:
  create: false
server:
  replicas: 1
  serviceAccountName: identity-runtime
  automountServiceAccountToken: false
  resources:
    requests: {cpu: 100m, memory: 768Mi, ephemeral-storage: 256Mi}
    limits: {memory: 1536Mi, ephemeral-storage: 1Gi}
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
    hosts: [auth.socrat.alchemmist.xyz]
    tls:
      - secretName: authentik-tls
        hosts: [auth.socrat.alchemmist.xyz]
worker:
  replicas: 1
  serviceAccountName: identity-runtime
  automountServiceAccountToken: false
  resources:
    requests: {cpu: 100m, memory: 768Mi, ephemeral-storage: 256Mi}
    limits: {memory: 1536Mi, ephemeral-storage: 1Gi}
geoip:
  enabled: false
...
