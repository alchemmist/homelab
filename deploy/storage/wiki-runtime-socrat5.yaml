# Apply only after the reviewed restore created this nonempty local directory.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wiki-runtime-socrat5
spec:
  capacity: { storage: 5Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local: { path: /mnt/files/homelab/wiki-runtime/data }
  claimRef: { namespace: wiki, name: wiki-runtime-socrat5 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [socrat-5]
...
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wiki-runtime-socrat5
  namespace: wiki
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
  storageClassName: ""
  volumeName: wiki-runtime-socrat5
...
