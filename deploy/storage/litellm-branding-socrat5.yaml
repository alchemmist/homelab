# Apply only after the reviewed restore created this nonempty local directory.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: litellm-branding-socrat5
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local: {path: /mnt/files/homelab/litellm-branding/data}
  claimRef: {namespace: llm, name: litellm-branding-socrat5}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [socrat-5]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-branding-socrat5
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
  storageClassName: ""
  volumeName: litellm-branding-socrat5
