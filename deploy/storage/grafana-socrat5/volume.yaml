# Restored and sealed cold before activation; old claim retained, never pruned.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-prometheus-stack-grafana
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.2.4
    helm.sh/chart: grafana-14.0.0
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: pvc-cd9b0a0f-2794-466e-9f48-52b9cc884b8d
...
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-socrat5
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local:
    path: /mnt/files/homelab/grafana/data
  claimRef:
    namespace: cattle-monitoring-system
    name: grafana-socrat5
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - socrat-5
...
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-socrat5
  namespace: cattle-monitoring-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: grafana-socrat5
