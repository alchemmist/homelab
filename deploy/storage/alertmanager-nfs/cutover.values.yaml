---
# Active: preserve the migrated PVC identity and its storage settings.
kube-prometheus-stack:
  alertmanager:
    alertmanagerSpec:
      replicas: 1
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [socrat-0, socrat-1]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [socrat-1]
      storage:
        volumeClaimTemplate:
          metadata:
            name: alert-state-nfs
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: nfs-shared
            resources:
              requests:
                storage: 1Gi
...
