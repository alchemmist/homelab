---
# Apply only after the reviewed restore created this nonempty local directory.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monori-back-socrat5
spec:
  capacity: {storage: 20Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local: {path: /mnt/files/homelab/monori/data}
  claimRef: {namespace: monori, name: monori-back-socrat5}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [socrat-5]
...
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monori-back-socrat5
  namespace: monori
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
  storageClassName: ""
  volumeName: monori-back-socrat5
...
---
# Apply only after the reviewed restore created this nonempty local directory.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monori-sync-socrat5
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local: {path: /mnt/files/homelab/monori/sync-debug}
  claimRef: {namespace: monori, name: monori-sync-socrat5}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [socrat-5]
...
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monori-sync-socrat5
  namespace: monori
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
  storageClassName: ""
  volumeName: monori-sync-socrat5
...
