---
# Apply only after the reviewed restore created this nonempty local directory.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: format-quorum-clang-versions-socrat5
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local: {path: /mnt/files/homelab/format-quorum/clang-versions}
  claimRef: {namespace: format-quorum, name: format-quorum-clang-versions-socrat5}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [socrat-5]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: format-quorum-clang-versions-socrat5
  namespace: format-quorum
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
  storageClassName: ""
  volumeName: format-quorum-clang-versions-socrat5
