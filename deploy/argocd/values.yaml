global:
  nodeSelector:
    kubernetes.io/hostname: socrat-0

# Browser sessions use native Authentik OIDC through the TLS ingress.
# Keep the built-in admin account as a break-glass login until an Authentik
# browser login and group authorization have been verified; disable it later.
configs:
  cm:
    url: https://argocd.socrat.alchemmist.xyz
    oidc.config: |
      name: Authentik
      issuer: https://auth.socrat.alchemmist.xyz/application/o/argocd/
      clientID: socrat-argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes: [openid, profile, email, groups]
      requestedIDTokenClaims:
        groups:
          essential: true
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, homelab-owner, role:admin
      g, homelab-platform-operator, role:admin
      g, homelab-project-maintainer, role:readonly
      g, homelab-observer, role:readonly
    scopes: '[groups]'
  params:
    server.insecure: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: true
    controller: generic
    ingressClassName: traefik
    hostname: argocd.socrat.alchemmist.xyz
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

notifications:
  enabled: false

dex:
  enabled: false

redis:
  image:
    repository: docker.io/library/redis
    tag: 8.2-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

redis-ha:
  enabled: false

# Do not enable automated sync, pruning, or self-heal globally. Each app will
# opt in after its ownership transfer and rollback path are validated.
