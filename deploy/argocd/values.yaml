global:
  nodeSelector:
    kubernetes.io/hostname: socrat-0

# Browser sessions use native Authentik OIDC through the TLS ingress.
# Keep the built-in admin account as a break-glass login until an Authentik
# browser login and group authorization have been verified; disable it later.
configs:
  cm:
    users.session.duration: 8h
    url: https://argocd.socrat.alchemmist.xyz
    oidc.config: |
      name: Authentik
      issuer: https://auth.socrat.alchemmist.xyz/application/o/argocd/
      clientID: socrat-argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes: [openid, profile, email, groups, offline_access]
      refreshTokenThreshold: 60s
      requestedIDTokenClaims:
        groups:
          essential: true
  rbac:
    policy.default: role:unassigned
    policy.csv: |
      g, homelab-owner, role:admin
      g, homelab-platform-operator, role:admin
      g, homelab-project-maintainer, role:readonly
      g, homelab-observer, role:readonly
      g, mcp, role:readonly
    scopes: '[groups]'
  params:
    server.insecure: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

server:
  replicas: 1
  service:
    type: ClusterIP
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: https
      traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-verified-tls@kubernetescrd
  ingress:
    enabled: true
    controller: generic
    ingressClassName: traefik
    hostname: argocd.socrat.alchemmist.xyz
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-http01
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

notifications:
  enabled: false

dex:
  enabled: false

redis:
  image:
    repository: docker.io/library/redis
    tag: 8.2-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

redis-ha:
  enabled: false

# Do not enable automated sync, pruning, or self-heal globally. Each app will
# opt in after its ownership transfer and rollback path are validated.

# Keep the verified transport managed by both bootstrap Helm and live GitOps.
extraObjects:
- apiVersion: traefik.io/v1alpha1
  kind: ServersTransport
  metadata:
    name: argocd-verified-tls
    namespace: argocd
    labels:
      homelab.alchemmist.xyz/edge-transport: argocd
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: argo-cd
      meta.helm.sh/release-namespace: argocd
  spec:
    serverName: argocd.socrat.alchemmist.xyz
    insecureSkipVerify: false
