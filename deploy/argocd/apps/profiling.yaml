apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: profiling
  namespace: argocd
  finalizers: []
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/profiling
    helm:
      releaseName: profiling
  destination:
    namespace: cattle-monitoring-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
