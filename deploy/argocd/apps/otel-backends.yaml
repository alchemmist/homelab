apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-backends
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/otel-backends
    helm:
      releaseName: otel-backends
  destination:
    namespace: cattle-monitoring-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
