---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/postgres-platform
    helm:
      valuesObject:
        enabled: true
  destination:
    namespace: postgres
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
