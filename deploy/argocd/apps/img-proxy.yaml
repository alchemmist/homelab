apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: img-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/img-proxy
    helm:
      releaseName: img-proxy
      parameters: []
  destination:
    namespace: img-proxy
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
