apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: password-self-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/password-self-service
    helm:
      releaseName: password-self-service
  destination:
    namespace: identity
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
