apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpn-transit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/vpn-transit
    helm:
      releaseName: vpn-transit
      parameters: []
  destination:
    namespace: vpn-transit
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
