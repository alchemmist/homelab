apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: free-deepseek-api
  namespace: argocd
  annotations:
    homelab/service-vpn: chart-includes-socks-sidecar
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/free-deepseek-api
    helm:
      releaseName: free-deepseek-api
      parameters: []
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
