apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lms-database-ha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/lms-database-ha
    helm:
      releaseName: lms-database-ha
  destination:
    namespace: lms
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
