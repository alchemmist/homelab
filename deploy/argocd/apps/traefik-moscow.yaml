---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-moscow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/traefik-moscow
    helm:
      releaseName: traefik-moscow
      valuesObject: {rehearsal: true}
      parameters: []
  destination:
    namespace: traefik-moscow
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
...
