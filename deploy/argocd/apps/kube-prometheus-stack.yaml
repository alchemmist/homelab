apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.0
      helm:
        valueFiles:
          - $values/deploy/platform/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/alchemmist/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alchemmist/homelab.git
      targetRevision: main
      path: deploy/platform/kube-prometheus-stack/public-entry
      helm:
        releaseName: kube-prometheus-stack-public-entry
        parameters: []
  destination:
    namespace: cattle-monitoring-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
