apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monori
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/monori
    helm:
      releaseName: monori
      valueFiles:
        - ../../deploy/monori/values.yaml
      parameters: []
  destination:
    namespace: monori
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
