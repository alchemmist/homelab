apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wiki-runtime
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: deploy/wiki-runtime/chart
    helm:
      releaseName: wiki-runtime
      valueFiles:
        - ../values.yaml
      parameters: []
  destination:
    namespace: wiki
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
