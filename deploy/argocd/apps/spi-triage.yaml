apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spi-triage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/spi-triage
    helm:
      releaseName: spi-triage
      valueFiles: [../../deploy/spi-triage/values.yaml]
      parameters: []
  destination:
    namespace: automation
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
    syncOptions: [CreateNamespace=true]
