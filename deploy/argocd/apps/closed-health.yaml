---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: closed-health
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: deploy/public-web/closed-health
    helm: {valueFiles: [../../blog/values.yaml, ../closed-format-quorum.yaml, ../entrances.yaml]}
  destination:
    namespace: public-health-staging
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
...
