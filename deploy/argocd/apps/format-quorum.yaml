apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: format-quorum
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/format-quorum
    helm:
      releaseName: format-quorum
      valueFiles:
        - ../../deploy/format-quorum/values.yaml
      parameters: []
  destination:
    namespace: format-quorum
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
