---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: redisinsight, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: deploy/platform/redisinsight/resources
  destination: {namespace: redis, server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
...
