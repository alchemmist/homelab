apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spi-queue-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/spi-queue-ui
    helm:
      releaseName: spi-queue-ui
      parameters: []
      valueFiles: [../../deploy/spi-queue-ui/values.yaml]
  destination:
    namespace: automation
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions: [CreateNamespace=true]
