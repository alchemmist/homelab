apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lms
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/lms
    helm:
      releaseName: lms
      valueFiles:
      - ../../deploy/lms/values.yaml
      parameters: []
  destination:
    namespace: lms
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: lms
    namespace: lms
    jsonPointers:
    - /spec/template/metadata/annotations/homelab.alchemmist.xyz~1client-certificate-sha256
