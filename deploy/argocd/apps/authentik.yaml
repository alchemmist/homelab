apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.5
      helm:
        valueFiles:
          - $values/deploy/platform/authentik/values.yaml
    - repoURL: https://github.com/alchemmist/homelab.git
      targetRevision: main
      ref: values
  destination:
    namespace: identity
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
