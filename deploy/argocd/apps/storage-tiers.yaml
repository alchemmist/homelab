apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-tiers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: deploy/storage/tiers
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      enabled: true
...
