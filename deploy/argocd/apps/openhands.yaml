---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openhands
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/openhands
    helm:
      releaseName: openhands
      valueFiles:
        - ../../deploy/openhands/values.yaml
      parameters: []
  destination:
    namespace: openhands
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
...
