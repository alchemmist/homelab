apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Same pinned upstream1.105.1, only scoped hostAliases/Job placement support.
    - repoURL: https://github.com/alchemmist/homelab.git
      path: charts/litellm
      targetRevision: main
      helm:
        valueFiles:
          - $values/deploy/platform/litellm/values.yaml
    - repoURL: https://github.com/alchemmist/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alchemmist/homelab.git
      targetRevision: main
      path: deploy/platform/litellm/public-entry
      helm:
        releaseName: litellm-public-entry
        parameters: []
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  syncPolicy:
    # Reduce unrelated applies. Explicit selective sync is still needed to skip hooks.
    syncOptions: [ApplyOutOfSyncOnly=true]
    automated:
      prune: false
      selfHeal: true
