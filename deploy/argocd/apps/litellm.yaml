apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/berriai
      chart: litellm-helm
      targetRevision: 1.105.1
      helm:
        valueFiles:
          - $values/deploy/platform/litellm/values.yaml
    - repoURL: https://github.com/alchemmist/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alchemmist/homelab.git
      targetRevision: main
      path: deploy/platform/litellm/public-entry
      helm:
        releaseName: litellm-public-entry
        parameters: []
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Temporary handoff pause: resource-only sync must not run DB migration hooks.
      enabled: false
      prune: false
      selfHeal: true
