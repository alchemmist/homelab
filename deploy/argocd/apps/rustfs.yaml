apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/rustfs
    helm:
      releaseName: rustfs
      valueFiles: [values-foundation-live.yaml]
  destination:
    namespace: rustfs
    server: https://kubernetes.default.svc
  # Manual sync only; explicit tracked foundation activation, browser routes off.
  syncPolicy:
    syncOptions: [CreateNamespace=true]
