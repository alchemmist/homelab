apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public-web-entry
  namespace: argocd
  # Migration: root may remove this Application only without cascading deletion.
  finalizers: []
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/public-web-entry
  destination:
    namespace: identity
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {enabled: false, prune: false, selfHeal: false}
    syncOptions: [ServerSideApply=true]
