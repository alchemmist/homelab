apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wishlist
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/wishlist
    helm:
      releaseName: wishlist
      valueFiles:
        - ../../deploy/wishlist/values.yaml
  destination:
    namespace: wishlist
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: wishlist
      namespace: wishlist
      jsonPointers:
        - /spec/template/metadata/annotations/homelab.alchemmist.xyz~1client-certificate-sha256
