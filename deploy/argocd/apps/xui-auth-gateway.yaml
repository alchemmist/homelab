apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xui-auth-gateway
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: deploy/xui-auth-gateway
    directory:
      include: resources.yaml
  destination:
    namespace: traefik-edge
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
