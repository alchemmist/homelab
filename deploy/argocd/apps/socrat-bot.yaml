apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: socrat-bot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  revisionHistoryLimit: 10
  source:
    repoURL: https://github.com/alchemmist/homelab.git
    targetRevision: main
    path: charts/socrat-bot
    helm:
      releaseName: socrat-bot
      valueFiles:
        - ../../deploy/socrat-bot/values.yaml
      parameters: []
  destination:
    namespace: socrat-bot
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
