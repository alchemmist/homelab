apiVersion: v1
kind: ConfigMap
metadata:
  name: xui-auth-gateway
  namespace: traefik-edge
data:
  nginx.conf: "worker_processes 1;\npid /tmp/nginx.pid;\nerror_log /dev/stderr warn;\n\
    events { worker_connections 256; }\nhttp {\n access_log off;\n server_tokens off;\n\
    \ client_body_temp_path /tmp/client_temp;\n proxy_temp_path /tmp/proxy_temp;\n\
    \ fastcgi_temp_path /tmp/fastcgi_temp;\n uwsgi_temp_path /tmp/uwsgi_temp;\n scgi_temp_path\
    \ /tmp/scgi_temp;\n map $http_upgrade $connection_upgrade { default upgrade; ''\
    \ close; }\n # Only canonical Bearer API calls may avoid interactive authentication.\n\
    \ map \"$uri|$http_authorization\" $machine_api {\n  default 0;\n  ~^/[^/]+/panel/api/[^|]*\\\
    |Bearer\\ [A-Za-z0-9._~+/-]+=*$ 1;\n }\n upstream panel { server 10.250.0.2:18082;\
    \ }\n upstream authentik { server authentik-server.identity.svc.cluster.local:80;\
    \ }\n server {\n  listen 8080;\n  server_name vpn.alchemmist.xyz;\n  client_max_body_size\
    \ 32m;\n  proxy_http_version 1.1;\n  proxy_set_header Host vpn.alchemmist.xyz;\n\
    \  proxy_set_header X-Forwarded-Host vpn.alchemmist.xyz;\n  proxy_set_header X-Forwarded-Proto\
    \ https;\n  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n  proxy_set_header\
    \ Upgrade $http_upgrade;\n  proxy_set_header Connection $connection_upgrade;\n\
    \  proxy_read_timeout 3600s;\n  proxy_buffering off;\n  proxy_cookie_flags ~ secure;\n\
    \  location = /-/xui-brand/0c57d75732c8.png {\n   alias /etc/nginx/xui-icon.png;\n\
    \   default_type image/png;\n   add_header Cache-Control \"public, max-age=31536000,\
    \ immutable\";\n   add_header X-Content-Type-Options nosniff always;\n   limit_except\
    \ GET HEAD { deny all; }\n  }\n  location = /healthz { return 200 \"ok\\n\"; }\n\
    \  location = /__ak_auth {\n   internal;\n   proxy_pass http://authentik/outpost.goauthentik.io/auth/nginx;\n\
    \   proxy_set_header Host vpn.alchemmist.xyz;\n   proxy_set_header X-Forwarded-Host\
    \ vpn.alchemmist.xyz;\n   proxy_set_header X-Forwarded-Proto https;\n   proxy_pass_request_body\
    \ off;\n   proxy_set_header Content-Length \"\";\n   proxy_set_header X-Original-URL\
    \ https://vpn.alchemmist.xyz$request_uri;\n  }\n  location /outpost.goauthentik.io/\
    \ { proxy_pass http://authentik; }\n  location @auth_login {\n   add_header Set-Cookie\
    \ $auth_cookie always;\n   return 302 /outpost.goauthentik.io/start?rd=https://vpn.alchemmist.xyz$request_uri;\n\
    \  }\n  location @machine {\n   # Invalid Bearer must NEVER fall back to a valid\
    \ native browser cookie.\n   proxy_set_header Host vpn.alchemmist.xyz;\n   proxy_set_header\
    \ X-Forwarded-Host vpn.alchemmist.xyz;\n   proxy_set_header X-Forwarded-Proto\
    \ https;\n   proxy_set_header Cookie \"\";\n   proxy_pass http://panel;\n  }\n\
    \  location / {\n   error_page 418 = @machine;\n   if ($machine_api) { return\
    \ 418; }\n   auth_request /__ak_auth;\n   auth_request_set $auth_cookie $upstream_http_set_cookie;\n\
    \   add_header Set-Cookie $auth_cookie always;\n   error_page 401 = @auth_login;\n\
    \   proxy_pass http://panel;\n  }\n }\n}\n"
binaryData:
  xui-icon.png: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xui-auth-gateway
  namespace: traefik-edge
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: xui-auth-gateway
  template:
    metadata:
      labels: *id001
      annotations:
        checksum/config: 882abd0c53820adb9b7fe980036847e3bf39d2fa8f5cc965cbff18cea9f3d94a
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: socrat-2
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
        args:
        - nginx
        - -g
        - daemon off;
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: config
          mountPath: /etc/nginx/xui-icon.png
          subPath: xui-icon.png
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: xui-auth-gateway
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: xui-auth-gateway
  namespace: traefik-edge
spec:
  selector:
    app.kubernetes.io/name: xui-auth-gateway
  ports:
  - name: http
    port: 80
    targetPort: http
