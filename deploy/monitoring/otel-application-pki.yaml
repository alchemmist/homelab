apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-app-tls-harbor
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/part-of: homelab-otel
    homelab-otel-role: application-client
spec:
  secretName: otel-app-tls-harbor
  commonName: otel-app-harbor
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
  - digital signature
  - client auth
  issuerRef:
    name: otel-ca
    kind: Issuer
---
