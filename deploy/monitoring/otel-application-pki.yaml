apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-application-credentials
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/part-of: homelab-otel
    homelab-otel-role: application-client
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-application-credentials
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/part-of: homelab-otel
    homelab-otel-role: application-client
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - otel-app-tls-harbor
  - otel-app-tls-litellm
  - otel-app-tls-vllm
  - otel-app-tls-open-webui
  - otel-app-tls-lms
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-application-credentials
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/part-of: homelab-otel
    homelab-otel-role: application-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-application-credentials
subjects:
- kind: ServiceAccount
  name: otel-application-credentials
  namespace: cattle-monitoring-system
