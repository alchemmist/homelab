auth_enabled: false
server:
  http_listen_address: ${OTEL_BIND_IP}
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  http_tls_config:
    cert_file: ${OTEL_TLS_DIR}/server.crt
    key_file: ${OTEL_TLS_DIR}/server.key
    client_ca_file: ${OTEL_TLS_DIR}/ca.crt
    client_auth_type: RequireAndVerifyClientCert
common:
  path_prefix: ${OTEL_STORAGE_DIR}/loki
  replication_factor: 1
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: ${OTEL_STORAGE_DIR}/loki/chunks
      rules_directory: ${OTEL_STORAGE_DIR}/loki/rules
schema_config:
  configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 336h
  retention_stream:
    - selector: '{log_level="debug"}'
      priority: 10
      period: 72h
    - selector: '{log_level="error"}'
      priority: 10
      period: 720h
    - selector: '{log_level="info"}'
      priority: 10
      period: 168h
    - selector: '{log_level="unknown"}'
      priority: 10
      period: 336h
    - selector: '{log_level="warn"}'
      priority: 10
      period: 720h
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name, service.namespace, host.name, k8s.namespace.name, log_level]
compactor:
  working_directory: ${OTEL_STORAGE_DIR}/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  compaction_interval: 2m
analytics:
  reporting_enabled: false
