extensions:
  file_storage:
    create_directory: true
    directory: ${env:OTEL_STORAGE_DIR}/agent
    fsync: true
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTEL_STORAGE_DIR}/agent-compaction
  health_check:
    endpoint: 127.0.0.1:13133
receivers:
  prometheus:
    trim_metric_suffixes: false
    config: ${file:${env:OTEL_SCRAPE_CONFIG}}
  filelog:
    include:
    - /var/log/pods/*/*/*.log
    exclude:
    - /var/log/pods/cattle-monitoring-system_prometheus-kube-prometheus-stack-prometheus-*_*/otel-cluster/*.log
    start_at: beginning
    storage: file_storage
    include_file_path: true
    max_log_size: 1MiB
    operators:
    - type: container
      id: container-parser
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    poll_interval: 200ms
  journald:
    storage: file_storage
    start_at: end
processors:
  filter/log-ingestion-cut:
    error_mode: propagate
    logs:
      log_record:
      - time_unix_nano == 0 or time_unix_nano < ${env:OTEL_LOG_INGESTION_START_NS}
  memory_limiter:
    check_interval: 1s
    limit_mib: 208
    spike_limit_mib: 48
  resource:
    attributes:
    - key: host.name
      action: upsert
      value: ${env:OTEL_NODE_NAME}
  transform/journal-identity:
    error_mode: propagate
    log_statements:
    - context: log
      statements:
      - set(attributes["service.name"], body["_SYSTEMD_UNIT"]) where IsMap(body) and body["_SYSTEMD_UNIT"] != nil
  groupbyattrs/journal-identity:
    keys:
    - service.name
  transform/journal:
    error_mode: propagate
    log_statements:
    - context: log
      statements:
      - set(severity_number, SEVERITY_NUMBER_ERROR) where IsMap(body) and body["PRIORITY"] != nil and IsMatch(String(body["PRIORITY"]),
        "^[0-3]$")
      - set(severity_number, SEVERITY_NUMBER_WARN) where IsMap(body) and String(body["PRIORITY"]) == "4"
      - set(severity_number, SEVERITY_NUMBER_INFO) where IsMap(body) and IsMatch(String(body["PRIORITY"]), "^[56]$")
      - set(severity_number, SEVERITY_NUMBER_DEBUG) where IsMap(body) and String(body["PRIORITY"]) == "7"
      - set(body, body["MESSAGE"]) where IsMap(body) and body["MESSAGE"] != nil
  batch/metrics:
    timeout: 1s
    send_batch_size: 1000
    send_batch_max_size: 2000
  transform/log-identity:
    error_mode: propagate
    log_statements:
    - context: log
      statements:
      - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"]
        == nil and resource.attributes["k8s.container.name"] != nil
      - set(resource.attributes["service.name"], "host-journal") where resource.attributes["service.name"] == nil
      - set(resource.attributes["k8s.namespace.name"], "host") where resource.attributes["k8s.namespace.name"] == nil
      - set(severity_text, "unknown")
      - set(severity_text, "trace") where severity_number >= 1 and severity_number < 5
      - set(severity_text, "debug") where severity_number >= 5 and severity_number < 9
      - set(severity_text, "info") where severity_number >= 9 and severity_number < 13
      - set(severity_text, "warn") where severity_number >= 13 and severity_number < 17
      - set(severity_text, "error") where severity_number >= 17 and severity_number < 21
      - set(severity_text, "fatal") where severity_number >= 21
      - set(severity_text, "debug") where severity_number == 0 and IsString(body) and IsMatch(body, "(?i)\\bdebug\\b")
      - set(severity_text, "info") where severity_number == 0 and IsString(body) and IsMatch(body, "(?i)\\binfo\\b")
      - set(severity_text, "warn") where severity_number == 0 and IsString(body) and IsMatch(body, "(?i)\\bwarn(ing)?\\b")
      - set(severity_text, "error") where severity_number == 0 and IsString(body) and IsMatch(body, "(?i)\\b(error|exception)\\b")
      - set(severity_text, "fatal") where severity_number == 0 and IsString(body) and IsMatch(body, "(?i)\\b(fatal|panic)\\b")
      - set(attributes["severity"], severity_text)
  groupbyattrs/log-severity:
    keys: [severity]
  transform/log-privacy:
    error_mode: propagate
    log_statements:
    - context: resource
      statements:
      - flatten(attributes, resolveConflicts=true)
      - delete_matching_keys(attributes, "(?i).*(authorization|password|secret|token|api[._-]?key|cookie|headers?|prompt|completion|request[._-]?body|response[._-]?body).*")
    # Parse failure is expected for truncated JSON-looking text. Never export it raw.
    - context: log
      error_mode: silent
      statements:
      - set(body, ParseJSON(body)) where IsString(body) and IsMatch(body, "^[ \\t]*(\\{|\\[[ \\t]*(\\{|\\[|\"))")
    - context: log
      statements:
      - set(body, "<redacted-invalid-json>") where IsString(body) and IsMatch(body, "^[ \\t]*(\\{|\\[[ \\t]*(\\{|\\[|\"))")
      - set(body, "<redacted-unstructured-array>") where IsList(body)
      - flatten(body, resolveConflicts=true) where IsMap(body)
      - delete_matching_keys(body, "(?i).*(authorization|password|secret|token|api[._-]?key|cookie|headers?|prompt|completion|request[._-]?body|response[._-]?body|(^|[.])body([.]|$)).*") where IsMap(body)
      - set(body, String(body)) where not IsString(body)
      - flatten(attributes, resolveConflicts=true)
      - delete_matching_keys(attributes, "(?i).*(authorization|password|secret|token|api[._-]?key|cookie|headers?|prompt|completion|request[._-]?body|response[._-]?body).*")
      # Free-form labeled sensitive payloads: retain prefix, redact rest of line.
      - replace_pattern(body, "(?is)(prompt|completion|request[._ -]?body|response[._ -]?body|cookie|headers?)[ \t:=]+.*", "sensitive-payload=<redacted>") where IsString(body)
      - replace_pattern(body, "(?i)Bearer[ \\t]+[A-Za-z0-9._~+/=-]+", "Bearer <redacted>") where IsString(body)
      - replace_pattern(body, "(?i)(password|secret|token|api[_-]?key|authorization)[\\\"' \\t:=]+[^ \\t,;\\\"']+", "credential=<redacted>")
        where IsString(body)
      - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<redacted-email>") where IsString(body)
      - replace_pattern(body, "\\?[^ \\t\\\"]+", "?<redacted-query>") where IsString(body)
exporters:
  otlp:
    endpoint: ${env:OTEL_CLUSTER_ENDPOINT}
    tls:
      ca_file: ${env:OTEL_TLS_DIR}/ca.crt
      cert_file: ${env:OTEL_TLS_DIR}/client.crt
      key_file: ${env:OTEL_TLS_DIR}/client.key
      server_name_override: ${env:OTEL_CLUSTER_TLS_NAME}
    sending_queue:
      storage: file_storage
      sizer: bytes
      queue_size: 134217728
      num_consumers: 2
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  otlp/logs:
    endpoint: ${env:OTEL_CLUSTER_ENDPOINT}
    tls:
      ca_file: ${env:OTEL_TLS_DIR}/ca.crt
      cert_file: ${env:OTEL_TLS_DIR}/client.crt
      key_file: ${env:OTEL_TLS_DIR}/client.key
      server_name_override: ${env:OTEL_CLUSTER_TLS_NAME}
    sending_queue:
      storage: file_storage
      sizer: bytes
      queue_size: 134217728
      num_consumers: 2
      block_on_overflow: true
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
service:
  extensions:
  - file_storage
  - health_check
  telemetry:
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8888
  pipelines:
    metrics:
      receivers:
      - prometheus
      processors:
      - memory_limiter
      - resource
      - batch/metrics
      exporters:
      - otlp
    logs:
      receivers:
      - filelog
      - journald
      processors:
      - memory_limiter
      - filter/log-ingestion-cut
      - resource
      - transform/journal-identity
      - groupbyattrs/journal-identity
      - transform/journal
      - transform/log-identity
      - groupbyattrs/log-severity
      - transform/log-privacy
      exporters:
      - otlp/logs
