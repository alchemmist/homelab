otel:
  enabled: true
  sourceConfigMap: open-webui-otel-source-5014d7b1628833fd
  environment:
    PYTHONPATH: /etc/otel-source:/app/backend
    PYTHONDONTWRITEBYTECODE: '1'
    ENABLE_OTEL: 'true'
    ENABLE_OTEL_TRACES: 'true'
    ENABLE_OTEL_METRICS: 'false'
    ENABLE_OTEL_LOGS: 'false'
    OTEL_OTLP_SPAN_EXPORTER: http
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_ENDPOINT: https://10.250.0.3:44318/v1/traces
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://10.250.0.3:44318/v1/traces
    OTEL_EXPORTER_OTLP_INSECURE: 'false'
    OTEL_EXPORTER_OTLP_CERTIFICATE: /etc/otel-client/ca.crt
    OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE: /etc/otel-client/tls.crt
    OTEL_EXPORTER_OTLP_CLIENT_KEY: /etc/otel-client/tls.key
    OTEL_EXPORTER_OTLP_HEADERS: Connection=close
    OTEL_BASIC_AUTH_USERNAME: ''
    OTEL_BASIC_AUTH_PASSWORD: ''
    OTEL_SERVICE_NAME: open-webui
    OTEL_TRACES_SAMPLER: always_on
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ''
    OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_RESPONSE: ''
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: NO_CONTENT
    UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: '7200'
