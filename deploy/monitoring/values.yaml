defaultRules:
  disabled:
    KubeNodeNotReady: true
    KubeNodePressure: true
    NodeRAIDDegraded: true
    NodeRAIDDiskFailure: true
    NodeBondingDegraded: true
    KubeletClientCertificateExpiration: true
    KubeletServerCertificateExpiration: true
    KubeletClientCertificateRenewalErrors: true
    KubeletServerCertificateRenewalErrors: true
  additionalRuleAnnotations:
    KubeMemoryOvercommit:
      rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer'
    KubeCPUOvercommit:
      rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer'
    KubePodNotReady:
      rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace }}/{{ $labels.pod }}'
    KubePodCrashLooping:
      rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/pod/{{ $labels.namespace }}/{{ $labels.pod }}'
    KubeNodeNotReady:
      rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}'
    KubeNodeUnreachable:
      rancher_url: 'https://rancher.socrat.alchemmist.xyz/dashboard/c/local/explorer/node/{{ $labels.node }}'
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeApiServer:
  serviceMonitor:
    relabelings:
      - action: keep
        sourceLabels: [__address__]
        regex: '10\.250\.0\.(1|3|5):6443'
kubelet:
  serviceMonitor:
    insecureSkipVerify: false
    metricRelabelings:
      - action: drop
        sourceLabels: [instance, __name__]
        regex: '(192\.168\.0\.(23|24)|10\.250\.0\.5):10250;(apiserver|etcd|scheduler|workqueue|kubeproxy)_.*'
prometheus:
  prometheusSpec:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: socrat-0
    retention: 12h
    scrapeInterval: 5s
    scrapeTimeout: 4s
    evaluationInterval: 30s
    disableCompaction: true
    walCompression: true
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 8Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    volumes:
      - name: thanos-data
        hostPath:
          path: /var/lib/socrat-thanos
          type: Directory
    thanos:
      image: quay.io/thanos/thanos:v0.42.4
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      volumeMounts:
        - name: thanos-data
          mountPath: /var/lib/socrat-thanos
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore-raw
          key: objstore.yml
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    probeSelector:
      matchLabels:
        release: kube-prometheus-stack
    scrapeConfigSelector:
      matchLabels:
        release: kube-prometheus-stack
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
    podMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [cattle-monitoring-system, llm]
    ruleNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
    probeNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
    scrapeConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cattle-monitoring-system
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes: []
    receivers:
      - name: 'null'
  alertmanagerSpec:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: socrat-1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
grafana:
  defaultDashboardsEnabled: false
  replicas: 1
  podAnnotations:
    homelab.alchemmist.xyz/dashboard-language: en
  extraConfigmapMounts:
    - name: socrat-branding
      configMap: socrat-branding
      mountPath: /usr/share/grafana/public/img/socrat
      readOnly: true
  nodeSelector:
    kubernetes.io/hostname: socrat-1
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: socrat-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes: [ReadWriteOnce]
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1536Mi
  env:
    GOMEMLIMIT: 1GiB
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
    datasources:
      url: http://thanos-query.cattle-monitoring-system.svc.cluster.local:9090
    dashboards:
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
        allowUiUpdates: true
  grafana.ini:
    server:
      domain: grafana.socrat.alchemmist.xyz
      root_url: https://grafana.socrat.alchemmist.xyz/
      enforce_domain: false
      serve_from_sub_path: false
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/socrat-overview.json
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
    users:
      allow_sign_up: false
      default_theme: dark
prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: socrat-1
  resources:
    requests:
      cpu: 30m
      memory: 128Mi
    limits:
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  admissionWebhooks:
    patch:
      nodeSelector:
        kubernetes.io/hostname: socrat-1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: socrat-1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
prometheus-node-exporter:
  env:
    DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
  extraArgs:
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
    - --collector.systemd
    - --collector.systemd.enable-restarts-metrics
  service:
    listenOnAllInterfaces: false
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
