---
global:
  cattle:
    clusterId: local
    clusterName: Socrat
commonLabels:
  release: kube-prometheus-stack
monitoringProxy:
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [socrat-0, socrat-1]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [socrat-0]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
dashboardArtifacts:
  groups:
    ingressNginx: false
    logging:
      fluentd: false
      fluentbit: false
    backupRestore: false
rancherMonitoring:
  enabled: true
  prometheusServiceAccount: kube-prometheus-stack-prometheus
...
