---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-application-credentials
  namespace: cattle-monitoring-system
data:
  mirror.py:
    "\"\"\"Narrow in-cluster client-leaf mirror; never logs Secret values or reads CA keys.\n\
    \n\
    Runs as the dedicated ServiceAccount. Existing target Secrets are patched only\n\
    when the three selected leaf/public-CA data fields change. Reload targets remain\n\
    empty until the corresponding application SDK rollout is explicitly enabled.\n\
    \"\"\"\n\
    import base64\n\
    import hashlib\n\
    import json\n\
    import os\n\
    import socket\n\
    import ssl\n\
    import tempfile\n\
    import urllib.parse\n\
    import urllib.request\n\
    from pathlib import Path\n\
    from typing import cast\n\
    \n\
    SOURCE_NS = \"cattle-monitoring-system\"\n\
    DESTINATIONS = {\"harbor\": \"harbor\", \"litellm\": \"llm\", \"vllm\": \"llm\",\
    \ \"open-webui\": \"llm\", \"lms\": \"lms\", \"wishlist\": \"wishlist\"}\n\
    OBSERVED_PHASE = {\"stage\": \"bootstrap\", \"application\": None}\n\
    \n\
    \n\
    def require(expected: object, message: str) -> None:\n\
    \    \"\"\"Enforce an invariant, failing with the given message.\"\"\"\n\
    \    if not expected:\n\
    \        raise ValueError(message)\n\
    \n\
    \n\
    def validate_destination(entry):\n\
    \    app = entry[\"application\"]\n\
    \    if app not in DESTINATIONS or entry[\"namespace\"] != DESTINATIONS[app] or\
    \ entry[\"secret\"] != \"otel-app-tls-\" + app:\n\
    \        raise ValueError(\"Unexpected application leaf destination\")\n\
    \    approved = {\"harbor\": {\"harbor-core\", \"harbor-jobservice\", \"harbor-registry\"},\n\
    \                \"litellm\": {\"litellm\"}, \"vllm\": {\"vllm\"}, \"open-webui\":\
    \ {\"open-webui\"}, \"lms\": {\"lms\"}, \"wishlist\": {\"wishlist\"}}\n\
    \    if not set(entry.get(\"reloadDeployments\", [])) <= approved[app]:\n\
    \        raise ValueError(\"Unexpected application reload target\")\n\
    \n\
    \n\
    def run():\n\
    \    token_root = Path(\"/var/run/secrets/kubernetes.io/serviceaccount\")\n\
    \    token = (token_root / \"token\").read_text().strip()\n\
    \    context = ssl.create_default_context(cafile=str(token_root / \"ca.crt\"))\n\
    \    endpoint = \"https://\" + os.environ[\"KUBERNETES_SERVICE_HOST\"] + \":\" +\
    \ os.environ.get(\"KUBERNETES_SERVICE_PORT_HTTPS\", \"443\")\n\
    \    entries = json.loads(Path(\"/etc/otel-applications/destinations.json\").read_text())\n\
    \    require(len(entries) == len(DESTINATIONS)\n\
    \            and {entry[\"application\"] for entry in entries} == set(DESTINATIONS),\n\
    \           \"Exactly the registered dedicated application client leaves required\")\n\
    \n\
    \    def api(namespace, resource, name, patch=None) -> dict[str, object]:\n\
    \        path = \"/api/v1/namespaces/\" if resource == \"secrets\" else\
    \ \"/apis/apps/v1/namespaces/\"\n\
    \        path += urllib.parse.quote(namespace, safe=\"\") + \"/\" + resource + \"/\" +\
    \ urllib.parse.quote(name, safe=\"\")\n\
    \        request = urllib.request.Request(endpoint + path, data=json.dumps(patch).encode() if\
    \ patch is not None else None,\n\
    \                  headers={\"Authorization\": \"Bearer \" + token, \"Content-Type\":\
    \ \"application/merge-patch+json\"},\n\
    \                  method=\"PATCH\" if patch is not None else \"GET\")\n\
    \        with urllib.request.urlopen(request, context=context, timeout=15) as response:\n\
    \            payload: dict[str, object] = json.load(response)\n\
    \            return payload\n\
    \n\
    \    updated = []\n\
    \    verified = []\n\
    \    for entry in entries:\n\
    \        validate_destination(entry)\n\
    \        app = entry[\"application\"]\n\
    \        OBSERVED_PHASE.update(stage=\"read-named-client-leaf\", application=app)\n\
    \        source = api(SOURCE_NS, \"secrets\", \"otel-app-tls-\" + app)\n\
    \        data = {key: cast(\"dict[str, str]\", source[\"data\"])[key]\n\
    \                for key in [\"tls.crt\", \"tls.key\", \"ca.crt\"]}\n\
    \        # Validate pair and actual private native ingress before distribution.\n\
    \        with tempfile.TemporaryDirectory(dir=\"/run/otel-check\") as temporary:\n\
    \            root = Path(temporary)\n\
    \            for key, value in data.items():\n\
    \                path = root / key\n\
    \                path.write_bytes(base64.b64decode(value, validate=True))\n\
    \                path.chmod(0o600)\n\
    \            native = ssl.create_default_context(cafile=str(root / \"ca.crt\"))\n\
    \            native.load_cert_chain(str(root / \"tls.crt\"), str(root / \"tls.key\"))\n\
    \            native.set_alpn_protocols([\"h2\"])\n\
    \            OBSERVED_PHASE[\"stage\"] = \"native-mtls-http2-handshake\"\n\
    \            with socket.create_connection((\"10.250.0.1\", 44317), timeout=10) as\
    \ connection:\n\
    \                with native.wrap_socket(connection, server_hostname=\"10.250.0.1\") as\
    \ secure:\n\
    \                    secure.sendall(b\"PRI * HTTP/2.0\\r\\n\\r\\nSM\\r\\n\\r\\n\" +\
    \ b\"\\x00\\x00\\x00\\x04\\x00\\x00\\x00\\x00\\x00\")\n\
    \                    header = b\"\"\n\
    \                    while len(header) < 9:\n\
    \                        chunk = secure.recv(9 - len(header))\n\
    \                        if not chunk:\n\
    \                            raise ValueError(\"Native authenticated HTTP2 handshake did not\
    \ complete\")\n\
    \                        header += chunk\n\
    \                    if header[3] != 4:\n\
    \                        raise ValueError(\"Native authenticated HTTP2 SETTINGS were not\
    \ received\")\n\
    \        verified.append(app)\n\
    \        certificate_hash = hashlib.sha256(base64.b64decode(data[\"tls.crt\"])).hexdigest()\n\
    \        OBSERVED_PHASE[\"stage\"] = \"mirror-named-client-leaf\"\n\
    \        target = api(entry[\"namespace\"], \"secrets\", entry[\"secret\"])\n\
    \        changed = any(cast(\"dict[str, object]\", target.get(\"data\", {})).get(key) !=\
    \ value\n\
    \                      for key, value in data.items())\n\
    \        if changed:\n\
    \            api(entry[\"namespace\"], \"secrets\", entry[\"secret\"],\n\
    \                {\"data\": data, \"metadata\": {\"annotations\":\
    \ {\"homelab.alchemmist.xyz/client-certificate-sha256\": certificate_hash}}})\n\
    \            updated.append(app)\n\
    \        for deployment in entry.get(\"reloadDeployments\", []):\n\
    \            workload = api(entry[\"namespace\"], \"deployments\", deployment)\n\
    \            spec = cast(\"dict[str, object]\", workload[\"spec\"])\n\
    \            template = cast(\"dict[str, object]\", spec[\"template\"])\n\
    \            metadata = cast(\"dict[str, object]\", template.get(\"metadata\", {}))\n\
    \            annotations = cast(\"dict[str, object]\", metadata.get(\"annotations\", {}))\n\
    \            annotation =\
    \ annotations.get(\"homelab.alchemmist.xyz/client-certificate-sha256\")\n\
    \            if annotation != certificate_hash:\n\
    \                api(entry[\"namespace\"], \"deployments\", deployment,\n\
    \                    {\"spec\": {\"template\": {\"metadata\": {\"annotations\":\
    \ {\"homelab.alchemmist.xyz/client-certificate-sha256\": certificate_hash}}}}})\n\
    \    print(json.dumps({\"nativeClientMtlsVerified\": verified,\
    \ \"mirroredClientLeavesUpdated\": updated,\n\
    \                      \"caPrivateKeysRead\": False, \"secretValuesLogged\": False}))\n\
    \n\
    \n\
    if __name__ == \"__main__\":\n\
    \    os.umask(0o077)\n\
    \    try:\n\
    \        run()\n\
    \    except (ImportError, OSError, RuntimeError, ValueError) as error:\n\
    \        print(json.dumps({\"success\": False, \"errorType\": type(error).__name__,\
    \ \"secretValuesLogged\": False, **OBSERVED_PHASE}))\n\
    \        raise SystemExit(1) from error\n"
  destinations.json: >-
    [{"application": "harbor", "namespace": "harbor", "secret": "otel-app-tls-harbor",
    "reloadDeployments": []}, {"application": "litellm", "namespace": "llm", "secret":
    "otel-app-tls-litellm", "reloadDeployments": []}, {"application": "vllm", "namespace": "llm",
    "secret": "otel-app-tls-vllm", "reloadDeployments": []}, {"application": "open-webui",
    "namespace": "llm", "secret": "otel-app-tls-open-webui", "reloadDeployments": []},
    {"application": "lms", "namespace": "lms", "secret": "otel-app-tls-lms", "reloadDeployments":
    ["lms"]}, {"application": "wishlist", "namespace": "wishlist", "secret":
    "otel-app-tls-wishlist", "reloadDeployments": ["wishlist"]}]
...
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-application-credentials
  namespace: llm
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - otel-app-tls-litellm
      - otel-app-tls-vllm
      - otel-app-tls-open-webui
    verbs:
      - get
      - patch
...
