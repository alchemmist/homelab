apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-application-credentials
  namespace: cattle-monitoring-system
data:
  mirror.py: "\"\"\"Narrow in-cluster client-leaf mirror; never logs Secret values\
    \ or reads CA keys.\n\nRuns as the dedicated ServiceAccount. Existing target Secrets\
    \ are patched only\nwhen the three selected leaf/public-CA data fields change.\
    \ Reload targets remain\nempty until the corresponding application SDK rollout\
    \ is explicitly enabled.\n\"\"\"\nimport base64\nimport hashlib\nimport json\n\
    import os\nfrom pathlib import Path\nimport socket\nimport ssl\nimport tempfile\n\
    import urllib.parse\nimport urllib.request\n\nSOURCE_NS = 'cattle-monitoring-system'\n\
    DESTINATIONS = {'harbor': 'harbor', 'litellm': 'llm', 'vllm': 'llm', 'open-webui':\
    \ 'llm', 'lms': 'lms'}\nOBSERVED_PHASE = {'stage': 'bootstrap', 'application':\
    \ None}\n\n\ndef validate_destination(entry):\n    app = entry['application']\n\
    \    if app not in DESTINATIONS or entry['namespace'] != DESTINATIONS[app] or\
    \ entry['secret'] != 'otel-app-tls-' + app:\n        raise ValueError('Unexpected\
    \ application leaf destination')\n    approved = {'harbor': {'harbor-core', 'harbor-jobservice',\
    \ 'harbor-registry'},\n                'litellm': {'litellm'}, 'vllm': {'vllm'},\
    \ 'open-webui': {'open-webui'}, 'lms': {'lms'}}\n    if not set(entry.get('reloadDeployments',\
    \ [])) <= approved[app]:\n        raise ValueError('Unexpected application reload\
    \ target')\n\n\ndef run():\n    token_root = Path('/var/run/secrets/kubernetes.io/serviceaccount')\n\
    \    token = (token_root / 'token').read_text().strip()\n    context = ssl.create_default_context(cafile=str(token_root\
    \ / 'ca.crt'))\n    endpoint = 'https://' + os.environ['KUBERNETES_SERVICE_HOST']\
    \ + ':' + os.environ.get('KUBERNETES_SERVICE_PORT_HTTPS', '443')\n    entries\
    \ = json.loads(Path('/etc/otel-applications/destinations.json').read_text())\n\
    \    if len(entries) != len(DESTINATIONS) or {entry['application'] for entry in\
    \ entries} != set(DESTINATIONS):\n        raise ValueError('Exactly the registered\
    \ dedicated application client leaves required')\n\n    def api(namespace, resource,\
    \ name, patch=None):\n        path = '/api/v1/namespaces/' if resource == 'secrets'\
    \ else '/apis/apps/v1/namespaces/'\n        path += urllib.parse.quote(namespace,\
    \ safe='') + '/' + resource + '/' + urllib.parse.quote(name, safe='')\n      \
    \  request = urllib.request.Request(endpoint + path, data=json.dumps(patch).encode()\
    \ if patch is not None else None,\n                  headers={'Authorization':\
    \ 'Bearer ' + token, 'Content-Type': 'application/merge-patch+json'},\n      \
    \            method='PATCH' if patch is not None else 'GET')\n        with urllib.request.urlopen(request,\
    \ context=context, timeout=15) as response:\n            return json.load(response)\n\
    \n    updated = []\n    verified = []\n    for entry in entries:\n        validate_destination(entry)\n\
    \        app = entry['application']\n        OBSERVED_PHASE.update(stage='read-named-client-leaf',\
    \ application=app)\n        source = api(SOURCE_NS, 'secrets', 'otel-app-tls-'\
    \ + app)\n        data = {key: source['data'][key] for key in ['tls.crt', 'tls.key',\
    \ 'ca.crt']}\n        # Validate pair and actual private native ingress before\
    \ distribution.\n        with tempfile.TemporaryDirectory(dir='/run/otel-check')\
    \ as temporary:\n            root = Path(temporary)\n            for key, value\
    \ in data.items():\n                path = root / key\n                path.write_bytes(base64.b64decode(value,\
    \ validate=True))\n                path.chmod(0o600)\n            native = ssl.create_default_context(cafile=str(root\
    \ / 'ca.crt'))\n            native.load_cert_chain(str(root / 'tls.crt'), str(root\
    \ / 'tls.key'))\n            native.set_alpn_protocols(['h2'])\n            OBSERVED_PHASE['stage']\
    \ = 'native-mtls-http2-handshake'\n            with socket.create_connection(('10.250.0.1',\
    \ 44317), timeout=10) as connection:\n                with native.wrap_socket(connection,\
    \ server_hostname='10.250.0.1') as secure:\n                    secure.sendall(b'PRI\
    \ * HTTP/2.0\\r\\n\\r\\nSM\\r\\n\\r\\n' + b'\\x00\\x00\\x00\\x04\\x00\\x00\\x00\\\
    x00\\x00')\n                    header = b''\n                    while len(header)\
    \ < 9:\n                        chunk = secure.recv(9 - len(header))\n       \
    \                 if not chunk:\n                            raise ValueError('Native\
    \ authenticated HTTP2 handshake did not complete')\n                        header\
    \ += chunk\n                    if header[3] != 4:\n                        raise\
    \ ValueError('Native authenticated HTTP2 SETTINGS were not received')\n      \
    \  verified.append(app)\n        certificate_hash = hashlib.sha256(base64.b64decode(data['tls.crt'])).hexdigest()\n\
    \        OBSERVED_PHASE['stage'] = 'mirror-named-client-leaf'\n        target\
    \ = api(entry['namespace'], 'secrets', entry['secret'])\n        changed = any(target.get('data',\
    \ {}).get(key) != value for key, value in data.items())\n        if changed:\n\
    \            api(entry['namespace'], 'secrets', entry['secret'],\n           \
    \     {'data': data, 'metadata': {'annotations': {'homelab.alchemmist.xyz/client-certificate-sha256':\
    \ certificate_hash}}})\n            updated.append(app)\n        for deployment\
    \ in entry.get('reloadDeployments', []):\n            workload = api(entry['namespace'],\
    \ 'deployments', deployment)\n            annotation = workload['spec']['template'].get('metadata',\
    \ {}).get('annotations', {}).get('homelab.alchemmist.xyz/client-certificate-sha256')\n\
    \            if annotation != certificate_hash:\n                api(entry['namespace'],\
    \ 'deployments', deployment,\n                    {'spec': {'template': {'metadata':\
    \ {'annotations': {'homelab.alchemmist.xyz/client-certificate-sha256': certificate_hash}}}}})\n\
    \    print(json.dumps({'nativeClientMtlsVerified': verified, 'mirroredClientLeavesUpdated':\
    \ updated,\n                      'caPrivateKeysRead': False, 'secretValuesLogged':\
    \ False}))\n\n\nif __name__ == '__main__':\n    os.umask(0o077)\n    try:\n  \
    \      run()\n    except Exception as error:\n        print(json.dumps({'success':\
    \ False, 'errorType': type(error).__name__, 'secretValuesLogged': False, **OBSERVED_PHASE}))\n\
    \        raise SystemExit(1)\n"
  destinations.json: '[{"application": "harbor", "namespace": "harbor", "secret":
    "otel-app-tls-harbor", "reloadDeployments": []}, {"application": "litellm", "namespace":
    "llm", "secret": "otel-app-tls-litellm", "reloadDeployments": []}, {"application":
    "vllm", "namespace": "llm", "secret": "otel-app-tls-vllm", "reloadDeployments":
    []}, {"application": "open-webui", "namespace": "llm", "secret": "otel-app-tls-open-webui",
    "reloadDeployments": []}, {"application": "lms", "namespace": "lms", "secret":
    "otel-app-tls-lms", "reloadDeployments": ["lms"]}]'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-application-credentials
  namespace: llm
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - otel-app-tls-litellm
  - otel-app-tls-vllm
  - otel-app-tls-open-webui
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-application-credentials
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-application-credentials
subjects:
- kind: ServiceAccount
  name: otel-application-credentials
  namespace: cattle-monitoring-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-application-credentials
  namespace: harbor
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - otel-app-tls-harbor
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-application-credentials
  namespace: harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-application-credentials
subjects:
- kind: ServiceAccount
  name: otel-application-credentials
  namespace: cattle-monitoring-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otel-application-credentials
  namespace: cattle-monitoring-system
spec:
  schedule: '*/30 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: otel-application-credentials
        spec:
          serviceAccountName: otel-application-credentials
          automountServiceAccountToken: true
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: socrat-1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: mirror
            image: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
            imagePullPolicy: IfNotPresent
            command:
            - python3
            - /etc/otel-applications/mirror.py
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: script
              mountPath: /etc/otel-applications
              readOnly: true
            - name: check
              mountPath: /run/otel-check
          volumes:
          - name: script
            configMap:
              name: otel-application-credentials
              defaultMode: 292
          - name: check
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-application-credentials
  namespace: lms
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - otel-app-tls-lms
  verbs:
  - get
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - lms
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-application-credentials
  namespace: lms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-application-credentials
subjects:
- kind: ServiceAccount
  name: otel-application-credentials
  namespace: cattle-monitoring-system
