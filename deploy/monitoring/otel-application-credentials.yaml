...
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otel-application-credentials
  namespace: cattle-monitoring-system
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: otel-application-credentials
        spec:
          serviceAccountName: otel-application-credentials
          automountServiceAccountToken: true
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [socrat-0, socrat-1]
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [socrat-0]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image:
                python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /etc/otel-applications/mirror.py
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /etc/otel-applications
                  readOnly: true
                - name: check
                  mountPath: /run/otel-check
          volumes:
            - name: script
              configMap:
                name: otel-application-credentials
                defaultMode: 292
            - name: check
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
...
