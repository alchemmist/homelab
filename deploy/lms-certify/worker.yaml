apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-certify
  namespace: automation
spec:
  replicas: 0 # Retired: never execute generated code in this worker.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lms-certify
  template:
    metadata:
      labels:
        app: lms-certify
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command: [python, -B, /app/server.py]
          envFrom:
            - secretRef:
                name: lms-certify
          env:
            - name: STATE_DIR
              value: /state
            - name: QUEUE_FILE
              value: /tasks/queue.json
            - name: LITELLM_BASE
              value: http://litellm.llm.svc.cluster.local:4000/v1
            - name: LITELLM_MODEL
              value: qwen3.8-27b
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: code
              mountPath: /app
            - name: tasks
              mountPath: /tasks
              readOnly: true
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: lms-certify-code
        - name: tasks
          configMap:
            name: lms-certify-queue
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lms-certify
  namespace: automation
spec:
  selector:
    app: lms-certify
  ports:
    - port: 8080
      targetPort: 8080
