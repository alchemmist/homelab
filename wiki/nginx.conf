worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        if ($http_x_forwarded_proto = http) {
            return 308 https://wiki.alchemmist.xyz$request_uri;
        }
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        error_page 404 /404.html;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /deployment-version.json { try_files /version.json =404; }
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location / {
            limit_except GET HEAD { deny all; }
            proxy_pass http://wiki-editor.wiki.svc.cluster.local:8080/site/;
            proxy_set_header Host $host;
            proxy_set_header X-Socrat-Editor-Key "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_read_timeout 30s;
            proxy_hide_header Cache-Control;
        }
    }
}
