apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallpaper-workflow-s3
  namespace: rustfs
spec:
  podSelector:
    matchLabels: {app: rustfs}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: automation}
          podSelector:
            matchLabels: {app: n8n}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: automation}
          podSelector:
            matchLabels: {app: n8n-worker}
      ports:
        - {protocol: TCP, port: 9000}
