---
# Skip the packaged writer, not --disable=local-storage (which uninstalls resources).
# Git Application storage-tiers owns the SAME resources and preserves their UIDs.
- name: Inspect the packaged manifest directory
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/manifests
  register: storage_manifest_dir
- name: Prepare manifest directory on newly onboarded hosts only
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: '0700'
  when: not storage_manifest_dir.stat.exists
- name: Prevent packaged local-storage from competing with the Git owner
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/local-storage.yaml.skip
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by k3s_storage_owner. Do not delete: Git Application storage-tiers
      # owns provisioner/RBAC/config/classes. Never disable/uninstall local-storage.
