---
# Kubernetes owns Syncthing on Socrat nodes. The Helm chart deploys it as a
# hostNetwork DaemonSet, so any host/user-level Syncthing service would collide
# on ports 8384/22000/21027 and make the node-local pod crash-loop.
- name: Look up homelab user
  ansible.builtin.getent:
    database: passwd
    key: "{{ homelab_user }}"

- name: Store homelab user uid
  ansible.builtin.set_fact:
    homelab_user_uid: "{{ ansible_facts.getent_passwd[homelab_user][1] }}"

- name: Stop legacy user Syncthing service if user manager is available
  ansible.builtin.command: systemctl --user stop syncthing.service
  become: true
  become_user: "{{ homelab_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ homelab_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ homelab_user_uid }}/bus"
  register: syncthing_user_stop
  failed_when: false
  changed_when: syncthing_user_stop.rc == 0

- name: Disable legacy user Syncthing service if user manager is available
  ansible.builtin.command: systemctl --user disable syncthing.service
  become: true
  become_user: "{{ homelab_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ homelab_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ homelab_user_uid }}/bus"
  register: syncthing_user_disable
  failed_when: false
  changed_when: syncthing_user_disable.rc == 0

- name: Remove legacy user Syncthing autostart symlink
  ansible.builtin.file:
    path: "{{ homelab_user_home }}/.config/systemd/user/default.target.wants/syncthing.service"
    state: absent

- name: Stop legacy system Syncthing service if present
  ansible.builtin.systemd:
    name: syncthing.service
    enabled: false
    state: stopped
  register: syncthing_system_service
  failed_when: false

- name: Stop legacy templated Syncthing service for homelab user if present
  ansible.builtin.systemd:
    name: "syncthing@{{ homelab_user }}.service"
    enabled: false
    state: stopped
  register: syncthing_templated_service
  failed_when: false

- name: Kill leftover legacy Syncthing processes owned by homelab user
  ansible.builtin.command: "pkill -u {{ homelab_user }} -x syncthing"
  register: syncthing_legacy_pkill
  failed_when: syncthing_legacy_pkill.rc not in [0, 1]
  changed_when: syncthing_legacy_pkill.rc == 0

- name: Ensure node-local Syncthing hostPath exists
  ansible.builtin.file:
    path: /srv/syncthing
    state: directory
    owner: root
    group: root
    mode: '0755'
