---
- name: Require macOS for WireGuard admin client preparation
  ansible.builtin.assert:
    that:
      - ansible_system == 'Darwin'
    fail_msg: This role prepares a WireGuard profile and split DNS for macOS only.
  tags:
    - prepare
    - dns

- name: Validate WireGuard client DNS settings
  ansible.builtin.assert:
    that:
      - wireguard_admin_dns_mode in ['split', 'system']
      - wireguard_admin_dns_servers is sequence
      - wireguard_admin_dns_servers is not string
      - wireguard_admin_dns_servers | length > 0
      - wireguard_admin_dns_domain is match('^(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}$')
    fail_msg: Choose split or system DNS, a nonempty server list, and a valid private DNS suffix.
  tags:
    - prepare
    - dns

- name: Validate private DNS server addresses
  ansible.builtin.assert:
    that:
      - item is match('^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
      - item in (wireguard_admin_peers | map(attribute='address') | list)
    fail_msg: Each DNS server must be an IPv4 address reachable through a configured peer.
  loop: "{{ wireguard_admin_dns_servers }}"
  tags:
    - prepare
    - dns

- name: Validate WireGuard admin peer inventory
  ansible.builtin.assert:
    that:
      - wireguard_admin_peers | length == 3
      - item.public_key | length > 0
      - item.public_key is match('^[A-Za-z0-9+/]{43}=$')
      - item.endpoint | length > 0
      - item.address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - item.address is not search('/')
    fail_msg: Peer {{ item.name }} must have a WireGuard public key, endpoint, and bare IPv4 address.
  loop: "{{ wireguard_admin_peers }}"
  loop_control:
    label: "{{ item.name }}"
  tags: prepare

- name: Validate unique WireGuard admin peer addresses and keys
  ansible.builtin.assert:
    that:
      - (wireguard_admin_peers | map(attribute='address') | list | unique | length) == (wireguard_admin_peers | length)
      - (wireguard_admin_peers | map(attribute='public_key') | list | unique | length) == (wireguard_admin_peers | length)
    fail_msg: WireGuard admin peer addresses and public keys must be unique.
  tags: prepare

- name: Create WireGuard app configuration directory
  ansible.builtin.file:
    path: "{{ wireguard_admin_config_dir }}"
    state: directory
    mode: '0700'
  tags: prepare

- name: Check for existing Mac private key
  ansible.builtin.stat:
    path: "{{ wireguard_admin_private_key_path }}"
  register: wireguard_admin_private_key_stat
  tags: prepare

- name: Generate Mac private key
  ansible.builtin.command: wg genkey
  register: wireguard_admin_generated_private_key
  changed_when: true
  no_log: true
  when: not wireguard_admin_private_key_stat.stat.exists
  tags: prepare

- name: Save generated Mac private key
  ansible.builtin.copy:
    content: "{{ wireguard_admin_generated_private_key.stdout | trim }}\n"
    dest: "{{ wireguard_admin_private_key_path }}"
    mode: '0600'
    force: false
  no_log: true
  when: not wireguard_admin_private_key_stat.stat.exists
  tags: prepare

- name: Enforce Mac private key permissions
  ansible.builtin.file:
    path: "{{ wireguard_admin_private_key_path }}"
    state: file
    mode: '0600'
  no_log: true
  tags: prepare

- name: Read Mac private key
  ansible.builtin.slurp:
    src: "{{ wireguard_admin_private_key_path }}"
  register: wireguard_admin_private_key_contents
  no_log: true
  tags: prepare

- name: Normalize Mac private key fact
  ansible.builtin.set_fact:
    wireguard_admin_private_key: "{{ wireguard_admin_private_key_contents.content | b64decode | trim }}"
  no_log: true
  tags: prepare

- name: Derive Mac public key
  ansible.builtin.command: wg pubkey
  args:
    stdin: "{{ wireguard_admin_private_key }}\n"
  register: wireguard_admin_public_key_command
  changed_when: false
  no_log: true
  tags: prepare

- name: Save Mac public key beside private key
  ansible.builtin.copy:
    content: "{{ wireguard_admin_public_key_command.stdout | trim }}\n"
    dest: "{{ wireguard_admin_public_key_path }}"
    mode: '0644'
  no_log: true
  tags: prepare

- name: Render WireGuard Mac profile
  ansible.builtin.template:
    src: wg-socrat-admin.conf.j2
    dest: "{{ wireguard_admin_profile_path }}"
    mode: '0600'
  no_log: true
  tags: prepare

- name: Show Mac public key for separate server inventory update
  ansible.builtin.debug:
    msg: "WireGuard admin Mac public key: {{ wireguard_admin_public_key_command.stdout | trim }}"
  tags: prepare

- name: Create managed macOS resolver directory
  become: true
  ansible.builtin.file:
    path: "{{ wireguard_admin_resolver_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: '0755'
  when: wireguard_admin_dns_mode == 'split'
  tags: dns

- name: Install split DNS for the complete Socrat private domain
  become: true
  ansible.builtin.copy:
    dest: "{{ wireguard_admin_resolver_dir }}/{{ wireguard_admin_dns_domain }}"
    content: |
      {% for server in wireguard_admin_dns_servers %}
      nameserver {{ server }}
      {% endfor %}
      timeout {{ wireguard_admin_dns_timeout }}
      options attempts:{{ wireguard_admin_dns_attempts }}
    owner: root
    group: wheel
    mode: '0644'
  when: wireguard_admin_dns_mode == 'split'
  tags: dns
