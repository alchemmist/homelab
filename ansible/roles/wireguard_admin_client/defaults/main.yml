wireguard_admin_interface_name: wg-socrat-admin
wireguard_admin_profile_name: wg-socrat-admin.conf
wireguard_admin_address: 10.250.0.4/32
wireguard_admin_keepalive: 25
wireguard_admin_config_dir: "{{ ansible_env.HOME }}/Library/Application Support/WireGuard/Configurations"
wireguard_admin_private_key_path: "{{ wireguard_admin_config_dir }}/wg-socrat-admin.key"
wireguard_admin_public_key_path: "{{ wireguard_admin_config_dir }}/wg-socrat-admin.key.pub"
wireguard_admin_profile_path: "{{ wireguard_admin_config_dir }}/{{ wireguard_admin_profile_name }}"
wireguard_admin_resolver_dir: /etc/resolver
wireguard_admin_dns_timeout: 6
wireguard_admin_dns_attempts: 1
wireguard_admin_peers:
  - name: socrat-0
    address: 10.250.0.1
    endpoint: 109.173.40.247:51830
    public_key: "{{ (wg_socrat_nodes | default({})).get('socrat-0', {}).get('public_key', '') }}"
  - name: socrat-1
    address: 10.250.0.3
    endpoint: 109.173.40.247:51831
    public_key: "{{ (wg_socrat_nodes | default({})).get('socrat-1', {}).get('public_key', '') }}"
  - name: socrat-2
    address: 10.250.0.2
    endpoint: 176.98.185.59:51830
    public_key: "{{ (wg_socrat_nodes | default({})).get('socrat-2', {}).get('public_key', '') }}"
