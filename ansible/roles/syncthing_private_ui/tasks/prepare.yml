- name: Require a registered WireGuard address for every Socrat node
  ansible.builtin.assert:
    that:
      - groups['Socrat'] | difference(wg_socrat_nodes.keys() | list) | length == 0
      - wg_socrat_nodes | length > 0

- name: Initialize private Syncthing node registry
  ansible.builtin.set_fact:
    syncthing_private_ui_nodes: []

- name: Require every enrolled Syncthing node to have a WireGuard address
  ansible.builtin.assert:
    that:
      - syncthing_private_ui_enrolled_nodes | length > 0
      - (syncthing_private_ui_enrolled_nodes + syncthing_private_ui_gateway_nodes) | difference(wg_socrat_nodes.keys() | list) | length == 0

- name: Derive private Syncthing endpoints from the enrolled nodes
  ansible.builtin.set_fact:
    syncthing_private_ui_nodes: "{{ syncthing_private_ui_nodes + [{'nodeName': item, 'host': item.split('-')[-1] ~ '.' ~ homelab_ssh_public_host, 'wgIP': wg_socrat_nodes[item].address}] }}"
  loop: "{{ syncthing_private_ui_enrolled_nodes + syncthing_private_ui_gateway_nodes }}"
  loop_control:
    label: "{{ item }}"

- name: Copy the Syncthing chart to the controller
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../charts/syncthing/"
    dest: "{{ syncthing_private_ui_chart_dir }}/"
    mode: preserve

- name: Generate private Syncthing Helm values
  ansible.builtin.copy:
    dest: "{{ syncthing_private_ui_values_path }}"
    content: "{{ {'replicaCount': 1, 'nodeSelector': {'kubernetes.io/hostname': syncthing_private_ui_enrolled_nodes[0]}, 'privateGui': {'enabled': true, 'gatewayOnlyNodes': syncthing_private_ui_gateway_nodes, 'nodes': syncthing_private_ui_nodes, 'extraVirtualHosts': syncthing_private_ui_extra_virtual_hosts, 'listenPort': syncthing_private_ui_port, 'healthPort': syncthing_private_ui_health_port, 'tlsSecret': syncthing_private_ui_tls_secret, 'certificate': {'enabled': true, 'commonName': syncthing_private_ui_nodes[0].host, 'clusterIssuer': syncthing_private_ui_cluster_issuer}}, 'ingress': {'enabled': false}, 'basicAuth': {'enabled': true, 'existingSecret': syncthing_private_ui_auth_secret}} | to_nice_yaml }}"
    mode: '0600'

- name: Install the private manifest comparison utility
  ansible.builtin.copy:
    src: "{{ role_path }}/../../files/helm_manifest_changed.py"
    dest: "{{ syncthing_private_ui_chart_dir }}/check-installed-manifest.py"
    mode: '0644'
