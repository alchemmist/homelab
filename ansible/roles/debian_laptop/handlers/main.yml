---

- name: Compile the wallpaper defaults
  ansible.builtin.command: dconf update
  changed_when: true

- name: Validate the complete SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Reload SSH after updating the session locale
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
...
