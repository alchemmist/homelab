---
- name: Automatically log the server account into GNOME
  community.general.ini_file:
    path: /etc/gdm3/daemon.conf
    section: daemon
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  loop:
    - {option: AutomaticLoginEnable, value: 'true'}
    - {option: AutomaticLogin, value: alchemmist}

- name: Select GNOME only when it is the requested desktop
  community.general.ini_file:
    path: /var/lib/AccountsService/users/alchemmist
    section: User
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: '0600'
    backup: true
  loop:
    - {key: XSession, value: gnome}
    - {key: Session, value: gnome}
    - {key: SessionType, value: wayland}
  when: homelab_laptop_desktop == 'gnome'

- name: Restore the GNOME user session preference when selected
  community.general.ini_file:
    path: "{{ homelab_user_home }}/.dmrc"
    section: Desktop
    option: Session
    value: gnome
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0644'
  when: homelab_laptop_desktop == 'gnome'

- name: Create the package cache for the pinned system monitor
  ansible.builtin.file:
    path: /var/cache/homelab
    state: directory
    mode: '0755'

- name: Download the official bottom package with checksum verification
  ansible.builtin.get_url:
    url: https://github.com/ClementTsang/bottom/releases/download/0.14.9/bottom_0.14.9-1_amd64.deb
    checksum: sha256:e8312526746c1190c3433e6ce0843f64c6e0c501003ee377552745c040dc6d56
    dest: /var/cache/homelab/bottom_0.14.9-1_amd64.deb
    mode: '0644'

- name: Install the verified monitor package
  ansible.builtin.apt:
    deb: /var/cache/homelab/bottom_0.14.9-1_amd64.deb

- name: Reuse the shared terminal and monitoring configuration
  ansible.builtin.import_role:
    name: desktop_terminal

- name: Create the GNOME account autostart directory
  ansible.builtin.file:
    path: /home/alchemmist/.config/autostart
    state: directory
    owner: alchemmist
    group: alchemmist
    mode: '0755'

- name: Start the shared monitor terminal after graphical login
  ansible.builtin.copy:
    dest: /home/alchemmist/.config/autostart/homelab-monitor.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=Homelab monitor
      Exec=/usr/local/bin/homelab-monitor-terminal
      Terminal=false
      OnlyShowIn=GNOME;
      X-GNOME-Autostart-enabled=true
    owner: alchemmist
    group: alchemmist
    mode: '0644'
