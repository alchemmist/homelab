---
- name: Install Internet clock synchronization
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Configure the Debian Internet time pool
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool\s+\S*debian\.pool\.ntp\.org\b'
    line: pool 2.debian.pool.ntp.org iburst
    owner: root
    group: root
    mode: '0644'
  register: homelab_chrony_pool

- name: Use the local administration timezone
  community.general.timezone:
    name: Europe/Moscow

- name: Enable Internet clock synchronization at boot
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: "{{ 'restarted' if homelab_chrony_pool.changed else 'started' }}"

- name: Wait for the clock to synchronize
  ansible.builtin.command: chronyc waitsync 12 0.1 0 5
  changed_when: false
  when: not ansible_check_mode

- name: Verify that a network time source is selected
  ansible.builtin.command: chronyc -n sources
  register: homelab_chrony_sources
  changed_when: false
  failed_when: >-
    homelab_chrony_sources.rc != 0 or
    (homelab_chrony_sources.stdout_lines | select('match', '^\^\*\s') | list | length) == 0
  when: not ansible_check_mode
