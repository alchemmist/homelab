- name: Require macOS
  ansible.builtin.assert:
    that: ansible_system == 'Darwin'

- name: Ordinary public Wiki access needs no workstation DNS changes
  ansible.builtin.debug:
    msg: Use https://wiki.socrat.alchemmist.xyz with native OIDC roles; no local resolver is required.
  when: not (wiki_editor_client_private_dns_legacy | default(false) | bool)

- name: Explicit legacy private-DNS recovery only (never normal onboarding)
  ansible.builtin.include_tasks: legacy-resolver.yml
  when: wiki_editor_client_private_dns_legacy | default(false) | bool
