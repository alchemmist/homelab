- name: Require macOS
  ansible.builtin.assert:
    that: ansible_system == 'Darwin'

- name: Read existing exact-host resolver
  ansible.builtin.stat:
    path: /etc/resolver/wiki.socrat.alchemmist.xyz
  register: wiki_editor_resolver

- name: Read resolver ownership marker
  ansible.builtin.stat:
    path: /var/db/socrat-wiki-resolver-owned
  register: wiki_editor_resolver_marker

- name: Preserve unmanaged resolvers
  ansible.builtin.assert:
    that: not wiki_editor_resolver.stat.exists or wiki_editor_resolver_marker.stat.exists
    fail_msg: An unmanaged exact-host wiki resolver exists; inspect and migrate it before installing the lifecycle service.

- name: Create executable directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: wheel
    mode: '0755'

- name: Install resolver updater
  ansible.builtin.copy:
    src: wiki-editor-resolver.sh
    dest: /usr/local/libexec/socrat-wiki-resolver
    owner: root
    group: wheel
    mode: '0755'

- name: Install launch daemon
  ansible.builtin.copy:
    src: xyz.alchemmist.wiki-resolver.plist
    dest: /Library/LaunchDaemons/xyz.alchemmist.wiki-resolver.plist
    owner: root
    group: wheel
    mode: '0644'
  register: wiki_editor_resolver_launch

- name: Inspect launch daemon
  ansible.builtin.command: launchctl print system/xyz.alchemmist.wiki-resolver
  register: wiki_editor_resolver_loaded
  changed_when: false
  failed_when: false

- name: Unload changed launch daemon
  ansible.builtin.command: launchctl bootout system/xyz.alchemmist.wiki-resolver
  when: wiki_editor_resolver_launch.changed and wiki_editor_resolver_loaded.rc == 0

- name: Load launch daemon
  ansible.builtin.command: launchctl bootstrap system /Library/LaunchDaemons/xyz.alchemmist.wiki-resolver.plist
  when: wiki_editor_resolver_launch.changed or wiki_editor_resolver_loaded.rc != 0

- name: Reconcile resolver immediately
  ansible.builtin.command: /usr/local/libexec/socrat-wiki-resolver
  changed_when: false
