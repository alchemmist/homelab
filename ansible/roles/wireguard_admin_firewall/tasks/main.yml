---
- name: Require Linux for the WireGuard administrative firewall
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
    fail_msg: The WireGuard administrative firewall requires Linux iptables.

- name: Validate administrative client registry
  ansible.builtin.assert:
    that:
      - item.value.address is match('^[0-9]+(\\.[0-9]+){3}$')
      - item.value.public_key | default('') | length > 0
    fail_msg: Administrative client {{ item.key }} must have an IPv4 address and public key.
  loop: "{{ wg_socrat_admin_clients | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate administrative forwarding registry
  ansible.builtin.assert:
    that:
      - item.client in wg_socrat_admin_clients
      - item.destination in wg_socrat_nodes
      - inventory_hostname in wg_socrat_nodes
      - item.destination != inventory_hostname
      - item.tcp_ports is sequence
      - item.tcp_ports is not string
      - item.tcp_ports | length > 0
      - item.tcp_ports | map('int') | min >= 1
      - item.tcp_ports | map('int') | max <= 65535
      - item.tcp_ports | select('integer') | list | length == item.tcp_ports | length
    fail_msg: Administrative forwarding requires registered endpoints and explicit integer TCP ports.
  loop: "{{ wg_socrat_admin_forward_rules }}"

- name: Install WireGuard administrative firewall script
  ansible.builtin.file:
    path: "{{ wg_socrat_admin_firewall_script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install WireGuard administrative firewall script
  ansible.builtin.template:
    src: wg-socrat-admin-firewall.sh.j2
    dest: "{{ wg_socrat_admin_firewall_script_path }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart WireGuard administrative firewall

- name: Install WireGuard administrative firewall systemd unit
  ansible.builtin.template:
    src: wg-socrat-admin-firewall.service.j2
    dest: "/etc/systemd/system/{{ wg_socrat_admin_firewall_service_name }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart WireGuard administrative firewall

- name: Enable WireGuard administrative firewall
  ansible.builtin.systemd_service:
    name: "{{ wg_socrat_admin_firewall_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
