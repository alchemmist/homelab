---
- name: Inspect storage node disk and available memory
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import os
        disk = os.statvfs("/var/lib/rancher/k3s/storage")
        memory = dict(line.split(":", 1) for line in open("/proc/meminfo"))
        print(json.dumps({"disk_available": disk.f_bavail * disk.f_frsize, "memory_available": int(memory["MemAvailable"].split()[0]) * 1024}))
  delegate_to: "{{ monitoring_storage_node }}"
  register: monitoring_node_capacity
  changed_when: false

- name: Require storage and memory headroom
  ansible.builtin.assert:
    that:
      - (monitoring_node_capacity.stdout | from_json).disk_available | int >= monitoring_minimum_available_disk_bytes | int
      - (monitoring_node_capacity.stdout | from_json).memory_available | int >= monitoring_minimum_available_memory_bytes | int
    fail_msg: Monitoring requires 30 GiB free disk and 3 GiB available RAM on its storage node.

- name: Read monitoring storage node
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", get, node, "{{ monitoring_storage_node }}", -o, json]
  register: monitoring_node
  changed_when: false

- name: Require a ready storage node without disk pressure
  ansible.builtin.assert:
    that:
      - (monitoring_node.stdout | from_json).status.conditions | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first == 'True'
      - (monitoring_node.stdout | from_json).status.conditions | selectattr('type', 'equalto', 'DiskPressure') | map(attribute='status') | first == 'False'

- name: Verify the explicit local storage class
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", get, storageclass, local-path, -o, json]
  register: monitoring_storage_class
  changed_when: false

- name: Require local storage with delayed binding
  ansible.builtin.assert:
    that:
      - (monitoring_storage_class.stdout | from_json).provisioner == 'rancher.io/local-path'
      - (monitoring_storage_class.stdout | from_json).volumeBindingMode == 'WaitForFirstConsumer'

- name: Create the monitoring deployment directory
  ansible.builtin.file:
    path: "{{ monitoring_directory }}"
    state: directory
    mode: '0700'

- name: Apply the monitoring namespace
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", apply, -f, '-']
    stdin: "{{ {'apiVersion': 'v1', 'kind': 'Namespace', 'metadata': {'name': monitoring_namespace, 'annotations': {'management.cattle.io/system-namespace': 'true'}}} | to_json }}"
  register: monitoring_namespace_apply
  changed_when: "'unchanged' not in monitoring_namespace_apply.stdout"

- name: Copy the idempotent Grafana credential initializer
  ansible.builtin.copy:
    src: ensure_admin_secret.py
    dest: "{{ monitoring_directory }}/ensure_admin_secret.py"
    mode: '0600'

- name: Initialize the Grafana administrator secret only when absent
  ansible.builtin.command:
    argv: [python3, "{{ monitoring_directory }}/ensure_admin_secret.py", "{{ monitoring_k3s_binary }}", "{{ monitoring_kubeconfig }}", "{{ monitoring_namespace }}", "{{ monitoring_grafana_admin_secret }}"]
  register: monitoring_admin_secret
  changed_when: monitoring_admin_secret.stdout == 'created'
  no_log: true

- name: Copy the versioned monitoring values
  ansible.builtin.copy:
    src: "{{ monitoring_values_source }}"
    dest: "{{ monitoring_directory }}/values.yaml"
    mode: '0600'

- name: Copy the original Socrat brand image
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/monitoring/branding/socrat-cover.png"
    dest: "{{ monitoring_directory }}/socrat-cover.png"
    mode: '0644'

- name: Publish the private Grafana branding asset
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import subprocess
        import sys
        command = [sys.argv[1], 'kubectl', '--kubeconfig', sys.argv[2], '-n', sys.argv[3]]
        desired = subprocess.check_output(command + ['create', 'configmap', 'socrat-branding', '--from-file=socrat-cover.png=' + sys.argv[4], '--dry-run=client', '-o', 'json'])
        result = subprocess.run(command + ['apply', '-f', '-'], input=desired, check=True, capture_output=True)
        print(result.stdout.decode().strip())
      - "{{ monitoring_k3s_binary }}"
      - "{{ monitoring_kubeconfig }}"
      - "{{ monitoring_namespace }}"
      - "{{ monitoring_directory }}/socrat-cover.png"
  register: monitoring_branding_asset
  changed_when: "'unchanged' not in monitoring_branding_asset.stdout"

- name: Install the stable node series dashboard renderer
  ansible.builtin.copy:
    src: stable_node_series.py
    dest: "{{ monitoring_directory }}/stable_node_series.py"
    mode: '0700'

- name: Install the dashboard description helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/dashboard_descriptions.py"
    dest: "{{ monitoring_directory }}/dashboard_descriptions.py"
    mode: '0600'

- name: Install the versioned dashboard descriptions
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/monitoring/dashboard-descriptions/"
    dest: "{{ monitoring_directory }}/dashboard-descriptions/"
    mode: '0600'
    directory_mode: '0700'

- name: Verify the dashboard renderer YAML dependency
  ansible.builtin.command: python3 -c 'import yaml'
  changed_when: false

- name: Copy the Prometheus relocate helper
  ansible.builtin.copy:
    src: prometheus_relocate.py
    dest: "{{ monitoring_directory }}/prometheus_relocate.py"
    mode: '0700'

- name: Read the Prometheus node requested by the values
  ansible.builtin.set_fact:
    monitoring_prometheus_desired_node: "{{ (lookup('file', monitoring_values_source) | from_yaml).prometheus.prometheusSpec.nodeSelector['kubernetes.io/hostname'] }}"

- name: Read Prometheus pods
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", -n, "{{ monitoring_namespace }}", get, pods, -l, app.kubernetes.io/name=prometheus, -o, json]
  register: monitoring_prometheus_pods
  changed_when: false
  failed_when: false

- name: Read persistent volumes
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", get, pv, -o, json]
  register: monitoring_persistent_volumes
  changed_when: false

- name: Decide whether the Prometheus volume can move
  ansible.builtin.command:
    argv: [python3, "{{ monitoring_directory }}/prometheus_relocate.py"]
    stdin: "{{ {'desired': monitoring_prometheus_desired_node, 'relocate': monitoring_prometheus_relocate | bool, 'pods': ((monitoring_prometheus_pods.stdout | from_json).items if monitoring_prometheus_pods.rc == 0 else []), 'volumes': (monitoring_persistent_volumes.stdout | from_json).items} | to_json }}"
  register: monitoring_prometheus_decision
  changed_when: false

- name: Remember the Prometheus volume decision
  ansible.builtin.set_fact:
    monitoring_prometheus_action: "{{ (monitoring_prometheus_decision.stdout | from_json).action }}"
    monitoring_prometheus_claim: "{{ (monitoring_prometheus_decision.stdout | from_json).claim | default('', true) }}"

- name: Refuse to retarget Prometheus while its volume is still on socrat-1
  ansible.builtin.fail:
    msg: Rerun with -e monitoring_prometheus_relocate=true. That deletes only the Prometheus TSDB PVC and the current 30-second history. Grafana and Alertmanager volumes stay on socrat-1.
  when: monitoring_prometheus_action == 'refuse'

- name: Require the Thanos raw bucket before deleting the Prometheus volume
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", -n, "{{ monitoring_namespace }}", get, "{{ item }}"]
  loop:
    - secret/thanos-objstore-raw
    - deployment/thanos-query
  when: monitoring_prometheus_action == 'relocate'
  changed_when: false

- name: Require the raw Thanos directory before deleting the Prometheus volume
  ansible.builtin.stat:
    path: /var/lib/socrat-thanos
  register: monitoring_thanos_raw_directory
  when: monitoring_prometheus_action == 'relocate'

- name: Stop if the raw Thanos directory is missing
  ansible.builtin.assert:
    that:
      - monitoring_thanos_raw_directory.stat.isdir | default(false)
    fail_msg: /var/lib/socrat-thanos must exist on socrat-0 before the Prometheus volume is deleted.
  when: monitoring_prometheus_action == 'relocate'

- name: Install the pinned monitoring stack
  ansible.builtin.command:
    argv:
      - "{{ monitoring_helm_binary }}"
      - upgrade
      - --install
      - "{{ monitoring_release }}"
      - kube-prometheus-stack
      - --repo
      - "{{ monitoring_chart_repository }}"
      - --version
      - "{{ monitoring_chart_version }}"
      - --namespace
      - "{{ monitoring_namespace }}"
      - --kubeconfig
      - "{{ monitoring_kubeconfig }}"
      - --values
      - "{{ monitoring_directory }}/values.yaml"
      - --post-renderer
      - "{{ monitoring_directory }}/stable_node_series.py"
      - "{{ '--wait=false' if monitoring_prometheus_action == 'relocate' else ('--wait' if monitoring_wait_for_daemonsets | bool else '--wait=false') }}"
      - --timeout
      - 12m
      - --history-max
      - '5'
  register: monitoring_helm_install
  changed_when: true

- name: Delete the Prometheus pod that is still attached to socrat-1
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", -n, "{{ monitoring_namespace }}", delete, pod, prometheus-kube-prometheus-stack-prometheus-0, --ignore-not-found, --wait=true, --timeout=180s]
  when: monitoring_prometheus_action == 'relocate'
  changed_when: true

- name: Delete only the Prometheus TSDB claim bound to socrat-1
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", -n, "{{ monitoring_namespace }}", delete, pvc, "{{ monitoring_prometheus_claim }}", --wait=true, --timeout=180s]
  when: monitoring_prometheus_action == 'relocate' and monitoring_prometheus_claim | length > 0
  changed_when: true

- name: Recreate Prometheus so the new claim binds on socrat-0
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", -n, "{{ monitoring_namespace }}", delete, pod, prometheus-kube-prometheus-stack-prometheus-0, --ignore-not-found, --wait=true, --timeout=180s]
  when: monitoring_prometheus_action == 'relocate'
  changed_when: true

- name: Discover monitoring workloads
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", -n, "{{ monitoring_namespace }}", get, 'deployment,statefulset,daemonset', -o, name]
  register: monitoring_workloads
  changed_when: false

- name: Wait for every monitoring workload
  ansible.builtin.command:
    argv: ["{{ monitoring_k3s_binary }}", kubectl, --kubeconfig, "{{ monitoring_kubeconfig }}", -n, "{{ monitoring_namespace }}", rollout, status, "{{ item }}", --timeout=300s]
  loop: "{{ monitoring_workloads.stdout_lines }}"
  when: monitoring_wait_for_daemonsets | bool or not item.startswith('daemonset.apps/')
  changed_when: false
