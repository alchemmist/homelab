---
- name: Refuse the retired combined monitoring installer
  ansible.builtin.fail:
    msg: >-
      The combined monitoring Helm installer is retired. Use the Argo Applications
      prometheus, alertmanager, prometheus-operator, node-exporter, kube-state-metrics
      and grafana. Edit their charts and commit/push. Restore prerequisites/Secrets
      separately under the appropriate runbook; do not upgrade or uninstall the
      historical kube-prometheus-stack Helm release.
  tags: [always]
