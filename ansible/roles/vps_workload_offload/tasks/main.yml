---
# img-proxy is managed by Argo CD and pinned to socrat-2; do not offload it.
- name: Converge and verify each selected deployment sequentially
  ansible.builtin.include_tasks: deployment.yml
  loop:
    - namespace: kube-system
      name: metrics-server
    - namespace: kube-system
      name: local-path-provisioner
  loop_control:
    loop_var: offload_workload

- name: Verify the aggregated metrics API after relocation
  ansible.builtin.command:
    argv: [kubectl, get, --raw, /apis/metrics.k8s.io/v1beta1/nodes]
  register: offload_metrics_api
  until: offload_metrics_api.rc == 0 and (offload_metrics_api.stdout | from_json).get('items', []) | length > 0
  retries: 12
  delay: 5
  changed_when: false
