---
- name: Set primary hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: inventory_hostname in ['socrat-0', 'socrat-1', 'socrat-2']
  become: true

- name: Remove legacy unmanaged master host alias line
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^192\.168\.0\.23\s+socrat-master\s+socrat-0$'
    state: absent
  become: true

- name: Manage homelab host aliases
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} HOMELAB HOST ALIASES"
    block: |
      192.168.0.23    socrat-0 socrat-master
      192.168.0.24    socrat-1
      10.250.0.2      socrat-2
  become: true
