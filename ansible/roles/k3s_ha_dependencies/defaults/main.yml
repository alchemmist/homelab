---
k3s_ha_dependencies_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_ha_dependencies_nodes:
  - socrat-0
  - socrat-1
  - socrat-5
# Two replicas, three eligible home nodes. Losing any one node still leaves a
# place for the replacement. socrat-3 is a worker that can disappear; socrat-2
# is too small for these control-plane addons.
k3s_ha_dependencies_coredns_nodes:
  - socrat-0
  - socrat-1
  - socrat-5
k3s_ha_dependencies_deployments:
  - namespace: kube-system
    name: coredns
  - namespace: cattle-system
    name: rancher-webhook
  - namespace: cert-manager
    name: cert-manager
  - namespace: cert-manager
    name: cert-manager-cainjector
  - namespace: cert-manager
    name: cert-manager-webhook
# K3s API servers which write packaged AddOns, not the desired DNS pod nodes.
k3s_ha_dependencies_manifest_servers:
  - socrat-0
  - socrat-1
  - socrat-5
k3s_ha_dependencies_cert_manager_chart_version: v1.16.2
...
