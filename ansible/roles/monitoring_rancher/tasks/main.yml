---
- name: Create monitoring integration staging directory
  ansible.builtin.file:
    path: "{{ monitoring_rancher_workdir }}"
    state: directory
    mode: "0700"

- name: Download verified Rancher dashboards chart
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/rancher/charts/release-v2.15/assets/rancher-monitoring-dashboards/rancher-monitoring-dashboards-{{ monitoring_rancher_chart_version }}.tgz"
    dest: "{{ monitoring_rancher_workdir }}/rancher-monitoring-dashboards-{{ monitoring_rancher_chart_version }}.tgz"
    checksum: "sha256:{{ monitoring_rancher_chart_sha256 }}"
    mode: "0600"

- name: Stage Rancher dashboard integration values
  ansible.builtin.copy:
    src: "{{ monitoring_rancher_repo_root }}/deploy/monitoring/rancher-values.yaml"
    dest: "{{ monitoring_rancher_workdir }}/rancher-values.yaml"
    mode: "0600"

- name: Install Rancher dashboard integration
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - rancher-monitoring-dashboards
      - "{{ monitoring_rancher_workdir }}/rancher-monitoring-dashboards-{{ monitoring_rancher_chart_version }}.tgz"
      - --namespace
      - "{{ monitoring_rancher_namespace }}"
      - --values
      - "{{ monitoring_rancher_workdir }}/rancher-values.yaml"
      - --wait
      - --timeout
      - 10m
      - --atomic
  environment:
    KUBECONFIG: "{{ monitoring_rancher_kubeconfig }}"

- name: Restrict the public Grafana route
  when: monitoring_rancher_public_ingress_enabled | bool
  block:
    - name: Stage protected Grafana access chart
      ansible.builtin.copy:
        src: "{{ monitoring_rancher_repo_root }}/charts/monitoring-access/"
        dest: "{{ monitoring_rancher_workdir }}/monitoring-access/"
        mode: "0600"
        directory_mode: "0700"

    - name: Install protected Grafana ingress
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - monitoring-access
          - "{{ monitoring_rancher_workdir }}/monitoring-access"
          - --namespace
          - "{{ monitoring_rancher_namespace }}"
          - --set-string
          - "host={{ monitoring_rancher_grafana_host }}"
          - --wait
          - --timeout
          - 5m
          - --atomic
      environment:
        KUBECONFIG: "{{ monitoring_rancher_kubeconfig }}"

    - name: Wait for the trusted Grafana certificate
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ monitoring_rancher_kubeconfig }}"
          - -n
          - "{{ monitoring_rancher_namespace }}"
          - wait
          - --for=condition=Ready
          - certificate/grafana-public-tls
          - --timeout=300s
      changed_when: false

    - name: Verify the public Grafana route is denied
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --noproxy
          - '*'
          - --max-time
          - '10'
          - --resolve
          - "{{ monitoring_rancher_grafana_host }}:443:{{ monitoring_rancher_public_address }}"
          - --output
          - /dev/null
          - --write-out
          - '%{http_code}'
          - "https://{{ monitoring_rancher_grafana_host }}/api/health"
      register: monitoring_public_probe
      failed_when: monitoring_public_probe.rc != 0 or monitoring_public_probe.stdout != '403'
      changed_when: false

    - name: Remove the obsolete ingress password hash
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ monitoring_rancher_kubeconfig }}"
          - -n
          - "{{ monitoring_rancher_namespace }}"
          - delete
          - secret
          - grafana-ingress-auth
          - --ignore-not-found
      register: monitoring_old_ingress_secret
      changed_when: "'deleted' in monitoring_old_ingress_secret.stdout"
