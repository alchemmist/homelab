---
- name: Create monitoring integration staging directory
  ansible.builtin.file:
    path: "{{ monitoring_rancher_workdir }}"
    state: directory
    mode: "0700"

- name: Download verified Rancher dashboards chart
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/rancher/charts/release-v2.15/assets/rancher-monitoring-dashboards/rancher-monitoring-dashboards-{{ monitoring_rancher_chart_version }}.tgz"
    dest: "{{ monitoring_rancher_workdir }}/rancher-monitoring-dashboards-{{ monitoring_rancher_chart_version }}.tgz"
    checksum: "sha256:{{ monitoring_rancher_chart_sha256 }}"
    mode: "0600"

- name: Stage Rancher dashboard integration values
  ansible.builtin.copy:
    src: "{{ monitoring_rancher_repo_root }}/deploy/monitoring/rancher-values.yaml"
    dest: "{{ monitoring_rancher_workdir }}/rancher-values.yaml"
    mode: "0600"

- name: Install the node name dashboard renderer
  ansible.builtin.copy:
    src: name_node_series.py
    dest: "{{ monitoring_rancher_workdir }}/name_node_series.py"
    mode: "0700"

- name: Verify the dashboard renderer YAML dependency
  ansible.builtin.command: python3 -c 'import yaml'
  changed_when: false

- name: Install Rancher dashboard integration
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - rancher-monitoring-dashboards
      - "{{ monitoring_rancher_workdir }}/rancher-monitoring-dashboards-{{ monitoring_rancher_chart_version }}.tgz"
      - --namespace
      - "{{ monitoring_rancher_namespace }}"
      - --values
      - "{{ monitoring_rancher_workdir }}/rancher-values.yaml"
      - --post-renderer
      - "{{ monitoring_rancher_workdir }}/name_node_series.py"
      - --wait
      - --timeout
      - 10m
      - --atomic
  environment:
    KUBECONFIG: "{{ monitoring_rancher_kubeconfig }}"

- name: Inspect the obsolete public Grafana release
  ansible.builtin.command:
    argv: [helm, list, --namespace, "{{ monitoring_rancher_namespace }}", --kubeconfig, "{{ monitoring_rancher_kubeconfig }}", --filter, '^monitoring-access$', --output, json]
  register: monitoring_public_release
  changed_when: false

- name: Remove the obsolete public Grafana ingress release
  ansible.builtin.command:
    argv: [helm, uninstall, monitoring-access, --namespace, "{{ monitoring_rancher_namespace }}", --kubeconfig, "{{ monitoring_rancher_kubeconfig }}", --wait, --timeout, 2m]
  when: monitoring_public_release.stdout | from_json | length > 0
  changed_when: true

- name: Remove obsolete public Grafana resources
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ monitoring_rancher_kubeconfig }}", -n, "{{ monitoring_rancher_namespace }}", delete, "{{ item }}", --ignore-not-found]
  loop:
    - ingress/grafana-public
    - middleware/grafana-local-only
    - middleware/grafana-auth
    - certificate/grafana-public-tls
    - secret/grafana-public-tls
    - secret/grafana-ingress-auth
  register: monitoring_public_cleanup
  changed_when: "'deleted' in monitoring_public_cleanup.stdout"

- name: Remove obsolete public ingress staging files
  ansible.builtin.file:
    path: "{{ monitoring_rancher_workdir }}/{{ item }}"
    state: absent
  loop:
    - monitoring-access
    - grafana_ingress_auth.py
