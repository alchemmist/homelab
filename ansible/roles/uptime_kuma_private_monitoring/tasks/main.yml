---
- name: Inspect the current Kuma deployment
  ansible.builtin.command:
    argv: [k3s, kubectl, --kubeconfig, "{{ kuma_private_kubeconfig }}", -n, "{{ kuma_private_namespace }}", get, deployment, "{{ kuma_private_deployment }}", -o, json]
  register: kuma_private_current
  changed_when: false

- name: Require a running singleton before maintenance
  ansible.builtin.assert:
    that:
      - (kuma_private_current.stdout | from_json).spec.replicas == 1
      - (kuma_private_current.stdout | from_json).spec.template.spec.hostNetwork | bool
      - (kuma_private_current.stdout | from_json).spec.template.spec.nodeSelector['kubernetes.io/hostname'] in groups['all']

- name: Locate the active database and evaluate DNS drift
  ansible.builtin.set_fact:
    kuma_private_node: "{{ (kuma_private_current.stdout | from_json).spec.template.spec.nodeSelector['kubernetes.io/hostname'] }}"
    kuma_private_data: "{{ ((kuma_private_current.stdout | from_json).spec.template.spec.volumes | selectattr('name', 'equalto', 'data') | first).hostPath.path }}"
    kuma_private_dns_changed: "{{ (kuma_private_current.stdout | from_json).spec.template.spec.dnsPolicy != 'None' or ((kuma_private_current.stdout | from_json).spec.template.spec.dnsConfig | default({}, true)) != kuma_private_dns }}"

- name: Verify private DNS and strict HTTPS from the existing Kuma container
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --kubeconfig
      - "{{ kuma_private_kubeconfig }}"
      - -n
      - "{{ kuma_private_namespace }}"
      - exec
      - "deployment/{{ kuma_private_deployment }}"
      - --
      - node
      - -e
      - |
        const https = require('https');
        const { Resolver } = require('dns').promises;
        const host = 'rancher.socrat.alchemmist.xyz';
        const resolver = new Resolver({timeout: 2000, tries: 1});
        resolver.setServers({{ kuma_private_dns.nameservers | to_json }});
        function probe(address) {
          return new Promise((resolve, reject) => {
            const request = https.get({hostname: address, servername: host, path: '/ping', headers: {Host: host}, timeout: 5000}, response => {
              let body = '';
              response.on('data', data => body += data);
              response.on('end', () => response.statusCode === 200 && body.trim() === 'pong' ? resolve() : reject(new Error('Unexpected Rancher response')));
            });
            request.on('error', reject);
            request.on('timeout', () => request.destroy(new Error('Rancher probe timed out')));
          });
        }
        (async () => {
          const addresses = await resolver.resolve4(host);
          if (!addresses.length || addresses.some(address => !['10.250.0.1', '10.250.0.3'].includes(address))) throw new Error('Rancher DNS did not return private ingress addresses');
          for (const address of addresses) {
            try { await probe(address); console.log('Private Rancher HTTPS responds with pong'); return; } catch (error) {}
          }
          throw new Error('No private Rancher endpoint is healthy');
        })().catch(error => { console.error(error.message); process.exitCode = 1; });
  changed_when: false

- name: Create the private maintenance directory
  ansible.builtin.file:
    path: "{{ kuma_private_workdir }}"
    state: directory
    mode: '0700'
  delegate_to: "{{ kuma_private_node }}"
  become: true

- name: Stage the targeted monitor migration
  ansible.builtin.copy:
    src: configure_monitor.py
    dest: "{{ kuma_private_workdir }}/configure_monitor.py"
    mode: '0700'
  delegate_to: "{{ kuma_private_node }}"
  become: true

- name: Inspect the Rancher monitor without changing the live database
  ansible.builtin.command:
    argv: [python3, "{{ kuma_private_workdir }}/configure_monitor.py", --db, "{{ kuma_private_data }}/kuma.db", --check]
  delegate_to: "{{ kuma_private_node }}"
  become: true
  register: kuma_private_monitor
  changed_when: false

- name: Update the monitor while the SQLite writer is stopped
  when: kuma_private_dns_changed | bool or (kuma_private_monitor.stdout | from_json).changed
  block:
    - name: Stop Kuma for the targeted database update
      ansible.builtin.command:
        argv: [k3s, kubectl, --kubeconfig, "{{ kuma_private_kubeconfig }}", -n, "{{ kuma_private_namespace }}", scale, deployment, "{{ kuma_private_deployment }}", --replicas=0]
      changed_when: true

    - name: Wait until the Kuma writer has exited
      ansible.builtin.command:
        argv: [k3s, kubectl, --kubeconfig, "{{ kuma_private_kubeconfig }}", -n, "{{ kuma_private_namespace }}", wait, --for=delete, pod, -l, app=uptime-kuma, --timeout=120s]
      changed_when: false

    - name: Back up the database and configure the existing Rancher monitor
      ansible.builtin.command:
        argv: [python3, "{{ kuma_private_workdir }}/configure_monitor.py", --db, "{{ kuma_private_data }}/kuma.db"]
      delegate_to: "{{ kuma_private_node }}"
      become: true
      register: kuma_private_migration
      changed_when: (kuma_private_migration.stdout | from_json).changed

    - name: Configure Kuma DNS without changing placement or other settings
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --kubeconfig
          - "{{ kuma_private_kubeconfig }}"
          - -n
          - "{{ kuma_private_namespace }}"
          - patch
          - deployment
          - "{{ kuma_private_deployment }}"
          - --type=merge
          - -p
          - "{{ {'spec': {'template': {'spec': {'dnsPolicy': 'None', 'dnsConfig': kuma_private_dns}}}} | to_json }}"
      changed_when: true
  always:
    - name: Ensure Kuma is running after maintenance
      ansible.builtin.command:
        argv: [k3s, kubectl, --kubeconfig, "{{ kuma_private_kubeconfig }}", -n, "{{ kuma_private_namespace }}", scale, deployment, "{{ kuma_private_deployment }}", --replicas=1]
      changed_when: true

    - name: Wait for Kuma to become available
      ansible.builtin.command:
        argv: [k3s, kubectl, --kubeconfig, "{{ kuma_private_kubeconfig }}", -n, "{{ kuma_private_namespace }}", rollout, status, "deployment/{{ kuma_private_deployment }}", --timeout=180s]
      changed_when: false

- name: Confirm the monitor settings after deployment
  ansible.builtin.command:
    argv: [python3, "{{ kuma_private_workdir }}/configure_monitor.py", --db, "{{ kuma_private_data }}/kuma.db", --check]
  delegate_to: "{{ kuma_private_node }}"
  become: true
  register: kuma_private_verified
  changed_when: false
  failed_when: (kuma_private_verified.stdout | from_json).changed

- name: Wait for a successful Rancher heartbeat
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sqlite3, sys
        connection = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True)
        row = connection.execute("SELECT status, time FROM heartbeat WHERE monitor_id = ? AND time >= datetime('now', '-3 minutes') ORDER BY id DESC LIMIT 1", (int(sys.argv[2]),)).fetchone()
        connection.close()
        print(json.dumps({'status': row[0], 'time': row[1]} if row else {}))
        sys.exit(0 if row and row[0] == 1 else 1)
      - "{{ kuma_private_data }}/kuma.db"
      - "{{ (kuma_private_verified.stdout | from_json).monitor_id | string }}"
  delegate_to: "{{ kuma_private_node }}"
  become: true
  register: kuma_private_heartbeat
  until: kuma_private_heartbeat.rc == 0
  retries: 12
  delay: 10
  changed_when: false
