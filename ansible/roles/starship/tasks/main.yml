---
- name: Check that starship is installed
  ansible.builtin.shell: command -v starship
  changed_when: false
  register: starship_binary

- name: Ensure machine-wide starship config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  become: true
  loop:
    - { path: /etc/starship, mode: "0755" }
    - { path: /etc/starship/bin, mode: "0755" }

- name: Deploy machine-wide starship.toml
  ansible.builtin.template:
    src: starship.toml.j2
    dest: /etc/starship/starship.toml
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true

- name: Deploy machine-wide starship helper scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/starship/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - arc_metrics.sh
    - arc_state.sh
    - arc-refresh.sh
    - arc_dots.sh
    - arc_status.sh
    - gh-prompt.py
    - arc-pr.py

- name: Export machine-wide STARSHIP_CONFIG for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/homelab-starship.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by homelab Ansible.
      export STARSHIP_CONFIG=/etc/starship/starship.toml
  become: true

- name: Check global zsh config directory
  ansible.builtin.stat:
    path: /etc/zsh
  register: global_zsh_dir

- name: Check global bashrc
  ansible.builtin.stat:
    path: /etc/bash.bashrc
  register: global_bashrc

- name: Enable starship in global zshrc
  ansible.builtin.blockinfile:
    path: /etc/zsh/zshrc
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} HOMELAB STARSHIP"
    block: |
      case $- in
        *i*) ;;
        *) return ;;
      esac

      if command -v starship >/dev/null 2>&1; then
        export STARSHIP_CONFIG=${STARSHIP_CONFIG:-/etc/starship/starship.toml}
        eval "$(starship init zsh)"
      fi
  become: true
  when: global_zsh_dir.stat.isdir | default(false)

- name: Enable starship in global bashrc
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    marker: "# {mark} HOMELAB STARSHIP"
    block: |
      case $- in
        *i*) ;;
        *) return ;;
      esac

      if command -v starship >/dev/null 2>&1; then
        export STARSHIP_CONFIG=${STARSHIP_CONFIG:-/etc/starship/starship.toml}
        eval "$(starship init bash)"
      fi
  become: true
  when: global_bashrc.stat.exists

- name: Keep compatibility symlink for homelab user starship config
  ansible.builtin.file:
    src: /etc/starship/starship.toml
    dest: "{{ homelab_user_home }}/.config/starship/starship.toml"
    state: link
    force: true
  become: true

- name: Validate deployed starship config
  ansible.builtin.command: starship explain
  environment:
    STARSHIP_CONFIG: /etc/starship/starship.toml
  changed_when: false
