---
- name: Restart dedicated k3s worker
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: restarted
    enabled: true
    daemon_reload: true

- name: Apply worker forwarding configuration
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-homelab-worker.conf
  changed_when: true
...
