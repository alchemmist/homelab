---
# Git owns the vendored, exact2.15.2 chart and native issuer route. The former
# imperative upstream --reuse-values upgrade ignores hostAliases and can break
# login on socrat-5; it must not silently replace the Git-owned native route.
- name: Require the existing Git-owned Rancher application
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ rancher_kubeconfig }}
    -n argocd get application rancher -o name
  changed_when: false

- name: Refresh only the existing Rancher application from committed source
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ rancher_kubeconfig }}
    -n argocd annotate application rancher argocd.argoproj.io/refresh=hard --overwrite
  changed_when: false

- name: Wait for Rancher replica rollout
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ rancher_kubeconfig }} -n cattle-system
    rollout status deployment/rancher --timeout=600s
  changed_when: false

- name: Verify Rancher replica placement
  ansible.builtin.include_tasks: verify.yml
...
