---
- name: Require the accepted single-replica Rancher topology
  ansible.builtin.assert:
    that:
      - rancher_replicas | int == 1
      - rancher_placement_nodes | length == 1
    fail_msg: >-
      This verifier supports the accepted single-replica topology; HA changes require a separate
      reviewed contract.

# Ansible transports the same reviewed stdlib-only checker into its temporary
# directory. No permanent helper install, nested SSH or additional Python package.
- name: Verify current owned Ready Rancher revision on the intended node
  ansible.builtin.script:
    cmd: >-
      {{ (role_path ~ '/../../../scripts/check_target_placement.py') | quote }}
      --local --kubeconfig {{ rancher_kubeconfig | quote }}
      --namespace cattle-system --deployment rancher
      --node {{ rancher_placement_nodes[0] | quote }} --timeout 60
    executable: /usr/bin/python3
  changed_when: false
...
