---
- name: Restart running desktop monitors
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.shell: "set -o pipefail\n\
    set -eu\n\
    if /usr/bin/tmux has-session -t {{ homelab_terminal_session | quote }} 2>/dev/null; then\n\
    \  /usr/bin/tmux list-panes -s -t {{ homelab_terminal_session | quote }} -F '#{pane_id}
    #{pane_current_command}' |\n\
    \  while read -r pane command; do\n\
    \    if [ \"$command\" = btm ]; then\n\
    \      /usr/bin/tmux respawn-pane -k -t \"$pane\" /usr/local/bin/homelab-monitor-shell\n\
    \      echo restarted\n\
    \    fi\n\
    \  done\n\
    fi\n"
  register: homelab_monitor_restart
  changed_when: "'restarted' in homelab_monitor_restart.stdout"
  args:
    executable: /bin/bash
...
