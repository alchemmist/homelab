---
- name: Require a joining member
  ansible.builtin.assert:
    that:
      - inventory_hostname != k3s_ha_primary
      - hostvars[k3s_ha_primary].k3s_ha_join_token is defined

- name: Inspect previous server mode
  ansible.builtin.stat:
    path: /etc/rancher/k3s/server-mode
  register: k3s_ha_member_mode

- name: Preserve agent configuration before promotion
  ansible.builtin.shell: |
    set -eu
    backup=$(mktemp -d /var/backups/homelab-k3s/agent-before-ha-XXXXXXXX)
    cp -a /etc/rancher/k3s "$backup/config"
    cp -a /etc/systemd/system/k3s-agent.service "$backup/"
    if [ -f /etc/systemd/system/k3s-agent.service.env ]; then
      cp -a /etc/systemd/system/k3s-agent.service.env "$backup/"
    fi
    if [ -d /etc/systemd/system/k3s-agent.service.d ]; then
      cp -a /etc/systemd/system/k3s-agent.service.d "$backup/"
    fi
    printf '%s\n' "$backup"
  register: k3s_ha_agent_backup
  when: not k3s_ha_member_mode.stat.exists
  changed_when: true

- name: Install the server join token privately
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/ha-server-token
    content: "{{ hostvars[k3s_ha_primary].k3s_ha_join_token }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Configure the joining server
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
  register: k3s_ha_member_configuration

- name: Install the server service without touching agent runtime data
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: '0644'
  register: k3s_ha_member_service

- name: Create the old agent guard directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    mode: '0755'

- name: Prevent concurrent agent and server services after promotion
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/40-homelab-server-mode.conf
    mode: '0644'
    content: |
      [Unit]
      ConditionPathExists=!/etc/rancher/k3s/server-mode

- name: Load prepared service definitions
  ansible.builtin.systemd_service:
    daemon_reload: true
