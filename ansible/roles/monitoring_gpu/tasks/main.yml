---
- name: Create node exporter textfile directory
  ansible.builtin.file:
    path: "{{ monitoring_gpu_textfile_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install GPU metrics collector
  when: monitoring_gpu_enabled | bool
  block:
    - name: Install GPU collector script
      ansible.builtin.copy:
        src: collect_gpu.py
        dest: /usr/local/sbin/collect-gpu-metrics
        owner: root
        group: root
        mode: "0755"
      notify: Collect GPU metrics

    - name: Install GPU collector units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - monitoring-gpu.service
        - monitoring-gpu.timer
      notify:
        - Restart GPU metrics timer
        - Collect GPU metrics

    - name: Enable GPU collection timer
      ansible.builtin.systemd_service:
        name: monitoring-gpu.timer
        enabled: true
        state: started
        daemon_reload: true
