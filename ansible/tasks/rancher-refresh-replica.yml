---
- name: Remove one replica and its disposable cache
  ansible.builtin.command: "kubectl -n cattle-system delete pod {{ rancher_cache_pod }} --wait=true --timeout=120s"

- name: Wait for both replicas to be ready before proceeding
  ansible.builtin.command: kubectl -n cattle-system rollout status deployment/rancher --timeout=300s
  changed_when: false
