---
k3s_ha_enabled: true
homelab_ssh_public_host: socrat.alchemmist.xyz
homelab_ssh_port_base: 2222
homelab_ssh_preserve_ports: [22]
homelab_ssh_router_mapping_mode: static
ansible_host: "{{ homelab_ssh_public_host }}"

# Shared defaults for Socrat nodes.
# Starship uses runtime `hostname`, so the same config works for every node:
#   (socrat-0), (socrat-1), ...
starship_show_hostname: true

wg_socrat_port: 51830
wg_socrat_keepalive: 25
wireguard_private_web_enabled: true
wg_socrat_peer_endpoints:
