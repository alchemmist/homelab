# Personal Linux accounts on Socrat nodes. No host restriction means all Socrat nodes.
# Owner keys and password hashes remain private bootstrap inputs, never registry defaults.
homelab_owner_account:
  name: alchemmist
  sudo: true
  shell: /usr/bin/zsh

# Key-only users managed by the non-privileged users role. Never feed the owner to it.
homelab_users:
  - name: tim
    shell: /bin/bash
    sudo: false
    groups: []
    authorized_keys:
