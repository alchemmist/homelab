---
all:
  children:
    Socrat:
      hosts:
        socrat-0:
          homelab_ssh_private_host: 192.168.0.23
          ansible_ssh_private_key_file: ~/.ssh/socrat-master
        socrat-1:
          homelab_ssh_private_host: 192.168.0.24
          homelab_wayland_launcher_source: "{{ homelab_user_home }}/code/dotfiles/wlinitrc/wlinitrc"
          homelab_kubelet_disk_config:
            apiVersion: kubelet.config.k8s.io/v1beta1
            kind: KubeletConfiguration
            evictionHard:
              memory.available: 100Mi
              nodefs.available: 10Gi
              imagefs.available: 10Gi
              nodefs.inodesFree: 5%
              imagefs.inodesFree: 5%
            evictionSoft:
              nodefs.available: 15Gi
              imagefs.available: 15Gi
            evictionSoftGracePeriod:
              nodefs.available: 2m
              imagefs.available: 2m
            evictionMaxPodGracePeriod: 60
            imageGCHighThresholdPercent: 96
            imageGCLowThresholdPercent: 95
          ansible_ssh_private_key_file: ~/.ssh/socrat-1
        socrat-2:
          homelab_ssh_private_host: 10.250.0.2
          homelab_ssh_relay: true
          homelab_ssh_direct_host: 176.98.185.59
          homelab_ssh_direct_port: 22
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/personal_server
