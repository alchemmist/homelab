---
# Cluster membership and connection settings. Node configuration lives in host_vars/.
all:
  children:
    Socrat:
      hosts:
        socrat-0:
          ansible_host: 10.250.0.1
          ansible_port: 2222
          ansible_ssh_common_args: -o HostKeyAlias=[socrat.alchemmist.xyz]:2222 -o ProxyJump=none
          ansible_ssh_private_key_file: ~/.ssh/socrat-master
        socrat-1:
          ansible_host: 10.250.0.3
          ansible_port: 2222
          ansible_ssh_common_args: -o HostKeyAlias=[socrat.alchemmist.xyz]:2223 -o ProxyJump=none
          ansible_ssh_private_key_file: ~/.ssh/socrat-1
        socrat-2:
          ansible_host: 10.250.0.2
          ansible_port: 2222
          ansible_ssh_common_args: -o HostKeyAlias=[socrat.alchemmist.xyz]:2224 -o ProxyJump=none
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/personal_server
        socrat-3:
          ansible_host: 10.250.0.5
          ansible_port: 2222
          ansible_ssh_common_args: -o HostKeyAlias=socrat-3 -o ProxyJump=none
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/socrat-master
          ansible_become_method: sudo
        socrat-4:
          ansible_host: 91.189.82.238
          ansible_port: 2222
          ansible_ssh_common_args: -o HostKeyAlias=socrat-4 -o ProxyJump=none
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/personal_server
          ansible_become_method: sudo
        socrat-5:
          ansible_host: 10.250.0.41
          ansible_port: 2222
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/personal_server
          ansible_become_method: sudo
