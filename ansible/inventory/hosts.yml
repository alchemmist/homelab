---
# Cluster membership and connection settings. Node configuration lives in host_vars/.
all:
  children:
    Socrat:
      hosts:
        socrat-0:
          ansible_port: "{{ homelab_ssh_port_base | int }}"
          ansible_ssh_private_key_file: ~/.ssh/socrat-master
        socrat-1:
          ansible_port: "{{ homelab_ssh_port_base | int + 1 }}"
          ansible_ssh_private_key_file: ~/.ssh/socrat-1
        socrat-2:
          ansible_port: "{{ homelab_ssh_port_base | int + 2 }}"
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/personal_server
        socrat-3:
          ansible_host: 10.250.0.5
          ansible_port: 2222
          ansible_ssh_common_args: -o HostKeyAlias=socrat-3 -o ProxyJump=socrat-0
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/socrat-master
          ansible_become_method: sudo
