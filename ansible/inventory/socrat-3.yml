---
all:
  children:
    Socrat:
      hosts:
        socrat-3:
          ansible_host: 10.250.0.5
          ansible_port: 2222
          ansible_ssh_common_args: -o HostKeyAlias=socrat-3 -o ProxyJump=socrat-0
          ansible_user: alchemmist
          ansible_ssh_private_key_file: ~/.ssh/socrat-master
          ansible_become_method: su
          ansible_become_flags: '-l'
          k3s_worker_swap_enabled: true
          homelab_laptop_desktop: sway
          homelab_alacritty_transparent_background_colors: true
          homelab_wifi_interface: wlp1s0
          homelab_ethernet_interface: enp2s0
          homelab_wifi_ssid: SweetHome
          homelab_wifi_msi: true
          homelab_wifi_autoconnect: true
          wg_socrat_extra_allowed_peer_ips:
            socrat-3:
              socrat-0: [192.168.0.23/32]
              socrat-1: [192.168.0.24/32]
