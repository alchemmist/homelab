---
wireguard_private_web_pod_cidrs: [10.42.0.0/16]
wireguard_private_http_enabled: true
rancher_wg_response_style: >-
  .dashboard.outlet .tabbed-container:has(#cluster-events) { min-width: 0; width: 100%; }
  .dashboard.outlet #cluster-events table.sortable-table td { overflow-wrap: anywhere; }
syncthing_private_ui_extra_virtual_hosts:
  - name: searxng
    host: search.socrat.alchemmist.xyz
    nodeName: socrat-0
    upstream: http://searxng.llm.svc.cluster.local:8080
    tlsSecret: searxng-private-tls
    resolver: 10.43.0.10
  - name: open-webui
    host: llm.socrat.alchemmist.xyz
    nodeName: socrat-0
    upstream: http://open-webui.llm.svc.cluster.local:8080
    tlsSecret: open-webui-private-tls
    resolver: 10.43.0.10
  - name: litellm
    host: litellm.socrat.alchemmist.xyz
    nodeName: socrat-0
    upstream: http://litellm.llm.svc.cluster.local:4000
    tlsSecret: litellm-private-tls
    resolver: 10.43.0.10
  - name: grafana
    host: grafana.socrat.alchemmist.xyz
    nodeName: socrat-1
    upstream: http://kube-prometheus-stack-grafana.cattle-monitoring-system.svc.cluster.local:80
    tlsSecret: grafana-private-tls
    resolver: 10.43.0.10
    clearAuthorization: true
  - name: grafana-mcp
    host: grafana-mcp.socrat.alchemmist.xyz
    nodeName: socrat-1
    upstream: http://grafana-mcp.cattle-monitoring-system.svc.cluster.local:8000
    tlsSecret: grafana-mcp-private-tls
    resolver: 10.43.0.10
    clearAuthorization: false
  - name: rancher-0
    responseStyle: "{{ rancher_wg_response_style }}"
    autoSizeGrafana: true
    allowedCIDRs: [10.250.0.0/24, 10.42.0.0/16]
    host: rancher.socrat.alchemmist.xyz
    nodeName: socrat-0
    upstream: http://rancher.cattle-system.svc.cluster.local:80
    tlsSecret: rancher-private-tls
    resolver: 10.43.0.10
  - name: rancher-1
    responseStyle: "{{ rancher_wg_response_style }}"
    autoSizeGrafana: true
    allowedCIDRs: [10.250.0.0/24, 10.42.0.0/16]
    host: rancher.socrat.alchemmist.xyz
    nodeName: socrat-1
    upstream: http://rancher.cattle-system.svc.cluster.local:80
    tlsSecret: rancher-private-tls
    resolver: 10.43.0.10
homelab_desktop_autologin: true
homelab_desktop_profile: desktop
homelab_waybar_profile: desktop
homelab_hide_flameshot_tray: true
homelab_hypr_monitors:
- HDMI-A-1, 3840x2160@30, 0x0, 1.5
homelab_hypr_polkit_agent: /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
homelab_hypr_autostart: []
