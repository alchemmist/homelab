---
vpn_failover_k3s_unit: k3s.service

homelab_boot_k3s_service: k3s.service
homelab_boot_services:
- ssh.service
- wg-quick@wg-socrat.service
- wireguard-tcp-transport.service
- k3s.service
homelab_ssh_private_host: 10.250.0.2
homelab_ssh_relay: true
homelab_ssh_direct_host: 109.120.141.60
homelab_ssh_direct_port: 22

# Private authoritative listener for the encrypted Moscow DNS hop.
public_dns_extra_listen: ["10.250.0.2@5354"]
public_dns_transit_listener_enabled: true

# Measured native etcd catch-up exceeds180s over the Moscow management relay.
# Bound service startup, never disable corruption/health checks.
vpn_failover_kubernetes_start_timeout_seconds: 600

# Exact machine exception: relay HTTPS must reach Traefik, not human private web.
wireguard_private_web_passthrough_sources: ["10.250.0.40"]
