---
# Native Debian KVM worker (VM105); no desktop/wallpaper/display autostart roles.
# Original Node/WG/SSH/NetBird identities retained; accepted applications now run here.
homelab_boot_k3s_service: k3s-agent.service
homelab_headless: true
k3s_worker_profile: headless-worker
k3s_worker_swap_enabled: true
k3s_worker_system_reserved: cpu=300m,memory=768Mi
k3s_worker_kube_reserved: cpu=100m,memory=256Mi
k3s_worker_server: https://10.250.0.1:6443
# Native VM supports ordinary NFS workloads; owner authorized full admission.
k3s_worker_nfs_enabled: true
k3s_worker_taints: []
k3s_worker_extra_node_labels: [homelab.io/nfs=true]
# Preserve original n8n PV/PVC coordinates; actual data lives on the dedicated disk.
# Source must already contain the verified restored dataset before provisioning.
k3s_worker_data_bind_mounts:
  - source: /mnt/files/homelab/n8n-socrat5/data
    target: /var/lib/rancher/k3s/storage/n8n-socrat5
k3s_worker_required_mounts:
  - /mnt/files
  - /var/lib/rancher/k3s/storage/n8n-socrat5
# VM owns its kernel: load bridge/overlay modules; never reapply the LXC workaround.
k3s_worker_manage_kernel_modules: true
netbird_node_enabled: true
homelab_ssh_preserve_ports: [22]
k3s_worker_user_namespace: false
# Preserve the verified legacy backend during migration; do not combine backend changes.
k3s_worker_prefer_bundled_bin: false
wg_socrat_interface_prefix: 32
# Retain the working kernel-WireGuard implementation; native VM also has /dev/net/tun.
netbird_kernel_wireguard_only: true
# Existing apiserver-advertised HOME addresses and the cluster NFS server.
wg_socrat_extra_allowed_peer_ips:
  socrat-5:
    socrat-0: [192.168.0.23/32]
    socrat-1: [192.168.0.24/32]
