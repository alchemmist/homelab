---
- name: Measure native metrics WAL compaction and existing storage without reading payloads
  hosts: socrat-0:socrat-1:socrat-2:socrat-3
  gather_facts: false
  become: true
  vars:
    ansible_host: '{{ inventory_hostname }}'
    otel_storage_root: /var/lib/homelab-otel-storage-capacity
    otel_storage_memory_mib: '{{ 32 if inventory_hostname == "socrat-2" else 128 }}'
    otel_storage_paths:
      socrat-0:
        - {name: rawMetrics, path: /var/lib/socrat-thanos}
        - {name: rawCompactionWorkspace, path: /var/lib/socrat-thanos-work}
        - name: prometheus
          path: /var/lib/rancher/k3s/storage/pvc-97a31a0a-b498-42a6-be10-1cab44673c41_cattle-monitoring-system_prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
      socrat-1:
        - {name: fiveMinuteMetrics, path: /var/lib/socrat-thanos-5m}
        - {name: historyStaging, path: /var/lib/homelab-otel-history}
      socrat-2: []
      socrat-3:
        - {name: hourlyMetrics, path: /var/lib/socrat-thanos-1h}
  tasks:
    - name: Require measured twenty-percent memory reserve after the full observer budget
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            from pathlib import Path; import json;
            m=dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines());
            print(json.dumps({key:int(m[key].split()[0])*1024 for key in ['MemTotal','MemAvailable']}))
      register: storage_memory
      changed_when: false
    - name: Pause only existing owned observer if the measured reserve no longer fits
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            from pathlib import Path; import subprocess;
            timer='homelab-otel-storage-capacity.timer'; service='homelab-otel-storage-capacity.service';
            [subprocess.run(['systemctl', operation, unit], check=True, capture_output=True)
            for unit,operations in [(timer,['stop','disable']),(service,['stop'])]
            if (Path('/etc/systemd/system')/unit).exists() for operation in operations]
      when: (storage_memory.stdout | from_json).MemAvailable - (otel_storage_memory_mib | int) * 1048576 < (storage_memory.stdout | from_json).MemTotal / 5
      changed_when: true
    - ansible.builtin.assert:
        that:
          - (storage_memory.stdout | from_json).MemAvailable - (otel_storage_memory_mib | int) * 1048576 >= (storage_memory.stdout | from_json).MemTotal / 5
        fail_msg: Insufficient measured memory reserve; do not evict workloads or reduce retention
    - ansible.builtin.file:
        path: '{{ otel_storage_root }}'
        state: directory
        mode: '0700'
    - ansible.builtin.copy:
        src: ../../scripts/otel-storage-capacity-observe.py
        dest: '{{ otel_storage_root }}/observe.py'
        mode: '0700'
    - ansible.builtin.copy:
        content: '{{ {"node": inventory_hostname, "paths": otel_storage_paths[inventory_hostname] + [{"name": "hostOtelState", "path": "/var/lib/homelab-otel"}]} | to_json }}'
        dest: '{{ otel_storage_root }}/configuration.json'
        mode: '0600'
    - name: Require successful bounded real native metadata before periodic collection
      ansible.builtin.command:
        argv: [python3, '{{ otel_storage_root }}/observe.py']
      changed_when: false
      no_log: true
    - ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-storage-capacity.service
        mode: '0644'
        content: |
          [Unit]
          Description=Native metrics WAL compaction filesystem metadata observation
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 {{ otel_storage_root }}/observe.py
          TimeoutStartSec=120
          MemoryMax={{ otel_storage_memory_mib }}M
          MemorySwapMax=0
          CPUQuota=10%
          IOWeight=10
          TasksMax=16
          NoNewPrivileges=yes
          CapabilityBoundingSet=CAP_DAC_READ_SEARCH
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          PrivateDevices=yes
          ReadWritePaths={{ otel_storage_root }}
          IPAddressDeny=any
          UMask=0077
    - ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-storage-capacity.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Observe actual native metrics storage metadata every fifteen minutes
          [Timer]
          OnCalendar=*-*-* *:0/15:00
          RandomizedDelaySec=45
          AccuracySec=1
          Persistent=true
          [Install]
          WantedBy=timers.target
    - ansible.builtin.systemd_service:
        name: homelab-otel-storage-capacity.timer
        daemon_reload: true
        enabled: true
        state: started
    - name: Prove constrained read-only service can read native storage metadata
      ansible.builtin.systemd_service:
        name: homelab-otel-storage-capacity.service
        state: started
