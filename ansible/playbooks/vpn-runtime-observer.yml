---
# No workload/agent/watchdog restart. Default audit only; install adds metrics timer.
- name: Audit and observe both local VPN runtimes without changing execution mode
  hosts: socrat-2:socrat-4
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_host: '{{ inventory_hostname }}'
    ansible_port: 2222
    ansible_ssh_common_args: '{{ "-o Hostname=10.250.0.2 -o ProxyJump=socrat-4 -o StrictHostKeyChecking=yes" if inventory_hostname == "socrat-2" else "-o ProxyJump=none -o StrictHostKeyChecking=yes" }}'
    observer_phase: '{{ vpn_observer_phase | default("audit") }}'
    recovery: /var/lib/homelab-recovery/20261113-vpn-runtime-monitor
    expected_image: '{{ (lookup("file", playbook_dir + "/../../charts/x-ui/values.yaml") | from_yaml).instances.primary.image }}'
  tasks:
    - ansible.builtin.assert:
        that: observer_phase in ['audit','install']
    - ansible.builtin.file:
        path: '{{ recovery }}'
        state: directory
        mode: '0700'
    - ansible.builtin.copy:
        src: ../../scripts/vpn-runtime-observer.py
        dest: '{{ recovery }}/observer.py'
        mode: '0700'
    - name: Read local runtime, native files, boot fences, DB integrity and image identity
      ansible.builtin.command: python3 {{ recovery }}/observer.py --audit --expected-image {{ expected_image }}
      register: audit
      changed_when: false
    - ansible.builtin.copy:
        content: '{{ audit.stdout }}'
        dest: '{{ recovery }}/audit.json'
        mode: '0600'
    - ansible.builtin.debug:
        var: audit.stdout
    - name: Refuse metric installation when runtime or independent assets are uncertain
      ansible.builtin.assert:
        that:
          - (audit.stdout | from_json).watchdog_active
          - (audit.stdout | from_json).watchdog_enabled
          - (audit.stdout | from_json).agent_boot_fenced
          - (audit.stdout | from_json).native_boot_fenced
          - not (audit.stdout | from_json).host_resolver_uses_cluster_dns
          - (audit.stdout | from_json).observation.runtime == 0
          - (audit.stdout | from_json).observation.check_success == 1
          - inventory_hostname != 'socrat-4' or (audit.stdout | from_json).relay_config_valid
          - inventory_hostname != 'socrat-4' or (audit.stdout | from_json).mesh_route_expected
          - inventory_hostname != 'socrat-2' or (audit.stdout | from_json).native_files_and_live_db_valid
          - inventory_hostname != 'socrat-2' or (audit.stdout | from_json).native_caddy_config_valid
          - inventory_hostname != 'socrat-2' or (audit.stdout | from_json).native_image_matches_expected
          - inventory_hostname != 'socrat-2' or (audit.stdout | from_json).configured_agent_is_server
          - inventory_hostname != 'socrat-2' or (audit.stdout | from_json).both_k3s_units_fenced
          - inventory_hostname != 'socrat-2' or (audit.stdout | from_json).obsolete_agent_boot_fenced
          - inventory_hostname != 'socrat-2' or not (audit.stdout | from_json).watchdog_inhibited
    - when: observer_phase == 'install'
      block:
        - ansible.builtin.copy:
            src: ../../scripts/vpn-runtime-observer.py
            dest: /usr/local/libexec/vpn-runtime-observer.py
            mode: '0755'
        - ansible.builtin.file:
            path: /var/lib/node_exporter/textfile_collector
            state: directory
            mode: '0755'
        - ansible.builtin.copy:
            dest: /etc/systemd/system/homelab-vpn-runtime-observer.service
            mode: '0644'
            content: |
              [Unit]
              Description=Read-only VPN runtime and transport observation, never recovery
              [Service]
              Type=oneshot
              ExecStart=/usr/bin/python3 /usr/local/libexec/vpn-runtime-observer.py
              TimeoutStartSec=45s
              Nice=10
              CPUWeight=10
              MemoryMax=96M
              NoNewPrivileges=yes
              ProtectSystem=strict
              ProtectHome=yes
              PrivateTmp=yes
              ProtectKernelTunables=yes
              ProtectControlGroups=yes
              RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
              ReadWritePaths=/var/lib/node_exporter/textfile_collector
              {% if inventory_hostname == 'socrat-4' %}
              ReadWritePaths=/var/lib/homelab-vpn-transit/relay-failover
              {% endif %}
        - ansible.builtin.copy:
            dest: /etc/systemd/system/homelab-vpn-runtime-observer.timer
            mode: '0644'
            content: |
              [Unit]
              Description=Observe local VPN components without requiring Kubernetes
              [Timer]
              OnBootSec=20s
              OnUnitInactiveSec=30s
              AccuracySec=1s
              Unit=homelab-vpn-runtime-observer.service
              [Install]
              WantedBy=timers.target
        - ansible.builtin.systemd_service:
            name: homelab-vpn-runtime-observer.timer
            daemon_reload: true
            enabled: true
            state: started
        - ansible.builtin.systemd_service:
            name: homelab-vpn-runtime-observer.service
            state: started
