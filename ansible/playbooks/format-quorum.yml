---
# Git -> existing Argo Application owns this workload. The former imperative
# chart-default deployment would restart node1 against stale NFS data after the
# VM105 handoff; do not reinstall that writer or re-bootstrap NFS on node1.
- name: Refresh the Git-owned format-quorum application
  hosts: socrat-0
  gather_facts: false
  become: false
  tasks:
    - name: Verify the existing Argo application before targeted refresh
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/rancher/k3s/k3s.yaml
          - get
          - application
          - format-quorum
          - --namespace
          - argocd
          - -o
          - name
      changed_when: false
    - name: Refresh only format-quorum from the committed production values
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/rancher/k3s/k3s.yaml
          - annotate
          - application
          - format-quorum
          - --namespace
          - argocd
          - argocd.argoproj.io/refresh=hard
          - --overwrite
      changed_when: false
