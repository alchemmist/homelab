---
- name: Verify the worker before admitting ordinary workloads
  hosts: socrat-0
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Inspect the verification namespace before creating resources
      ansible.builtin.command: kubectl get namespace homelab-worker-check --ignore-not-found -o name
      register: worker_probe_namespace
      changed_when: false

    - name: Refuse to overwrite an existing namespace
      ansible.builtin.assert:
        that: worker_probe_namespace.stdout | trim == ''

    - name: Exercise worker networking and storage with disposable pods
      block:
        - name: Create isolated verification pods
          ansible.builtin.command: kubectl apply -f -
          args:
            stdin: "{{ lookup('template', playbook_dir + '/../templates/worker-probe.yaml.j2') }}"

        - name: Wait for probes including the read-only NFS mount
          ansible.builtin.command: kubectl -n homelab-worker-check wait --for=condition=Ready pod --all --timeout=240s
          changed_when: false

        - name: Read probe addresses
          ansible.builtin.command: kubectl -n homelab-worker-check get pods -o json
          register: worker_probe_pods
          changed_when: false

        - name: Verify new-worker DNS and cluster API connectivity
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homelab-worker-check
              - exec
              - probe-socrat-3
              - --
              - sh
              - -ec
              - nslookup kubernetes.default.svc.cluster.local; nc -z -w 10 kubernetes.default.svc.cluster.local 443; test -d /mnt/nfs; grep -q ' /mnt/nfs .* ro,' /proc/mounts
          changed_when: false

        - name: Verify traffic from every node to every probe
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homelab-worker-check
              - exec
              - "{{ item.0.metadata.name }}"
              - --
              - wget
              - -qO-
              - -T
              - '10'
              - "http://{{ item.1.status.podIP }}:8080"
          loop: "{{ (worker_probe_pods.stdout | from_json)['items'] | product((worker_probe_pods.stdout | from_json)['items']) | list }}"
          loop_control:
            label: "{{ item.0.spec.nodeName }} -> {{ item.1.spec.nodeName }}"
          register: worker_probe_http
          changed_when: false
          failed_when: worker_probe_http.rc != 0 or worker_probe_http.stdout != item.1.spec.nodeName

        - name: Verify worker log streaming
          ansible.builtin.command: kubectl -n homelab-worker-check logs probe-socrat-3
          register: worker_probe_logs
          changed_when: false
          failed_when: worker_probe_logs.rc != 0 or 'probe-ready' not in worker_probe_logs.stdout
      always:
        - name: Remove disposable verification workloads
          ansible.builtin.command: kubectl delete namespace homelab-worker-check --ignore-not-found --wait=true --timeout=90s
