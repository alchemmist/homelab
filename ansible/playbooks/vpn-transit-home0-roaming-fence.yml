---
- name: Preserve the narrow HOME0 legacy-endpoint anti-roaming fence
  hosts: socrat-0
  gather_facts: false
  become: true
  tasks:
    - name: Install only the receipted HOME0 legacy tuple fence
      ansible.builtin.copy:
        src: ../../deploy/vpn-hardening/home0-mesh-roaming-fence.nft
        dest: /etc/wireguard/msk-mesh-fence.nft
        mode: '0600'
    - name: Validate fence syntax without changing any existing table
      ansible.builtin.command: nft -c -f /etc/wireguard/msk-mesh-fence.nft
      changed_when: false
    - name: Preserve persistent ordering without deleting a live fence on stop
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-msk-mesh-fence.service
        mode: '0644'
        content: |
          [Unit]
          Description=Prevent Netherlands mesh endpoint roaming around Moscow
          Before=wireguard-private-web.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c '/usr/sbin/nft list table inet homelab_msk_mesh_fence >/dev/null 2>&1 || /usr/sbin/nft -f /etc/wireguard/msk-mesh-fence.nft'
          [Install]
          WantedBy=multi-user.target
    - name: Enable only the scoped anti-roaming fence
      ansible.builtin.systemd_service:
        name: homelab-msk-mesh-fence.service
        state: started
        enabled: true
        daemon_reload: true
