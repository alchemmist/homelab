---
- name: Register the new worker without restarting existing management interfaces
  hosts: socrat-0:socrat-1:socrat-2
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Inspect persisted and active worker address ownership
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          -
            "import ipaddress, json, pathlib, re, subprocess, sys\n\
            key, cidr, keepalive = sys.argv[1:]\n\
            target = ipaddress.ip_network(cidr)\n\
            config = pathlib.Path('/etc/wireguard/wg-socrat.conf').read_text()\n\
            peers = []\n\
            for block in re.split(r'(?m)^\\s*\\[Peer\\]\\s*$', config)[1:]:\n\
            \    fields = {}\n\
            \    for line in block.splitlines():\n\
            \        line = line.split('#', 1)[0].strip()\n\
            \        if '=' in line:\n\
            \            name, value = line.split('=', 1)\n\
            \            fields[name.strip()] = value.strip()\n\
            \    peers.append(fields)\n\
            matches = [peer for peer in peers if peer.get('PublicKey') == key]\n\
            if len(matches) > 1:\n\
            \    sys.exit('Duplicate persisted worker peers; repair before applying')\n\
            for peer in peers:\n\
            \    networks = [ipaddress.ip_network(value.strip()) for value in
            peer.get('AllowedIPs', '').split(',') if value.strip()]\n\
            \    if peer.get('PublicKey') == key:\n\
            \        if networks != [target]:\n\
            \            sys.exit('Existing worker AllowedIPs differ from inventory; refusing
            replacement')\n\
            \    elif any(network.version == target.version and network.overlaps(target) for
            network in networks):\n\
            \        sys.exit('Worker address overlaps another persisted peer')\n\
            addresses = {}\n\
            for line in subprocess.check_output(['wg', 'show', 'wg-socrat', 'allowed-ips'],
            text=True).splitlines():\n\
            \    peer_key, values = line.split(None, 1)\n\
            \    networks = [ipaddress.ip_network(value) for value in values.replace(',', '
            ').split() if value != '(none)']\n\
            \    addresses[peer_key] = networks\n\
            \    if peer_key != key and any(network.version == target.version and
            network.overlaps(target) for network in networks):\n\
            \        sys.exit('Worker address overlaps another active peer')\n\
            intervals = dict(line.split() for line in subprocess.check_output(['wg', 'show',
            'wg-socrat', 'persistent-keepalive'], text=True).splitlines())\n\
            print(json.dumps({'persisted': bool(matches), 'runtime_matches': addresses.get(key) ==
            [target] and intervals.get(key) == keepalive}))\n"
          - "{{ wg_socrat_nodes['socrat-3'].public_key }}"
          - "{{ wg_socrat_nodes['socrat-3'].address }}/32"
          - "{{ wg_socrat_keepalive | string }}"
      register: worker_peer_state
      changed_when: false
      check_mode: false

    - name: Persist the dedicated worker peer
      ansible.builtin.blockinfile:
        path: /etc/wireguard/wg-socrat.conf
        marker: "# {mark} homelab socrat-3 peer"
        block: |
          [Peer]
          PublicKey = {{ wg_socrat_nodes['socrat-3'].public_key }}
          AllowedIPs = {{ wg_socrat_nodes['socrat-3'].address }}/32
          PersistentKeepalive = {{ wg_socrat_keepalive }}
        owner: root
        group: root
        mode: "0600"
        backup: true
      no_log: true
      when: not (worker_peer_state.stdout | from_json).persisted

    - name: Add the worker peer without altering existing peers
      ansible.builtin.command:
        argv:
          - wg
          - set
          - wg-socrat
          - peer
          - "{{ wg_socrat_nodes['socrat-3'].public_key }}"
          - allowed-ips
          - "{{ wg_socrat_nodes['socrat-3'].address }}/32"
          - persistent-keepalive
          - "{{ wg_socrat_keepalive | string }}"
      when: not (worker_peer_state.stdout | from_json).runtime_matches
      changed_when: true

    - name: Verify the active worker address mapping
      ansible.builtin.command: wg show wg-socrat allowed-ips
      register: worker_peer_addresses
      changed_when: false
      failed_when: >-
        (wg_socrat_nodes['socrat-3'].public_key + '\t' + wg_socrat_nodes['socrat-3'].address +
        '/32') not in worker_peer_addresses.stdout_lines
      when: not ansible_check_mode
...
