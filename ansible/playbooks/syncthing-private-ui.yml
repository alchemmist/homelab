- name: Record Syncthing identities and folder policy before migration
  hosts: Socrat
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
    - name: Ensure the local verification directory exists
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the read-only Syncthing state verifier
      ansible.builtin.copy:
        src: ../files/syncthing_private_snapshot.py
        dest: /usr/local/libexec/syncthing-private-snapshot.py
        owner: root
        group: root
        mode: '0644'

    - name: Record certificate identity and folder pause state
      ansible.builtin.command: python3 /usr/local/libexec/syncthing-private-snapshot.py /srv/syncthing/config
      register: syncthing_private_ui_snapshot_before
      changed_when: false

- name: Prepare private Syncthing endpoints and certificates
  hosts: socrat-0
  any_errors_fatal: true
  gather_facts: false
  tasks:
    - name: Prepare the private Syncthing chart values
      ansible.builtin.include_role:
        name: syncthing_private_ui
        tasks_from: prepare

    - name: Prepare a trusted certificate before changing pod access
      ansible.builtin.include_role:
        name: syncthing_private_ui
        tasks_from: certificate

- name: Configure private HTTPS delivery on every node
  hosts: Socrat
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - wireguard_admin_firewall
    - wireguard_private_web

- name: Deploy private Syncthing interfaces
  hosts: socrat-0
  any_errors_fatal: true
  gather_facts: false
  tasks:
    - name: Apply the node-local private UI
      ansible.builtin.include_role:
        name: syncthing_private_ui
        tasks_from: deploy

- name: Verify Syncthing identities and paused folders were retained
  hosts: Socrat
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
    - name: Verify certificate identity and folder pause state
      ansible.builtin.command: python3 /usr/local/libexec/syncthing-private-snapshot.py /srv/syncthing/config
      register: syncthing_private_ui_snapshot_after
      changed_when: false
      failed_when: syncthing_private_ui_snapshot_after.stdout != syncthing_private_ui_snapshot_before.stdout

- name: Migrate existing Syncthing monitors to private health checks
  hosts: socrat-2
  gather_facts: false
  become: true
  roles:
    - syncthing_private_monitors
