---
- name: Operator-selected50 export workers without interrupting the active history importer
  hosts: socrat-0
  gather_facts: false
  become: true
  vars:
    ansible_host: socrat-0
    history_base: /var/lib/homelab-otel-history/tail-roundtrip-20261101
    new_history_binary_sha256: ca3cf860b7735459fe5097caa5330e8f69478dc189b12a4d236b8dc2388422e0
  tasks:
    - ansible.builtin.copy:
        src: '{{ controller_root }}/bin/otel-history-workers50-linux-amd64'
        dest: '{{ history_base }}/otel-history.workers50-candidate'
        mode: '0700'
    - name: Verify active controller, old/candidate pins and save immutable predecessor
      ansible.builtin.shell: |
        python3 - <<'PY'
        import hashlib,json,os,subprocess,time
        from pathlib import Path
        base=Path('{{ history_base }}');unit='otel-history-tail-parallel-20261101.service'
        sha=lambda p:hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
        assert os.uname().nodename=='socrat-0'
        assert subprocess.check_output(['systemctl','is-active',unit],text=True).strip()=='active'
        assert sha(base/'otel-history')=='235650012ba0f062c27f6be701a6be9e72e5f8454237e176034f3193b81fa848'
        assert sha(base/'otel-history.workers50-candidate')=='{{ new_history_binary_sha256 }}'
        old=base/'otel-history.before-workers50-20261101';assert not old.exists()
        os.link(base/'otel-history',old)
        r={'atUnix':time.time(),'mainPID':subprocess.check_output(['systemctl','show',unit,'-p','MainPID','--value'],text=True).strip(),'progress':json.loads((base/'progress.json').read_text()),'previousBinarySHA256':sha(old),'newBinarySHA256':'{{ new_history_binary_sha256 }}'}
        (base/'workers50-preimage.json').write_text(json.dumps(r,indent=2))
        PY
      changed_when: true
    - name: Configure explicit root-only override for subsequent exports in this exact workspace
      ansible.builtin.copy:
        content: '{"schemaVersion":1,"workers":50}
'
        dest: '{{ history_base }}/export-worker-override.json'
        owner: root
        group: root
        mode: '0600'
    - name: Atomically install candidate, preserving executing subprocess inode and controller
      ansible.builtin.shell: |
        python3 - <<'PY'
        import hashlib,json,os,subprocess
        from pathlib import Path
        base=Path('{{ history_base }}');before=json.loads((base/'workers50-preimage.json').read_text())
        assert subprocess.check_output(['systemctl','show','otel-history-tail-parallel-20261101.service','-p','MainPID','--value'],text=True).strip()==before['mainPID']
        with (base/'otel-history.workers50-candidate').open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='{{ new_history_binary_sha256 }}'
        os.replace(base/'otel-history.workers50-candidate',base/'otel-history')
        PY
      changed_when: true
    - ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/otel-history-tail-roundtrip.py'
        dest: '{{ history_base }}/queue.py'
        mode: '0700'
    - name: Verify effective50 despite cached controller's16 argument, without starting another export
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json,os,subprocess,time
        from pathlib import Path
        base=Path('{{ history_base }}');unit='otel-history-tail-parallel-20261101.service'
        settings=json.loads(subprocess.check_output([str(base/'otel-history'),'export','--source','/home/alchemmist/otel-tail-roundtrip-work-20261101/01M66G9HT3YJ4W6TSADWG305M6/source/01M66G9HT3YJ4W6TSADWG305M6','--export-workers','16','--show-export-workers'],env=dict(os.environ,GOMAXPROCS='16',GOMEMLIMIT='6GiB'),text=True))
        assert settings=={'effectiveExportWorkers':50,'gomaxprocs':16,'samplesRead':False,'exportStarted':False}
        before=json.loads((base/'workers50-preimage.json').read_text())
        assert subprocess.check_output(['systemctl','show',unit,'-p','MainPID','--value'],text=True).strip()==before['mainPID']
        cg=subprocess.check_output(['systemctl','show',unit,'-p','ControlGroup','--value'],text=True).strip();group=Path('/sys/fs/cgroup'+cg)
        quota,period=map(int,(group/'cpu.max').read_text().split());assert quota==16*period
        assert int((group/'memory.max').read_text())==9*1024**3 and (group/'memory.swap.max').read_text().strip()=='0'
        r={'success':True,'atUnix':time.time(),'settings':settings,'before':before,'currentProgress':json.loads((base/'progress.json').read_text()),'mainPIDUnchanged':True,'currentImporterNotRestarted':True,'workersApplyToNextExportSubprocess':True,'cpuQuotaCores':16,'memoryMaxBytes':9*1024**3,'memoryEvents':(group/'memory.events').read_text(),'throughputGainClaimed':False,'secondImporterStarted':False}
        (base/'workers50-result.json').write_text(json.dumps(r,indent=2));print(json.dumps(r))
        PY
      changed_when: false
      register: configured
    - ansible.builtin.copy:
        content: '{{ configured.stdout }}'
        dest: '{{ controller_root }}/history-workers50-configured-20261101.json'
        mode: '0600'
      delegate_to: localhost
      become: false
