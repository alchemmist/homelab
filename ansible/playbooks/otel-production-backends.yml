---
- name: Keep retired host Loki and Tempo units absent
  hosts: socrat-1
  gather_facts: false
  become: true
  tasks:
    - name: Stop and disable retired native backend units
      ansible.builtin.systemd_service:
        name: 'homelab-otel-{{ item }}.service'
        enabled: false
        state: stopped
      failed_when: false
      loop: [loki, tempo]
    - name: Remove retired native backend unit files
      ansible.builtin.file:
        path: '/etc/systemd/system/homelab-otel-{{ item }}.service'
        state: absent
      loop: [loki, tempo]
      notify: Reload systemd
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
