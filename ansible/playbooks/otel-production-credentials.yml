---
- name: Install restricted cert-manager credential refresh on native hosts
  hosts: socrat-0:socrat-1:socrat-2:socrat-3
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Create durable private native state
      ansible.builtin.file:
        path: /var/lib/homelab-otel
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Install narrowly scoped host bootstrap material
      ansible.builtin.copy:
        src: '{{ otel_production_credentials }}/{{ inventory_hostname }}/{{ item }}'
        dest: '/var/lib/homelab-otel/{{ item }}'
        mode: '0600'
        force: false
      loop: [token.json, kubernetes-ca.crt, credentials.json]
      no_log: true
    - name: Install native host credential refresher
      tags: [grafana-correlations]
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/otel-host-credentials.py'
        dest: /var/lib/homelab-otel/credentials.py
        mode: '0600'
    - name: Verify actual token self-renewal and rejection of CA-key access
      tags: [grafana-correlations]
      ansible.builtin.command: python3 /var/lib/homelab-otel/credentials.py --verify-scope
      changed_when: false
    - name: Install least-privilege credential refresh service
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-credentials.service
        mode: '0644'
        content: |
          [Unit]
          Description=Refresh narrowly scoped native OTel host leaf credentials
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 /var/lib/homelab-otel/credentials.py
          UMask=0077
          NoNewPrivileges=yes
          ProtectHome=yes
          TimeoutStartSec=180
    - name: Install persistent certificate and token refresh timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-credentials.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Refresh cert-manager OTel certificates and scoped tokens
          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          Persistent=true
          [Install]
          WantedBy=timers.target
    - name: Enable bounded credential lifecycle
      ansible.builtin.systemd_service:
        name: homelab-otel-credentials.timer
        daemon_reload: true
        enabled: true
        state: started
