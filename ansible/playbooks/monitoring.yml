---
- name: Collect active VPN client metrics on the edge node
  hosts: socrat-2
  gather_facts: false
  become: true
  tags: [monitoring_vpn]
  roles:
    - monitoring_vpn

- name: Legacy monitoring bootstrap guarded against active GitOps owners
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  pre_tasks:
    - name: Refuse legacy monitoring mutations before any role
      ansible.builtin.include_role:
        name: monitoring_stack
        tasks_from: gitops-guard.yml
      tags: [always]
  roles:
    - role: monitoring_thanos
      tags: [monitoring_thanos, monitoring_base]
    - role: monitoring_stack
      tags: [monitoring_base]
    - role: monitoring_k3s
      tags: [monitoring_k3s]
    - role: monitoring_rancher
      tags: [monitoring_rancher]
    - role: monitoring_wg_access
      tags: [monitoring_access]

- ansible.builtin.import_playbook: monitoring-private-dns.yml
