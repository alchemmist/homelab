---
- name: Collect active VPN client metrics on the edge node
  hosts: socrat-2
  gather_facts: false
  become: true
  tags: [monitoring_vpn]
  roles:
    - monitoring_vpn

- name: Deploy persistent cluster metrics and Grafana
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  roles:
    - role: monitoring_thanos
      tags: [monitoring_thanos, monitoring_base]
    - role: monitoring_stack
      tags: [monitoring_base]
    - role: monitoring_k3s
      tags: [monitoring_k3s]
    - role: monitoring_rancher
      tags: [monitoring_rancher]
    - role: monitoring_wg_access
      tags: [monitoring_access]

- ansible.builtin.import_playbook: monitoring-private-dns.yml
