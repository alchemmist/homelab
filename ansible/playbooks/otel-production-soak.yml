---
- name: Emit harmless native journal heartbeat for source coverage
  hosts: socrat-0:socrat-1:socrat-2:socrat-3
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Install production log heartbeat
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-heartbeat.service
        mode: '0644'
        content: |
          [Unit]
          Description=Native OTel journal coverage heartbeat
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/logger -t homelab-otel-heartbeat native-otel-heartbeat
          NoNewPrivileges=yes
    - name: Install production heartbeat timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-heartbeat.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Native journal heartbeat every minute
          [Timer]
          OnBootSec=10s
          OnUnitActiveSec=60s
          Persistent=true
          [Install]
          WantedBy=timers.target
    - name: Enable native source coverage timer
      ansible.builtin.systemd_service:
        name: homelab-otel-heartbeat.timer
        daemon_reload: true
        state: started
        enabled: true
    - name: Emit initial safe journal heartbeat
      ansible.builtin.systemd_service:
        name: homelab-otel-heartbeat.service
        state: started
- name: Run genuine durable 72-hour production observation on healthy host
  hosts: socrat-1
  gather_facts: false
  become: true
  tasks:
    - name: Install bounded production verification script
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/otel-production-soak.py'
        dest: /var/lib/homelab-otel/soak.py
        mode: '0600'
    - name: Install native production observation unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-soak.service
        mode: '0644'
        content: |
          [Unit]
          Description=Verify real production native OTLP 72-hour health window
          After=network-online.target
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 /var/lib/homelab-otel/soak.py
          StateDirectory=homelab-otel-soak
          StateDirectoryMode=0700
          UMask=0077
          TimeoutStartSec=180
          MemoryMax=134217728
          MemorySwapMax=0
          NoNewPrivileges=yes
          ProtectHome=yes
    - name: Install durable production observation timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-otel-soak.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Observe real production OTLP health every five minutes
          [Timer]
          OnBootSec=60s
          OnUnitActiveSec=300s
          Persistent=true
          [Install]
          WantedBy=timers.target
    - name: Enable real production soak observation
      ansible.builtin.systemd_service:
        name: homelab-otel-soak.timer
        daemon_reload: true
        state: started
        enabled: true
    - name: Require the first actual production health observation
      ansible.builtin.command: python3 /var/lib/homelab-otel/soak.py
      changed_when: false
