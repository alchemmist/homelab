---
- name: Refuse the retired competing open-terminal-browser-cleanup maintenance entrypoint
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require the existing Git-owned Application
      ansible.builtin.fail:
        msg: >-
          This legacy entrypoint is retired. Existing workloads belong to
          deploy/argocd/apps/open-terminal.yaml and charts/open-terminal.
          Commit reviewed changes to these sources; preserve native identity,
          existing credentials, current authoritative data and access policies.
          No Helm, Secret creation, backup, scaling, image pull, runtime setting,
          DNS/firewall, shared-host or imported identity/instruction change is
          performed. Never adapt the historical old-node/old-PVC upgrade sequence
          as a fallback. Recovery or new installation needs separate review;
          current backup work remains explicitly deferred by the owner.
          See docs/infrastructure-contracts.md and docs/open-webui-upgrades.md.
      tags: [always]
...
