---
- name: Bootstrap Argo CD without taking ownership of existing workloads
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    argocd_chart_version: "10.11.6"
    argocd_chart_repo_name: argo
    argocd_chart_repo_url: https://argoproj.github.io/argo-helm
    argocd_namespace: argocd
    argocd_values_local: "{{ playbook_dir }}/../../deploy/argocd/values.yaml"
    argocd_values_remote: /tmp/homelab-argocd-values.yaml
  tasks:
    - name: Add the official Argo Helm chart repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ argocd_chart_repo_name }}"
          - "{{ argocd_chart_repo_url }}"
          - --force-update
      changed_when: false

    - name: Refresh Helm chart metadata
      ansible.builtin.command:
        argv: [helm, repo, update, "{{ argocd_chart_repo_name }}"]
      changed_when: false

    - name: Copy pinned Argo CD values
      ansible.builtin.copy:
        src: "{{ argocd_values_local }}"
        dest: "{{ argocd_values_remote }}"
        mode: '0600'

    - name: Install Argo CD control plane only
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - argo-cd
          - "{{ argocd_chart_repo_name }}/argo-cd"
          - --version
          - "{{ argocd_chart_version }}"
          - --namespace
          - "{{ argocd_namespace }}"
          - --create-namespace
          - --values
          - "{{ argocd_values_remote }}"
          - --wait
          - --timeout
          - 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_helm
      changed_when: >-
        'has been upgraded' in argocd_helm.stdout or
        'has been installed' in argocd_helm.stdout

    - name: Show Argo CD workload health
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - --namespace
          - "{{ argocd_namespace }}"
          - get
          - deployments,statefulsets,pods,services
          - -o
          - wide
      register: argocd_status
      changed_when: false

    - name: Print Argo CD workload health
      ansible.builtin.debug:
        var: argocd_status.stdout_lines
