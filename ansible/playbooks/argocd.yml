---
- name: Bootstrap Argo CD without taking ownership of existing workloads
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    argocd_chart_version: "10.11.6"
    argocd_chart_repo_name: argo
    argocd_chart_repo_url: https://argoproj.github.io/argo-helm
    argocd_namespace: argocd
    argocd_values_local: "{{ playbook_dir }}/../../deploy/argocd/values.yaml"
    argocd_values_remote: /tmp/homelab-argocd-values.yaml
    argocd_oidc_script_local: "{{ playbook_dir }}/../roles/argocd_oidc/files/configure.py"
    argocd_oidc_script_remote: /home/alchemmist/.cache/homelab-authentik/argocd-oidc.py
  tasks:
    - name: Read the VPS ingress backend transport prerequisite
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, -n, traefik-edge,
               get, deployment, traefik-edge, '-o=jsonpath={.spec.template.spec.containers[0].args}']
      environment:
        K3S_CONFIG_FILE: /dev/null
      register: argocd_edge_args
      changed_when: false

    - name: Refuse backend TLS until both ingress providers can resolve the transport
      ansible.builtin.assert:
        that:
          - "'--providers.kubernetescrd=true' in argocd_edge_args.stdout"
          - "'--providers.kubernetescrd.namespaces=argocd' in argocd_edge_args.stdout"
        fail_msg: Reconcile the reviewed traefik-edge chart before the Argo CD TLS/refresh rollout.

    - name: Add the official Argo Helm chart repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ argocd_chart_repo_name }}"
          - "{{ argocd_chart_repo_url }}"
          - --force-update
      changed_when: false

    - name: Refresh Helm chart metadata
      ansible.builtin.command:
        argv: [helm, repo, update, "{{ argocd_chart_repo_name }}"]
      changed_when: false

    - name: Copy pinned Argo CD values
      ansible.builtin.copy:
        src: "{{ argocd_values_local }}"
        dest: "{{ argocd_values_remote }}"
        mode: '0600'

    - name: Apply verified Argo CD backend transport before enabling HTTPS
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, apply, -f, '-']
        stdin: "{{ lookup('file', playbook_dir + '/../../deploy/argocd/server-transport.yaml') }}"
      environment:
        K3S_CONFIG_FILE: /dev/null
      register: argocd_transport
      changed_when: "'created' in argocd_transport.stdout or 'configured' in argocd_transport.stdout"

    - name: Install Argo CD control plane only
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - argo-cd
          - "{{ argocd_chart_repo_name }}/argo-cd"
          - --version
          - "{{ argocd_chart_version }}"
          - --namespace
          - "{{ argocd_namespace }}"
          - --create-namespace
          - --values
          - "{{ argocd_values_remote }}"
          - --wait
          - --timeout
          - 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_helm
      changed_when: >-
        'has been upgraded' in argocd_helm.stdout or
        'has been installed' in argocd_helm.stdout

    - name: Copy the Authentik OIDC reconciler without credentials
      ansible.builtin.copy:
        src: "{{ argocd_oidc_script_local }}"
        dest: "{{ argocd_oidc_script_remote }}"
        mode: '0600'

    - name: Verify the Authentik API and private credential journal before reconciliation
      ansible.builtin.command:
        argv: [python3, "{{ argocd_oidc_script_remote }}", --check]
      no_log: true
      changed_when: false

    - name: Reconcile Authentik OIDC client and inject its private secret
      ansible.builtin.command:
        argv: [python3, "{{ argocd_oidc_script_remote }}"]
      register: argocd_oidc
      no_log: true
      changed_when: "'changed=true' in argocd_oidc.stdout"

    - name: Show Argo CD workload health
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - --namespace
          - "{{ argocd_namespace }}"
          - get
          - deployments,statefulsets,pods,services
          - -o
          - wide
      register: argocd_status
      changed_when: false

    - name: Print Argo CD workload health
      ansible.builtin.debug:
        var: argocd_status.stdout_lines
