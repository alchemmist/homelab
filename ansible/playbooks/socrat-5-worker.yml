---
- name: Join only the headless worker with bootstrap scheduling protection
  hosts: socrat-5
  become: true
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Inspect restored application data before touching worker mounts
      ansible.builtin.stat:
        path: "{{ item.source }}/database.sqlite"
      loop: "{{ k3s_worker_data_bind_mounts | default([]) }}"
      register: k3s_worker_restored_data
    - name: Refuse to bootstrap an empty replacement n8n dataset
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.size | default(0) | int > 0
        fail_msg: Restore the verified sole-writer dataset before provisioning this native worker.
      loop: "{{ k3s_worker_restored_data.results | default([]) }}"
      loop_control:
        label: "{{ item.item.target }}"
    - name: Persist dedicated application data binds at original PV coordinates
      ansible.posix.mount:
        src: "{{ item.source }}"
        path: "{{ item.target }}"
        fstype: none
        opts: bind,x-systemd.requires-mounts-for=/mnt/files
        state: mounted
      loop: "{{ k3s_worker_data_bind_mounts | default([]) }}"
    - name: Create application data dependency drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/k3s-agent.service.d
        state: directory
        mode: "0755"
      when: k3s_worker_required_mounts | default([]) | length > 0
    - name: Fail closed when dedicated application data mounts are unavailable
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-agent.service.d/50-worker-data-mounts.conf
        mode: "0644"
        content: |
          [Unit]
          RequiresMountsFor={{ k3s_worker_required_mounts | join(' ') }}
          [Service]
          {% for path in k3s_worker_required_mounts %}
          ExecStartPre=/usr/bin/mountpoint --quiet {{ path }}
          {% endfor %}
      when: k3s_worker_required_mounts | default([]) | length > 0
    - name: Reload required mount dependencies before worker provisioning
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: k3s_worker_required_mounts | default([]) | length > 0
    - name: Require the owned storage admission boundary before worker provisioning
      ansible.builtin.command:
        cmd: >-
          python3 /usr/local/libexec/socrat5-storage-guard.py
          --manifest /var/lib/homelab-socrat5-storage-guard.json
      delegate_to: socrat-0
      register: socrat5_storage_boundary
      changed_when: false
      failed_when: >-
        socrat5_storage_boundary.rc != 0 or
        (socrat5_storage_boundary.stdout | from_json).operations != 0
      when: not (k3s_worker_nfs_enabled | default(false) | bool)
    - name: Require obsolete no-NFS binding to be retired for native NFS workers
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get
          validatingadmissionpolicybinding homelab-socrat5-local-storage
          --ignore-not-found -o name
      delegate_to: socrat-0
      register: socrat5_retired_storage_boundary
      changed_when: false
      failed_when: >-
        socrat5_retired_storage_boundary.rc != 0 or
        socrat5_retired_storage_boundary.stdout | trim != ''
      when: k3s_worker_nfs_enabled | default(false) | bool
  roles:
    # Required for NetBird/VXLAN mark separation before starting pod networking.
    - k3s_overlay_marks
    - k3s_worker
  post_tasks:
    - name: Prepare new-worker-only fail-closed overlay dependency
      ansible.builtin.file:
        path: /etc/systemd/system/k3s-agent.service.d
        state: directory
        mode: "0755"
    - name: Require the overlay mark boundary before this worker starts
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-agent.service.d/45-overlay-policy-guard.conf
        mode: "0644"
        content: |
          [Unit]
          Requires=homelab-k3s-overlay-marks.service
          After=homelab-k3s-overlay-marks.service
          [Service]
          ExecStartPre=/usr/local/sbin/homelab-k3s-overlay-marks --apply
    - name: Reload new-worker unit dependencies without restarting it
      ansible.builtin.systemd_service:
        daemon_reload: true
...
