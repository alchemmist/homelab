---
- name: Rehearse synthetic all-signal outage and durable restart on trusted socrat-0
  hosts: socrat-0
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    otel_ops_root: /var/lib/homelab-otel-operations
    otel_ops_memory_bytes: 3221225472
    otel_ops_artifacts:
      - {name: otelcol-contrib, source: /var/tmp/otel-signals-smoke/bin/otelcol-contrib, sha256: 57911a9d902cfe2c287dac09fcee4b054630b4ec248fa190a3115d860a32f81f}
      - {name: loki, source: /var/tmp/otel-signals-smoke/bin/loki, sha256: cfcaf9b519b514584d010791d7f2dd06472a62f0ba1bf922e619031db03f3464}
      - {name: tempo, source: /var/tmp/otel-signals-smoke/bin/tempo, sha256: 465af41aeac81580ccb802b0f98b2c07ab69e1895190b8583a785a834944666e}
      - {name: prometheus, source: /var/tmp/otel-metrics-smoke-20261029/prometheus, sha256: dac83d1d1007961de3b9ba624942c9af0c192ee3df262ac47ef390bcade71c65}
  tasks:
    - ansible.builtin.assert:
        that:
          - otel_ops_tls is defined
          - otel_ops_controller_output is defined
          - otel_ops_run is match('^[a-z0-9-]+$')
    - name: Require twenty-percent memory reserve beyond the complete test cgroup budget
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            from pathlib import Path; import json;
            m=dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines());
            print(json.dumps({k:int(m[k].split()[0])*1024 for k in ['MemTotal','MemAvailable']}))
      register: ops_memory
      changed_when: false
    - ansible.builtin.assert:
        that:
          - (ops_memory.stdout | from_json).MemAvailable - otel_ops_memory_bytes >= (ops_memory.stdout | from_json).MemTotal / 5
        fail_msg: No workload eviction or reserve waiver for the isolated test
    - ansible.builtin.file:
        path: '{{ otel_ops_root }}/{{ item }}'
        state: directory
        mode: '0700'
      loop: ['', bin, 'tls-{{ otel_ops_run }}', config]
    - ansible.builtin.copy:
        src: '{{ item.source }}'
        dest: '{{ otel_ops_root }}/bin/{{ item.name }}'
        remote_src: true
        mode: '0700'
      loop: '{{ otel_ops_artifacts }}'
    - ansible.builtin.stat:
        path: '{{ otel_ops_root }}/bin/{{ item.name }}'
        checksum_algorithm: sha256
      loop: '{{ otel_ops_artifacts }}'
      register: ops_hashes
    - ansible.builtin.assert:
        that: item.stat.checksum == item.item.sha256
      loop: '{{ ops_hashes.results }}'
    - name: Copy only isolated leaves and public CA, never a CA signing key
      ansible.builtin.copy:
        src: '{{ otel_ops_tls }}/{{ item }}'
        dest: '{{ otel_ops_root }}/tls-{{ otel_ops_run }}/{{ item }}'
        mode: '0600'
      loop: [ca.crt, server.crt, server.key, client.crt, client.key]
      no_log: true
    - ansible.builtin.copy:
        content: '{{ lookup("file", playbook_dir + "/../../deploy/monitoring/otel/" + item + ".yaml") | from_yaml | to_json }}'
        dest: '{{ otel_ops_root }}/config/{{ item }}.json'
        mode: '0600'
      loop: [cluster, trace-gateway, loki, tempo]
    - ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/otel-operational-replay.py'
        dest: '{{ otel_ops_root }}/replay.py'
        mode: '0700'
    - name: Only owned synthetic children in loopback-only namespace, durable state outside tmp
      ansible.builtin.command:
        argv:
          - systemd-run
          - --quiet
          - --collect
          - --wait
          - --pipe
          - '--unit=homelab-otel-ops-{{ otel_ops_run }}'
          - '--property=MemoryMax={{ otel_ops_memory_bytes }}'
          - --property=MemorySwapMax=0
          - --property=CPUQuota=100%
          - --property=RuntimeMaxSec=420
          - --property=OOMPolicy=kill
          - unshare
          - --net
          - --
          - sh
          - -ec
          - 'ip link set lo up; exec python3 "$@"'
          - isolated-ops
          - '{{ otel_ops_root }}/replay.py'
          - --binaries
          - '{{ otel_ops_root }}/bin'
          - --config
          - '{{ otel_ops_root }}/config'
          - --tls
          - '{{ otel_ops_root }}/tls-{{ otel_ops_run }}'
          - --workspace
          - '{{ otel_ops_root }}/{{ otel_ops_run }}'
      timeout: 450
      register: ops_replay
      changed_when: false
    - ansible.builtin.copy:
        content: '{{ ops_replay.stdout }}'
        dest: '{{ otel_ops_controller_output }}'
        mode: '0600'
      delegate_to: localhost
      become: false
