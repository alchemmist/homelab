---
- name: Whole-fleet DNS addition preflight (no package/config/service restarts)
  hosts: socrat-0:socrat-1:socrat-2:socrat-4
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Create the pgAdmin public DNS staging directory
      ansible.builtin.file:
        path: /var/lib/homelab-pgadmin-public-dns
        state: directory
        mode: "0700"
    - name: Install the pgAdmin public DNS plan and apply tool
      ansible.builtin.copy:
        src: ../../scripts/pgadmin-public-dns.py
        dest: /usr/local/sbin/homelab-pgadmin-public-dns
        mode: "0700"
    - name: Stage the proposed zone renderer for pgAdmin public DNS
      ansible.builtin.copy:
        src: ../../scripts/public_dns_zone.py
        dest: /var/lib/homelab-pgadmin-public-dns/proposed.py
        mode: "0700"
    - name: Compute the pgAdmin public DNS plan
      ansible.builtin.command: /usr/local/sbin/homelab-pgadmin-public-dns
      register: dns_plan
      changed_when: false
    - name: Display the pgAdmin public DNS plan
      ansible.builtin.debug:
        var: dns_plan.stdout
    - name: Require the approved pgAdmin public DNS plan hash
      ansible.builtin.assert:
        that: (dns_plan.stdout | from_json).plan_hash == pgadmin_public_dns_hash
      when: pgadmin_public_dns_apply | default(false) | bool
- name: Serial approved owned-zone refresh
  hosts: socrat-0:socrat-1:socrat-2:socrat-4
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Apply the approved pgAdmin public DNS plan
      ansible.builtin.command:
        argv: [/usr/local/sbin/homelab-pgadmin-public-dns, --apply, --approve-plan-hash,
               "{{ pgadmin_public_dns_hash }}"]
      when: pgadmin_public_dns_apply | default(false) | bool
      register: dns_apply
      changed_when: (dns_apply.stdout | from_json).applied
...
