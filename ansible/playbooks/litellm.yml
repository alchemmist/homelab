---
# Historical installation/branding/key initialization remains in Git history.
# Do not replay it over the authoritative runtime or use it for model updates.
- name: Refuse the retired competing LiteLLM installer
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require Git-owned LiteLLM maintenance instead of legacy bootstrap
      ansible.builtin.fail:
        msg: >-
          This LiteLLM installer is retired and performs no deployment, key
          initialization, branding upload or identity reconciliation. Existing
          LiteLLM belongs to deploy/argocd/apps/litellm.yaml, charts/litellm and
          deploy/platform/litellm/values.yaml; infrastructure and branding have
          separate owning Applications. Commit reviewed changes to their sources.
          Preserve existing keys, native identity, authoritative data and schema
          guards. For new installation/recovery review current prerequisites
          separately; do not re-enable migration Jobs or run this historical
          initializer to update models. See docs/vm105-lms-litellm-renderer-20261116.md.
      tags: [always]
...
