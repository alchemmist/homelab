---
- name: Whole-fleet DNS alias retirement preflight (no package/config/service restarts)
  hosts: socrat-0:socrat-1:socrat-2
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Create the Grafana TV alias retirement staging directory
      ansible.builtin.file:
        path: /var/lib/homelab-grafana-tv-dns-retirement
        state: directory
        mode: "0700"
    - name: Install the Grafana TV alias retirement plan and apply tool
      ansible.builtin.copy:
        src: ../../scripts/grafana-tv-dns.py
        dest: /usr/local/sbin/homelab-grafana-tv-dns
        mode: "0700"
    - name: Stage the proposed zone renderer for Grafana TV alias retirement
      ansible.builtin.copy:
        src: ../../scripts/public_dns_zone.py
        dest: /var/lib/homelab-grafana-tv-dns-retirement/proposed.py
        mode: "0700"
    - name: Compute the Grafana TV alias retirement plan
      ansible.builtin.command: /usr/local/sbin/homelab-grafana-tv-dns
      register: dns_plan
      changed_when: false
    - name: Display the Grafana TV alias retirement plan
      ansible.builtin.debug:
        var: dns_plan.stdout
    - name: Require the approved Grafana TV alias retirement plan hash
      ansible.builtin.assert:
        that: (dns_plan.stdout | from_json).plan_hash == public_web_dns_hash
      when: public_web_dns_apply | default(false) | bool
- name: Serial approved owned-zone refresh
  hosts: socrat-0:socrat-1:socrat-2
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Apply the approved Grafana TV alias retirement plan
      ansible.builtin.command:
        argv: [/usr/local/sbin/homelab-grafana-tv-dns,
               --apply,
               --approve-plan-hash,
               "{{ public_web_dns_hash }}"]
      when: public_web_dns_apply | default(false) | bool
      register: dns_apply
      changed_when: (dns_apply.stdout | from_json).applied
...
