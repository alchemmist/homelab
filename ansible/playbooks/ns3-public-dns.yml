---
- name: Whole-fleet DNS addition preflight (no package/config/service restarts)
  hosts: socrat-0:socrat-1:socrat-2:socrat-4
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    ansible_host: "{{ '10.250.0.2' if inventory_hostname == 'socrat-2' else inventory_hostname }}"
    ansible_port: "{{ 2223 if inventory_hostname == 'socrat-1' else 2222 }}"
    ansible_ssh_common_args:
      "{{ '-o ProxyJump=socrat-4 -o HostKeyAlias=[socrat.alchemmist.xyz]:2224 -o
      UserKnownHostsFile=~/.ssh/known_hosts.d/homelab -o StrictHostKeyChecking=yes'\n\
      \   if inventory_hostname == 'socrat-2' else '-o ProxyJump=none -o
      StrictHostKeyChecking=yes' }}"
  tasks:
    - name: Create the NS3 public DNS staging directory
      ansible.builtin.file:
        path: /var/lib/homelab-ns3-public-dns
        state: directory
        mode: "0700"
    - name: Install the NS3 public DNS plan and apply tool
      ansible.builtin.copy:
        src: ../../scripts/ns3-public-dns.py
        dest: /usr/local/sbin/homelab-ns3-public-dns
        mode: "0700"
    - name: Stage the proposed zone renderer for NS3 public DNS
      ansible.builtin.copy:
        src: ../../scripts/public_dns_zone.py
        dest: /var/lib/homelab-ns3-public-dns/proposed.py
        mode: "0700"
    - name: Compute the NS3 public DNS plan
      ansible.builtin.command: /usr/local/sbin/homelab-ns3-public-dns
      register: dns_plan
      changed_when: false
    - name: Display the NS3 public DNS plan
      ansible.builtin.debug:
        var: dns_plan.stdout
    - name: Require the approved NS3 public DNS plan hash
      ansible.builtin.assert:
        that: (dns_plan.stdout | from_json).plan_hash == ns3_public_dns_hash
      when: ns3_public_dns_apply | default(false) | bool
- name: Serial approved owned-zone refresh
  hosts: socrat-0:socrat-1:socrat-2:socrat-4
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    ansible_host: "{{ '10.250.0.2' if inventory_hostname == 'socrat-2' else inventory_hostname }}"
    ansible_port: "{{ 2223 if inventory_hostname == 'socrat-1' else 2222 }}"
    ansible_ssh_common_args:
      "{{ '-o ProxyJump=socrat-4 -o HostKeyAlias=[socrat.alchemmist.xyz]:2224 -o
      UserKnownHostsFile=~/.ssh/known_hosts.d/homelab -o StrictHostKeyChecking=yes'\n\
      \   if inventory_hostname == 'socrat-2' else '-o ProxyJump=none -o
      StrictHostKeyChecking=yes' }}"
  tasks:
    - name: Apply the approved NS3 public DNS plan
      ansible.builtin.command:
        argv: [/usr/local/sbin/homelab-ns3-public-dns,
               --apply,
               --approve-plan-hash,
               "{{ ns3_public_dns_hash }}"]
      when: ns3_public_dns_apply | default(false) | bool
      register: dns_apply
      changed_when: (dns_apply.stdout | from_json).applied
...
