- name: Bootstrap the shared wiki runtime Fleet deployment
  hosts: socrat-0
  gather_facts: false
  become: true
  vars:
    wiki_runtime_skip_legacy_git: false
  tasks:
    - name: Copy runtime bootstrap helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/bootstrap-wiki-runtime.py"
        dest: /tmp/bootstrap-wiki-runtime.py
        owner: root
        group: root
        mode: '0700'

    - name: Bootstrap isolated runtime prerequisites
      ansible.builtin.command:
        argv: "{{ ['python3', '/tmp/bootstrap-wiki-runtime.py'] + (['--skip-legacy-git'] if wiki_runtime_skip_legacy_git | bool else []) }}"
      register: wiki_runtime_bootstrap
      changed_when: "'created' in wiki_runtime_bootstrap.stdout"

    - name: Copy runtime Fleet repository manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/fleet/wiki-runtime.yaml"
        dest: /tmp/wiki-runtime-fleet.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Register runtime Fleet repository
      ansible.builtin.command:
        argv: [k3s, kubectl, apply, -f, /tmp/wiki-runtime-fleet.yaml]
      register: wiki_runtime_fleet
      changed_when: "'created' in wiki_runtime_fleet.stdout or 'configured' in wiki_runtime_fleet.stdout"

    - name: Show runtime Fleet reconciliation status
      ansible.builtin.command:
        argv: [k3s, kubectl, -n, fleet-local, get, gitrepo, wiki-runtime]
      changed_when: false
