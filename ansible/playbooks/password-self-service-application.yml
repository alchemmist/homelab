- name: Register the password self-service dashboard application only
  hosts: socrat-0
  gather_facts: false
  vars:
    password_application_root: /home/alchemmist/.cache/homelab-authentik
  tasks:
    - name: Copy bounded dashboard registration controller
      ansible.builtin.copy:
        src: ../roles/authentik/files/password_application.py
        dest: '{{ password_application_root }}/password_application.py'
        mode: '0600'
    - name: Copy declarative English application metadata
      ansible.builtin.copy:
        src: ../../deploy/identity/password-self-service-application.json
        dest: '{{ password_application_root }}/password-self-service-application.json'
        mode: '0600'
    - name: Validate or register the dashboard link
      ansible.builtin.command:
        argv: '{{ ["python3", password_application_root + "/password_application.py", password_application_root] + (["--apply"] if password_application_apply | default(false) | bool else []) }}'
      register: password_application_result
      changed_when: "'Receipt:' in password_application_result.stdout"
