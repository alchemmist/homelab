---
- name: Refuse the retired competing searxng installer
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require the existing Git-owned Applications
      ansible.builtin.fail:
        msg: >-
          This legacy installer is retired. Existing workloads belong to
          deploy/argocd/apps/searxng.yaml and charts/searxng. Commit reviewed changes to the owning Git sources.
          No deployment, namespace or key initialization, workspace instruction
          update, user integration, DNS/firewall or imported follow-up is performed.
          Preserve existing credentials, authoritative data and native access.
          New installation or recovery requires separately reviewed prerequisites;
          do not replay this historical bootstrap. See docs/infrastructure-contracts.md.
      tags: [always]
...
