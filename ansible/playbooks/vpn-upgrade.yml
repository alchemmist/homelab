---
- name: Upgrade the primary VPN and its dormant recovery runtime
  hosts: socrat-2
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    vpn_upgrade_image: "{{ (lookup('file', playbook_dir + '/../../charts/x-ui/values.yaml') | from_yaml).instances.primary.image }}"
    vpn_upgrade_chart: "{{ homelab_user_home }}/tmp-charts/x-ui-upgrade"
  tasks:
    - name: Inspect recovery and maintenance markers
      ansible.builtin.stat:
        path: "/var/lib/homelab-vpn-failover/{{ item }}"
      loop: [active, inhibit]
      register: vpn_upgrade_markers

    - name: Require normal operation without existing maintenance
      ansible.builtin.assert:
        that: not item.stat.exists
        quiet: true
      loop: "{{ vpn_upgrade_markers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify the live VPN before maintenance
      ansible.builtin.command: /usr/bin/python3 /usr/local/sbin/homelab-vpn-failover check
      changed_when: false

    - name: Record the current release revision
      ansible.builtin.command: helm list -n x-ui --filter ^x-ui$ -o json --kubeconfig /etc/rancher/k3s/k3s.yaml
      delegate_to: socrat-0
      become: false
      register: vpn_upgrade_releases
      changed_when: false

    - name: Require an existing deployed release
      ansible.builtin.assert:
        that:
          - vpn_upgrade_releases.stdout | from_json | length == 1
          - (vpn_upgrade_releases.stdout | from_json)[0].status == 'deployed'

    - name: Copy the desired VPN chart
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../charts/x-ui/"
        dest: "{{ vpn_upgrade_chart }}/"
        mode: preserve
      delegate_to: socrat-0
      become: false

    - name: Validate the desired chart
      ansible.builtin.command: "helm lint {{ vpn_upgrade_chart }}"
      delegate_to: socrat-0
      become: false
      changed_when: false

    - name: Pull the pinned image before interrupting the running workload
      ansible.builtin.command: "k3s crictl pull {{ vpn_upgrade_image }}"
      changed_when: false

    - name: Install the configuration and tunnel verifiers
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../roles/vpn_consolidation/files/{{ item.src }}"
        dest: "/usr/local/sbin/{{ item.dest }}"
        owner: root
        group: root
        mode: '0700'
      loop:
        - {src: verify_vpn.py, dest: homelab-verify-vpn}
        - {src: probe_vpn.py, dest: homelab-probe-vpn}

    - name: Verify the authenticated public tunnel
      ansible.builtin.command: /usr/bin/python3 /usr/local/sbin/homelab-probe-vpn
      changed_when: false

    - name: Allocate a private upgrade backup
      ansible.builtin.command: mktemp -d /var/backups/homelab-vpn/upgrade-XXXXXXXX
      register: vpn_upgrade_backup
      changed_when: true

    - name: Apply and verify the upgrade under maintenance protection
      block:
        - name: Pause the watchdog
          ansible.builtin.systemd_service:
            name: homelab-vpn-watchdog.timer
            state: stopped
          register: vpn_upgrade_timer

        - name: Wait for the watchdog lock and inhibit recovery
          ansible.builtin.command: flock --exclusive --timeout 240 /var/lib/homelab-vpn-failover/lock touch /var/lib/homelab-vpn-failover/inhibit
          register: vpn_upgrade_inhibit
          changed_when: true

        - name: Recheck the recovery latch
          ansible.builtin.stat:
            path: /var/lib/homelab-vpn-failover/active
          register: vpn_upgrade_active

        - name: Refuse upgrade if recovery activated concurrently
          ansible.builtin.assert:
            that: not vpn_upgrade_active.stat.exists

        - name: Back up both databases and fingerprint configuration and subscriptions
          ansible.builtin.command: "/usr/bin/python3 /usr/local/sbin/homelab-verify-vpn snapshot --directory {{ vpn_upgrade_backup.stdout }}"
          changed_when: true

        - name: Prepare a separate recovery runtime from the pinned image
          ansible.builtin.command: "/usr/bin/python3 /opt/homelab-vpn-failover/prepare_runtime.py {{ vpn_upgrade_image }} {{ vpn_upgrade_backup.stdout }}/new-primary-runtime"
          changed_when: true

        - name: Record the beginning of the Helm update
          ansible.builtin.set_fact:
            vpn_upgrade_started: true

        - name: Upgrade the unified workload
          ansible.builtin.command: >-
            helm upgrade x-ui {{ vpn_upgrade_chart }} -n x-ui
            --kubeconfig /etc/rancher/k3s/k3s.yaml
            --reset-values --atomic --wait --timeout 5m
          delegate_to: socrat-0
          become: false
          changed_when: true

        - name: Verify configuration and all subscriptions after upgrade
          ansible.builtin.command: "/usr/bin/python3 /usr/local/sbin/homelab-verify-vpn verify --directory {{ vpn_upgrade_backup.stdout }}"
          changed_when: false

        - name: Verify the authenticated public tunnel after upgrade
          ansible.builtin.command: /usr/bin/python3 /usr/local/sbin/homelab-probe-vpn
          changed_when: false

        - name: Retain the previous dormant runtime
          ansible.builtin.command: "mv /opt/homelab-vpn-failover/primary {{ vpn_upgrade_backup.stdout }}/previous-primary-runtime"
          register: vpn_upgrade_runtime_saved
          changed_when: true

        - name: Activate the new dormant runtime
          ansible.builtin.command: "mv {{ vpn_upgrade_backup.stdout }}/new-primary-runtime /opt/homelab-vpn-failover/primary"
          register: vpn_upgrade_runtime_installed
          changed_when: true

        - name: Verify native recovery in isolated networking with database copies
          ansible.builtin.command: /usr/bin/python3 /opt/homelab-vpn-failover/smoke_test.py
          changed_when: false

        - name: Verify both live VPN configurations and TLS routing
          ansible.builtin.command: /usr/bin/python3 /usr/local/sbin/homelab-vpn-failover check
          changed_when: false

      rescue:
        - name: Retain the failed replacement runtime
          ansible.builtin.command: "mv /opt/homelab-vpn-failover/primary {{ vpn_upgrade_backup.stdout }}/failed-primary-runtime"
          when: vpn_upgrade_runtime_installed is defined and vpn_upgrade_runtime_installed is succeeded

        - name: Restore the previous recovery runtime
          ansible.builtin.command: "mv {{ vpn_upgrade_backup.stdout }}/previous-primary-runtime /opt/homelab-vpn-failover/primary"
          when: vpn_upgrade_runtime_saved is defined and vpn_upgrade_runtime_saved is succeeded

        - name: Restore the previous Helm revision
          ansible.builtin.command: >-
            helm rollback x-ui {{ (vpn_upgrade_releases.stdout | from_json)[0].revision }}
            -n x-ui --kubeconfig /etc/rancher/k3s/k3s.yaml --wait --timeout 5m
          delegate_to: socrat-0
          become: false
          when: vpn_upgrade_started | default(false)

        - name: Report the failed upgrade without overwriting live databases
          ansible.builtin.fail:
            msg: "Upgrade failed; previous runtime and Helm revision restored. Inspect {{ vpn_upgrade_backup.stdout }}. Database snapshots were not restored over live data."

      always:
        - name: Remove this upgrade's maintenance marker
          ansible.builtin.file:
            path: /var/lib/homelab-vpn-failover/inhibit
            state: absent
          when: vpn_upgrade_inhibit is defined and vpn_upgrade_inhibit is succeeded

        - name: Resume the watchdog
          ansible.builtin.systemd_service:
            name: homelab-vpn-watchdog.timer
            state: started
          when: vpn_upgrade_timer is defined and vpn_upgrade_timer is succeeded

    - name: Report the private backup location
      ansible.builtin.debug:
        msg: "Verified VPN upgrade; backups and previous recovery runtime retained in {{ vpn_upgrade_backup.stdout }}"
