---
- name: Maintain dedicated application leaves and narrowly scoped renewable mirrors
  hosts: socrat-0
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prepare protected application credential manifests
      ansible.builtin.file:
        path: /var/lib/homelab-otel/application-credential-assets
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Copy maintained manifests containing no credential values
      ansible.builtin.copy:
        src: '../../deploy/monitoring/{{ item }}'
        dest: '/var/lib/homelab-otel/application-credential-assets/{{ item }}'
        mode: '0600'
      loop:
        - otel-application-pki.yaml
        - otel-application-credentials.yaml
    - name: Maintain cert-manager client leaves without copying the CA private key
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, apply, -f, /var/lib/homelab-otel/application-credential-assets/otel-application-pki.yaml]
      register: application_pki_apply
      changed_when: "'created' in application_pki_apply.stdout or 'configured' in application_pki_apply.stdout"
    - name: Discover only named target Secret identities without reading values
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, -n, '{{ item.namespace }}', get, secret, '{{ item.name }}', --ignore-not-found, -o, name]
      loop:
        - {namespace: lms, name: otel-app-tls-lms}
        - {namespace: harbor, name: otel-app-tls-harbor}
        - {namespace: llm, name: otel-app-tls-litellm}
        - {namespace: llm, name: otel-app-tls-vllm}
        - {namespace: llm, name: otel-app-tls-open-webui}
      register: application_target_secrets
      changed_when: false
    - name: Create only missing opaque targets without overwriting existing leaf data
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, -n, '{{ item.item.namespace }}', create, secret, generic, '{{ item.item.name }}']
      loop: '{{ application_target_secrets.results }}'
      loop_control:
        label: '{{ item.item.namespace }}/{{ item.item.name }}'
      when: item.stdout | length == 0
      changed_when: true
    - name: Maintain bounded native TLS-validating leaf mirror CronJob and named RBAC
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, apply, -f, /var/lib/homelab-otel/application-credential-assets/otel-application-credentials.yaml]
      register: application_mirror_apply
      changed_when: "'created' in application_mirror_apply.stdout or 'configured' in application_mirror_apply.stdout"
