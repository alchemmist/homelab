---
- name: Configure shared SearXNG search in Open WebUI
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Copy the search configuration helper
      ansible.builtin.copy:
        src: ../files/configure_webui_search.py
        dest: '{{ homelab_user_home }}/tmp-charts/configure-webui-search.py'
        mode: '0600'
    - name: Locate the running Open WebUI pod
      ansible.builtin.command: kubectl -n llm get pod -l app=open-webui -o jsonpath={.items[0].metadata.name}
      register: webui_search_pod
      changed_when: false
    - name: Copy the helper into Open WebUI
      ansible.builtin.command: >-
        kubectl -n llm cp {{ homelab_user_home }}/tmp-charts/configure-webui-search.py
        {{ webui_search_pod.stdout }}:/tmp/configure-webui-search.py
      changed_when: false
    - name: Enable search for Qwen and all users while preserving unrelated settings
      ansible.builtin.command: >-
        kubectl -n llm exec {{ webui_search_pod.stdout }} -- env PYTHONPATH=/app/backend
        python /tmp/configure-webui-search.py
      register: webui_search_config
      changed_when: (webui_search_config.stdout | from_json).changed
