---
# Compatibility entrypoint only. Historical installer remains in Git history;
# do not restore its upstream Helm upgrade or post-install imperative patches.
- name: Refuse the retired competing Rancher installer
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require Git-owned Rancher maintenance instead of legacy bootstrap
      ansible.builtin.fail:
        msg: >-
          This Rancher installer is retired and performs no deployment or bootstrap.
          Existing Rancher belongs to deploy/argocd/apps/rancher.yaml, the vendored
          charts/rancher and deploy/platform/rancher/values.yaml. Commit reviewed
          changes there; use rancher-placement.yml only for its documented targeted
          refresh/verification. Do not run upstream Helm upgrade, reset bootstrap
          credentials, or restore stale PVCs. For a new installation or recovery,
          review docs/platform/rancher-private-access.md and the current prerequisites
          separately; this refusal is not an automated empty-cluster restore.
      tags: [always]
...
