---
- name: Install Rancher on k3s
  hosts: socrat-0
  gather_facts: false
  become: true
  vars:
    rancher_hostname: rancher.socrat.alchemmist.xyz
    rancher_email: antropophag@gmail.com
    rancher_replicas: 1
    rancher_cluster_display_name: socrat
  tasks:
    - name: Require rancher_bootstrap_password variable
      ansible.builtin.fail:
        msg: "Pass -e rancher_bootstrap_password=... (do not commit it to git)"
      when: rancher_bootstrap_password is not defined or rancher_bootstrap_password | length < 8

    - name: Install Helm if missing
      ansible.builtin.shell: |
        set -eu
        if ! command -v helm >/dev/null 2>&1; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
      args:
        creates: /usr/local/bin/helm

    - name: Add Rancher stable Helm repository
      ansible.builtin.command: helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
      register: helm_repo_add
      failed_when: helm_repo_add.rc not in [0, 1]
      changed_when: helm_repo_add.rc == 0 and 'already exists' not in (helm_repo_add.stderr + helm_repo_add.stdout)

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Ensure cattle-system namespace exists
      ansible.builtin.command: k3s kubectl create namespace cattle-system
      register: cattle_ns
      failed_when: cattle_ns.rc not in [0, 1]
      changed_when: cattle_ns.rc == 0

    - name: Render Rancher Helm values
      ansible.builtin.copy:
        dest: /tmp/rancher-values.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          hostname: {{ rancher_hostname }}
          replicas: {{ rancher_replicas }}
          bootstrapPassword: {{ rancher_bootstrap_password | quote }}

          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi

          ingress:
            tls:
              source: letsEncrypt

          letsEncrypt:
            email: {{ rancher_email }}
            ingress:
              class: traefik

          nodeSelector:
            kubernetes.io/hostname: socrat-0

    - name: Install or upgrade Rancher
      ansible.builtin.command: >-
        helm upgrade --install rancher rancher-stable/rancher
        --namespace cattle-system
        --kubeconfig /etc/rancher/k3s/k3s.yaml
        --values /tmp/rancher-values.yaml
        --wait
        --timeout 10m
      register: rancher_helm
      changed_when: "'has been upgraded' in rancher_helm.stdout or 'has been installed' in rancher_helm.stdout"

    - name: Pin Rancher deployments to socrat-0
      ansible.builtin.command: >-
        k3s kubectl -n cattle-system patch deploy {{ item }} --type merge
        -p '{"spec":{"template":{"spec":{"nodeSelector":{"kubernetes.io/hostname":"socrat-0"}}}}}'
      loop:
        - rancher
        - rancher-webhook
      register: rancher_pin
      failed_when: rancher_pin.rc != 0 and 'not found' not in rancher_pin.stderr
      changed_when: rancher_pin.rc == 0

    - name: Wait for Rancher rollout
      ansible.builtin.command: k3s kubectl -n cattle-system rollout status deploy/rancher --timeout=600s
      changed_when: false

    - name: Set Rancher auxiliary deployment resources
      ansible.builtin.command: >-
        k3s kubectl -n cattle-system set resources deployment/{{ item.name }}
        --requests=cpu={{ item.requests_cpu }},memory={{ item.requests_memory }}
        --limits=memory={{ item.limits_memory }}
      loop:
        - name: rancher-webhook
          requests_cpu: 20m
          requests_memory: 64Mi
          limits_memory: 256Mi
        - name: system-upgrade-controller
          requests_cpu: 10m
          requests_memory: 64Mi
          limits_memory: 256Mi
      register: rancher_aux_resources
      failed_when: rancher_aux_resources.rc != 0 and 'not found' not in rancher_aux_resources.stderr
      changed_when: rancher_aux_resources.rc == 0

    - name: Wait for Rancher webhook rollout when present
      ansible.builtin.command: k3s kubectl -n cattle-system rollout status deploy/rancher-webhook --timeout=600s
      register: rancher_webhook_rollout
      failed_when: rancher_webhook_rollout.rc != 0 and 'not found' not in rancher_webhook_rollout.stderr
      changed_when: false

    - name: Wait for system-upgrade-controller rollout when present
      ansible.builtin.command: k3s kubectl -n cattle-system rollout status deploy/system-upgrade-controller --timeout=600s
      register: system_upgrade_controller_rollout
      failed_when: system_upgrade_controller_rollout.rc != 0 and 'not found' not in system_upgrade_controller_rollout.stderr
      changed_when: false

    - name: Rename Rancher local cluster display name
      ansible.builtin.command: >-
        k3s kubectl patch clusters.management.cattle.io local --type merge
        -p '{"spec":{"displayName":"{{ rancher_cluster_display_name }}"}}'
      changed_when: false

    - name: Add official Rancher UI extension repository
      ansible.builtin.command: k3s kubectl apply -f -
      args:
        stdin: |
          apiVersion: catalog.cattle.io/v1
          kind: ClusterRepo
          metadata:
            name: rancher-ui-plugins
          spec:
            gitRepo: https://github.com/rancher/ui-plugin-charts
            gitBranch: main
      changed_when: false

    - name: Add Rancher partner extension repository
      ansible.builtin.command: k3s kubectl apply -f -
      args:
        stdin: |
          apiVersion: catalog.cattle.io/v1
          kind: ClusterRepo
          metadata:
            name: partner-extensions
          spec:
            gitRepo: https://github.com/rancher/partner-extensions
            gitBranch: main
      changed_when: false

    - name: Copy Rancher UI logo to control-plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../assets/rancher/socrat-logo.png"
        dest: /tmp/socrat-logo.png
        owner: root
        group: root
        mode: "0644"

    - name: Set Rancher UI logo
      ansible.builtin.shell: |
        set -eu
        python3 - <<'PY'
        import base64
        import json
        import subprocess
        from pathlib import Path

        patch_dir = Path("/tmp/rancher-logo-patches")
        patch_dir.mkdir(exist_ok=True)
        val = "data:image/png;base64," + base64.b64encode(Path("/tmp/socrat-logo.png").read_bytes()).decode()
        for name in ["ui-logo-light", "ui-logo-dark"]:
            patch_file = patch_dir / f"{name}-patch.json"
            patch_file.write_text(json.dumps({"value": val, "customized": True}))
            subprocess.run(
                ["k3s", "kubectl", "patch", "settings.management.cattle.io", name, "--type", "merge", "--patch-file", str(patch_file)],
                check=True,
            )
        PY
      changed_when: false

    - name: Show Rancher status
      ansible.builtin.shell: |
        k3s kubectl -n cattle-system get pods,svc,ingress -o wide
        k3s kubectl get clusters.management.cattle.io local -o jsonpath='{.spec.displayName}{"\n"}'
      changed_when: false
      register: rancher_status

    - name: Print Rancher status
      ansible.builtin.debug:
        var: rancher_status.stdout_lines
