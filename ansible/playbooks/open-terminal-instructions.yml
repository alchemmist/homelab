---
- name: Maintain workspace and inline delivery instructions
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Update the managed instructions without restarting the terminal
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - llm
          - exec
          - -i
          - deployment/open-terminal
          - --
          - python
          - -c
          -
            "import json\n\
            import sys\n\
            from pathlib import Path\n\
            \n\
            path = Path('/home/user/AGENTS.md')\n\
            begin = '<!-- homelab-workspace-delivery:start -->'\n\
            end = '<!-- homelab-workspace-delivery:end -->'\n\
            block = begin + '\\n' + sys.stdin.read().strip() + '\\n' + end\n\
            before = path.read_text() if path.exists() else ''\n\
            if begin in before or end in before:\n\
            \    if before.count(begin) != 1 or before.count(end) != 1 or before.index(begin) >
            before.index(end):\n\
            \        raise RuntimeError('Invalid managed instruction markers')\n\
            \    after = before[:before.index(begin)] + block + before[before.index(end) +
            len(end):]\n\
            else:\n\
            \    after = before + ('\\n\\n' if before else '') + block + '\\n'\n\
            if after != before:\n\
            \    path.write_text(after)\n\
            if path.read_text() != after:\n\
            \    raise RuntimeError('Instruction readback failed')\n\
            print(json.dumps({'changed': after != before, 'path': str(path)}))\n"
        stdin: "{{ lookup('file', playbook_dir + '/../files/open-terminal-AGENTS.md') }}"
      register: terminal_instructions
      changed_when: (terminal_instructions.stdout | from_json).changed
...
