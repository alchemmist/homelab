---
- name: Explicit bounded public-web maintenance (audit by default)
  hosts: socrat-0
  gather_facts: false
  become: true
  vars:
    maintenance_helpers:
      role-groups: public-web-role-groups
      retire-grafana-gate: retire-grafana-proxy-gate
      grafana-empty-admission: grafana-app-admission
  tasks:
    - ansible.builtin.assert:
        that: public_web_maintenance_task | default('') in maintenance_helpers
    - ansible.builtin.copy:
        src: "../../scripts/{{ maintenance_helpers[public_web_maintenance_task] }}.py"
        dest: "/usr/local/sbin/homelab-{{ maintenance_helpers[public_web_maintenance_task] }}"
        mode: '0700'
    - ansible.builtin.command:
        argv: "{{ ['/usr/local/sbin/homelab-' + maintenance_helpers[public_web_maintenance_task]] + (['--apply','--approve-plan-hash',public_web_maintenance_hash | default('')] if public_web_maintenance_apply | default(false) | bool else []) }}"
      register: maintenance
      changed_when: (maintenance.stdout|from_json).applied
      when: not ansible_check_mode
    - ansible.builtin.debug:
        var: maintenance.stdout
      when: not ansible_check_mode
