---
- name: Deploy homelab applications
  hosts: socrat-0
  gather_facts: false
  become: true
  vars:
    apps:
      - name: blog
        namespace: blog
        chart: blog
      - name: cats
        namespace: cats
        chart: cats
      - name: img-proxy
        namespace: img-proxy
        chart: img-proxy
      - name: lms
        namespace: lms
        chart: lms
      - name: syncthing
        namespace: syncthing
        chart: syncthing
      - name: remark42
        namespace: remark42
        chart: remark42
      - name: umami
        namespace: umami
        chart: umami
      - name: monori
        namespace: monori
        chart: monori
      - name: format-quorum
        namespace: format-quorum
        chart: format-quorum
      - name: uptime-kuma
        namespace: uptime-kuma
        chart: uptime-kuma
      - name: traefik-edge
        namespace: traefik-edge
        chart: traefik-edge
      - name: x-ui-lab
        namespace: x-ui-lab
        chart: x-ui
      - name: x-ui-legacy
        namespace: x-ui-legacy
        chart: x-ui
        valuesFile: values-legacy.yaml
  tasks:
    - name: Ensure app namespaces exist
      ansible.builtin.command: k3s kubectl create namespace {{ item.namespace }}
      loop: "{{ apps }}"
      register: app_ns
      failed_when: app_ns.rc not in [0, 1]
      changed_when: app_ns.rc == 0

    - name: Copy app Helm charts to control-plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../charts/{{ item.chart }}/"
        dest: "/tmp/charts/{{ item.chart }}/"
        owner: root
        group: root
        mode: preserve
      loop: "{{ apps }}"

    - name: Generate Syncthing private endpoints from the node registry
      ansible.builtin.include_role:
        name: syncthing_private_ui
        tasks_from: prepare

    - name: Prepare Syncthing private HTTPS before changing pod access
      ansible.builtin.include_role:
        name: syncthing_private_ui
        tasks_from: certificate

    - name: Install or upgrade app Helm releases
      ansible.builtin.command: >-
        helm upgrade --install {{ item.name }} /tmp/charts/{{ item.chart }}
        --namespace {{ item.namespace }}
        --kubeconfig /etc/rancher/k3s/k3s.yaml
        {{ ('--values /tmp/charts/' ~ item.chart ~ '/' ~ item.valuesFile) if item.valuesFile is defined else '' }}
        {{ '--values /tmp/charts/syncthing/private-ui-values.yml' if item.name == 'syncthing' else '' }}
        --wait
        --timeout 5m
      loop: "{{ apps }}"
      register: app_helm
      changed_when: "'has been upgraded' in app_helm.stdout or 'has been installed' in app_helm.stdout"

    - name: Show app status
      ansible.builtin.shell: |
        set -eu
        for ns in {% for app in apps %}{{ app.namespace }} {% endfor %}; do
          echo "--- namespace: $ns"
          k3s kubectl -n "$ns" get deploy,pod,svc,ingress,certificate -o wide
        done
      changed_when: false
      register: app_status

    - name: Print app status
      ansible.builtin.debug:
        var: app_status.stdout_lines
