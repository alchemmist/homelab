---
- name: Prepare Android TV administration from the home server
  hosts: socrat-0
  gather_facts: false
  vars:
    homelab_tv_serial: 192.168.0.19:5555
    homelab_tv_expected_model: MiTV-MOOQ1
    homelab_tv_select_hdmi: false
    homelab_tv_fully_package: de.ozerov.fully
    homelab_tv_fully_reapply: false
    homelab_tv_fully_start_url: https://grafana.socrat.alchemmist.xyz/d/socrat-traffic-light?kiosk=1&hideLogo=1
    homelab_tv_fully_settings:
      startURL: "{{ homelab_tv_fully_start_url }}"
      injectJsCode: ""
      launchOnBoot: false
      kioskMode: false
      disableHome: false
      disableHomeButton: false
    homelab_tv_quickactions_package: dev.vodik7.tvquickactions.free
    homelab_tv_quickactions_service: dev.vodik7.tvquickactions.free/dev.vodik7.tvquickactions.KeyAccessibilityService
    homelab_tv_wireguard_package: com.wireguard.android
    homelab_tv_hdmi_package: xyz.alchemmist.hdmi
    homelab_tv_partner_package: com.xiaomi.android.tvsetup.partnercustomizer
    homelab_tv_home_component: com.google.android.tvlauncher/.MainActivity
    homelab_tv_persistent_packages:
      - "{{ homelab_tv_fully_package }}"
      - "{{ homelab_tv_quickactions_package }}"
      - "{{ homelab_tv_wireguard_package }}"
      - "{{ homelab_tv_hdmi_package }}"
    homelab_tv_fully_settings_path: "{{ homelab_user_home }}/.cache/homelab-tv/fully-once-settings.json"
  tasks:
    - name: Install Android Debug Bridge
      become: true
      ansible.builtin.package:
        name: adb
        state: present

    - name: Create the private SSH directory
      ansible.builtin.file:
        path: "{{ homelab_user_home }}/.ssh"
        state: directory
        mode: '0700'

    - name: Create a dedicated TV administration key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ''
          - -C
          - homelab-socrat-0-tv
          - -f
          - "{{ homelab_user_home }}/.ssh/homelab-tv"
        creates: "{{ homelab_user_home }}/.ssh/homelab-tv"

    - name: Connect to the authorized Android TV
      ansible.builtin.command:
        argv: [adb, connect, "{{ homelab_tv_serial }}"]
      changed_when: false
      check_mode: false

    - name: Require TV debugging authorization
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", get-state]
      register: homelab_tv_adb_state
      changed_when: false
      check_mode: false
      failed_when: homelab_tv_adb_state.rc != 0 or homelab_tv_adb_state.stdout != 'device'

    - name: Read the television model
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, getprop, ro.product.model]
      register: homelab_tv_model
      changed_when: false
      check_mode: false

    - name: Require the inspected Xiaomi firmware family
      ansible.builtin.assert:
        that:
          - homelab_tv_model.stdout == homelab_tv_expected_model
        quiet: true

    - name: Read source restoration behavior
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, get, global, set_auto_play]
      register: homelab_tv_restore_source
      changed_when: false
      check_mode: false

    - name: Restore the last input when the television starts
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, put, global, set_auto_play, '1']
      when: homelab_tv_restore_source.stdout != '1'

    - name: Select HDMI 1 when explicitly requested
      ansible.builtin.command:
        argv:
          - adb
          - -s
          - "{{ homelab_tv_serial }}"
          - shell
          - am
          - start
          - -W
          - -n
          - com.mediatek.wwtv.tvcenter/com.mitv.livetv.tv.MainActivity
          - -a
          - android.intent.action.VIEW
          - -t
          - vnd.android.cursor.item/channel
          - -d
          - content://android.media.tv/passthrough/com.mediatek.tvinput%2F.hdmi.HDMIInputService%2FHW4
      when: homelab_tv_select_hdmi | bool

    - name: Require the living-room television packages
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, pm, path, "{{ item }}"]
      loop: "{{ homelab_tv_persistent_packages }}"
      changed_when: false
      check_mode: false
      failed_when: rc != 0 or item not in stdout

    - name: Read disabled television packages
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, pm, list, packages, -d]
      register: homelab_tv_disabled_packages
      changed_when: false
      check_mode: false

    - name: Keep the Xiaomi partner customizer from taking the remote buttons
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, pm, disable-user, --user, "0", "{{ homelab_tv_partner_package }}"]
      when: homelab_tv_partner_package not in homelab_tv_disabled_packages.stdout

    - name: Read the current home screen
      ansible.builtin.command:
        argv:
          - adb
          - -s
          - "{{ homelab_tv_serial }}"
          - shell
          - cmd
          - package
          - resolve-activity
          - --brief
          - -a
          - android.intent.action.MAIN
          - -c
          - android.intent.category.HOME
      register: homelab_tv_home
      changed_when: false
      check_mode: false

    - name: Keep Home on the normal television launcher
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, cmd, package, set-home-activity, "{{ homelab_tv_home_component }}"]
      when: homelab_tv_fully_package in homelab_tv_home.stdout

    - name: Read the accessibility master switch
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, get, secure, accessibility_enabled]
      register: homelab_tv_accessibility_enabled
      changed_when: false
      check_mode: false

    - name: Leave accessibility available for the remote helper
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, put, secure, accessibility_enabled, "1"]
      when: homelab_tv_accessibility_enabled.stdout != '1'

    - name: Read enabled accessibility services
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, get, secure, enabled_accessibility_services]
      register: homelab_tv_accessibility_services
      changed_when: false
      check_mode: false

    - name: Keep tvQuickActions bound across reboot
      ansible.builtin.command:
        argv:
          - adb
          - -s
          - "{{ homelab_tv_serial }}"
          - shell
          - settings
          - put
          - secure
          - enabled_accessibility_services
          - "{{ homelab_tv_quickactions_service if homelab_tv_accessibility_services.stdout in ['null', ''] else homelab_tv_accessibility_services.stdout ~ ':' ~ homelab_tv_quickactions_service }}"
      when: homelab_tv_quickactions_service not in homelab_tv_accessibility_services.stdout

    - name: Read the standby whitelist
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, dumpsys, deviceidle, whitelist]
      register: homelab_tv_idle_whitelist
      changed_when: false
      check_mode: false

    - name: Keep the television helpers out of standby
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, dumpsys, deviceidle, whitelist, "+{{ item }}"]
      loop: "{{ homelab_tv_persistent_packages }}"
      when: item not in homelab_tv_idle_whitelist.stdout

    - name: Read background execution for the television helpers
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, appops, get, "{{ item.0 }}", "{{ item.1 }}"]
      loop: "{{ homelab_tv_persistent_packages | product(['RUN_IN_BACKGROUND', 'RUN_ANY_IN_BACKGROUND']) | list }}"
      register: homelab_tv_background
      changed_when: false
      check_mode: false

    - name: Allow the television helpers to start again after boot
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, appops, set, "{{ item.item.0 }}", "{{ item.item.1 }}", allow]
      loop: "{{ homelab_tv_background.results }}"
      when: "'allow' not in item.stdout"

    - name: Read the always-on VPN app
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, get, secure, always_on_vpn_app]
      register: homelab_tv_vpn_app
      changed_when: false
      check_mode: false

    - name: Bring the WireGuard tunnel up when the television boots
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, put, secure, always_on_vpn_app, "{{ homelab_tv_wireguard_package }}"]
      when: homelab_tv_vpn_app.stdout != homelab_tv_wireguard_package

    - name: Read VPN lockdown
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, get, secure, always_on_vpn_lockdown]
      register: homelab_tv_vpn_lockdown
      changed_when: false
      check_mode: false

    - name: Leave YouTube and Kinopoisk on the normal network
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, settings, put, secure, always_on_vpn_lockdown, "0"]
      when: homelab_tv_vpn_lockdown.stdout != '0'

    - name: Read Fully shared-storage access
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, appops, get, "{{ homelab_tv_fully_package }}", "{{ item }}"]
      loop:
        - NO_ISOLATED_STORAGE
        - LEGACY_STORAGE
      register: homelab_tv_fully_storage
      changed_when: false
      check_mode: false

    - name: Let Fully read one-shot settings from shared storage
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, appops, set, "{{ homelab_tv_fully_package }}", "{{ item.item }}", allow]
      loop: "{{ homelab_tv_fully_storage.results }}"
      when: "'allow' not in item.stdout"

    - name: Create the Fully settings directory
      ansible.builtin.file:
        path: "{{ homelab_tv_fully_settings_path | dirname }}"
        state: directory
        mode: '0700'

    - name: Render Fully one-shot settings
      ansible.builtin.copy:
        dest: "{{ homelab_tv_fully_settings_path }}"
        content: "{{ (homelab_tv_fully_settings | to_nice_json) ~ '\n' }}"
        mode: '0600'
      register: homelab_tv_fully_settings_file

    - name: Push Fully one-shot settings
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", push, "{{ homelab_tv_fully_settings_path }}", /sdcard/fully-once-settings.json]
      when: homelab_tv_fully_settings_file.changed or homelab_tv_fully_reapply | bool

    - name: Restart Fully so it imports the start URL
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, "{{ item }}"]
      loop:
        - am force-stop {{ homelab_tv_fully_package }}
        - am start -n {{ homelab_tv_fully_package }}/.FullyActivity
      when: homelab_tv_fully_settings_file.changed or homelab_tv_fully_reapply | bool

    - name: Wait until Fully consumes the one-shot settings
      ansible.builtin.command:
        argv: [adb, -s, "{{ homelab_tv_serial }}", shell, ls, /sdcard/fully-once-settings.json]
      register: homelab_tv_fully_import
      changed_when: false
      check_mode: false
      failed_when: false
      retries: 8
      delay: 1
      until: homelab_tv_fully_import.rc != 0
      when: homelab_tv_fully_settings_file.changed or homelab_tv_fully_reapply | bool
