---
- name: Keep routine guest system output off the VM105 login console
  hosts: socrat-5
  become: true
  gather_facts: false
  tasks:
    - name: Persist a zero console threshold without reducing kernel ring buffer logging
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-zz-socrat5-quiet-console.conf
        mode: '0644'
        content: "kernel.printk = 0 4 0 7\n"

    - name: Read current kernel printk settings
      ansible.builtin.command: sysctl -n kernel.printk
      register: printk_live
      changed_when: false
      check_mode: false

    - name: Quiet the running kernel without restarting the guest
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-zz-socrat5-quiet-console.conf
      when: printk_live.stdout.split() != ['0', '4', '0', '7']
      changed_when: true

    - name: Ensure journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'

    - name: Disable journal broadcasts while preserving journal and syslog collection
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/99-quiet-console.conf
        mode: '0644'
        content: |
          [Journal]
          ForwardToConsole=no
          ForwardToWall=no
      notify: Restart journald

    - name: Silence routine kernel and systemd status output on subsequent normal boots
      ansible.builtin.copy:
        dest: /etc/default/grub.d/99-quiet-console.cfg
        mode: '0644'
        content: |
          GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} loglevel=0 systemd.show_status=false"
      notify: Update GRUB menu

  handlers:
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted

    - name: Update GRUB menu
      ansible.builtin.command: update-grub
      changed_when: true
