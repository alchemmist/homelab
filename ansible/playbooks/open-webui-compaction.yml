---
- name: Use gateway context budgeting instead of percentage-based WebUI compaction
  hosts: socrat-0
  gather_facts: false
  become: false
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Copy the context compaction configuration helper
      ansible.builtin.copy:
        src: ../files/configure_webui_compaction.py
        dest: '{{ homelab_user_home }}/tmp-charts/configure-webui-compaction.py'
        mode: '0600'
    - name: Locate the running Open WebUI pod
      ansible.builtin.command: kubectl -n llm get pod -l app=open-webui -o jsonpath={.items[0].metadata.name}
      register: webui_compaction_pod
      changed_when: false
    - name: Copy the helper into Open WebUI
      ansible.builtin.command: >-
        kubectl -n llm cp {{ homelab_user_home }}/tmp-charts/configure-webui-compaction.py
        {{ webui_compaction_pod.stdout }}:/tmp/configure-webui-compaction.py
      changed_when: false
    - name: Persist automatic compaction settings and verify readback
      ansible.builtin.command: >-
        kubectl -n llm exec {{ webui_compaction_pod.stdout }} -- env PYTHONPATH=/app/backend
        python /tmp/configure-webui-compaction.py
      register: webui_compaction_config
      changed_when: (webui_compaction_config.stdout | from_json).changed
