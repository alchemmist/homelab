---
- name: Whole-fleet DNS addition preflight (no package/config/service restarts)
  hosts: socrat-0:socrat-1:socrat-2
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Create the public web DNS staging directory
      ansible.builtin.file:
        path: /var/lib/homelab-public-web-dns
        state: directory
        mode: "0700"
    - name: Install the public web DNS plan and apply tool
      ansible.builtin.copy:
        src: ../scripts/public-web-dns.py
        dest: /usr/local/sbin/homelab-public-web-dns
        mode: "0700"
    - name: Stage the proposed zone renderer for public web DNS
      ansible.builtin.copy:
        src: ../scripts/public_dns_zone.py
        dest: /var/lib/homelab-public-web-dns/proposed.py
        mode: "0700"
    - name: Compute the public web DNS plan
      ansible.builtin.command: /usr/local/sbin/homelab-public-web-dns
      register: dns_plan
      changed_when: false
    - name: Display the public web DNS plan
      ansible.builtin.debug:
        var: dns_plan.stdout
    - name: Require the approved public web DNS plan hash
      ansible.builtin.assert:
        that: (dns_plan.stdout | from_json).plan_hash == public_web_dns_hash
      when: public_web_dns_apply | default(false) | bool
- name: Serial approved owned-zone refresh
  hosts: socrat-0:socrat-1:socrat-2
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Apply the approved public web DNS plan
      ansible.builtin.command:
        argv: [/usr/local/sbin/homelab-public-web-dns,
               --apply,
               --approve-plan-hash,
               "{{ public_web_dns_hash }}"]
      when: public_web_dns_apply | default(false) | bool
      register: dns_apply
      changed_when: (dns_apply.stdout | from_json).applied
...
