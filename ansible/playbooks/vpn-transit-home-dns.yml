---
- name: Relay HOME authoritative NL DNS over private Moscow transport
  hosts: socrat-4
  gather_facts: false
  become: true
  tasks:
    - name: Install private-only fixed DNS relay configuration
      ansible.builtin.copy:
        dest: /etc/homelab-vpn-transit/dns.json
        mode: '0644'
        content: |
          {"log":{"loglevel":"warning"},"inbounds":[{"tag":"private-dns-tcp","listen":"10.250.0.40","port":53,"protocol":"tunnel","settings":{"rewriteAddress":"10.251.4.2","rewritePort":53,"allowedNetwork":"tcp","followRedirect":false}},{"tag":"private-dns-udp","listen":"10.250.0.40","port":53,"protocol":"tunnel","settings":{"rewriteAddress":"10.251.4.2","rewritePort":53,"allowedNetwork":"udp","followRedirect":false}}],"outbounds":[{"protocol":"freedom"}]}
    - name: Validate DNS relay before activation
      ansible.builtin.command: /usr/local/libexec/xray-transit run -test -config /etc/homelab-vpn-transit/dns.json
      changed_when: false
    - name: Install bounded DNS-only service without restarting production VPN relay
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-vpn-dns-transit.service
        mode: '0644'
        content: |
          [Unit]
          Description=Private fixed-destination HOME Moscow NL authoritative DNS relay
          Requires=wg-quick@wg-vpn-transit.service wg-quick@wg-socrat.service
          After=wg-quick@wg-vpn-transit.service wg-quick@wg-socrat.service
          [Service]
          DynamicUser=yes
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          NoNewPrivileges=yes
          Environment=GOMEMLIMIT=48MiB
          MemoryMax=100663296
          MemorySwapMax=0
          ExecStart=/usr/local/libexec/xray-transit run -config /etc/homelab-vpn-transit/dns.json
          Restart=on-failure
          RestartSec=5s
          [Install]
          WantedBy=multi-user.target
    - name: Enable only the new private DNS relay
      ansible.builtin.systemd_service:
        name: homelab-vpn-dns-transit.service
        state: started
        enabled: true
        daemon_reload: true
