---
# kube-linter 0.8.3. Default checks stay on. Extra checks are explicit.
# Omissions are architecture conflicts in docs/quality/strict-policy.md.
checks:
  doNotAutoAddDefaults: false
  include:
    - access-to-create-pods
    - access-to-secrets
    - cluster-admin-role-binding
    - dangling-horizontalpodautoscaler
    - dangling-ingress
    - dangling-networkpolicy
    - dangling-networkpolicypeer-podselector
    - dangling-servicemonitor
    - default-service-account
    - env-value-from
    - no-liveness-probe
    - no-readiness-probe
    - non-isolated-pod
    - privileged-ports
    - read-secret-from-env-var
    - scc-deny-privileged-container
    - sorted-keys
    - unsafe-proc-mount
    - use-namespace
    - wildcard-in-rules
    - writable-host-mount
...
