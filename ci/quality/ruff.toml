target-version = "py313"
line-length = 100

[lint]
select = ["ALL"]
# Unsatisfiable rule pairs. Documented in docs/quality/strict-policy.md.
ignore = ["D203", "D213", "ISC001", "COM812"]

[lint.per-file-ignores]
# Behavior names document pytest functions and unittest methods in test modules.
"tests/**/test_*.py" = ["D102", "D103"]
# Pytest rewrites assertions in the tests tree (unchanged assertion policy).
"**/tests/**" = ["S101"]
# Tests load modules inside test functions to isolate runpy/importlib reloads
# and invoke the real CLIs; the tree is intentionally not an importable package.
"tests/**" = ["INP001", "PLC0415", "S603", "S607"]
# CI console tools print their machine-readable progress to stdout.
"ci/**" = ["INP001", "T201"]
# The audited subprocess dispatcher itself: this module is the single reviewed
# execution site every ci tool routes through (fixed argv, no shell, bounded,
# failure output never published). All other modules must use command()/spawn().
"ci/quality/common.py" = ["S603"]
# The checksum-locked tool fetcher: it must stream the raw binary payload out
# of curl, which the str-only command() dispatcher and DEVNULL-based spawn()
# cannot carry; the argv below stays fixed (/usr/bin/curl, https-only,
# bounded size/time) and every archive is sha256-verified before use.
"ci/quality/install_tools.py" = ["S603"]
# The checksum-locked ansible-galaxy installer: like install_tools it must
# stream the raw archive bytes out of curl (the str-only dispatcher cannot
# carry them) and then hand each verified tarball to the pinned
# ansible-galaxy executable; both argv lists stay fixed and reviewed.
"ci/quality/install_collections.py" = ["S603"]
# The npm consumer-parity smoke: its reviewed function is running the same
# npm/node binaries the consumer runs, in the consumer's isolated HOME/PATH
# sandbox, so the audited dispatcher (fixed cwd/env) cannot reproduce it.
"ci/quality/npm_smoke.py" = ["S603", "S607"]
# The reviewed test-suite launcher: it must inject a credential-scrubbed
# environment, an isolated network policy and the framework's own exit code
# for pytest, none of which the fixed-argv dispatcher carries.
"ci/quality/tests.py" = ["S603"]
# The scoped ruff driver: it batches the owned inventory as explicit argv
# and must propagate each batch's own ruff exit status (tests pin that
# contract on the raw runner), which the failing dispatcher cannot carry.
"ci/quality/ruff_scope.py" = ["S603"]
# Copy-deployed VPN operational programs (persist() ships these single files
# to hosts without a repo checkout): reviewed fixed-operand subprocess calls
# are their documented function, and routing them through ci.quality.common
# would break the single-file deployment contract.
"ci/vpn/**" = ["S603", "S607"]
# The pinned hostname/timeout asserts are the reviewed hard stops whose exact
# AST the probe tests pin structurally: the timeout bounds (including the
# literal 45) are part of that pinned review, so PLR2004 stays per-file ignored.
"ci/vpn/vpn-home-nl-udp-probe.py" = ["S101", "PLR2004"]
# Subscription migration: the subListen allow-list audits the panel's
# historical wildcard binding (retiring it is out of this change's scope),
# and the subscription fetches go to the two reviewed constant origins with
# an explicit scheme allowlist.
"ci/vpn/vpn-subscription-migrate.py" = ["S104", "S310"]
# Operational single-file programs below are deployed by copy (no package
# layout makes sense): stdout is their CLI contract, subprocess/urllib calls on
# reviewed fixed operands are their purpose, sys.path or bootstrap code can
# precede imports, and one cohesive procedure is the documented interface.
"scripts/**" = ["INP001", "T201", "S603", "S607", "S310", "PLC0415", "E402", "PLR0913", "PLR0915"]
"ansible/**" = ["INP001", "T201", "S603", "S607", "S310", "PLC0415", "E402", "PLR0913", "PLR0915"]
# The NetBird OIDC reconciler's isinstance guards protect reviewed remote
# inventory integrity on the CLI apply path: they raise RuntimeError so main()'s
# handler can print one reviewed line and exit 1; a TypeError would escape it
# and crash the operational tool with a raw traceback instead.
"ansible/roles/identity_integrations/files/netbird_oidc.py" = ["TRY004"]
"charts/**" = ["INP001", "T201", "S603", "S607", "S310", "PLC0415", "E402", "PLR0913", "PLR0915"]
# The cold backup probe writes its sqlite staging copies into the container's
# fixed /tmp spawn directory (never extracted, single-purpose container) and
# narrows the reviewed recipient key with an isinstance guard that raises
# RuntimeError, like every reviewed backup failure, instead of a bare TypeError.
"charts/openhands/files/cold_backup.py" = ["S108", "TRY004"]
# The OTLP log-runtime probe mounts three fixed /tmp paths inside throwaway
# pinned Collector containers (config/output/queue); the host side only copies
# through docker cp into a real TemporaryDirectory, and every peer reviewed
# here is a container-side literal, so the S108 host-tmp rule does not apply.
"scripts/test-otel-log-runtime.py" = ["S108"]
# The SPI finalize probe selects rows from a table name read back from
# sqlite_master itself; no user input reaches the fragment, and every other
# query goes through psycopg sql composition with bound parameters.
"scripts/spi-pg/finalize.py" = ["S608"]
# The cold-copy TLS sender must listen on every interface of its
# single-purpose sending container; the socket is immediately wrapped in the
# reviewed TLS context and every response requires the verified bearer token.
"deploy/storage/thanos-retire/offload.py" = ["S104"]
# The durable workflow error type is named Failure across the reviewed
# worker API boundary: its fixed non-sensitive codes are the documented wire
# contract asserted by the spi_triage suite and produced by every chart
# module, so renaming to an Error suffix would break the deployed worker API
# and the reviewed compatibility pins.
"charts/spi-triage/files/core.py" = ["N818", "PLC0415"]
"services/spi/legacy/backend/core.py" = ["N818", "PLC0415"]
# The evolved services store keeps replace_snapshot(expensive) positional
# (the deployed worker calls it positionally) and keeps module-level seeded
# random for the test-pinned jitter determinism instead of SystemRandom.
"services/spi/backend/core.py" = ["N818", "PLC0415", "FBT001", "S311"]
"charts/spi-triage/files/durable_wait.py" = ["PLC0415"]
"services/spi/legacy/backend/durable_wait.py" = ["PLC0415"]
# The evolved wait owners call the services Store private API (_schedule,
# _reconcile_owners, _owned_priority_until) reviewed in the same package.
"services/spi/backend/durable_wait.py" = ["PLC0415", "SLF001", "C901", "FBT001"]
# The storage exception names (StoragePermanent/StorageTransient et al.) and
# the SigV4 sign() arity are the reviewed wire contract shared with the
# independent reference implementation in services/rustfs_gateway/gateway.py
# and consumed by service.py/storage_runtime.py: renaming or re-shaping them
# would break the deployed worker and gateway boundaries.
"charts/spi-triage/files/s3_evidence.py" = ["N818", "PLR0913"]
"services/spi/legacy/backend/s3_evidence.py" = ["N818", "PLR0913"]
"services/spi/backend/s3_evidence.py" = ["N818", "PLR0913"]
# The dispatcher constructor arity (store, token, enabled) and its positional
# boolean are pinned positionally by the spi_triage dispatcher tests; the two
# kept tail `except Exception` sites are the reviewed trust boundary (a failed
# POST does not prove n8n did not start), and the component/event JSON lines
# are the worker stdout log contract.
"charts/spi-triage/files/dispatcher.py" = ["FBT001", "FBT002", "BLE001", "T201"]
"services/spi/legacy/backend/dispatcher.py" = ["FBT001", "FBT002", "BLE001", "T201"]
"services/spi/backend/dispatcher.py" = ["FBT001", "FBT002", "BLE001", "T201"]
# The git-tracked spelling of the renovated spi-triage service module carries the
# same reviewed rationale as the charts/** family: stdout JSON records are the
# worker log contract, the Engine collaborator arity is the reviewed (and test-
# asserted) constructor surface, and queue_admin is deferred until the worker is
# actually configured with a queue UI token.
"services/spi/legacy/backend/service.py" = ["PLC0415", "T201", "PLR0913"]
# The evolved services entrypoint keeps the reviewed engine constructor arity
# and the published-error raise inside the audited queue-admin handler.
# The SPI evidence gateway is one reviewed operational HTTP server: its
# answer path is a single cohesive protocol procedure (HTTP status literals,
# branches and socket lifecycle raises are the reviewed wire contract), the
# do_* aliases and socketserver/HTTPServer parameters mirror the stdlib
# handler API names, bind_and_activate is the stdlib positional contract, the
# bounded 0.0.0.0 listener is the reviewed container admission surface, and
# urllib opens only the two fixed reviewed origins above.
"services/spi/integrations/evidence/gateway.py" = ["TRY300", "TRY301", "PLR2004", "PLR0913", "PLR0911", "PLR0912", "PLR0915", "C901", "N815", "N803", "FBT001", "FBT002", "S104", "S310"]
# Anonymous read-only Nature branding smoke script: its remaining literals are
# HTTP status codes of the reviewed journey wire protocol, checked inline.
"scripts/identity-nature-smoke.py" = ["PLR2004"]
# One-shot root promotion script: the atomic exchange body is one reviewed
# sequential guard chain whose branches are inseparable safety steps.
"ansible/scripts/vpn-native-image-promote.py" = ["C901", "PLR0912"]
# The relay watchdog is a cohesive node-local failover state machine: its
# fixed reviewed subprocess/socket calls, bounded retry loops and guard chains
# are inseparable safety steps under a single tree lock.
"tools/watchdog/runtime/relay.py" = ["TRY300", "TRY301", "PLR2004", "S603", "S607", "S104", "C901", "PLR0912", "PLR0915", "T201"]

# The HOME egress tool is one reviewed sequential CAS/state guard chain per mode
# (apply, boot, direct-probe upgrade); its branches are inseparable safety steps.
"ansible/scripts/vpn-home-transit-egress.py" = ["C901", "PLR0912"]

# The public-edge resolver patches mirror the exact typeshed socket.getaddrinfo
# signature, whose fourth parameter is legitimately named "type".
"scripts/identity-argocd-refresh-smoke.py" = ["A002"]
"scripts/identity-app-access-smoke.py" = ["A002"]
# The live tool-guard probe walks one sequential end-to-end scenario whose
# stages share the mutable dispatch counter, metadata and repeat-stop state;
# re-staging them into helpers would spread reviewed protocol steps, and the
# /tmp fixture is a unique uuid-named file the probe itself deletes.
"scripts/check-webui-tool-guard.py" = ["C901", "PLR0912", "S108"]
# The retirement carrier embeds byte-pinned remote python payloads verified
# against the socrat-0 spool; reflowing their long single-line assert code
# would change the audited command bytes, so the payload lines stay exact.
"deploy/storage/thanos-retire/retire.py" = ["E501"]
# The whole live smoke is one sanitized catch-all try/except boundary;
# its RuntimeError guards must stay inline inside that boundary so the
# sanitized failure path stays the single exit, hence TRY301 stays local.
"scripts/identity-xui-gateway-smoke.py" = ["TRY301"]
# The one-shot transfer builds its SQL from immutable reviewed literals:
# the only interpolated pieces are quoted identifiers already guarded by
# the identifier regex in q() and psycopg placeholders (%s), so the four
# S608 hits are false positives. The broad conversion except folds every
# possible cell failure into one operational ValueError diagnostic.
"scripts/netbird-critical-transfer.py" = ["S608", "BLE001"]

"services/spi/backend/service.py" = ["PLC0415", "T201", "PLR0913", "TRY301"]
"deploy/**" = ["INP001", "T201", "S603", "S607", "S310", "PLC0415", "E402", "PLR0913", "PLR0915"]
# The integrations adapters are the reviewed LLM/checkpoint/collector boundary:
# the v3 checkpoint-replay reductions (match, call, collect) and the bounded
# rate-limit header parser are single cohesive contracts whose exact structure
# the spi_triage suite pins (replay digests, batch order, admission budget
# probes); splitting them would rewrite reviewed replay semantics, not style.
# Lazy evidence_bundle/telegram_links/local_token_counter imports guard the
# legacy import cycle behind per-call freshness, and every adapter URL is one
# of the fixed observability/GitHub origins named in this file's constants.
"charts/spi-triage/files/integrations.py" = ["S310", "PLC0415", "C901", "PLR0912", "PLR0913", "PLR0915"]
"services/spi/legacy/backend/integrations.py" = ["S310", "PLC0415", "C901", "PLR0912", "PLR0913", "PLR0915"]
# The evolved services adapter keeps the reviewed GitHub allow_issue_creation
# boolean default and the int32 issue-number ceiling inline with the deployed
# compatibility pins; the graph capture raise stays in the reviewed handler.
"services/spi/backend/integrations.py" = ["S310", "PLC0415", "C901", "PLR0912", "PLR0913", "PLR0915", "FBT001", "FBT002", "PLR2004", "TRY301", "EM101"]
# The telemetry collector is one reviewed bounded-read contract: the window
# clipper, the trace-span projector, and the per-source request gate are pinned
# digest-exactly by the spi_triage suite (probe order, budget gaps, truncation
# flags), so their branch/return shape stays per-file reviewed rather than split.
"charts/spi-triage/files/telemetry.py" = ["PLC0415", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
"services/spi/legacy/backend/telemetry.py" = ["PLC0415", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
"services/spi/backend/telemetry.py" = ["PLC0415", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
# The evolved evidence bundle keeps the reviewed bounded-excerpt packing, the
# binary-ref storage readers and the deterministic graph/navigation markdown in
# single cohesive contracts (digest-pinned by the sp services suite); the lazy
# graph_evidence import guards the same legacy import cycle per call freshness.
"services/spi/backend/evidence_bundle.py" = ["PLC0415", "C901", "PLR0915"]
# The local token counter is one reviewed bounded-input contract: raw_fits
# walks the whole request once with per-type budget deductions (returning
# False exactly at the bound, raising Failure only on the named
# non-negotiable types), and its shape is pinned digest-exactly by the
# spi_triage parity/golden-render tests, so the single walk stays per-file
# reviewed rather than split; the constructor converts any pinned-asset or
# library failure into the one documented Failure code, and the local
# tokenizers import stays per-call so byte-bound mode never loads the Rust
# extension (PLC0415 listed only where charts/** does not already cover it).
"charts/spi-triage/files/local_token_counter.py" = ["C901", "PLR0912", "BLE001"]
"services/spi/legacy/backend/local_token_counter.py" = ["C901", "PLR0912", "BLE001", "PLC0415"]
"services/spi/backend/local_token_counter.py" = ["C901", "PLR0912", "BLE001", "PLC0415"]
# The storage runtime is the reviewed fail-closed credentials seam: every
# invalid input, unpinned path, unsafe inode or parser error must surface as
# the single documented S3_WRITER_CONFIGURATION_INVALID code, so the outward
# except Exception stays part of the pinned contract.
"charts/spi-triage/files/storage_runtime.py" = ["BLE001"]
"services/spi/legacy/backend/storage_runtime.py" = ["BLE001"]
"services/spi/backend/storage_runtime.py" = ["BLE001"]
# The GitHub App token broker runs as a copy-deployed CronJob entrypoint: its
# reviewed function is emitting the operational log/exit-status lines and
# calling the four fixed https API origins, and any failure must become the
# one logged refresh_failed line plus exit 1, so the outer except Exception
# stays part of the pinned contract (T201/S310 where charts/** does not
# already cover them).
"charts/spi-triage/files/github_broker.py" = ["BLE001"]
"services/spi/legacy/backend/github_broker.py" = ["T201", "S310", "BLE001"]
"services/spi/backend/github_broker.py" = ["T201", "S310", "BLE001"]
# The queue operator DTO composes its IN-clause from the fixed "?"
# placeholder set only (never interpolated values), which S608 cannot see;
# the projection stays exactly the reviewed column list pinned by the
# spi_triage queue_admin suite.
"charts/spi-triage/files/queue_admin.py" = ["S608"]
"services/spi/legacy/backend/queue_admin.py" = ["S608"]
# The evolved queue list keeps the reviewed cursor-paginated query and the
# fenced cancel_batch transaction as single cohesive contracts (digest-pinned
# by the queue-admin tests); the SQL constructors use fixed identifiers only.
"services/spi/backend/queue_admin.py" = ["S608", "C901"]
# The provenance collector keeps its original per-call lazy imports: the
# in-cluster hosts (integrations) and quote/urlencode helpers load only on
# the reviewed read paths so an unused collector never touches the wire,
# and the shared import cycle stays guarded per-call (charts/** already
# carries PLC0415; the services spelling repeats it here).
"services/spi/legacy/backend/provenance.py" = ["PLC0415"]
"services/spi/backend/provenance.py" = ["PLC0415"]
# telegram_links.once deliberately catches a blind Exception so an ambiguous
# POST outcome is retried instead of killing the delivery thread or
# fabricating a receipt (reviewed seams, pinned by the spi_triage suite).
"charts/spi-triage/files/telegram_links.py" = ["BLE001"]
"services/spi/legacy/backend/telegram_links.py" = ["BLE001"]
"services/spi/backend/telegram_links.py" = ["BLE001"]
# telegram_delivery loops swallow single-retry hiccups on purpose: a tick of
# card discovery, primary backfill, or link retry must never kill its worker
# thread, and each failure already reschedules itself in the durable tables
# (reviewed seams, pinned by the spi_triage suite; the services spelling also
# keeps the lazy json.codec import, the audited HTTPS open, and the one-line
# loop retry log that charts/** covers via the global tables).
"charts/spi-triage/files/telegram_delivery.py" = ["BLE001", "S110"]
"services/spi/legacy/backend/telegram_delivery.py" = ["BLE001", "S110", "PLC0415", "S310", "T201", "PLR0913"]
"services/spi/backend/telegram_delivery.py" = ["BLE001", "S110", "PLC0415", "S310", "T201", "PLR0913"]
"services/**" = ["INP001"]
