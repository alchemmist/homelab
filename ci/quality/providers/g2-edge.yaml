  # Architectural binding contract: the edge proxy takes over the node's
  # public 80/443 (TCP + HTTP/3 UDP) listeners from the host itself
  # (deploy/argocd/apps/traefik-edge.yaml, nodeSelector socrat-2). Verified
  # docker run as uid 65532 with CAP_NET_BIND_SERVICE.
  - consumer: traefik-edge-0
    kind: Deployment
    namespace: traefik-edge
    name: traefik-edge
    checks: [host-network, privileged-ports]
    evidence: deploy/argocd/apps/traefik-edge.yaml
  # Out-of-band backend: traefik-edge-panel is a selector-less Service whose
  # only endpoint is the socrat-2 host process (10.250.0.2:18082); see
  # docs/quality/traefik-edge-vpn-backends.md.
  - consumer: traefik-edge-0
    kind: Service
    namespace: traefik-edge
    name: traefik-edge-panel
    checks: [dangling-service]
    evidence: docs/quality/traefik-edge-vpn-backends.md
  # Out-of-band backend: traefik-edge-subscriptions is a selector-less Service whose
