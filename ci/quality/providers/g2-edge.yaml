  # private-gateway is a hostNetwork DaemonSet by design: each node's nginx
  # must own the WireGuard interface address (10.250.0.x:18443) so the private
  # mesh reaches the per-node virtual hosts; no Service/ClusterIP path can
  # pin listeners to node addresses. The Argo CD Application below names the
  # DaemonSet release.
  - consumer: private-gateway-0
    kind: DaemonSet
    namespace: syncthing
    name: private-gateway
    checks: [host-network]
    evidence: deploy/argocd/apps/private-gateway.yaml

  # vpn-transit is the node-local WireGuard relay (socrat-2): it must own the
  # host network to bind the node's VPN endpoint on 443, and 443 is a
  # privileged port bound through the reviewed NET_BIND_SERVICE root
  # contract (see charts.py PRIVILEGED_BIND_EXEMPT_CHECKS). The Argo CD
  # Application below names the release.
  - consumer: vpn-transit-0
    kind: Deployment
    namespace: vpn-transit
    name: vpn-transit
    checks: [host-network, privileged-ports]
    evidence: deploy/argocd/apps/vpn-transit.yaml
