version: 1
entries:
  # Selector-less per-node GUI Services backed by explicit Endpoints. Evidence:
  # docs/quality/syncthing-contracts.md.
  - consumer: syncthing-0
    kind: Service
    namespace: syncthing
    name: syncthing-sync-0
    checks: [dangling-service]
    evidence: docs/quality/syncthing-contracts.md
  - consumer: syncthing-0
    kind: Service
    namespace: syncthing
    name: syncthing-sync-1
    checks: [dangling-service]
    evidence: docs/quality/syncthing-contracts.md
  # Host sync daemon: hostNetwork + root/writable state + GUI proxy's writable
  # nginx config. Evidence: docs/quality/syncthing-contracts.md.
  - consumer: syncthing-0
    kind: Deployment
    namespace: syncthing
    name: syncthing
    checks: [host-network, run-as-non-root, writable-host-mount, no-read-only-root-fs]
    evidence: docs/quality/syncthing-contracts.md
