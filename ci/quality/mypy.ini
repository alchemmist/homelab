[mypy]
strict = true
# Resolves the reviewed test-only entry modules (charts/spi-triage/files and the
# sibling spi_triage fixtures like test_triage) mypy checks imports against.
mypy_path = charts/spi-triage/files:tests/spi_triage
warn_unreachable = true
explicit_package_bases = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
strict_equality_for_none = true
enable_error_code = explicit-override, mutable-override, truthy-bool, truthy-iterable, possibly-undefined, redundant-expr, unused-awaitable, ignore-without-code
